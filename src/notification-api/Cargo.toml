[package]
name = "notification-api"
version = "0.1.0"
edition = "2024"

[dependencies]
common = { workspace = true, features = ["api"] }
notification = { workspace = true, features = ["data", "service", "dynamodb"] }
user = { workspace = true, features = ["dynamodb"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["json"] }
tokio = { workspace = true, features = ["macros"] }
aws_lambda_events = { workspace = true, features = ["apigw"] }
lambda_runtime = { workspace = true }
aws-config = { workspace = true }
aws-sdk-dynamodb = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
http = { workspace = true }
time = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
notification = { workspace = true, features = ["test-data"] }
user = { workspace = true, features = ["test-data"] }
test-api = { workspace = true, features = ["api-gateway", "dynamodb"] }
serial_test = { workspace = true }
rstest = { workspace = true }
fake = { workspace = true }
