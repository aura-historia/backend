[package]
name = "shopify-lambda"
version = "0.1.0"
edition = "2024"

[dependencies]
aws-config = { workspace = true }
aws-sdk-dynamodb = { workspace = true }
aws_lambda_events = { workspace = true, features = ["eventbridge"] }
common = { workspace = true }
html2text = { workspace = true }
lambda_runtime = { workspace = true }
lingua = { workspace = true }
product = { workspace = true, features = ["dynamodb", "service"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
shop = { workspace = true, features = ["dynamodb", "service"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros"] }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
common = { workspace = true, features = ["test-data"] }
fake = { workspace = true }
product = { workspace = true, features = ["full"] }
rstest = { workspace = true }
shop = { workspace = true, features = ["full"] }
