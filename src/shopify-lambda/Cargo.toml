[package]
name = "shopify-lambda"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = { workspace = true }
aws_lambda_events = { workspace = true, features = ["eventbridge", "sqs"] }
application = { workspace = true }
aws-config = { workspace = true }
aws-sdk-sqs = { workspace = true }
platform-observability = { workspace = true }
platform-lambda-bootstrap = { workspace = true }
platform-postgres = { workspace = true }
platform-postgres-secretsmanager = { workspace = true }

lambda_runtime = { workspace = true }
listing-source-core = { workspace = true }
listing-source-postgres = { workspace = true }
listing-source-service = { workspace = true }

product-listing-shopify = { workspace = true }
product-listing-normalization = { workspace = true }
product-listing-ingestion-sqs = { workspace = true }
product-listing-service = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

time = { workspace = true, features = ["parsing"] }
tokio = { workspace = true, features = ["macros"] }
tracing = { workspace = true }

[dev-dependencies]
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
http = { workspace = true }
tokio = { workspace = true, features = ["sync", "test-util", "time"] }
auction-postgres = { workspace = true }
fxrate-core = { workspace = true }
fxrate-postgres = { workspace = true }
localization = { workspace = true }
money = { workspace = true }
product-service = { workspace = true }
product-listing-postgres = { workspace = true }
fxrate-service = { workspace = true }
test-api = { workspace = true, features = ["postgres"] }
sqlx = { workspace = true }
serial_test = { workspace = true }
uuid = { workspace = true }
strum = { workspace = true }
