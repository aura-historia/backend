[package]
name = "notification-core"
version = "0.1.0"
edition = "2024"

[dependencies]
domain-primitives = { workspace = true }
listing-source-core = { workspace = true }
localization = { workspace = true }
money = { workspace = true }
partnership-core = { workspace = true }
party-core = { workspace = true }
product-listing-core = { workspace = true }
search-filter-core = { workspace = true }
serde = { workspace = true }
strum = { workspace = true }
strum_macros = { workspace = true }
user-core = { workspace = true }

thiserror = { workspace = true }
url = { workspace = true, features = ["serde"] }
uuid = { workspace = true, features = ["v7"] }

# Optional
fake = { workspace = true, optional = true }

[dev-dependencies]
rstest = { workspace = true }

[features]
default = []
test-data = ["fake", "domain-primitives/test-data", "localization/test-data", "money/test-data", "partnership-core/test-data", "party-core/test-data", "product-listing-core/test-data", "search-filter-core/test-data", "user-core/test-data"]
