[package]
name = "product-core"
version = "0.1.0"
edition = "2024"

[dependencies]
strum = { workspace = true }
domain-primitives = { workspace = true }
fxrate-core = { workspace = true }
localization = { workspace = true }
money = { workspace = true }
geo = { workspace = true }
html-escape = { workspace = true }
indexmap = { workspace = true }
isocountry = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_fields = { workspace = true }
shop-core = { workspace = true }
strum_macros = { workspace = true }
time = { workspace = true, features = ["local-offset", "macros", "formatting"] }
thiserror = { workspace = true }
url = { workspace = true, features = ["serde"] }
uuid = { workspace = true }

# Optional
fake = { workspace = true, optional = true }

[dev-dependencies]
rstest = { workspace = true }

[features]
default = []
test-data = ["fake", "domain-primitives/test-data", "fxrate-core/test-data", "geo/test-data", "localization/test-data", "money/test-data", "shop-core/test-data"]
