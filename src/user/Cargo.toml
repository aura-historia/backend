[package]
name = "user"
version = "0.1.0"
edition = "2024"

[dependencies]
geo = { workspace = true }
isocountry = { workspace = true }
common = { workspace = true }
serde = { workspace = true }
serde-email = { workspace = true }
serde_fields = { workspace = true }
time = { workspace = true }
async-trait = { workspace = true }
mockall = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
prefixed-api-key = { workspace = true, features = ["sha2"] }
cognito_verifier = { package = "cognito", path = "../cognito", optional = true }
http = { workspace = true, optional = true }

# Optional
serde_dynamo = { workspace = true, features = ["aws-sdk-dynamodb+1"], optional = true }
tracing = { workspace = true, optional = true }
aws-sdk-dynamodb = { workspace = true, optional = true }
aws-sdk-cognitoidentityprovider = { workspace = true, optional = true }
tokio = { workspace = true, features = ["time"], optional = true }
fake = { workspace = true, optional = true }
opensearch = { workspace = true, optional = true }
serde_json = { workspace = true }

[dev-dependencies]
user = { workspace = true, features = ["full"] }
test-api = { workspace = true, features = ["dynamodb", "opensearch"] }
serial_test = { workspace = true }
rstest = { workspace = true }
tokio = { workspace = true, features = ["macros"] }

[features]
default = []
data = ["common/api", "geo/data", "dep:http"]
dynamodb = ["aws-sdk-dynamodb", "serde_dynamo", "serde_dynamo/aws-sdk-dynamodb+1", "tracing", "common/dynamodb"]
opensearch = ["common/opensearch", "dep:opensearch", "tracing", "dynamodb", "tokio", "time/formatting"]
cognito = ["aws-sdk-cognitoidentityprovider"]
service = ["dynamodb", "tokio", "geo/service", "opensearch"]
authenticator = ["service", "data", "dep:cognito_verifier"]
test-data = ["fake", "common/test-data", "geo/test-data"]
full = ["data", "test-data", "dynamodb", "opensearch", "service", "authenticator", "cognito"]
