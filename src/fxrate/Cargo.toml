[package]
name = "fxrate"
version = "0.1.0"
edition = "2024"

[dependencies]
common = { workspace = true }
time = { workspace = true, features = ["local-offset", "macros", "formatting"] }
url = { workspace = true, features = ["serde"] }
serde = { workspace = true }
serde_fields = { workspace = true }
async-trait = { workspace = true }
mockall = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }
aws-sdk-dynamodb = { workspace = true }
serde_dynamo = { workspace = true, features = ["aws-sdk-dynamodb+1"] }
tracing = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
strum = { workspace = true }

[dev-dependencies]
fxrate = { workspace = true }
test-api = { workspace = true, features = ["dynamodb"] }
serial_test = { workspace = true }
tokio = { workspace = true, features = ["macros"] }
