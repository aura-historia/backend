[package]
name = "product-api-partner"
version = "0.1.0"
edition = "2024"

[dependencies]
common = { workspace = true, features = ["api", "opensearch"] }
product = { workspace = true, features = ["data", "service", "dynamodb"] }
shop = { workspace = true, features = ["dynamodb", "api", "service"] }
product-classification = { workspace = true, features = ["data"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["json"] }
tokio = { workspace = true, features = ["macros"] }
aws_lambda_events = { workspace = true, features = ["apigw"] }
lambda_runtime = { workspace = true }
aws-config = { workspace = true }
aws-sdk-dynamodb = { workspace = true }
opensearch = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
http = { workspace = true }
url = { workspace = true }
time = { workspace = true }

[dev-dependencies]
product = { workspace = true, features = ["test-data"] }
shop = { workspace = true, features = ["test-data"] }
test-api = { workspace = true, features = ["api-gateway"] }
rstest = { workspace = true }
fake = { workspace = true }
