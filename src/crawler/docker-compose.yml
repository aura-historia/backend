services:
  postgres:
    image: postgres:16
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - crawler_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  crawler_pgdata:
