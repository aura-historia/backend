services:
  postgres:
    image: postgres:16
    # Parallel queries allocate shared memory in /dev/shm; Docker's 64 MB default runs out under crawl + review API load.
    shm_size: 512mb
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - crawler_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  crawler_pgdata:
