<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Crawler Review Console</title>
    <script>
        (() => {
            const stored = localStorage.getItem('crawlerReviewTheme');
            const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.documentElement.dataset.theme = stored || (prefersDark ? 'dark' : 'light');
        })();
    </script>
    <link href="/assets/styles.css" rel="stylesheet">
</head>
<body>
<header class="app-header">
    <a class="brand" href="#overview">
        <svg aria-hidden="true" fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="16"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg>Crawler review
    </a>
    <nav aria-label="Views" class="nav">
        <a class="nav-link" href="#overview" id="navOverview">Overview</a>
        <a class="nav-link" href="#sources" id="navSources">Sources</a>
        <a class="nav-link" href="#reviews" id="navReviews">Reviews</a>
    </nav>
    <div class="header-actions">
        <span class="system-status" id="reloadState" role="status"></span>
        <button class="btn btn-quiet btn-sm" hidden id="signOutButton" onclick="clearReviewAuthToken()" title="End the browser session and forget the review token" type="button">Sign out</button>
        <button aria-label="Switch to dark mode" class="btn btn-quiet btn-icon btn-sm" id="themeToggle" onclick="toggleTheme()" title="Switch to dark mode" type="button"></button>
    </div>
</header>
<main class="main" id="appShell">
    <div class="page" id="detail"></div>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
