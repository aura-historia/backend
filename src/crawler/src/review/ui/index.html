<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Crawler Review Console</title>
    <script>
        (() => {
            const stored = localStorage.getItem('crawlerReviewTheme');
            const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.documentElement.dataset.theme = stored || (prefersDark ? 'dark' : 'light');
        })();
    </script>
    <link href="/assets/styles.css" rel="stylesheet">
</head>
<body>
<header>
    <div>
        <h1>Crawler Review Console</h1>
        <div class="header-subtitle">Human review for product schema candidates</div>
    </div>
    <div class="header-actions">
        <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" type="button">Dark mode</button>
        <button class="theme-toggle" onclick="clearReviewAuthToken()" type="button">Clear review token</button>
        <div class="system-status" id="reloadState">Queue auto refresh active</div>
    </div>
</header>
<main id="appShell">
    <section class="sidebar" id="reviewSidebar">
        <h2>
            <span>Pending Reviews</span>
            <button aria-label="Collapse pending reviews" class="icon-button" id="sidebarToggle"
                    onclick="toggleSidebar()" title="Collapse pending reviews">&lt;
            </button>
        </h2>
        <div class="sidebar-search">
            <input id="reviewSearch" oninput="setReviewSearch(this.value)" placeholder="Search listing_sources or reviews"
                   type="search">
        </div>
        <div class="list" id="reviewList"></div>
    </section>
    <section class="detail-shell">
        <div class="detail muted" id="detail">Select a review.</div>
    </section>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
