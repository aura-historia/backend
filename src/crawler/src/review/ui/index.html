<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Crawler Review Console</title>
    <script>
        (() => {
            const stored = localStorage.getItem('crawlerReviewTheme');
            const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.documentElement.dataset.theme = stored || (prefersDark ? 'dark' : 'light');
        })();
    </script>
    <link href="/assets/styles.css" rel="stylesheet">
</head>
<body>
<header>
    <h1>Crawler review</h1>
    <div class="header-actions">
        <span class="system-status" id="reloadState" role="status">Queue auto refresh active</span>
        <button class="ghost" onclick="clearReviewAuthToken()" type="button">Clear review token</button>
        <button class="ghost" id="themeToggle" onclick="toggleTheme()" type="button">Dark mode</button>
    </div>
</header>
<main id="appShell">
    <section class="sidebar" id="reviewSidebar">
        <h2>
            <span>Reviews</span>
            <button aria-controls="reviewSidebarBody" aria-expanded="true" aria-label="Collapse reviews"
                    class="icon-button sidebar-toggle" id="sidebarToggle" onclick="toggleSidebar()"
                    title="Collapse reviews" type="button">
                <svg aria-hidden="true" focusable="false" height="16" viewBox="0 0 16 16" width="16">
                    <path d="M10 4l-4 4 4 4" fill="none" stroke="currentColor" stroke-linecap="round"
                          stroke-linejoin="round" stroke-width="1.6"/>
                </svg>
            </button>
        </h2>
        <div id="reviewSidebarBody">
            <div class="sidebar-search">
                <input aria-label="Search reviews" id="reviewSearch" oninput="setReviewSearch(this.value)"
                       placeholder="Search reviews" type="search">
            </div>
            <div class="list" id="reviewList"></div>
        </div>
    </section>
    <section class="detail-shell">
        <div class="detail muted" id="detail">Select a review.</div>
    </section>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
