[package]
name = "user-core"
version = "0.1.0"
edition = "2024"

[dependencies]
common = { workspace = true }
domain-primitives = { workspace = true }
geo = { workspace = true }
isocountry = { workspace = true }
prefixed-api-key = { workspace = true, features = ["sha2"] }
serde = { workspace = true }
serde-email = { workspace = true }
time = { workspace = true, features = ["local-offset", "macros", "formatting"] }
thiserror = { workspace = true }
uuid = { workspace = true }
http = { workspace = true, optional = true }

# Optional
fake = { workspace = true, optional = true }

[dev-dependencies]
rstest = { workspace = true }

[features]
default = []
data = ["common/api", "dep:http"]
test-data = ["fake", "common/test-data", "domain-primitives/test-data", "geo/test-data"]
