[package]
name = "user-core"
version = "0.1.0"
edition = "2024"

[dependencies]
credential-core = { workspace = true }
domain-primitives = { workspace = true }
geo = { workspace = true }
isocountry = { workspace = true }
localization = { workspace = true }
money = { workspace = true }
prefixed-api-key = { workspace = true, features = ["sha2"] }
serde = { workspace = true }
serde-email = { workspace = true }
strum = { workspace = true }
strum_macros = { workspace = true }
time = { workspace = true, features = ["local-offset", "macros", "formatting"] }
thiserror = { workspace = true }
uuid = { workspace = true }
http = { workspace = true, optional = true }

# Optional
fake = { workspace = true, optional = true }

[dev-dependencies]
rstest = { workspace = true }

[features]
default = []
data = ["dep:http"]
test-data = ["fake", "credential-core/test-data", "domain-primitives/test-data", "geo/test-data", "localization/test-data", "money/test-data"]
