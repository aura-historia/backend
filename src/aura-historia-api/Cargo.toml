[package]
name = "aura-historia-api"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = { workspace = true }
axum = { workspace = true }
aws-config = { workspace = true }
aws-sdk-dynamodb = { workspace = true }
common = { workspace = true, features = ["postgres"] }
geo = { workspace = true, features = ["data"] }
http = { workspace = true }
httpdate = { workspace = true }
isocountry = { workspace = true }
jsonwebtokens = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
serde = { workspace = true, features = ["derive"] }
serde-email = { workspace = true }
serde_json = { workspace = true }
serde_qs = { workspace = true }
shop-core = { workspace = true }
shop-postgres = { workspace = true }
shop-service = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true, features = ["formatting"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync"] }
tracing = { workspace = true }
url = { workspace = true, features = ["serde"] }
user-core = { workspace = true }
user-dynamodb = { workspace = true }
user-postgres = { workspace = true }
user-service = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
base64 = { workspace = true }
openssl = { workspace = true, features = ["vendored"] }
rstest = { workspace = true }
serial_test = { workspace = true }
sqlx = { workspace = true }
test-api = { workspace = true, features = ["aura-historia-api", "dynamodb", "postgres"] }
time = { workspace = true }
tower = { workspace = true, features = ["util"] }
