[package]
name = "user-service"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { workspace = true }
fake = { workspace = true, optional = true }
async-trait = { workspace = true }
application = { workspace = true }
domain-primitives = { workspace = true }

localization = { workspace = true }
money = { workspace = true }
serde-email = { workspace = true }
sha2 = { workspace = true }
time = { workspace = true, features = ["local-offset", "macros", "formatting"] }
thiserror = { workspace = true }
tracing = { workspace = true }
getrandom = { workspace = true }
user-core = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
tracing-subscriber = { workspace = true, features = ["json"] }

[features]
default = []
test-data = ["fake", "user-core/test-data"]
