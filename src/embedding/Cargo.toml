[package]
name = "embedding"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = { workspace = true }
google-cloud-auth = { workspace = true }
image-fetcher = { workspace = true }
lru = "0.19"
reqwest = { workspace = true, features = ["json"] }
