[package]
name = "common"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { workspace = true, features = ["derive"] }
time = { workspace = true, features = [
    "formatting",
    "parsing",
    "macros",
    "serde",
] }
uuid = { workspace = true, features = ["v4", "v7"] }
async-trait = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }
tracing = { workspace = true }

itertools = { workspace = true }
strum = { workspace = true }
strum_macros = { workspace = true }
slug = { workspace = true }
application = { workspace = true }
domain-primitives = { workspace = true }
fxrate-core = { workspace = true }
geo = { workspace = true }
platform-observability = { workspace = true }
product-core = { workspace = true }
shop-core = { workspace = true }

# Optional dependencies via feature-flags
aws-config = { workspace = true, optional = true }
aws-sdk-dynamodb = { workspace = true, optional = true }
aws-sdk-sqs = { workspace = true, optional = true }
serde_dynamo = { workspace = true, features = [
    "aws-sdk-dynamodb+1",
], optional = true }
aws_lambda_events = { workspace = true, optional = true }
lambda_runtime = { workspace = true, optional = true }
http = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
httpdate = { workspace = true, optional = true }
fake = { workspace = true, optional = true }
opensearch = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
platform-postgres = { workspace = true, optional = true }


[dev-dependencies]
rstest = { workspace = true }
tracing-subscriber = { workspace = true, features = ["json"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }

[features]
default = []
dynamodb = ["serde_dynamo", "aws-sdk-dynamodb"]
event_bridge = ["aws_lambda_events/eventbridge", "aws_lambda_events/sqs", "aws_lambda_events/dynamodb", "sqs", "dynamodb"]
opensearch = ["dep:opensearch", "serde_json", "aws-config"]
postgres = ["dep:sqlx", "dep:platform-postgres"]
sqs = ["aws-sdk-sqs", "serde_json"]
api = [
    "aws_lambda_events/apigw",
    "http",
    "serde_json",
    "httpdate",
    "lambda_runtime"
]
test-data = ["fake", "domain-primitives/test-data", "fxrate-core/test-data", "geo/test-data", "product-core/test-data", "shop-core/test-data"]
