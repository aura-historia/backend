[package]
name = "search-filter-lambda-periodic-match"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "search-filter-lambda-periodic-match"
path = "src/main.rs"

[dependencies]
common = { workspace = true, features = ["dynamodb", "event_bridge", "opensearch", "api"] }
search-filter = { workspace = true, features = ["dynamodb", "opensearch", "service"] }
product = { workspace = true, features = ["dynamodb", "opensearch", "service"] }
product-pipeline-embed-text = { workspace = true }
notification = { workspace = true, features = ["dynamodb", "service"] }
user = { workspace = true, features = ["dynamodb", "service", "data"] }
lambda_runtime = { workspace = true }
aws-config = { workspace = true }
aws-sdk-dynamodb = { workspace = true }
aws-sdk-sesv2 = { workspace = true }
aws-sdk-s3 = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros"] }
tracing-subscriber = { workspace = true, features = ["json"] }
tracing = { workspace = true }
mockall = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
time = { workspace = true }

[dev-dependencies]
product = { workspace = true, features = ["test-data"] }
search-filter = { workspace = true, features = ["test-data"] }
notification = { workspace = true, features = ["test-data"] }
user = { workspace = true, features = ["test-data"] }
common = { workspace = true, features = ["test-data"] }
fake = { workspace = true }
