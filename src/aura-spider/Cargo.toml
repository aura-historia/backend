[package]
name = "aura-spider"
version = "0.1.0"
edition = "2024"

[dependencies]
schemars = { workspace = true }
spider = { version = "2", default-features = false, features = ["regex", "sync", "reqwest_rustls_tls"] }
tokio = { workspace = true, features = ["full"] }
reqwest = { workspace = true, features = ["json", "rustls-tls"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
regex = { workspace = true }
llm = { workspace = true, features = ["google", "rustls-tls"] }
dotenvy = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }
bloomfilter = "3.0.1"
async-trait = { workspace = true }
mockall = { workspace = true }
sqlx = { workspace = true }
time = { workspace = true, features = ["serde"] }
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true, features = ["postgres"] }
sha2 = { workspace = true }
url-normalize = { workspace = true }
uuid = { workspace = true }
common = { workspace = true }
aura-scraper = { workspace = true }

[dev-dependencies]
test-api = { workspace = true, features = ["rds"] }
tokio = { workspace = true, features = ["macros", "time"] }
serial_test = { workspace = true }

[[bin]]
name = "demo"
path = "src/demo.rs"
