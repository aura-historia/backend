[package]
name = "product-pipeline-extract-attribute"
version = "0.1.0"
edition = "2024"

[dependencies]
product-pipeline-common = { workspace = true }
product = { workspace = true, features = ["dynamodb"] }
common = { workspace = true, features = ["dynamodb", "event_bridge"] }
async-trait = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["json"] }
mockall = { workspace = true }
aws-config = { workspace = true }
aws-sdk-sqs = { workspace = true }
tokio = { workspace = true, features = ["time", "macros", "rt-multi-thread"] }
serde = { workspace = true }
serde_json = { workspace = true }
pyo3 = { workspace = true, features = ["auto-initialize"] }
pyo3-ffi = { workspace = true }

[dev-dependencies]
product-pipeline-common = { workspace = true, features = ["test-data"] }
rstest = { workspace = true }
fake = { workspace = true }
