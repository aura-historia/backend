[package]
name = "product-pipeline-classify"
version = "0.1.0"
edition = "2024"

[dependencies]
product = { workspace = true, features = ["dynamodb", "service"] }
product-classification = { workspace = true }
common = { workspace = true, features = ["dynamodb", "event_bridge", "opensearch", "api"] }
async-trait = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["json"] }
mockall = { workspace = true }
aws-config = { workspace = true }
aws-sdk-dynamodb = { workspace = true }
lambda_runtime = { workspace = true }
aws_lambda_events = { workspace = true, features = ["sqs", "dynamodb", "eventbridge"] }
serde_dynamo = { workspace = true }
llm = { workspace = true, features = ["google", "rustls-tls"] }
opensearch = { workspace = true }
thiserror = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true, features = ["macros"] }
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }

[dev-dependencies]
product = { workspace = true, features = ["test-data"] }
product-classification = { workspace = true, features = ["test-data"] }
fake = { workspace = true }
rstest = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }
