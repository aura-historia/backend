[package]
name = "product-opensearch"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = { workspace = true }
common = { workspace = true, features = ["opensearch"] }
geo = { workspace = true }
indexmap = { workspace = true }
isocountry = { workspace = true }
opensearch = { workspace = true }
product-core = { workspace = true }
product-service = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_fields = { workspace = true }
shop-core = { workspace = true }
strum = { workspace = true }
strum_macros = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true, features = ["formatting", "serde"] }
