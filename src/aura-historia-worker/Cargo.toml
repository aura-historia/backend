[package]
name = "aura-historia-worker"
version = "0.1.0"
edition = "2024"

[dependencies]
aws-config = { workspace = true }
aws-sdk-dynamodb = { workspace = true }
common = { workspace = true, features = ["postgres"] }
notification-dynamodb = { workspace = true }
notification-service = { workspace = true }
opensearch = { workspace = true }
product-postgres = { workspace = true }
product-service = { workspace = true }
search-filter-opensearch = { workspace = true }
search-filter-postgres = { workspace = true }
search-filter-service = { workspace = true }
watchlist-postgres = { workspace = true }
serde = { workspace = true, features = ["derive"] }
