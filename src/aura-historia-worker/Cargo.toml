[package]
name = "aura-historia-worker"
version = "0.1.0"
edition = "2024"
autobins = false

[[bin]]
name = "aura-historia-worker"
path = "src/main.rs"

[dependencies]
aura-historia-jobs = { path = "../aura-historia-jobs" }
aura-historia-cdc-routing = { path = "../aura-historia-cdc-routing" }
# Temporary compatibility bridge for the legacy polling handlers (Iteration 3 removes these).
notification-delivery-lambda = { workspace = true }
product-content-assessment-lambda = { workspace = true }
product-embedding-lambda = { workspace = true }
product-listing-normalization-lambda = { workspace = true }
product-listing-opensearch-lambda = { workspace = true }
product-translation-lambda = { workspace = true }
search-filter-match-notification-lambda = { workspace = true }
search-filter-percolator-lambda = { workspace = true }
search-filter-projection-lambda = { workspace = true }
watchlist-notification-lambda = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
application = { workspace = true }

aws-config = { workspace = true }
aws-sdk-s3 = { workspace = true }
aws-sdk-sesv2 = { workspace = true }
aws-sdk-sqs = { workspace = true }
aws-smithy-types = { workspace = true }


domain-primitives = { workspace = true }
fxrate-core = { workspace = true }
embedding = { workspace = true }
fxrate-postgres = { workspace = true }

large-language-model = { workspace = true }

localization = { workspace = true }
money = { workspace = true }
google-cloud-auth = { workspace = true }
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util = { workspace = true, features = ["tokio", "service"] }
indexmap = { workspace = true }
notification-core = { workspace = true }
notification-email-aws = { workspace = true }
notification-postgres = { workspace = true }
notification-service = { workspace = true }
opensearch = { workspace = true }
platform-observability = { workspace = true }
platform-worker-queue-contract = { path = "../platform-worker-queue-contract" }
platform-postgres = { workspace = true }
product-listing-core = { workspace = true }
product-listing-opensearch = { workspace = true }
product-listing-postgres = { workspace = true }
product-listing-service = { workspace = true }
product-service = { workspace = true }
product-listing-translation-llm = { workspace = true }
reqwest = { workspace = true }
search-filter-core = { workspace = true }
search-filter-opensearch = { workspace = true }
search-filter-postgres = { workspace = true }
search-filter-service = { workspace = true }
watchlist-postgres = { workspace = true }
user-core = { workspace = true }
user-postgres = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
strum = { workspace = true }
strum_macros = { workspace = true }
time = { workspace = true, features = ["formatting", "parsing"] }

uuid = { workspace = true }

sqlx = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = { workspace = true }

[dev-dependencies]
rstest = { workspace = true }
listing-source-core = { workspace = true }
listing-source-postgres = { workspace = true }
listing-source-service = { workspace = true }
user-service = { workspace = true }
product-listing-normalization = { workspace = true }
search-filter-core = { workspace = true }
indexmap = { workspace = true }
serial_test = { workspace = true }
test-api = { workspace = true, features = ["opensearch", "postgres", "sequin", "ses", "sqs"] }
tokio = { workspace = true, features = ["test-util"] }
