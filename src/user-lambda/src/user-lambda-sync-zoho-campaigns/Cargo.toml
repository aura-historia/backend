[package]
name = "user-lambda-sync-zoho-campaigns"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "user-lambda-sync-zoho-campaigns"
path = "src/main.rs"

[dependencies]
common = { workspace = true, features = ["dynamodb", "event_bridge"] }
user = { workspace = true, features = ["dynamodb", "service", "zoho"] }
lambda_runtime = { workspace = true }
aws-config = { workspace = true }
aws_lambda_events = { workspace = true, features = ["sqs", "dynamodb", "eventbridge"] }
aws-sdk-dynamodb = { workspace = true }
serde_json = { workspace = true }
serde_dynamo = { workspace = true }
tokio = { workspace = true, features = ["macros"] }
tracing-subscriber = { workspace = true, features = ["json"] }
tracing = { workspace = true }
reqwest = { workspace = true, features = ["json"] }

[dev-dependencies]
user = { workspace = true, features = ["test-data"] }
fake = { workspace = true }
rstest = { workspace = true }
serde = { workspace = true }
time = { workspace = true }
uuid = { workspace = true }
