[package]
name = "user-lambda-fanout-update"
version = "0.1.0"
edition = "2024"

[dependencies]
common = { workspace = true, features = ["dynamodb", "event_bridge"] }
user = { workspace = true, features = ["dynamodb"] }
product = { workspace = true, features = ["dynamodb", "watchlist"] }
time = { workspace = true }
lambda_runtime = { workspace = true }
aws-config = { workspace = true }
aws-sdk-dynamodb = { workspace = true }
aws_lambda_events = { workspace = true, features = [
    "sqs",
    "dynamodb",
    "eventbridge",
] }
serde_json = { workspace = true }
serde_dynamo = { workspace = true }
tokio = { workspace = true, features = ["macros"] }
tracing-subscriber = { workspace = true, features = ["json"] }
tracing = { workspace = true }

[dev-dependencies]
mockall = { workspace = true }
rstest = { workspace = true }
fake = { workspace = true }
uuid = { workspace = true }
user = { workspace = true, features = ["test-data"] }
product = { workspace = true, features = ["test-data"] }
