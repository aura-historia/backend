http_endpoints:
  - name: "worker"
    url: "__WEBHOOK_URL__"

sinks:
  - name: "worker-changes"
    database: "aura-historia-business-__SUFFIX__"
    source:
      include_tables: [__INCLUDE_TABLES__]
    actions:
      - insert
      - update
      - delete
    batch_size: 1
    destination:
      type: "webhook"
      http_endpoint: "worker"
      batch: false
