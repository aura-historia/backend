
http_endpoints:
  - name: "worker"
    url: "__WEBHOOK_URL__"

sinks:
  - name: "worker-product-events"
    database: "aura-historia-business-__SUFFIX__"
    source:
      include_tables:
        - "public.product_events"
    actions:
      - insert
    batch_size: 1
    destination:
      type: "webhook"
      http_endpoint: "worker"
      batch: false
