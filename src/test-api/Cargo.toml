[package]
name = "test-api"
version = "0.1.0"
edition = "2024"

[dependencies]
application = { workspace = true }
test-api-macros = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true, optional = true }
derive_builder = { workspace = true }
serial_test = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true, features = ["localstack", "postgres"] }
sqlx = { workspace = true, optional = true }
aws-config = { workspace = true }
aws-sdk-account = { workspace = true }
tracing-subscriber = { workspace = true, features = ["json"] }
tracing = { workspace = true }
typed-builder = { workspace = true }
libc = { workspace = true }
ctrlc = { workspace = true }

uuid = { workspace = true }

# Optional deps
aws_lambda_events = { workspace = true, optional = true, features = ["apigw"] }
opensearch = { workspace = true, optional = true, features = ["aws-auth"] }
aws-sdk-opensearch = { workspace = true, optional = true }
aws-sdk-sqs = { workspace = true, optional = true }
aws-sdk-eventbridge = { workspace = true, optional = true }
futures-util = { workspace = true }

reqwest = { workspace = true, optional = true, features = ["json"] }
aws-sdk-sesv2 = { workspace = true, optional = true }

[dev-dependencies]
test-api = { workspace = true, features = [
    "api-gateway",
    "opensearch",
    "postgres",
    "ses",
    "sqs",
]}
rstest = { workspace = true }
product-listing-core = { workspace = true }

[features]
default = []
api-gateway = ["aws_lambda_events", "aws_lambda_events/apigw"]
aura-historia-api = ["dep:axum"]
opensearch = ["dep:opensearch", "dep:aws-sdk-opensearch"]
postgres = ["dep:sqlx"]
sqs = ["dep:aws-sdk-sqs"]
eventbridge = ["dep:aws-sdk-eventbridge"]
ses = ["dep:aws-sdk-sesv2", "dep:reqwest"]
