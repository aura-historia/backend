[package]
name = "test-api"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "aura-test-env"
path = "src/bin/aura-test-env.rs"
required-features = ["supervisor"]

[dependencies]
application = { workspace = true }
test-api-macros = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true, optional = true }
serial_test = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
tokio = { workspace = true, features = ["full"] }
testcontainers = { workspace = true }
sqlx = { workspace = true, optional = true }
aws-config = { workspace = true }
aws-sdk-account = { workspace = true }
tracing-subscriber = { workspace = true, features = ["json"] }
tracing = { workspace = true }
libc = { workspace = true }
ctrlc = { workspace = true }
sha2 = { workspace = true, optional = true }
aws-sdk-s3 = { workspace = true, optional = true }

uuid = { workspace = true }

# Optional deps
opensearch = { workspace = true, optional = true }
futures-util = { workspace = true }

reqwest = { workspace = true, optional = true, features = ["json"] }
aws-sdk-sesv2 = { workspace = true, optional = true }

[dev-dependencies]
test-api = { workspace = true, features = [
    "opensearch",
    "postgres",
    "s3",
    "ses",
]}
rstest = { workspace = true }
product-listing-core = { workspace = true }

[features]
default = []
aura-historia-api = ["dep:axum"]
opensearch = ["dep:opensearch"]
postgres = ["dep:sqlx", "dep:sha2"]
s3 = ["dep:aws-sdk-s3"]
ses = ["dep:aws-sdk-sesv2", "dep:reqwest"]

supervisor = ["postgres", "opensearch", "s3", "ses"]
