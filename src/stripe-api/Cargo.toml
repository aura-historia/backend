[package]
name = "stripe-api"
version = "0.1.0"
edition = "2024"

[dependencies]
common = { workspace = true, features = ["api"] }
user = { workspace = true, features = ["data", "dynamodb", "service"] }
async-trait = { workspace = true }
mockall = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["json"] }
tokio = { workspace = true, features = ["macros"] }
aws_lambda_events = { workspace = true, features = ["apigw"] }
lambda_runtime = { workspace = true }
aws-config = { workspace = true }
aws-sdk-dynamodb = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
url = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
common = { workspace = true, features = ["test-data"] }
user = { workspace = true, features = ["full"] }
test-api = { workspace = true, features = ["api-gateway"] }
rstest = { workspace = true }
fake = { workspace = true }
http = { workspace = true }
