[package]
name = "oauth"
version = "0.1.0"
edition = "2024"

[dependencies]
common = { workspace = true, features = ["api"] }
user = { workspace = true, features = ["dynamodb", "service", "data"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_fields = { workspace = true }
serde_dynamo = { workspace = true, features = ["aws-sdk-dynamodb+1"] }
aws-sdk-dynamodb = { workspace = true }
async-trait = { workspace = true }
mockall = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true, features = ["serde", "formatting"] }
url = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
http = { workspace = true }
fake = { workspace = true, optional = true }

[dev-dependencies]
oauth = { workspace = true, features = ["test-data"] }
test-api = { workspace = true, features = ["dynamodb"] }
fake = { workspace = true }
rstest = { workspace = true }
serial_test = { workspace = true }
tokio = { workspace = true, features = ["macros"] }

[features]
default = []
test-data = ["dep:fake", "common/test-data", "user/test-data"]
