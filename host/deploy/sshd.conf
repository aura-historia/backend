# Installed as /etc/ssh/sshd_config.d/20-aura-deploy.conf by host/install.sh deploy. The deploy
# user logs in only with the key in a root-owned file and can only run the prod deploy, which
# reads its request from SSH_ORIGINAL_COMMAND. A Match block in an included file ends with it.
Match User deploy
    AuthorizedKeysFile /etc/aura-historia/deploy/authorized_keys
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    ForceCommand /usr/bin/sudo -n /usr/local/sbin/aura-prod-deploy
    AllowTcpForwarding no
    AllowStreamLocalForwarding no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTTY no
    PermitTunnel no
    PermitUserRC no
