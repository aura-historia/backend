# pgBackRest for the business PostgreSQL (host/prod/README.md#backups). The bucket, the S3 key
# and the repository cipher passphrase come from the environment:
# PGBACKREST_REPO1_S3_BUCKET, PGBACKREST_REPO1_S3_KEY, PGBACKREST_REPO1_S3_KEY_SECRET and
# PGBACKREST_REPO1_CIPHER_PASS.

[global]
repo1-type=s3
repo1-path=/pgbackrest
repo1-s3-endpoint=s3.eu-central-1.amazonaws.com
repo1-s3-region=eu-central-1
repo1-s3-uri-style=host
# Encrypted before upload; the passphrase lives only in the host's secret files and their
# encrypted copy.
repo1-cipher-type=aes-256-cbc
# Weekly full and daily differential backups; every point of the last 14 days stays restorable.
repo1-retention-full-type=time
repo1-retention-full=14
repo1-bundle=y
repo1-block=y

compress-type=zst
process-max=2
start-fast=y
archive-async=y
archive-push-queue-max=16GiB
spool-path=/var/spool/pgbackrest
lock-path=/tmp/pgbackrest

log-level-console=info
log-level-stderr=warn
log-level-file=off

[aura]
pg1-path=/var/lib/postgresql/data
pg1-socket-path=/var/run/postgresql
