# Business PostgreSQL client authentication (host/prod/README.md#postgresql).
# TYPE  DATABASE  USER      ADDRESS  METHOD

# The superuser only as the container's own postgres user: initdb, pgBackRest and
# `compose exec -u postgres postgres psql`. Never over a network.
local   all       postgres           peer
host    all       postgres  all      reject

# Application, operator and crawler roles authenticate with their passwords: over the
# Compose networks, or through the socket directory the host crawler shares.
local   aura      all                scram-sha-256
host    aura      all       all      scram-sha-256
