# Business PostgreSQL on the prod host. The container's memory settings and the host memory
# plan are in host/README.md; tune both together from observed usage.

hba_file = '/etc/postgresql/pg_hba.conf'

# Reachable only on the Compose networks and through the socket directories; nothing is
# published. The second directory is shared with the host for the crawler.
listen_addresses = '*'
unix_socket_directories = '/var/run/postgresql, /run/postgresql-host'
unix_socket_permissions = 0777
password_encryption = scram-sha-256

# Connection budget: two API replicas and MCP 10 each, the worker 77 at its default concurrency,
# ops jobs 2 each, the crawler role 8, plus operators, migrations and pgBackRest.
max_connections = 200
superuser_reserved_connections = 5

# Memory, for a 14 GiB container limit.
shared_buffers = 4GB
huge_pages = try
effective_cache_size = 10GB
work_mem = 16MB
maintenance_work_mem = 1GB
autovacuum_work_mem = 512MB

# NVMe RAID 1.
random_page_cost = 1.1
effective_io_concurrency = 200
maintenance_io_concurrency = 200

# Parallelism within the host's 12 threads; the serving tier shares them with OpenSearch.
max_worker_processes = 8
max_parallel_workers = 4
max_parallel_workers_per_gather = 2
max_parallel_maintenance_workers = 2

# WAL and continuous archiving through pgBackRest (host/prod/README.md#backups).
wal_level = replica
wal_compression = lz4
max_wal_size = 8GB
min_wal_size = 1GB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
archive_mode = on
archive_command = 'pgbackrest --stanza=aura archive-push %p'
archive_timeout = 300

autovacuum_max_workers = 4
autovacuum_naptime = 30s

timezone = 'UTC'
log_timezone = 'UTC'
datestyle = 'iso, mdy'
lc_messages = 'C'

# Logs go to the container's stderr; statement text is never logged by default.
log_destination = 'stderr'
log_min_duration_statement = -1
log_checkpoints = on
log_lock_waits = on
log_temp_files = 64MB
log_autovacuum_min_duration = 10s
log_line_prefix = '%m [%p] %q%u@%d '
