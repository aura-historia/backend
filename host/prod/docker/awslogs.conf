# Installed by host/install.sh prod as a docker.service drop-in. Docker's awslogs log driver
# signs with the daemon's own credentials: the host user's key from the prod secrets
# (host/prod/README.md#logs). Optional, so Docker starts without the file. It applies after
# `systemctl restart docker`; live-restore keeps the containers running meanwhile.
[Service]
EnvironmentFile=-/etc/aura-historia/prod/secrets/aws.env
