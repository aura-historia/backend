# Installed as /etc/tmpfiles.d/aura-prod.conf by host/install.sh prod.
# PostgreSQL's socket directory shared with the host crawler. 999 is the postgres user inside
# the database image; only it may create entries here, everyone may connect.
d /run/aura-historia 0755 root root -
d /run/aura-historia/postgresql 0755 999 999 -
