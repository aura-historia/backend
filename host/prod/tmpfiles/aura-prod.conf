# Installed as /etc/tmpfiles.d/aura-prod.conf by host/install.sh prod.
# PostgreSQL's socket directory shared with the host crawler. 999 is the postgres user inside
# the database image; only it may create entries here, and only the crawler group may connect.
# Peer authentication maps uid 999 to the database superuser, so no host process may run as
# uid 999 (host/prod/README.md#crawler).
d /run/aura-historia 0755 root root -
d /run/aura-historia/postgresql 0750 999 crawler -
