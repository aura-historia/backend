  # --- Stripe API ---
  # The LocalStack acceptance-tests run against this Lambda. The Lambda binary
  # detects the LocalStack environment via `LOCALSTACK_HOSTNAME` and then
  # short-circuits all Stripe calls through `MockStripeService`, so no real
  # Stripe credentials are required here.
  StripeApiRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "stripe-api-role-${StageName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:UpdateItem
                Resource:
                  - !GetAtt TableOne.Arn
                  - !Sub "${TableOne.Arn}/index/*"
  StripeApiLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "stripe-api-${StageName}"
      Runtime: provided.al2023
      Handler: lib.handler
      Role: !GetAtt StripeApiRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub "stripe-api-${StageName}-${CommitSHA}.zip"
      MemorySize: 256
      Timeout: 10
      EphemeralStorage:
        Size: 512
      Environment:
        Variables:
          STAGE: !Ref Stage
          DYNAMODB_TABLE_NAME: !Ref TableOne
          # Required by the lambda's startup config-loader. The values are
          # placeholders here because LocalStack-deployments use the
          # MockStripeService and never reach Stripe.
          STRIPE_PRO_MONTHLY_PRICE_ID: "price_pro_monthly_mock"
          STRIPE_PRO_YEARLY_PRICE_ID: "price_pro_yearly_mock"
          STRIPE_ULTIMATE_MONTHLY_PRICE_ID: "price_ultimate_monthly_mock"
          STRIPE_ULTIMATE_YEARLY_PRICE_ID: "price_ultimate_yearly_mock"
  StripeApiLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref StripeApiLambda
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*/*/api/v1*"

