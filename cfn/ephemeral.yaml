        Size: 512
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME: !Ref TableOne
          S3_BUCKET_NAME_TEMPLATES: "aura-historia-mail-templates-eu-central-1"
          STAGE_NAME: !Sub "${StageName}"
          COMMIT_SHA: !Sub "${CommitSHA}"
          GOOGLE_GEOCODING_API_KEY: "test-key"
  PartnerShopApplicationStateMachineExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "partner-shop-application-sfn-execution-role-${StageName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeLambda
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !GetAtt PartnerShopApplicationStepFunctionLambda.Arn
  PartnerShopApplicationStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub "partner-shop-application-${StageName}"
      StateMachineType: STANDARD
      RoleArn: !GetAtt PartnerShopApplicationStateMachineExecutionRole.Arn
      DefinitionString: !Sub |
        {
          "Comment": "Partner Shop Application approval workflow",
          "StartAt": "WaitForReview",
          "States": {
            "WaitForReview": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke.waitForTaskToken",
              "Parameters": {
                "FunctionName": "${PartnerShopApplicationStepFunctionLambda.Arn}",
                "Payload": {
                  "step": "WAIT_FOR_REVIEW",
                  "task_token.$": "$$.Task.Token",
                  "partner_application_id.$": "$.partner_application_id",
                  "applicant_user_id.$": "$.applicant_user_id"
                }
              },
              "Next": "ReviewDecision"
            },
            "ReviewDecision": {
              "Type": "Choice",
              "Choices": [
                {
                  "Variable": "$.decision",
                  "StringEquals": "APPROVED",
                  "Next": "Approve"
                },
                {
                  "Variable": "$.decision",
                  "StringEquals": "REJECTED",
                  "Next": "Reject"
                }
              ]
            },
            "Approve": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${PartnerShopApplicationStepFunctionLambda.Arn}",
                "Payload": {
                  "step": "APPROVE",
                  "partner_application_id.$": "$.partner_application_id",
                  "applicant_user_id.$": "$.applicant_user_id"
                }
              },
              "End": true
            },
            "Reject": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${PartnerShopApplicationStepFunctionLambda.Arn}",
                "Payload": {
                  "step": "REJECT",
                  "partner_application_id.$": "$.partner_application_id",
                  "applicant_user_id.$": "$.applicant_user_id"
                }
              },
              "End": true
            }
          }
        }

