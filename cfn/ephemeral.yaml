  ProductPipelineCompleteDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "product-pipeline-complete-dlq-${StageName}"
      MessageRetentionPeriod: 1209600
  ProductPipelineCompleteQ:
