                  - dynamodb:TransactWriteItems
                Resource:
                  - !GetAtt TableOne.Arn
                  - !Sub "${TableOne.Arn}/index/*"
  ProductPipelineClassifyPeriodInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub "product-pipeline-classify-period-profile-${StageName}"
      Roles:
        - !Ref ProductPipelineClassifyPeriodRole
  ProductPipelineClassifyPeriodLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub "product-pipeline-classify-period-template-${StageName}"
      LaunchTemplateData:
        IamInstanceProfile:
          Name: !Ref ProductPipelineClassifyPeriodInstanceProfile
        InstanceType: g6.xlarge # Placeholder - ASG overrides this
        ImageId: "{{resolve:ssm:/amis/ephemeral/product-pipeline-classify-period/latest}}"
        SecurityGroupIds: [!Ref ProductPipelineSecurityGroup]
        BlockDeviceMappings:
          - DeviceName: /dev/sda1
            Ebs:
              VolumeSize: 80
              VolumeType: gp3
              DeleteOnTermination: true
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: !Sub "product-pipeline-classify-period-${StageName}"
              - Key: Fleet
                Value: product-pipeline-classify-period
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -euxo pipefail
            sudo -i
            export DYNAMODB_TABLE_NAME="${TableOne}"
            export STAGE="ephemeral"
            export STAGE_NAME=${StageName}
            export CommitSHA="${CommitSHA}"
            export ARTIFACT_BUCKET="${ArtifactBucket}"
            export SOURCE_QUEUE_URL="${ProductPipelineClassifyPeriodQ}"
            export OPENSEARCH_ENDPOINT_URL="https://${OpenSearchDomain.DomainEndpoint}"
            # Download and install binary
            sudo aws s3 cp "s3://${ArtifactBucket}/ephemeral/${CommitSHA}/product-pipeline-classify-period" /opt/product-pipeline-classify-period/product-pipeline-classify-period --region eu-central-1
            sudo chmod +x /opt/product-pipeline-classify-period/product-pipeline-classify-period
            # Prepare (preconfigured via custom ami) python venv
            cd /opt/product-pipeline-classify-period
            source .venv/bin/activate
            # ----------------------------
            # INSTANCE STORE (CORRECT ZERO-COPY HF CACHE)
            # ----------------------------
            set -euxo pipefail

            ROOT_DEV=$(lsblk -ndo PKNAME "$(findmnt -n -o SOURCE /)")
            DEVICE=""

            echo "Waiting for instance store NVMe..."

            for i in {1..30}; do
              DEVICE=$(lsblk -ndo NAME,TYPE | awk '$2=="disk"{print "/dev/"$1}' | grep -v "$ROOT_DEV" | head -n1 || true)
              [ -n "$DEVICE" ] && break
              sleep 1
            done

            if [ -z "$DEVICE" ]; then
              echo "❌ No instance store detected — using EBS"
              export HF_HOME=/opt/huggingface
              export TRANSFORMERS_CACHE=/opt/huggingface
              export SENTENCE_TRANSFORMERS_HOME=/opt/huggingface
            else
              echo "✅ Found instance store: $DEVICE"

              if ! blkid "$DEVICE" >/dev/null 2>&1; then
                mkfs.xfs -f "$DEVICE"
              fi

              mkdir -p /mnt/instance-store
              mount -o noatime,nodiratime "$DEVICE" /mnt/instance-store

              mkdir -p /mnt/instance-store/huggingface

              # If /opt/huggingface is NOT already a symlink, replace it
              if [ ! -L /opt/huggingface ]; then
                echo "🔁 Moving HF cache pointer to NVMe (no copy)"
                rm -rf /opt/huggingface
                ln -s /mnt/instance-store/huggingface /opt/huggingface
              fi

              export HF_HOME=/opt/huggingface
              export TRANSFORMERS_CACHE=/opt/huggingface
              export SENTENCE_TRANSFORMERS_HOME=/opt/huggingface

              echo "🔥 HuggingFace cache now lives on NVMe"
            fi

            # Run binary
            LOG_PATH="/var/log/product-pipeline-classify-period.log"
            echo "[$(date)] Running product-pipeline-classify-period..." | tee -a "$LOG_PATH"
            ./product-pipeline-classify-period >> "$LOG_PATH" 2>&1
            EXIT_CODE=$?
            echo "[$(date)] Job finished with code $EXIT_CODE" | tee -a "$LOG_PATH"
            sleep 5
            aws autoscaling terminate-instance-in-auto-scaling-group \
              --instance-id $(ec2metadata --instance-id) \
              --should-decrement-desired-capacity
            exit $EXIT_CODE
  ProductPipelineClassifyPeriodASG:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      VPCZoneIdentifier:
        - !Ref ProductPipelineSubnetA
      MinSize: 0
      MaxSize: 1
      DesiredCapacity: 0
      MixedInstancesPolicy:
        LaunchTemplate:
          LaunchTemplateSpecification:
            LaunchTemplateId: !Ref ProductPipelineClassifyPeriodLaunchTemplate
            Version: !GetAtt ProductPipelineClassifyPeriodLaunchTemplate.LatestVersionNumber
          Overrides:
            - InstanceType: g6.xlarge
            - InstanceType: g6.2xlarge
            - InstanceType: g5.xlarge
            - InstanceType: g5.2xlarge
        InstancesDistribution:
          OnDemandPercentageAboveBaseCapacity: 0
          SpotAllocationStrategy: price-capacity-optimized
      Tags:
        - Key: Name
          Value: !Sub "product-pipeline-classify-period-${StageName}"
          PropagateAtLaunch: true
      HealthCheckType: EC2
      HealthCheckGracePeriod: 120
  ProductPipelineClassifyPeriodDynamoDbProductEventRecordCreatedEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "ddb-product-embed-product-pipeline-classify-period-${StageName}"
      EventBusName: !Ref DynamoDbEventBus
      EventPattern:
        source:
          - !Ref TableOne
        detail-type:
          - "DynamoDBStreamRecord"
        detail:
          eventName:
            - "INSERT"
          dynamodb:
            NewImage:
              event_type:
                S:
                  - "ENRICHMENT_EMBEDDED_TEXT"
      Targets:
        - Id: ProductPipelineClassifyPeriodQ
          Arn: !GetAtt ProductPipelineClassifyPeriodQ.Arn

  ProductPipelineScaleControlRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "product-pipeline-asg-scale-control-role-${StageName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: SqsGetQueueAttributes
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sqs:GetQueueAttributes
                  - sqs:GetQueueUrl
                  - cloudwatch:GetMetricStatistics
                Resource: "*"
        - PolicyName: ScaleASG
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - autoscaling:UpdateAutoScalingGroup
                  - autoscaling:DescribeAutoScalingGroups
                Resource: "*"
  ProductPipelineScaleControlLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "product-pipeline-asg-scale-control-${StageName}"
      Runtime: provided.al2023
      Handler: lib.handler
      Role: !GetAtt ProductPipelineScaleControlRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub "product-pipeline-asg-scale-control-${StageName}-${CommitSHA}.zip"
      MemorySize: 128
      Timeout: 60
      EphemeralStorage:
        Size: 512
      Environment:
        Variables:
          PRODUCT_PIPELINE_TRANSLATE_SQS_URL: !Ref ProductPipelineTranslateQ
          PRODUCT_PIPELINE_TRANSLATE_SQS_NAME: !GetAtt ProductPipelineTranslateQ.QueueName
          PRODUCT_PIPELINE_TRANSLATE_ASG_NAME: !Ref ProductPipelineTranslateASG
          PRODUCT_PIPELINE_EMBED_TEXT_SQS_URL: !Ref ProductPipelineEmbedTextQ
          PRODUCT_PIPELINE_EMBED_TEXT_SQS_NAME: !GetAtt ProductPipelineEmbedTextQ.QueueName
          PRODUCT_PIPELINE_EMBED_TEXT_ASG_NAME: !Ref ProductPipelineEmbedTextASG
          PRODUCT_PIPELINE_EXTRACT_ATTRIBUTE_SQS_URL: !Ref ProductPipelineExtractAttributeQ
          PRODUCT_PIPELINE_EXTRACT_ATTRIBUTE_SQS_NAME: !GetAtt ProductPipelineExtractAttributeQ.QueueName
          PRODUCT_PIPELINE_EXTRACT_ATTRIBUTE_ASG_NAME: !Ref ProductPipelineExtractAttributeASG
          PRODUCT_PIPELINE_CLASSIFY_CATEGORY_SQS_URL: !Ref ProductPipelineClassifyCategoryQ
          PRODUCT_PIPELINE_CLASSIFY_CATEGORY_SQS_NAME: !GetAtt ProductPipelineClassifyCategoryQ.QueueName
          PRODUCT_PIPELINE_CLASSIFY_CATEGORY_ASG_NAME: !Ref ProductPipelineClassifyCategoryASG
          PRODUCT_PIPELINE_CLASSIFY_PERIOD_SQS_URL: !Ref ProductPipelineClassifyPeriodQ
          PRODUCT_PIPELINE_CLASSIFY_PERIOD_SQS_NAME: !GetAtt ProductPipelineClassifyPeriodQ.QueueName
          PRODUCT_PIPELINE_CLASSIFY_PERIOD_ASG_NAME: !Ref ProductPipelineClassifyPeriodASG
  ProductPipelineScaleControlStartSchedule:
    Type: AWS::Events::Rule
    Properties:
      ScheduleExpression: "cron(*/15 * * * ? *)" # every 15min
      Targets:
        - Arn: !GetAtt ProductPipelineScaleControlLambda.Arn
          Id: "ProductPipelineScaleControlStartSchedule"
          RetryPolicy:
            MaximumRetryAttempts: 5
            MaximumEventAgeInSeconds: 3600
  ProductPipelineScaleControlStartSchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ProductPipelineScaleControlLambda
      Action: "lambda:InvokeFunction"
      Principal: "events.amazonaws.com"
      SourceArn: !GetAtt ProductPipelineScaleControlStartSchedule.Arn

