  PartnerShopApplicationStepFunctionLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "partner-shop-application-lambda-${StageName}"
      Runtime: provided.al2023
      Handler: lib.handler
      Role: !GetAtt PartnerShopApplicationStepFunctionRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
