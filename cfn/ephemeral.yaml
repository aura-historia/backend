  # --- Partner Shop Application Step Function ---
  PartnerShopApplicationStepFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "partner-shop-application-sfn-lambda-role-${StageName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
