        AllowMethods:
          - "*"
        AllowHeaders:
          - Authorization
          - Content-Type
          - Accept
          - X-WC-Webhook-Source
          - X-WC-Webhook-Topic
          - X-WC-Webhook-Signature
          - X-WC-Webhook-Resource
          - X-WC-Webhook-Event
          - X-WC-Webhook-ID
          - X-WC-Webhook-Delivery-ID
