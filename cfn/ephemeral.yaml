AWSTemplateFormatVersion: "2010-09-09"
Description: Ephemeral Staging-Test Stack for the Aura-Historia Application-Backend

Parameters:
  Stage:
    Type: String
    Description: "Name of the stage"
  StageName:
    Type: String
    Description: "Name of the ephemeral stage"
  ArtifactBucket:
    Type: String
    Description: "S3 bucket containing Lambda deployment zips"
  ResourceBucket:
    Type: String
    Description: "S3 bucket containing resources"
  MailTemplateBucket:
    Type: String
    Description: "S3 bucket containing mail-templates"
  CommitSHA:
    Type: String

Resources:
  PrimaryUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "primary-userpool-${StageName}"
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 7
      UserPoolAddOns:
        AdvancedSecurityMode: ENFORCED
      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE
      EmailVerificationSubject: "Verify your email"
      EmailVerificationMessage: "Your verification code is {####}"
      Schema:
        - Name: email
          AttributeDataType: String
          Mutable: false
          Required: true
      LambdaConfig:
        PostConfirmation: !GetAtt PrimaryUserPoolPostConfirmationLambda.Arn

  PrimaryUserPoolPostConfirmationLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "cognito-primary-userpool-post-confirmation-role-${StageName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                Resource: !GetAtt TableOne.Arn
  PrimaryUserPoolPostConfirmationLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "cognito-primary-userpool-post-confirmation-${StageName}"
      Runtime: provided.al2023
      Handler: lib.handler
      Role: !GetAtt PrimaryUserPoolPostConfirmationLambdaRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub "cognito-post-confirmation-${StageName}-${CommitSHA}.zip"
      MemorySize: 256
      Timeout: 5
      EphemeralStorage:
        Size: 512
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME: !Ref TableOne
  AllowCognitoInvokePrimaryUserPoolPostConfirmationLambda:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref PrimaryUserPoolPostConfirmationLambda
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt PrimaryUserPool.Arn

  PrimaryUserPoolClientPublic:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref PrimaryUserPool
      ClientName: !Sub "primary-userpool-client-public-${StageName}"
      GenerateSecret: false # PKCE replaces client secret
      PreventUserExistenceErrors: ENABLED
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      SupportedIdentityProviders:
        - COGNITO
      CallbackURLs:
        - http://localhost:3000
      LogoutURLs:
        - http://localhost:3000
      EnableTokenRevocation: true
      AccessTokenValidity: 1 # hours
      IdTokenValidity: 1 # hours
      RefreshTokenValidity: 30 # days
      ReadAttributes:
        - email
        - email_verified
  PrimaryUserPoolClientAdmin:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref PrimaryUserPool
      ClientName: !Sub "primary-userpool-client-admin-${StageName}"
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      AllowedOAuthFlowsUserPoolClient: false
      ExplicitAuthFlows:
        - ALLOW_ADMIN_USER_PASSWORD_AUTH
      EnableTokenRevocation: true
      AccessTokenValidity: 1 # hours
      IdTokenValidity: 1 # hours
      RefreshTokenValidity: 30 # days
      ReadAttributes:
        - email
      WriteAttributes:
        - email
  PrimaryUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub "primary-userpool-${StageName}" # hosted UI domain
      UserPoolId: !Ref PrimaryUserPool

  TableOne:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "table_1-${StageName}"
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: lsi1_sk
          AttributeType: S
        - AttributeName: lsi2_sk
          AttributeType: S
        - AttributeName: lsi3_sk
          AttributeType: S
        - AttributeName: lsi4_sk
          AttributeType: S
        - AttributeName: lsi5_sk
          AttributeType: S
        - AttributeName: gsi1_pk
          AttributeType: S
        - AttributeName: gsi1_sk
          AttributeType: S
        - AttributeName: gsi2_pk
          AttributeType: S
        - AttributeName: gsi2_sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      LocalSecondaryIndexes:
        - IndexName: lsi1
          KeySchema:
            - AttributeName: pk
              KeyType: HASH
            - AttributeName: lsi1_sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: lsi2
          KeySchema:
            - AttributeName: pk
              KeyType: HASH
            - AttributeName: lsi2_sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: lsi3
          KeySchema:
            - AttributeName: pk
              KeyType: HASH
            - AttributeName: lsi3_sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: lsi4
          KeySchema:
            - AttributeName: pk
              KeyType: HASH
            - AttributeName: lsi4_sk
              KeyType: RANGE
          Projection:
            ProjectionType: KEYS_ONLY
        - IndexName: lsi5
          KeySchema:
            - AttributeName: pk
              KeyType: HASH
            - AttributeName: lsi5_sk
              KeyType: RANGE
          Projection:
            ProjectionType: KEYS_ONLY
      GlobalSecondaryIndexes:
        - IndexName: gsi1
          KeySchema:
            - AttributeName: gsi1_pk
              KeyType: HASH
            - AttributeName: gsi1_sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: gsi2
          KeySchema:
            - AttributeName: gsi2_pk
              KeyType: HASH
            - AttributeName: gsi2_sk
              KeyType: RANGE
          Projection:
            ProjectionType: KEYS_ONLY
      TimeToLiveSpecification:
        AttributeName: "ttl"
        Enabled: true
      BillingMode: PAY_PER_REQUEST
      TableClass: STANDARD
      StreamSpecification:
        StreamViewType: NEW_IMAGE

  OpenSearchDomain:
    Type: AWS::OpenSearchService::Domain
    Properties:
      DomainName: !Sub "application-${StageName}"
      EngineVersion: "OpenSearch_3.1"
      ClusterConfig:
        InstanceType: t3.small.search
        InstanceCount: 1
        ZoneAwarenessEnabled: false
      EBSOptions:
        EBSEnabled: true
        VolumeSize: 10
        VolumeType: gp3
      AccessPolicies:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: "es:*"
            Resource: !Sub "arn:aws:es:${AWS::Region}:${AWS::AccountId}:domain/application-${StageName}/*"

  DynamoDbEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub "dynamodb-event-bus-${StageName}"
  PipeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "dynamodb-to-eventbridge-pipe-role-${StageName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: pipes.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PipePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:DescribeStream
                  - dynamodb:GetRecords
                  - dynamodb:GetShardIterator
                  - dynamodb:ListStreams
                Resource: "*"
              - Effect: Allow
                Action:
                  - events:PutEvents
                Resource: !GetAtt DynamoDbEventBus.Arn
  TableOneStreamToEventBusPipe:
    Type: AWS::Pipes::Pipe
    Properties:
      Name: !Sub "tableone-stream-to-eventbus-${StageName}"
      RoleArn: !GetAtt PipeRole.Arn
      Source: !GetAtt TableOne.StreamArn
      SourceParameters:
        DynamoDBStreamParameters:
          StartingPosition: LATEST
          BatchSize: 10
          MaximumBatchingWindowInSeconds: 1
        FilterCriteria:
          Filters:
            - Pattern: |
                {
                  "eventName": ["INSERT"],
                  "dynamodb": {
                    "NewImage": {
                      "pk": {
                        "S": [{ "prefix": "product#shop_id#" }]
                      },
                      "sk": {
                        "S": [{ "prefix": "product#event#" }]
                      }
                    }
                  }
                }
            - Pattern: |
                {
                  "eventName": ["MODIFY"],
                  "dynamodb": {
                    "NewImage": {
                      "pk": {
                        "S": [{ "prefix": "user#" }]
                      },
                      "sk": {
                        "S": [ "user#details" ]
                      }
                    }
                  }
                }
            - Pattern: |
                {
                  "eventName": ["INSERT", "MODIFY"],
                  "dynamodb": {
                    "NewImage": {
                      "pk": {
                        "S": [{ "prefix": "shop#shop_id#" }]
                      },
                      "sk": {
                        "S": [ "shop#details" ]
                      }
                    }
                  }
                }
            - Pattern: |
                {
                  "eventName": ["INSERT"],
                  "dynamodb": {
                    "NewImage": {
                      "pk": {
                        "S": [{ "prefix": "user#" }]
                      },
                      "sk": {
                        "S": [{ "prefix": "user#notification#origin_event_id#" }]
                      }
                    }
                  }
                }
            # FILTER 5: Search filter INSERT/MODIFY/REMOVE events
            - Pattern: |
                {
                  "eventName": ["INSERT", "MODIFY", "REMOVE"],
                  "dynamodb": {
                    "$or": [
                      {
                        "NewImage": {
                          "pk": {
                            "S": [{ "prefix": "user#" }]
                          },
                          "sk": {
                            "S": [{ "prefix": "search_filter#" }]
                          }
                        }
                      },
                      {
                        "Keys": {
                          "pk": {
                            "S": [{ "prefix": "user#" }]
                          },
                          "sk": {
                            "S": [{ "prefix": "search_filter#" }]
                          }
                        }
                      }
                    ]
                  }
                }
      Target: !GetAtt DynamoDbEventBus.Arn
      TargetParameters:
        EventBridgeEventBusParameters:
          DetailType: "DynamoDBStreamRecord"
          Source: !Ref TableOne

  DynamoDbEventBusQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref ProductMaterializeDynamoDbQ
        - !Ref ProductMaterializeOpenSearchQ
        - !Ref ShopOpenSearchIndexQ
        - !Ref SearchFilterOpenSearchSyncQ
        - !Ref ProductUpdateNotifyUserQ
        - !Ref SearchFilterPercolateProductQ
        - !Ref ProductPipelineTranslateQ
        - !Ref ProductPipelineEmbedTextQ
        - !Ref ProductPipelineExtractAttributeQ
        - !Ref ProductPipelineClassifyCategoryQ
        - !Ref ProductPipelineClassifyPeriodQ
        - !Ref NotificationSendQ
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource:
              - !GetAtt ProductMaterializeDynamoDbQ.Arn
              - !GetAtt ProductMaterializeOpenSearchQ.Arn
              - !GetAtt ShopOpenSearchIndexQ.Arn
              - !GetAtt SearchFilterOpenSearchSyncQ.Arn
              - !GetAtt ProductUpdateNotifyUserQ.Arn
              - !GetAtt SearchFilterPercolateProductQ.Arn
              - !GetAtt ProductPipelineTranslateQ.Arn
              - !GetAtt ProductPipelineEmbedTextQ.Arn
              - !GetAtt ProductPipelineExtractAttributeQ.Arn
              - !GetAtt ProductPipelineClassifyCategoryQ.Arn
              - !GetAtt ProductPipelineClassifyPeriodQ.Arn
              - !GetAtt NotificationSendQ.Arn

  Api:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "api-${StageName}"
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - "*"
        AllowHeaders:
          - Authorization
          - Content-Type
          - Accept
  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      StageName: !Ref StageName
      ApiId: !Ref Api
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 20
  ApiCognitoAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref Api
      Name: CognitoJwtAuthorizer
      AuthorizerType: JWT
      IdentitySource:
        - "$request.header.Authorization"
      JwtConfiguration:
        Issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${PrimaryUserPool}"
        Audience:
          - !Ref PrimaryUserPoolClientPublic
          - !Ref PrimaryUserPoolClientAdmin

  ProductApiGetProductRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: "GET /api/v1/shops/{shopId}/products/{shopsProductId}"
      Target: !Sub "integrations/${ProductApiLambdaIntegration}"
  ProductApiGetProductBySlugIdRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: "GET /api/v1/by-slug/shops/{shopSlugId}/products/{productSlugId}"
      Target: !Sub "integrations/${ProductApiLambdaIntegration}"
  ProductApiGetProductSimilarRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: "GET /api/v1/shops/{shopId}/products/{shopsProductId}/similar"
      Target: !Sub "integrations/${ProductApiLambdaIntegration}"
  ProductApiPutProductRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: "PUT /api/v1/products"
      Target: !Sub "integrations/${ProductApiLambdaIntegration}"
  ProductApiSearchProductRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: "POST /api/v1/products/search"
      Target: !Sub "integrations/${ProductApiLambdaIntegration}"
  ProductApiSimpleSearchProductRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: "GET /api/v1/products"
      Target: !Sub "integrations/${ProductApiLambdaIntegration}"
  ProductApiGetProductHistoryRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: "GET /api/v1/shops/{shopId}/products/{shopsProductId}/history"
      Target: !Sub "integrations/${ProductApiLambdaIntegration}"
  ProductApiLambdaIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref Api
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${ProductApiLambda}"
      PayloadFormatVersion: "2.0"
  ProductApiRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "product-api-role-${StageName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: OpenSearchReadOnly
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - es:Describe*
                  - es:List*
                  - es:ESHttpGet
                  - es:ESHttpHead
                  - es:ESHttpPost
                Resource: !Sub "${OpenSearchDomain.Arn}/*"
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:Query
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:BatchGetItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:TransactGetItems
                  - dynamodb:TransactWriteItems
                Resource:
                  - !GetAtt TableOne.Arn
                  - !Sub "${TableOne.Arn}/index/*"
  ProductApiLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "product-api-${StageName}"
      Runtime: provided.al2023
      Handler: lib.handler
      Role: !GetAtt ProductApiRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub "product-api-${StageName}-${CommitSHA}.zip"
      MemorySize: 512
      Timeout: 10
      EphemeralStorage:
        Size: 512
      Environment:
        Variables:
          OPENSEARCH_ENDPOINT_URL: !Sub "https://${OpenSearchDomain.DomainEndpoint}"
          STAGE: "ephemeral"
          DYNAMODB_TABLE_NAME: !Ref TableOne
          USER_POOL_ID: !Ref PrimaryUserPool
          USER_POOL_PUBLIC_CLIENT_ID: !Ref PrimaryUserPoolClientPublic
          USER_POOL_ADMIN_CLIENT_ID: !Ref PrimaryUserPoolClientAdmin
  ProductApiLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ProductApiLambda
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*/*/api/v1*"

  ProductWatchlistApiDeleteWatchlistProductRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: "DELETE /api/v1/me/watchlist/{shopId}/{shopsProductId}"
      AuthorizationType: JWT
      AuthorizerId: !Ref ApiCognitoAuthorizer
      Target: !Sub "integrations/${ProductWatchlistApiLambdaIntegration}"
  ProductWatchlistApiGetAllWatchlistProductRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: "GET /api/v1/me/watchlist"
      AuthorizationType: JWT
      AuthorizerId: !Ref ApiCognitoAuthorizer
      Target: !Sub "integrations/${ProductWatchlistApiLambdaIntegration}"
  ProductWatchlistApiPatchWatchlistProductRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: "PATCH /api/v1/me/watchlist/{shopId}/{shopsProductId}"
      AuthorizationType: JWT
      AuthorizerId: !Ref ApiCognitoAuthorizer
      Target: !Sub "integrations/${ProductWatchlistApiLambdaIntegration}"
  ProductWatchlistApiPostWatchlistProductRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: "POST /api/v1/me/watchlist"
      AuthorizationType: JWT
      AuthorizerId: !Ref ApiCognitoAuthorizer
      Target: !Sub "integrations/${ProductWatchlistApiLambdaIntegration}"
  ProductWatchlistApiLambdaIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref Api
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${ProductWatchlistApiLambda}"
      PayloadFormatVersion: "2.0"
  ProductWatchlistApiRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "product-watchlist-api-role-${StageName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:BatchGetItem
                  - dynamodb:Query
                Resource:
                  - !GetAtt TableOne.Arn
                  - !Sub "${TableOne.Arn}/index/*"
  ProductWatchlistApiLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "product-watchlist-api-${StageName}"
      Runtime: provided.al2023
      Handler: lib.handler
      Role: !GetAtt ProductWatchlistApiRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub "product-watchlist-api-${StageName}-${CommitSHA}.zip"
      MemorySize: 256
      Timeout: 10
      EphemeralStorage:
        Size: 512
      Environment:
        Variables:
          STAGE: !Ref Stage
          DYNAMODB_TABLE_NAME: !Ref TableOne
  ProductWatchlistApiLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ProductWatchlistApiLambda
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*/*/api/v1*"

  NotificationApiGetRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: "GET /api/v1/me/notifications"
      AuthorizationType: JWT
      AuthorizerId: !Ref ApiCognitoAuthorizer
      Target: !Sub "integrations/${NotificationApiLambdaIntegration}"
  NotificationApiPatchAllRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: "PATCH /api/v1/me/notifications"
      AuthorizationType: JWT
      AuthorizerId: !Ref ApiCognitoAuthorizer
      Target: !Sub "integrations/${NotificationApiLambdaIntegration}"
  NotificationApiPatchOneRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: "PATCH /api/v1/me/notifications/{eventId}"
      AuthorizationType: JWT
      AuthorizerId: !Ref ApiCognitoAuthorizer
      Target: !Sub "integrations/${NotificationApiLambdaIntegration}"
  NotificationApiDeleteAllRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: "DELETE /api/v1/me/notifications"
      AuthorizationType: JWT
      AuthorizerId: !Ref ApiCognitoAuthorizer
      Target: !Sub "integrations/${NotificationApiLambdaIntegration}"
  NotificationApiDeleteOneRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: "DELETE /api/v1/me/notifications/{eventId}"
      AuthorizationType: JWT
      AuthorizerId: !Ref ApiCognitoAuthorizer
      Target: !Sub "integrations/${NotificationApiLambdaIntegration}"
  NotificationApiLambdaIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref Api
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${NotificationApiLambda}"
      PayloadFormatVersion: "2.0"
  NotificationApiRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "notification-api-role-${StageName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:Query
                Resource:
                  - !GetAtt TableOne.Arn
                  - !Sub "${TableOne.Arn}/index/*"
  NotificationApiLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "notification-api-${StageName}"
      Runtime: provided.al2023
      Handler: lib.handler
      Role: !GetAtt NotificationApiRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub "notification-api-${StageName}-${CommitSHA}.zip"
      MemorySize: 256
      Timeout: 10
      EphemeralStorage:
        Size: 512
      Environment:
        Variables:
          STAGE: !Ref Stage
          DYNAMODB_TABLE_NAME: !Ref TableOne
  NotificationApiLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref NotificationApiLambda
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*/*/api/v1*"

  UserApiGetUserAccountRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: "GET /api/v1/me/account"
      AuthorizationType: JWT
      AuthorizerId: !Ref ApiCognitoAuthorizer
