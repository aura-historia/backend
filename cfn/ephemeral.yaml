      MaximumBatchingWindowInSeconds: 1
      FunctionResponseTypes:
        - ReportBatchItemFailures

  # ---------------------------------------------------------------------------
  # Stripe integration (acceptance tests)
  # In LocalStack the partner event bus is replaced by a plain custom bus.
  # Tests publish synthetic Stripe events via PutEvents.
  # ---------------------------------------------------------------------------
  StripeEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub "stripe-event-bus-${StageName}"
  StripeLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "stripe-lambda-role-${StageName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                Resource:
                  - !GetAtt TableOne.Arn
                  - !Sub "${TableOne.Arn}/index/*"
  StripeLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "stripe-lambda-${StageName}"
      Runtime: provided.al2023
      Handler: lib.handler
      Role: !GetAtt StripeLambdaRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub "stripe-lambda-${StageName}-${CommitSHA}.zip"
      MemorySize: 256
      Timeout: 30
      EphemeralStorage:
        Size: 512
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME: !Ref TableOne
          STRIPE_PRO_PRODUCT_ID: "prod_test_pro"
          STRIPE_ULTIMATE_PRODUCT_ID: "prod_test_ultimate"
  StripeEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "stripe-subscription-events-${StageName}"
      EventBusName: !Ref StripeEventBus
      EventPattern:
        detail:
          type:
            - "customer.subscription.created"
            - "customer.subscription.updated"
            - "customer.subscription.deleted"
      Targets:
        - Id: StripeLambda
          Arn: !GetAtt StripeLambda.Arn
  AllowEventBridgeInvokeStripeLambda:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref StripeLambda
      Principal: events.amazonaws.com
      SourceArn: !GetAtt StripeEventRule.Arn

  ShopifyEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub "shopify-event-bus-${StageName}"

  # ---------------------------------------------------------------------------
  # Shopify integration
  # Shopify product webhooks are delivered through EventBridge and forwarded to
  # the Lambda for partner-shop product synchronization.
  # ---------------------------------------------------------------------------
  ShopifyLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "shopify-lambda-role-${StageName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:BatchGetItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:TransactWriteItems
                Resource:
                  - !GetAtt TableOne.Arn
                  - !Sub "${TableOne.Arn}/index/*"
        - PolicyName: SQSPollerAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                  - sqs:GetQueueUrl
                Resource: !GetAtt ShopifyLambdaQ.Arn
  ShopifyLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "shopify-lambda-${StageName}"
      Runtime: provided.al2023
      Handler: lib.handler
      Role: !GetAtt ShopifyLambdaRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub "shopify-lambda-${StageName}-${CommitSHA}.zip"
      MemorySize: 256
      Timeout: 30
      EphemeralStorage:
        Size: 512
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME: !Ref TableOne
          OPENSEARCH_ENDPOINT_URL: !Sub "https://${OpenSearchDomain.DomainEndpoint}"
          GEMINI_API_KEY: "test-key"
          GOOGLE_GEOCODING_API_KEY: "test-key"
  ShopifyLambdaMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      FunctionName: !Ref ShopifyLambda
      EventSourceArn: !GetAtt ShopifyLambdaQ.Arn
      Enabled: true
      BatchSize: 10
      MaximumBatchingWindowInSeconds: 1
      FunctionResponseTypes:
        - ReportBatchItemFailures
  ShopifyEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "shopify-product-events-${StageName}"
      EventBusName: !Ref ShopifyEventBus
      EventPattern:
        detail:
          metadata:
            X-Shopify-Topic:
              - "products/create"
              - "products/update"
              - "products/delete"
      Targets:
        - Id: ShopifyLambdaQ
          Arn: !GetAtt ShopifyLambdaQ.Arn

