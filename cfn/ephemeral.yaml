        - PolicyName: S3MailTemplateAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: "arn:aws:s3:::aura-historia-mail-templates-eu-central-1/*"
  SearchFilterPercolateProductLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "search-filter-percolate-product-${StageName}"
      Runtime: provided.al2023
      Handler: lib.handler
