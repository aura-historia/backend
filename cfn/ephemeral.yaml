      Timeout: 60
      EphemeralStorage:
        Size: 512
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME: !Ref TableOne
          S3_BUCKET_NAME_TEMPLATES: "aura-historia-mail-templates-eu-central-1"
          STAGE_NAME: !Sub "${StageName}"
          COMMIT_SHA: !Sub "${CommitSHA}"
  ProductUpdateNotifyUserMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      FunctionName: !Ref ProductUpdateNotifyUserLambda
      EventSourceArn: !GetAtt ProductUpdateNotifyUserQ.Arn
      Enabled: true
      BatchSize: 10
      MaximumBatchingWindowInSeconds: 1
      FunctionResponseTypes:
        - ReportBatchItemFailures

  # --- Search Filter Percolate Product ---
  SearchFilterPercolateProductRole:
