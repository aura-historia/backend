    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "search-filter-opensearch-sync-role-${StageName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: OpenSearchAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - es:*
                Resource: !Sub "arn:aws:es:${AWS::Region}:${AWS::AccountId}:domain/test-domain/*"
        - PolicyName: SQSPollerAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                  - sqs:GetQueueUrl
                Resource: !GetAtt SearchFilterOpenSearchSyncQ.Arn
  SearchFilterOpenSearchSyncLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "search-filter-opensearch-sync-${StageName}"
      Runtime: provided.al2023
      Handler: lib.handler
      Role: !GetAtt SearchFilterOpenSearchSyncRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub "search-filter-lambda-opensearch-sync-${StageName}-${CommitSHA}.zip"
      MemorySize: 256
      Timeout: 30
      EphemeralStorage:
        Size: 512
      Environment:
        Variables:
          OPENSEARCH_ENDPOINT_URL: !Sub "https://${OpenSearchDomain.DomainEndpoint}"
          LOCALSTACK_MAPPED_PORT: !Ref LocalStackMappedPort
          STAGE: "ephemeral"
  SearchFilterOpenSearchSyncMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      FunctionName: !Ref SearchFilterOpenSearchSyncLambda
      EventSourceArn: !GetAtt SearchFilterOpenSearchSyncQ.Arn
      Enabled: true
      BatchSize: 1
      MaximumBatchingWindowInSeconds: 0

  # --- Product Partner Ingest Lambda ---
  ProductPartnerIngestRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "product-lambda-ingest-partner-products-role-${StageName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:BatchGetItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:TransactWriteItems
                Resource:
                  - !GetAtt TableOne.Arn
                  - !Sub "${TableOne.Arn}/index/*"
        - PolicyName: SQSPollerAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                  - sqs:GetQueueUrl
                Resource: !GetAtt ProductPartnerIngestQ.Arn
  ProductPartnerIngestLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "product-lambda-ingest-partner-products-${StageName}"
      Runtime: provided.al2023
      Handler: lib.handler
      Role: !GetAtt ProductPartnerIngestRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub "product-lambda-ingest-partner-products-${StageName}-${CommitSHA}.zip"
      MemorySize: 512
      Timeout: 30
      EphemeralStorage:
        Size: 512
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME: !Ref TableOne
          OPENSEARCH_ENDPOINT_URL: !Sub "https://${OpenSearchDomain.DomainEndpoint}"
          GEMINI_API_KEY: "test-key"
          GOOGLE_GEOCODING_API_KEY: "test-key"
          LOCALSTACK_MAPPED_PORT: !Ref LocalStackMappedPort
          STAGE: "ephemeral"
  ProductPartnerIngestMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      FunctionName: !Ref ProductPartnerIngestLambda
      EventSourceArn: !GetAtt ProductPartnerIngestQ.Arn
      Enabled: true
      BatchSize: 10
      MaximumBatchingWindowInSeconds: 1
      FunctionResponseTypes:
        - ReportBatchItemFailures

