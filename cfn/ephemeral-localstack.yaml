AWSTemplateFormatVersion: "2010-09-09"
Description: Simplified Ephemeral Stack for LocalStack Pro Acceptance Tests

Parameters:
  Stage:
    Type: String
  StageName:
    Type: String
  ArtifactBucket:
    Type: String
  CommitSHA:
    Type: String
  LocalStackMappedPort:
    Type: String

Resources:
  # ---------------------------------------------------------------------------
  # Cognito
  # ---------------------------------------------------------------------------
  PrimaryUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "primary-userpool-${StageName}"
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 7
      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE
      EmailVerificationSubject: "Verify your email"
      EmailVerificationMessage: "Your verification code is {####}"
      Schema:
        - Name: email
          AttributeDataType: String
          Mutable: false
          Required: true
      LambdaConfig:
        PostConfirmation: !GetAtt PrimaryUserPoolPostConfirmationLambda.Arn

  PrimaryUserPoolPostConfirmationLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "cognito-primary-userpool-post-confirmation-role-${StageName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                Resource: !GetAtt TableOne.Arn
  PrimaryUserPoolPostConfirmationLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "cognito-primary-userpool-post-confirmation-${StageName}"
      Runtime: provided.al2023
      Handler: lib.handler
      Role: !GetAtt PrimaryUserPoolPostConfirmationLambdaRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub "cognito-post-confirmation-${StageName}-${CommitSHA}.zip"
      MemorySize: 256
      Timeout: 5
      EphemeralStorage:
        Size: 512
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME: !Ref TableOne
  AllowCognitoInvokePrimaryUserPoolPostConfirmationLambda:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref PrimaryUserPoolPostConfirmationLambda
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt PrimaryUserPool.Arn

  PrimaryUserPoolClientPublic:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref PrimaryUserPool
      ClientName: !Sub "primary-userpool-client-public-${StageName}"
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      SupportedIdentityProviders:
        - COGNITO
      CallbackURLs:
        - http://localhost:3000
      LogoutURLs:
        - http://localhost:3000
      EnableTokenRevocation: true
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      ReadAttributes:
        - email
        - email_verified
  PrimaryUserPoolClientAdmin:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref PrimaryUserPool
      ClientName: !Sub "primary-userpool-client-admin-${StageName}"
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      AllowedOAuthFlowsUserPoolClient: false
      ExplicitAuthFlows:
        - ALLOW_ADMIN_USER_PASSWORD_AUTH
      EnableTokenRevocation: true
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      ReadAttributes:
        - email
      WriteAttributes:
        - email
  PrimaryUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub "primary-userpool-${StageName}"
      UserPoolId: !Ref PrimaryUserPool

  # ---------------------------------------------------------------------------
  # DynamoDB
  # ---------------------------------------------------------------------------
  TableOne:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "table_1-${StageName}"
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: lsi1_sk
          AttributeType: S
        - AttributeName: lsi2_sk
          AttributeType: S
        - AttributeName: lsi3_sk
          AttributeType: S
        - AttributeName: lsi4_sk
          AttributeType: S
        - AttributeName: lsi5_sk
          AttributeType: S
        - AttributeName: gsi1_pk
          AttributeType: S
        - AttributeName: gsi1_sk
          AttributeType: S
        - AttributeName: gsi2_pk
          AttributeType: S
        - AttributeName: gsi2_sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      LocalSecondaryIndexes:
        - IndexName: lsi1
          KeySchema:
            - AttributeName: pk
              KeyType: HASH
            - AttributeName: lsi1_sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: lsi2
          KeySchema:
            - AttributeName: pk
              KeyType: HASH
            - AttributeName: lsi2_sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: lsi3
          KeySchema:
            - AttributeName: pk
              KeyType: HASH
            - AttributeName: lsi3_sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: lsi4
          KeySchema:
            - AttributeName: pk
              KeyType: HASH
            - AttributeName: lsi4_sk
              KeyType: RANGE
          Projection:
            ProjectionType: KEYS_ONLY
        - IndexName: lsi5
          KeySchema:
            - AttributeName: pk
              KeyType: HASH
            - AttributeName: lsi5_sk
              KeyType: RANGE
          Projection:
            ProjectionType: KEYS_ONLY
      GlobalSecondaryIndexes:
        - IndexName: gsi1
          KeySchema:
            - AttributeName: gsi1_pk
              KeyType: HASH
            - AttributeName: gsi1_sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: gsi2
          KeySchema:
            - AttributeName: gsi2_pk
              KeyType: HASH
            - AttributeName: gsi2_sk
              KeyType: RANGE
          Projection:
            ProjectionType: KEYS_ONLY
      TimeToLiveSpecification:
        AttributeName: "ttl"
        Enabled: true
      BillingMode: PAY_PER_REQUEST
      TableClass: STANDARD
      StreamSpecification:
        StreamViewType: NEW_IMAGE

  # ---------------------------------------------------------------------------
  # OpenSearch (simplified for LocalStack — no VPC, no advanced config)
  # ---------------------------------------------------------------------------
  OpenSearchDomain:
    Type: AWS::OpenSearchService::Domain
    Properties:
      DomainName: "test-domain"
      EngineVersion: "OpenSearch_3.1"
      ClusterConfig:
        InstanceType: t3.small.search
        InstanceCount: 1
        ZoneAwarenessEnabled: false
      EBSOptions:
        EBSEnabled: true
        VolumeSize: 10
        VolumeType: gp3
      DomainEndpointOptions:
        CustomEndpointEnabled: true
        CustomEndpoint: "http://localhost:4566/test-domain"

  # ---------------------------------------------------------------------------
  # EventBridge
  # ---------------------------------------------------------------------------
  DynamoDbEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub "dynamodb-event-bus-${StageName}"
  PipeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "dynamodb-to-eventbridge-pipe-role-${StageName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: pipes.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PipePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:DescribeStream
                  - dynamodb:GetRecords
                  - dynamodb:GetShardIterator
                  - dynamodb:ListStreams
                Resource: "*"
              - Effect: Allow
                Action:
                  - events:PutEvents
                Resource: !GetAtt DynamoDbEventBus.Arn
  TableOneStreamToEventBusPipe:
    Type: AWS::Pipes::Pipe
    Properties:
      Name: !Sub "tableone-stream-to-eventbus-${StageName}"
      RoleArn: !GetAtt PipeRole.Arn
      Source: !GetAtt TableOne.StreamArn
      SourceParameters:
        DynamoDBStreamParameters:
          StartingPosition: LATEST
          BatchSize: 10
          MaximumBatchingWindowInSeconds: 1
        FilterCriteria:
          Filters:
            - Pattern: |
                {
                  "eventName": ["INSERT"],
                  "dynamodb": {
                    "NewImage": {
                      "pk": {
                        "S": [{ "prefix": "product#shop_id#" }]
                      },
                      "sk": {
                        "S": [{ "prefix": "product#event#" }]
                      }
                    }
                  }
                }
            - Pattern: |
                {
                  "eventName": ["MODIFY"],
                  "dynamodb": {
                    "NewImage": {
                      "pk": {
                        "S": [{ "prefix": "user#" }]
                      },
                      "sk": {
                        "S": [ "user#details" ]
                      }
                    }
                  }
                }
            - Pattern: |
                {
                  "eventName": ["INSERT", "MODIFY"],
                  "dynamodb": {
                    "NewImage": {
                      "pk": {
                        "S": [{ "prefix": "shop#shop_id#" }]
                      },
                      "sk": {
                        "S": [ "shop#details" ]
                      }
                    }
                  }
                }
            - Pattern: |
                {
                  "eventName": ["INSERT"],
                  "dynamodb": {
                    "NewImage": {
                      "pk": {
                        "S": [{ "prefix": "user#" }]
                      },
                      "sk": {
                        "S": [{ "prefix": "user#notification#origin_event_id#" }]
                      }
                    }
                  }
                }
            - Pattern: |
                {
                  "eventName": ["INSERT", "MODIFY", "REMOVE"],
                  "dynamodb": {
                    "$or": [
                      {
                        "NewImage": {
                          "pk": {
                            "S": [{ "prefix": "user#" }]
                          },
                          "sk": {
                            "S": [{ "prefix": "search_filter#" }]
                          }
                        }
                      },
                      {
                        "Keys": {
                          "pk": {
                            "S": [{ "prefix": "user#" }]
                          },
                          "sk": {
                            "S": [{ "prefix": "search_filter#" }]
                          }
                        }
                      }
                    ]
                  }
                }
      Target: !GetAtt DynamoDbEventBus.Arn
      TargetParameters:
        EventBridgeEventBusParameters:
          DetailType: "DynamoDBStreamRecord"
          Source: !Ref TableOne

  # ---------------------------------------------------------------------------
  # SQS Queues
  # ---------------------------------------------------------------------------
  NotificationSendDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "notification-send-dlq-${StageName}"
      MessageRetentionPeriod: 1209600
  NotificationSendQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "notification-send-queue-${StageName}"
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt NotificationSendDlq.Arn
        maxReceiveCount: 5
      VisibilityTimeout: 180

  ProductMaterializeDynamoDbDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "product-lambda-materialize-dynamodb-dlq-${StageName}"
      MessageRetentionPeriod: 1209600
  ProductMaterializeDynamoDbQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "product-lambda-materialize-dynamodb-queue-${StageName}"
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ProductMaterializeDynamoDbDlq.Arn
        maxReceiveCount: 5
      VisibilityTimeout: 360

  ProductMaterializeOpenSearchDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "product-lambda-materialize-opensearch-dlq-${StageName}"
      MessageRetentionPeriod: 1209600
  ProductMaterializeOpenSearchQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "product-lambda-materialize-opensearch-queue-${StageName}"
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ProductMaterializeOpenSearchDlq.Arn
        maxReceiveCount: 5
      VisibilityTimeout: 360

  ShopOpenSearchIndexDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "shop-opensearch-index-dlq-${StageName}"
      MessageRetentionPeriod: 1209600
  ShopOpenSearchIndexQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "shop-opensearch-index-queue-${StageName}"
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ShopOpenSearchIndexDlq.Arn
        maxReceiveCount: 5
      VisibilityTimeout: 360

  SearchFilterOpenSearchSyncDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "search-filter-opensearch-sync-dlq-${StageName}"
      MessageRetentionPeriod: 1209600
  SearchFilterOpenSearchSyncQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "search-filter-opensearch-sync-queue-${StageName}"
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt SearchFilterOpenSearchSyncDlq.Arn
        maxReceiveCount: 5
      VisibilityTimeout: 360

  ProductUpdateNotifyUserDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "product-lambda-update-notify-user-dlq-${StageName}"
      MessageRetentionPeriod: 1209600
  ProductUpdateNotifyUserQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "product-lambda-update-notify-user-queue-${StageName}"
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ProductUpdateNotifyUserDlq.Arn
        maxReceiveCount: 5
      VisibilityTimeout: 360

  SearchFilterPercolateProductDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "search-filter-percolate-product-dlq-${StageName}"
      MessageRetentionPeriod: 1209600
  SearchFilterPercolateProductQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "search-filter-percolate-product-queue-${StageName}"
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt SearchFilterPercolateProductDlq.Arn
        maxReceiveCount: 5
      VisibilityTimeout: 360

  ProductPipelineTranslateDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "product-pipeline-translate-dlq-${StageName}"
      MessageRetentionPeriod: 1209600
  ProductPipelineTranslateQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "product-pipeline-translate-queue-${StageName}"
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ProductPipelineTranslateDlq.Arn
        maxReceiveCount: 3
      VisibilityTimeout: 300

  ProductPipelineEmbedTextDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "product-pipeline-embed-text-dlq-${StageName}"
      MessageRetentionPeriod: 1209600
  ProductPipelineEmbedTextQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "product-pipeline-embed-text-queue-${StageName}"
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ProductPipelineEmbedTextDlq.Arn
        maxReceiveCount: 3
      VisibilityTimeout: 300

  ProductPipelineExtractAttributeDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "product-pipeline-extract-attribute-dlq-${StageName}"
      MessageRetentionPeriod: 1209600
  ProductPipelineExtractAttributeQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "product-pipeline-extract-attribute-queue-${StageName}"
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ProductPipelineExtractAttributeDlq.Arn
        maxReceiveCount: 3
      VisibilityTimeout: 300

  ProductPipelineClassifyCategoryDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "product-pipeline-classify-category-dlq-${StageName}"
      MessageRetentionPeriod: 1209600
  ProductPipelineClassifyCategoryQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "product-pipeline-classify-category-queue-${StageName}"
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ProductPipelineClassifyCategoryDlq.Arn
        maxReceiveCount: 3
      VisibilityTimeout: 300

  ProductPipelineClassifyPeriodDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "product-pipeline-classify-period-dlq-${StageName}"
      MessageRetentionPeriod: 1209600
  ProductPipelineClassifyPeriodQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "product-pipeline-classify-period-queue-${StageName}"
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ProductPipelineClassifyPeriodDlq.Arn
        maxReceiveCount: 3
      VisibilityTimeout: 300

  DynamoDbEventBusQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref ProductMaterializeDynamoDbQ
        - !Ref ProductMaterializeOpenSearchQ
        - !Ref ShopOpenSearchIndexQ
        - !Ref SearchFilterOpenSearchSyncQ
        - !Ref ProductUpdateNotifyUserQ
        - !Ref SearchFilterPercolateProductQ
        - !Ref ProductPipelineTranslateQ
        - !Ref ProductPipelineEmbedTextQ
        - !Ref ProductPipelineExtractAttributeQ
        - !Ref ProductPipelineClassifyCategoryQ
        - !Ref ProductPipelineClassifyPeriodQ
        - !Ref NotificationSendQ
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource:
              - !GetAtt ProductMaterializeDynamoDbQ.Arn
              - !GetAtt ProductMaterializeOpenSearchQ.Arn
              - !GetAtt ShopOpenSearchIndexQ.Arn
              - !GetAtt SearchFilterOpenSearchSyncQ.Arn
              - !GetAtt ProductUpdateNotifyUserQ.Arn
              - !GetAtt SearchFilterPercolateProductQ.Arn
              - !GetAtt ProductPipelineTranslateQ.Arn
              - !GetAtt ProductPipelineEmbedTextQ.Arn
              - !GetAtt ProductPipelineExtractAttributeQ.Arn
              - !GetAtt ProductPipelineClassifyCategoryQ.Arn
              - !GetAtt ProductPipelineClassifyPeriodQ.Arn
              - !GetAtt NotificationSendQ.Arn

  # ---------------------------------------------------------------------------
  # EventBridge Rules
  # ---------------------------------------------------------------------------
  DynamoDbProductMaterializeDynamoDbEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "ddb-product-mat-ddb-${StageName}"
      EventBusName: !Ref DynamoDbEventBus
      EventPattern:
        source:
          - !Ref TableOne
        detail-type:
          - "DynamoDBStreamRecord"
        detail:
          eventName:
            - "INSERT"
          dynamodb:
            NewImage:
              event_type:
                S:
                  - prefix: "DOMAIN_"
                  - prefix: "ENRICHMENT_"
                  - prefix: "POLICY_"
      Targets:
        - Id: ProductMaterializeDynamoDbQ
          Arn: !GetAtt ProductMaterializeDynamoDbQ.Arn
  DynamoDbProductMaterializeOpenSearchEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "ddb-product-mat-os-${StageName}"
      EventBusName: !Ref DynamoDbEventBus
      EventPattern:
        source:
          - !Ref TableOne
        detail-type:
          - "DynamoDBStreamRecord"
        detail:
          eventName:
            - "INSERT"
          dynamodb:
            NewImage:
              event_type:
                S:
                  - prefix: "DOMAIN_"
                  - prefix: "ENRICHMENT_"
                  - prefix: "POLICY_"
      Targets:
        - Id: ProductMaterializeOpenSearchQ
          Arn: !GetAtt ProductMaterializeOpenSearchQ.Arn
  DynamoDbProductEventRecordUpdatedNotifyUserEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "ddb-product-update-notify-user-${StageName}"
      EventBusName: !Ref DynamoDbEventBus
      EventPattern:
        source:
          - !Ref TableOne
        detail-type:
          - "DynamoDBStreamRecord"
        detail:
          eventName:
            - "INSERT"
          dynamodb:
            NewImage:
              event_type:
                S:
                  - prefix: "DOMAIN_PRICE_"
                  - prefix: "DOMAIN_STATE_"
      Targets:
        - Id: ProductUpdateNotifyUserQ
          Arn: !GetAtt ProductUpdateNotifyUserQ.Arn
  DynamoDbProductEventRecordPercolateSearchFilterEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "ddb-product-percolate-search-filter-${StageName}"
      EventBusName: !Ref DynamoDbEventBus
      EventPattern:
        source:
          - !Ref TableOne
        detail-type:
          - "DynamoDBStreamRecord"
        detail:
          eventName:
            - "INSERT"
          dynamodb:
            NewImage:
              event_type:
                S:
                  - prefix: "DOMAIN_PRICE"
                  - prefix: "DOMAIN_STATE"
                  - prefix: "ENRICHMENT_"
      Targets:
        - Id: SearchFilterPercolateProductQ
          Arn: !GetAtt SearchFilterPercolateProductQ.Arn
  DynamoDbPutShopRecordEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "ddb-put-shop-record-${StageName}"
      EventBusName: !Ref DynamoDbEventBus
      EventPattern:
        source:
          - !Ref TableOne
        detail-type:
          - "DynamoDBStreamRecord"
        detail:
          eventName:
            - "INSERT"
            - "MODIFY"
          dynamodb:
            NewImage:
              sk:
                S:
                  - "shop#details"
      Targets:
        - Id: ShopOpenSearchIndexQ
          Arn: !GetAtt ShopOpenSearchIndexQ.Arn
  DynamoDbSearchFilterSyncEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "ddb-search-filter-sync-${StageName}"
      EventBusName: !Ref DynamoDbEventBus
      EventPattern:
        source:
          - !Ref TableOne
        detail-type:
          - "DynamoDBStreamRecord"
        detail:
          eventName:
            - "INSERT"
            - "MODIFY"
            - "REMOVE"
          dynamodb:
            $or:
              - NewImage:
                  sk:
                    S:
                      - prefix: "search_filter#"
              - Keys:
                  sk:
                    S:
                      - prefix: "search_filter#"
      Targets:
        - Id: SearchFilterOpenSearchSyncQ
          Arn: !GetAtt SearchFilterOpenSearchSyncQ.Arn
  DynamoDbNotificationSendEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "ddb-notification-send-${StageName}"
      EventBusName: !Ref DynamoDbEventBus
      EventPattern:
        source:
          - !Ref TableOne
        detail-type:
          - "DynamoDBStreamRecord"
        detail:
          eventName:
            - "INSERT"
          dynamodb:
            NewImage:
              sk:
                S:
                  - prefix: "user#notification#origin_event_id#"
              external:
                BOOL:
                  - true
      Targets:
        - Id: NotificationSendQ
          Arn: !GetAtt NotificationSendQ.Arn
  ProductPipelineTranslateDynamoDbProductEventRecordCreatedEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "ddb-product-create-product-pipeline-translate-${StageName}"
      EventBusName: !Ref DynamoDbEventBus
      EventPattern:
        source:
          - !Ref TableOne
        detail-type:
          - "DynamoDBStreamRecord"
        detail:
          eventName:
            - "INSERT"
          dynamodb:
            NewImage:
              event_type:
                S:
                  - "DOMAIN_CREATED"
      Targets:
        - Id: ProductPipelineTranslateQ
          Arn: !GetAtt ProductPipelineTranslateQ.Arn
  ProductPipelineEmbedTextDynamoDbProductEventRecordCreatedEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "ddb-product-create-product-pipeline-embed-text-${StageName}"
      EventBusName: !Ref DynamoDbEventBus
      EventPattern:
        source:
          - !Ref TableOne
        detail-type:
          - "DynamoDBStreamRecord"
        detail:
          eventName:
            - "INSERT"
          dynamodb:
            NewImage:
              event_type:
                S:
                  - "DOMAIN_CREATED"
      Targets:
        - Id: ProductPipelineEmbedTextQ
          Arn: !GetAtt ProductPipelineEmbedTextQ.Arn
  ProductPipelineExtractAttributeDynamoDbProductEventRecordCreatedEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "ddb-product-embed-product-pipeline-extract-attr-${StageName}"
      EventBusName: !Ref DynamoDbEventBus
      EventPattern:
        source:
          - !Ref TableOne
        detail-type:
          - "DynamoDBStreamRecord"
        detail:
          eventName:
            - "INSERT"
          dynamodb:
            NewImage:
              event_type:
                S:
                  - "ENRICHMENT_EMBEDDED_TEXT"
      Targets:
        - Id: ProductPipelineExtractAttributeQ
          Arn: !GetAtt ProductPipelineExtractAttributeQ.Arn
  ProductPipelineClassifyCategoryDynamoDbProductEventRecordCreatedEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "ddb-product-embed-product-pipeline-classify-${StageName}"
      EventBusName: !Ref DynamoDbEventBus
      EventPattern:
        source:
          - !Ref TableOne
        detail-type:
          - "DynamoDBStreamRecord"
        detail:
          eventName:
            - "INSERT"
          dynamodb:
            NewImage:
              event_type:
                S:
                  - "ENRICHMENT_EMBEDDED_TEXT"
      Targets:
        - Id: ProductPipelineClassifyCategoryQ
          Arn: !GetAtt ProductPipelineClassifyCategoryQ.Arn
