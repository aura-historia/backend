AWSTemplateFormatVersion: "2010-09-09"
Description: >
    EC2 Image Builder pipeline for baking golden AMIs.
    This stack defines the Image Builder infrastructure only.
    Builds are triggered externally (CI/CD).

Parameters:
    StageName:
        Type: String
        Description: "Name of the stage"

Resources:
    AppComponent:
        Type: AWS::ImageBuilder::Component
        Properties:
            Name: !Sub "${StageName}-app-component-product-pipeline-embed-text"
            Platform: Linux
            Version: 0.0.1
            Description: Install application dependencies
            Data: |
                name: app-install
                schemaVersion: 1.0
                phases:
                  - name: build
                    steps:
                      - name: InstallApp
                        action: ExecuteBash
                        inputs:
                          commands:
                            - echo "Installing foo"
                            - mkdir -p /opt/foo

    ImageBuilderInstanceRole:
        Type: AWS::IAM::Role
        Properties:
            AssumeRolePolicyDocument:
                Version: "2012-10-17"
                Statement:
                    - Effect: Allow
                      Principal:
                          Service:
                              [ec2.amazonaws.com, imagebuilder.amazonaws.com]
                      Action: sts:AssumeRole
            ManagedPolicyArns:
                - arn:aws:iam::aws:policy/service-role/AmazonEC2RoleforSSM
                - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
    ImageBuilderInstanceProfile:
        Type: AWS::IAM::InstanceProfile
        Properties:
            Roles:
                - !Ref ImageBuilderInstanceRole

    GoldenAmiRecipe:
        Type: AWS::ImageBuilder::ImageRecipe
        Properties:
            Name: !Sub "${StageName}-golden-ami-product-pipeline-embed-text"
            Version: 0.0.1
            ParentImage: !Sub "{{resolve:ssm:/aws/service/deeplearning/ami/x86_64/oss-nvidia-driver-gpu-pytorch-2.9-ubuntu-24.04/latest/ami-id}}"
            Components:
                - ComponentArn: !Ref AppComponent
            BlockDeviceMappings:
                - DeviceName: /dev/xvda
                  Ebs:
                      VolumeSize: 60
                      VolumeType: gp3
                      DeleteOnTermination: true

    ImageBuilderInfrastructure:
        Type: AWS::ImageBuilder::InfrastructureConfiguration
        Properties:
            Name: !Sub "${StageName}-image-builder-infra-product-pipeline-embed-text"
            InstanceProfileName: !Ref ImageBuilderInstanceProfile
            InstanceTypes:
                - t3.medium
            TerminateInstanceOnFailure: true
            Tags:
                StageName: !Ref StageName
                ManagedBy: ImageBuilder

    ImageDistribution:
        Type: AWS::ImageBuilder::DistributionConfiguration
        Properties:
            Name: !Sub "${StageName}-distribution-config-product-pipeline-embed-text"
            Distributions:
                - Region: !Ref AWS::Region
                  AmiDistributionConfiguration:
                      Name: !Sub "${StageName}-product-pipeline-embed-text-{{imagebuilder:buildDate}}"
                      Description: !Sub "Golden AMI for product-pipeline-embed-text (${StageName})"
                      AmiTags:
                          Name: !Sub "${StageName}-product-pipeline-embed-text-golden-ami"
                          StageName: !Ref StageName
                          ManagedBy: ImageBuilder

    ImagePipeline:
        Type: AWS::ImageBuilder::ImagePipeline
        Properties:
            Name: !Sub "${StageName}-product-pipeline-embed-text-image-pipeline"
            Description: !Sub "Golden AMI pipeline for product-pipeline-embed-text"
            ImageRecipeArn: !Ref GoldenAmiRecipe
            InfrastructureConfigurationArn: !Ref ImageBuilderInfrastructure
            DistributionConfigurationArn: !Ref ImageDistribution
            Status: ENABLED
            ImageTestsConfiguration:
                ImageTestsEnabled: true
                TimeoutMinutes: 60
            Tags:
                StageName: !Ref StageName

Outputs:
    ImagePipelineArn:
        Description: ARN of the Image Builder pipeline
        Value: !Ref ImagePipeline

    ImageRecipeArn:
        Description: ARN of the Image Recipe
        Value: !Ref GoldenAmiRecipe
