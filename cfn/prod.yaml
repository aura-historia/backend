  NotificationSendDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: "notification-send-dlq-prod"
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
  NotificationSendQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: "notification-send-queue-prod"
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt NotificationSendDlq.Arn
        maxReceiveCount: 5
      VisibilityTimeout: 360
      SqsManagedSseEnabled: true
  NotificationSendRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: "notification-send-role-prod"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource:
                  - !GetAtt TableOne.Arn
        - PolicyName: SQSPollerAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                  - sqs:GetQueueUrl
                Resource: !GetAtt NotificationSendQ.Arn
        - PolicyName: SESSendAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource: "*"
        - PolicyName: S3TemplateAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub "arn:aws:s3:::${MailTemplateBucket}/*"
  NotificationSendLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: "notification-send-prod"
      Runtime: provided.al2023
      Handler: lib.handler
      Role: !GetAtt NotificationSendRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub "notification-send-prod-${CommitSHA}.zip"
      MemorySize: 128
      Timeout: 20
      # ReservedConcurrentExecutions: 20
      EphemeralStorage:
        Size: 512
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME: !Ref TableOne
          S3_BUCKET_NAME_TEMPLATES: !Ref MailTemplateBucket
          STAGE_NAME: prod
          COMMIT_SHA: !Ref CommitSHA
  NotificationSendMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      FunctionName: !Ref NotificationSendLambda
      EventSourceArn: !GetAtt NotificationSendQ.Arn
      Enabled: true
      BatchSize: 25
      MaximumBatchingWindowInSeconds: 5
      FunctionResponseTypes:
        - ReportBatchItemFailures
  NotificationSendLambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: "prod-notification-send-lambda-errors"
      AlarmDescription: "Alarm when notification-send Lambda has errors"
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref NotificationSendLambda
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmNotificationTopic

