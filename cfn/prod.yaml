  ProductPipelineCompleteRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: "product-pipeline-complete-role-prod"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
          - Effect: Allow
            Principal:
              Service: spot.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
        - arn:aws:iam::aws:policy/AmazonS3ReadOnlyAccess
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: AllowTerminateInASG
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: autoscaling:TerminateInstanceInAutoScalingGroup
                Resource: "*"
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                  - dynamodb:UpdateItem
                  - dynamodb:BatchGetItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:TransactGetItems
                  - dynamodb:TransactWriteItems
                Resource:
                  - !GetAtt TableOne.Arn
                  - !Sub "${TableOne.Arn}/index/*"
        - PolicyName: OpenSearchAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - es:*
                Resource: !Sub "arn:aws:es:${AWS::Region}:${AWS::AccountId}:domain/application-prod/*"
        - PolicyName: SQSPollerAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:DeleteMessageBatch
                  - sqs:GetQueueAttributes
                  - sqs:GetQueueUrl
                Resource: !GetAtt ProductPipelineCompleteQ.Arn
        - PolicyName: CloudWatchLogsCreate
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"
  ProductPipelineCompleteInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: "product-pipeline-complete-profile-prod"
      Roles:
        - !Ref ProductPipelineCompleteRole
  ProductPipelineCompleteLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: "product-pipeline-complete-template-prod"
      LaunchTemplateData:
        KeyName: !Ref Ec2KeyPairName
        IamInstanceProfile:
          Name: !Ref ProductPipelineCompleteInstanceProfile
        InstanceType: c8g.large
        ImageId: !Ref Al2023AmiId
        SecurityGroupIds: [!Ref ProductPipelineSecurityGroup]
        BlockDeviceMappings:
          - DeviceName: /dev/sda1
            Ebs:
              VolumeSize: 50
              VolumeType: gp3
              DeleteOnTermination: true
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: "product-pipeline-complete-prod"
              - Key: Fleet
                Value: product-pipeline-complete
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -euxo pipefail
            sudo -i
            export STAGE="dev"
            export STAGE_NAME=${StageName}
            export CommitSHA="${CommitSHA}"
            export ARTIFACT_BUCKET="${ArtifactBucket}"
            export SOURCE_QUEUE_URL="${ProductPipelineCompleteQ}"
            export DYNAMODB_TABLE_NAME="${TableOne}"
            export OPENSEARCH_ENDPOINT_URL="${OpenSearchEndpointUrl}"
            export OPENSEARCH_USERNAME="${OpenSearchUsername}"
            export OPENSEARCH_PASSWORD="${OpenSearchPassword}"
            # Download and install binary
            sudo aws s3 cp "s3://${ArtifactBucket}/${StageName}/${CommitSHA}/product-pipeline-complete" /opt/product-pipeline-complete --region eu-central-1
            sudo chmod +x /opt/product-pipeline-complete
            # Configure CloudWatchAgent
            cat << EOF | sudo tee /opt/aws/amazon-cloudwatch-agent.json > /dev/null
            {
              "logs": {
                "logs_collected": {
                  "files": {
                    "collect_list": [
                      {
                        "file_path": "/var/log/product-pipeline-complete.log",
                        "log_group_name": "/aws/ec2/$STAGE-product-pipeline-complete",
                        "log_stream_name": "{instance_id}",
                        "timestamp_format": "%Y-%m-%dT%H:%M:%S.%f%z",
                        "timezone": "UTC",
                        "multi_line_start_pattern": "^{"
                      }
                    ]
                  }
                }
              }
            }
            EOF
            amazon-cloudwatch-agent-ctl -a fetch-config -m ec2 -c file:/opt/aws/amazon-cloudwatch-agent.json -s
            LOG_PATH="/var/log/product-pipeline-complete.log"
            sudo touch "$LOG_PATH"
            sudo chmod 666 "$LOG_PATH"
            # Run binary
            echo "[$(date)] Running product-pipeline-complete..." | tee -a "$LOG_PATH"
            /opt/product-pipeline-complete >> "$LOG_PATH" 2>&1
            EXIT_CODE=$?
            echo "[$(date)] Job finished with code $EXIT_CODE" | tee -a "$LOG_PATH"
            sleep 5
            aws autoscaling terminate-instance-in-auto-scaling-group \
              --instance-id $(ec2metadata --instance-id) \
              --should-decrement-desired-capacity
            exit $EXIT_CODE
