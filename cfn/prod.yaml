  # ---------------------------------------------------------------------------
  # Stripe integration
  # Stripe events are delivered through an AWS EventBridge Partner-Event-Bus
  # (created manually in the AWS Console, see
  # https://docs.stripe.com/event-destinations/eventbridge). The rule below
  # forwards the supported `customer.subscription.*` events to the Lambda.
  # ---------------------------------------------------------------------------
  StripeLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: "stripe-lambda-role-prod"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                Resource:
                  - !GetAtt TableOne.Arn
                  - !Sub "${TableOne.Arn}/index/*"
  StripeLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: "stripe-lambda-prod"
      Runtime: provided.al2023
      Handler: lib.handler
      Role: !GetAtt StripeLambdaRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub "stripe-lambda-prod-${CommitSHA}.zip"
      MemorySize: 128
      Timeout: 7
      # ReservedConcurrentExecutions: 20
      EphemeralStorage:
        Size: 512
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME: !Ref TableOne
          STRIPE_PRO_PRODUCT_ID: !Ref StripeProProductId
          STRIPE_ULTIMATE_PRODUCT_ID: !Ref StripeUltimateProductId
  StripeEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: "stripe-subscription-events-prod"
      EventBusName: !Ref StripeEventBusName
      EventPattern:
        source:
          - prefix: "aws.partner/stripe.com"
        detail:
          type:
            - "customer.subscription.created"
            - "customer.subscription.updated"
            - "customer.subscription.deleted"
          livemode:
            - true
      Targets:
        - Id: StripeLambda
          Arn: !GetAtt StripeLambda.Arn
  AllowEventBridgeInvokeStripeLambda:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref StripeLambda
      Principal: events.amazonaws.com
      SourceArn: !GetAtt StripeEventRule.Arn
  StripeLambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: "prod-stripe-lambda-errors"
      AlarmDescription: "Alarm when stripe Lambda has errors"
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref StripeLambda
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmNotificationTopic

  # ---------------------------------------------------------------------------
  # Shopify integration
  # Shopify product webhooks are delivered through EventBridge and forwarded to
  # the Lambda for partner-shop product synchronization.
  # ---------------------------------------------------------------------------

  ProductPartnerIngestRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: "product-lambda-ingest-partner-products-role-prod"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:BatchGetItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:TransactWriteItems
                Resource:
                  - !GetAtt TableOne.Arn
                  - !Sub "${TableOne.Arn}/index/*"
        - PolicyName: SQSPollerAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                  - sqs:GetQueueUrl
                Resource: !GetAtt ProductPartnerIngestQ.Arn
  ProductPartnerIngestLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: "product-lambda-ingest-partner-products-prod"
      Runtime: provided.al2023
      Handler: lib.handler
      Role: !GetAtt ProductPartnerIngestRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub "product-lambda-ingest-partner-products-prod-${CommitSHA}.zip"
      MemorySize: 512
      Timeout: 30
      EphemeralStorage:
        Size: 512
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME: !Ref TableOne
          OPENSEARCH_ENDPOINT_URL: !Ref OpenSearchEndpointUrl
          OPENSEARCH_USERNAME: "{{resolve:ssm:/opensearch/prod/username}}"
          OPENSEARCH_PASSWORD: "{{resolve:ssm:/opensearch/prod/password}}"
          GEMINI_API_KEY: !Sub "{{resolve:ssm:/secrets/prod/gemini-api-key}}"
          GOOGLE_GEOCODING_API_KEY: !Sub "{{resolve:ssm:/secrets/prod/google-geocoding-api-key}}"
          STAGE: "prod"
  ProductPartnerIngestMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      FunctionName: !Ref ProductPartnerIngestLambda
      EventSourceArn: !GetAtt ProductPartnerIngestQ.Arn
      Enabled: true
      BatchSize: 10
      MaximumBatchingWindowInSeconds: 1
      FunctionResponseTypes:
        - ReportBatchItemFailures

  ShopifyLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: "shopify-lambda-role-prod"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:BatchGetItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:TransactWriteItems
                Resource:
                  - !GetAtt TableOne.Arn
                  - !Sub "${TableOne.Arn}/index/*"
        - PolicyName: SQSPollerAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                  - sqs:GetQueueUrl
                Resource: !GetAtt ShopifyLambdaQ.Arn
  ShopifyLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: "shopify-lambda-prod"
      Runtime: provided.al2023
      Handler: lib.handler
      Role: !GetAtt ShopifyLambdaRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub "shopify-lambda-prod-${CommitSHA}.zip"
      MemorySize: 128
      Timeout: 15
      EphemeralStorage:
        Size: 512
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME: !Ref TableOne
          OPENSEARCH_ENDPOINT_URL: !Ref OpenSearchEndpointUrl
          OPENSEARCH_USERNAME: "{{resolve:ssm:/opensearch/prod/username}}"
          OPENSEARCH_PASSWORD: "{{resolve:ssm:/opensearch/prod/password}}"
          GEMINI_API_KEY: !Sub "{{resolve:ssm:/secrets/prod/gemini-api-key}}"
          GOOGLE_GEOCODING_API_KEY: !Sub "{{resolve:ssm:/secrets/prod/google-geocoding-api-key}}"
  ShopifyLambdaMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      FunctionName: !Ref ShopifyLambda
      EventSourceArn: !GetAtt ShopifyLambdaQ.Arn
      Enabled: true
      BatchSize: 100
      MaximumBatchingWindowInSeconds: 10
      FunctionResponseTypes:
        - ReportBatchItemFailures
  ShopifyEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: "shopify-product-events-prod"
      EventBusName: !Ref ShopifyEventBusName
      EventPattern:
        source:
          - prefix: "aws.partner/shopify.com"
        detail:
          metadata:
            X-Shopify-Topic:
              - "products/create"
              - "products/update"
              - "products/delete"
      Targets:
        - Id: ShopifyLambdaQ
          Arn: !GetAtt ShopifyLambdaQ.Arn
  ShopifyLambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: "prod-shopify-lambda-errors"
      AlarmDescription: "Alarm when Shopify Lambda has errors"
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref ShopifyLambda
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmNotificationTopic

