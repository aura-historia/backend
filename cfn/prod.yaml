  ProductPipelineScaleUpRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: "product-pipeline-asg-scale-up-role-prod"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ScaleUpASG
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - autoscaling:UpdateAutoScalingGroup
                  - autoscaling:DescribeAutoScalingGroups
                Resource: !Sub "arn:aws:autoscaling:${AWS::Region}:${AWS::AccountId}:autoScalingGroup:*:autoScalingGroupName/${ProductPipelineInitASG}"
  ProductPipelineScaleUpLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: "product-pipeline-asg-scale-up-prod"
      Runtime: provided.al2023
      Handler: lib.handler
      Role: !GetAtt ProductPipelineScaleUpRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub "product-pipeline-asg-scale-up-prod-${CommitSHA}.zip"
      MemorySize: 128
      Timeout: 60
      EphemeralStorage:
        Size: 512
      Environment:
        Variables:
          STAGE: "dev"
          PRODUCT_ENRICHMENT_ASG_NAME: !Ref ProductPipelineInitASG
  ProductPipelineScaleUpStartSchedule:
    Type: AWS::Events::Rule
    Properties:
      ScheduleExpression: "cron(0 1 * * ? *)" # every day at 01:00 UTC
      Targets:
        - Arn: !GetAtt ProductPipelineScaleUpLambda.Arn
          Id: "ProductPipelineScaleUpStartSchedule"
          RetryPolicy:
            MaximumRetryAttempts: 5
            MaximumEventAgeInSeconds: 3600
          DeadLetterConfig:
            Arn: !GetAtt ProductPipelineInitDlq.Arn
  ProductPipelineScaleUpStartSchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ProductPipelineScaleUpLambda
      Action: "lambda:InvokeFunction"
      Principal: "events.amazonaws.com"
      SourceArn: !GetAtt ProductPipelineScaleUpStartSchedule.Arn

