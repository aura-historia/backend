  # --- Partner Shop Application Step Function ---
  PartnerShopApplicationStepFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: "partner-shop-application-sfn-lambda-role-prod"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                Resource:
                  - !GetAtt TableOne.Arn
                  - !Sub "${TableOne.Arn}/index/*"
        - PolicyName: SESSendAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource: "*"
        - PolicyName: S3TemplateAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub "arn:aws:s3:::${MailTemplateBucket}/*"
  PartnerShopApplicationStepFunctionLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: "partner-shop-application-lambda-prod"
      Runtime: provided.al2023
      Handler: lib.handler
      Role: !GetAtt PartnerShopApplicationStepFunctionRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub "partner-shop-application-lambda-prod-${CommitSHA}.zip"
      MemorySize: 128
      Timeout: 30
      EphemeralStorage:
        Size: 512
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME: !Ref TableOne
          S3_BUCKET_NAME_TEMPLATES: !Ref MailTemplateBucket
          STAGE_NAME: prod
          COMMIT_SHA: !Ref CommitSHA
          GOOGLE_GEOCODING_API_KEY: !Sub "{{resolve:ssm:/secrets/prod/google-geocoding-api-key}}"
  PartnerShopApplicationStateMachineExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: "partner-shop-application-sfn-execution-role-prod"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeLambda
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !GetAtt PartnerShopApplicationStepFunctionLambda.Arn
  PartnerShopApplicationStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: "partner-shop-application-prod"
      StateMachineType: STANDARD
      RoleArn: !GetAtt PartnerShopApplicationStateMachineExecutionRole.Arn
      DefinitionString: !Sub |
        {
          "Comment": "Partner Shop Application approval workflow",
          "StartAt": "WaitForReview",
          "States": {
            "WaitForReview": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke.waitForTaskToken",
              "Parameters": {
                "FunctionName": "${PartnerShopApplicationStepFunctionLambda.Arn}",
                "Payload": {
                  "step": "WAIT_FOR_REVIEW",
                  "task_token.$": "$$.Task.Token",
                  "partner_application_id.$": "$.partner_application_id",
                  "applicant_user_id.$": "$.applicant_user_id"
                }
              },
              "Next": "ReviewDecision"
            },
            "ReviewDecision": {
              "Type": "Choice",
              "Choices": [
                {
                  "Variable": "$.decision",
                  "StringEquals": "APPROVED",
                  "Next": "Approve"
                },
                {
                  "Variable": "$.decision",
                  "StringEquals": "REJECTED",
                  "Next": "Reject"
                }
              ]
            },
            "Approve": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${PartnerShopApplicationStepFunctionLambda.Arn}",
                "Payload": {
                  "step": "APPROVE",
                  "partner_application_id.$": "$.partner_application_id",
                  "applicant_user_id.$": "$.applicant_user_id"
                }
              },
              "End": true
            },
            "Reject": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${PartnerShopApplicationStepFunctionLambda.Arn}",
                "Payload": {
                  "step": "REJECT",
                  "partner_application_id.$": "$.partner_application_id",
                  "applicant_user_id.$": "$.applicant_user_id"
                }
              },
              "End": true
            }
          }
        }

