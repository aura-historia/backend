  ProductPipelineVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: "product-pipeline-vpc-prod"
  ProductPipelineInternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: "product-pipeline-igw-prod"
  ProductPipelineVpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref ProductPipelineInternetGateway
      VpcId: !Ref ProductPipelineVpc
  ProductPipelinePublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref ProductPipelineVpc
      Tags:
        - Key: Name
          Value: "product-pipeline-public-rt-prod"
  ProductPipelinePublicRoute:
    Type: AWS::EC2::Route
    DependsOn: ProductPipelineVpcGatewayAttachment
    Properties:
      RouteTableId: !Ref ProductPipelinePublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref ProductPipelineInternetGateway
  ProductPipelineSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref ProductPipelineVpc
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - Key: Name
          Value: "product-pipeline-subnet-a-prod"
  ProductPipelineSubnetRouteAssocA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref ProductPipelineSubnetA
      RouteTableId: !Ref ProductPipelinePublicRouteTable
  ProductPipelineSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow SSH and internal comms
      VpcId: !Ref ProductPipelineVpc
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: "product-pipeline-sg-prod"

  ProductPipelineInitDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: "product-pipeline-init-dlq-prod"
      MessageRetentionPeriod: 1209600
  ProductPipelineInitQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: "product-pipeline-init-queue-prod"
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ProductPipelineInitDlq.Arn
        maxReceiveCount: 5
      VisibilityTimeout: 60
  ProductPipelineInitRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: "product-pipeline-init-role-prod"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
          - Effect: Allow
            Principal:
              Service: spot.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
        - arn:aws:iam::aws:policy/AmazonS3ReadOnlyAccess
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: AllowTerminateInASG
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: autoscaling:TerminateInstanceInAutoScalingGroup
                Resource: "*"
        - PolicyName: SQSPollerAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:DeleteMessageBatch
                  - sqs:GetQueueAttributes
                  - sqs:GetQueueUrl
                Resource: !GetAtt ProductPipelineInitQ.Arn
        - PolicyName: CloudWatchLogsCreate
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"
  ProductPipelineInitInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: "product-pipeline-init-profile-prod"
      Roles:
        - !Ref ProductPipelineInitRole
  ProductPipelineInitLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: "product-pipeline-init-template-prod"
      LaunchTemplateData:
        KeyName: !Ref Ec2KeyPairName
        IamInstanceProfile:
          Name: !Ref ProductPipelineInitInstanceProfile
        InstanceType: c8g.large
        ImageId: !Ref Al2023AmiId
        SecurityGroupIds: [!Ref ProductPipelineSecurityGroup]
        BlockDeviceMappings:
          - DeviceName: /dev/sda1
            Ebs:
              VolumeSize: 50
              VolumeType: gp3
              DeleteOnTermination: true
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: "product-pipeline-init-prod"
              - Key: Fleet
                Value: product-pipeline-init
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -euxo pipefail
            sudo -i
            export STAGE="dev"
            export STAGE_NAME=${StageName}
            export CommitSHA="${CommitSHA}"
            export ARTIFACT_BUCKET="${ArtifactBucket}"
            export SOURCE_QUEUE_URL="${ProductPipelineInitQ}"
            export TARGET_QUEUE_URL="${ProductPipelineTranslateQ}"
            # Download and install binary
            sudo aws s3 cp "s3://${ArtifactBucket}/${StageName}/${CommitSHA}/product-pipeline-init" /opt/product-pipeline-init --region eu-central-1
            sudo chmod +x /opt/product-pipeline-init
            # Configure CloudWatchAgent
            cat << EOF | sudo tee /opt/aws/amazon-cloudwatch-agent.json > /dev/null
            {
              "logs": {
                "logs_collected": {
                  "files": {
                    "collect_list": [
                      {
                        "file_path": "/var/log/product-pipeline-init.log",
                        "log_group_name": "/aws/ec2/$STAGE-product-pipeline-init",
                        "log_stream_name": "{instance_id}",
                        "timestamp_format": "%Y-%m-%dT%H:%M:%S.%f%z",
                        "timezone": "UTC",
                        "multi_line_start_pattern": "^{"
                      }
                    ]
                  }
                }
              }
            }
            EOF
            amazon-cloudwatch-agent-ctl -a fetch-config -m ec2 -c file:/opt/aws/amazon-cloudwatch-agent.json -s
            LOG_PATH="/var/log/product-pipeline-init.log"
            sudo touch "$LOG_PATH"
            sudo chmod 666 "$LOG_PATH"
            # Run binary
            echo "[$(date)] Running product-pipeline-init..." | tee -a "$LOG_PATH"
            /opt/product-pipeline-init >> "$LOG_PATH" 2>&1
            EXIT_CODE=$?
            echo "[$(date)] Job finished with code $EXIT_CODE" | tee -a "$LOG_PATH"
            sleep 5
            aws autoscaling terminate-instance-in-auto-scaling-group \
              --instance-id $(ec2metadata --instance-id) \
              --should-decrement-desired-capacity
            exit $EXIT_CODE
  ProductPipelineInitASG:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      VPCZoneIdentifier:
        - !Ref ProductPipelineSubnetA
      MinSize: 0
      MaxSize: 1
      DesiredCapacity: 0
      MixedInstancesPolicy:
        LaunchTemplate:
          LaunchTemplateSpecification:
            LaunchTemplateId: !Ref ProductPipelineInitLaunchTemplate
            Version: !GetAtt ProductPipelineInitLaunchTemplate.LatestVersionNumber
          Overrides:
            - InstanceType: c8g.large
            - InstanceType: c7g.large
            - InstanceType: c6g.large
            - InstanceType: t4g.large
        InstancesDistribution:
