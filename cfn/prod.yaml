  SendMailDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: "mail-lambda-send-prod"
      MessageRetentionPeriod: 1209600
  SendMailQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: "mail-lambda-send-queue-prod"
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt SendMailDlq.Arn
        maxReceiveCount: 5
      VisibilityTimeout: 360
  SendMailRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: "mail-lambda-send-role-prod"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: SQSPollerAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                  - sqs:GetQueueUrl
                Resource: !GetAtt SendMailQ.Arn
        - PolicyName: SESSendMailAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource: "*"
        - PolicyName: S3Access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub "arn:aws:s3:::${MailTemplateBucket}/*"
  SendMailLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: "mail-lambda-send-prod"
      Runtime: provided.al2023
      Handler: lib.handler
      Role: !GetAtt SendMailRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub "mail-lambda-send-prod-${CommitSHA}.zip"
      MemorySize: 512
      Timeout: 60
      EphemeralStorage:
        Size: 512
      Environment:
        Variables:
          S3_BUCKET_NAME_TEMPLATES: !Ref MailTemplateBucket
          STAGE_NAME: "prod"
          COMMIT_SHA: !Sub "${CommitSHA}"
  SendMailMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      FunctionName: !Ref SendMailLambda
      EventSourceArn: !GetAtt SendMailQ.Arn
      Enabled: true
      BatchSize: 200
      MaximumBatchingWindowInSeconds: 5
      FunctionResponseTypes:
        - ReportBatchItemFailures
  SendMailLambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: "prod-send-mail-lambda-errors"
      AlarmDescription: "Alarm when send-mail Lambda has errors"
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref SendMailLambda
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmNotificationTopic
  SendMailDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: "prod-send-mail-dlq-messages"
      AlarmDescription: "Alarm when messages appear in send-mail DLQ"
      MetricName: ApproximateNumberOfMessagesVisible
      Namespace: AWS/SQS
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: QueueName
          Value: !GetAtt SendMailDlq.QueueName
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmNotificationTopic

