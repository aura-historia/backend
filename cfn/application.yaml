AWSTemplateFormatVersion: "2010-09-09"
Description: Full application stack for the Blitzfilter Backend

Parameters:
  Stage:
    Type: String
    Description: "Type of the stage"
    AllowedValues:
      - dev
      - staging
      - prod
  StageName:
    Type: String
    Description: "Unique name of the stage"
  ArtifactBucket:
    Type: String
    Description: "S3 bucket containing Lambda deployment zips"
  CommitSHA:
    Type: String

Mappings:
  ItemIngestEventsDynamoDbQueueMap:
    MaximumBatchingWindowInSeconds:
      dev: 1
      staging: 1
      prod: 10
  ItemMaterializeDynamoDbQueuesMap:
    MaximumBatchingWindowInSeconds:
      dev: 1
      staging: 1
      prod: 10
  ItemMaterializeOpenSearchQueuesMap:
    MaximumBatchingWindowInSeconds:
      dev: 1
      staging: 1
      prod: 300

Resources:
  BlitzfilterUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "blitzfilter-userpool-${StageName}"
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 7
      UserPoolAddOns:
        AdvancedSecurityMode: ENFORCED
      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE
      EmailVerificationSubject: "Verify your email"
      EmailVerificationMessage: "Your verification code is {####}"
  BlitzfilterUserPoolClientPublic:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref BlitzfilterUserPool
      ClientName: !Sub "blitzfilter-client-${StageName}"
      GenerateSecret: false # PKCE replaces client secret
      PreventUserExistenceErrors: ENABLED
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      SupportedIdentityProviders:
        - COGNITO
      CallbackURLs: # Placeholder for staging-tests
        - !Sub "https://${BlitzfilterApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}/oauth2/callback"
      LogoutURLs:
        - !Sub "https://${BlitzfilterApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}/logout"
      EnableTokenRevocation: true
      AccessTokenValidity: 1 # hours
      IdTokenValidity: 1 # hours
      RefreshTokenValidity: 30 # days
  BlitzfilterUserPoolClientAdmin:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref BlitzfilterUserPool
      ClientName: !Sub "blitzfilter-admin-${StageName}"
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      AllowedOAuthFlowsUserPoolClient: false
      ExplicitAuthFlows:
        - ALLOW_ADMIN_USER_PASSWORD_AUTH
      EnableTokenRevocation: true
      AccessTokenValidity: 1 # hours
      IdTokenValidity: 1 # hours
      RefreshTokenValidity: 30 # days
  BlitzfilterUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub "blitzfilter-${StageName}" # hosted UI domain
      UserPoolId: !Ref BlitzfilterUserPool

  TableOne:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "table_1-${StageName}"
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: gsi_1_pk
          AttributeType: S
        - AttributeName: gsi_1_sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: gsi_1
          KeySchema:
            - AttributeName: gsi_1_pk
              KeyType: HASH
            - AttributeName: gsi_1_sk
              KeyType: RANGE
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes:
              - item_id
              - shop_id
              - shops_item_id
              - hash
      BillingMode: PAY_PER_REQUEST
      TableClass: STANDARD
      StreamSpecification:
        StreamViewType: NEW_IMAGE

  BlitzfilterOpenSearchDomain:
    Type: AWS::OpenSearchService::Domain
    Properties:
      DomainName: !Sub "application-${StageName}"
      EngineVersion: "OpenSearch_2.19"
      ClusterConfig:
        InstanceType: t3.small.search
        InstanceCount: 1
        ZoneAwarenessEnabled: false
      EBSOptions:
        EBSEnabled: true
        VolumeSize: 10
        VolumeType: gp3
      AccessPolicies:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: "es:*"
            Resource: !Sub "arn:aws:es:${AWS::Region}:${AWS::AccountId}:domain/application-${StageName}/*"

  DynamoDbEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub "dynamodb-event-bus-${StageName}"
  PipeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "dynamodb-to-eventbridge-pipe-role-${StageName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: pipes.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PipePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:DescribeStream
                  - dynamodb:GetRecords
                  - dynamodb:GetShardIterator
                  - dynamodb:ListStreams
                Resource: "*"
              - Effect: Allow
                Action:
                  - events:PutEvents
                Resource: !GetAtt DynamoDbEventBus.Arn
  TableOneStreamToEventBusPipe:
    Type: AWS::Pipes::Pipe
    Properties:
      Name: !Sub "tableone-stream-to-eventbus-${StageName}"
      RoleArn: !GetAtt PipeRole.Arn
      Source: !GetAtt TableOne.StreamArn
      SourceParameters:
        DynamoDBStreamParameters:
          StartingPosition: LATEST
          BatchSize: 10
          MaximumBatchingWindowInSeconds: 1
        FilterCriteria:
          Filters:
            - Pattern: |
                {
                  "eventName": ["INSERT"],
                  "dynamodb": {
                    "NewImage": {
                      "sk": {
                        "S": [{ "prefix": "item#event#" }]
                      }
                    }
                  }
                }
      Target: !GetAtt DynamoDbEventBus.Arn
      TargetParameters:
        EventBridgeEventBusParameters:
          DetailType: "DynamoDBStreamRecord"
          Source: !Ref TableOne

  DynamoDbEventBusQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref ItemMaterializeDynamoDbNewQ
        - !Ref ItemMaterializeDynamoDbUpdateQ
        - !Ref ItemMaterializeOpenSearchNewQ
        - !Ref ItemMaterializeOpenSearchUpdateQ
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource:
              - !GetAtt ItemMaterializeDynamoDbNewQ.Arn
              - !GetAtt ItemMaterializeDynamoDbUpdateQ.Arn
              - !GetAtt ItemMaterializeOpenSearchNewQ.Arn
              - !GetAtt ItemMaterializeOpenSearchUpdateQ.Arn

  BlitzfilterApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "blitzfilter-api-${StageName}"
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        AllowHeaders:
          - "*"
  BlitzfilterApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      StageName: !Sub "${StageName}"
      ApiId: !Ref BlitzfilterApi
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 20
  BlitzfilterApiCognitoAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref BlitzfilterApi
      Name: CognitoJwtAuthorizer
      AuthorizerType: JWT
      IdentitySource:
        - "$request.header.Authorization"
      JwtConfiguration:
        Issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${BlitzfilterUserPool}"
        Audience:
          - !Ref BlitzfilterUserPoolClientPublic
          - !Ref BlitzfilterUserPoolClientAdmin

  BlitzfilterApiGetItemRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref BlitzfilterApi
      RouteKey: "GET /api/v1/items/{shopId}/{shopsItemId}"
      Target: !Sub "integrations/${BlitzfilterApiGetItemLambdaIntegration}"
  BlitzfilterApiGetItemLambdaIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref BlitzfilterApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${BlitzfilterApiGetItemLambda}"
      PayloadFormatVersion: "2.0"
  BlitzfilterApiGetItemRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "blitzfilter-api-get-item-role-${StageName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:BatchGetItem
                  - dynamodb:Query
                Resource: !GetAtt TableOne.Arn
  BlitzfilterApiGetItemLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "blitzfilter-api-get-item-${StageName}"
      Runtime: provided.al2023
      Handler: lib.handler
      Role: !GetAtt BlitzfilterApiGetItemRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub "item-api-get-item-${StageName}-${CommitSHA}.zip"
      MemorySize: 512
      Timeout: 10
      EphemeralStorage:
        Size: 512
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME: !Ref TableOne
  BlitzfilterApiGetItemLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref BlitzfilterApiGetItemLambda
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${BlitzfilterApi}/*/*/api/v1/items/*/*"

  BlitzfilterApiPutItemsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref BlitzfilterApi
      RouteKey: "PUT /api/v1/items"
      Target: !Sub "integrations/${BlitzfilterApiPutItemsLambdaIntegration}"
  BlitzfilterApiPutItemsLambdaIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref BlitzfilterApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${BlitzfilterApiPutItemsLambda}"
      PayloadFormatVersion: "2.0"
  BlitzfilterApiPutItemsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "blitzfilter-api-put-items-role-${StageName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:BatchGetItem
                  - dynamodb:Query
                Resource: !GetAtt TableOne.Arn
        - PolicyName: SQSSendMessage
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: !GetAtt ItemIngestEventsDynamoDbQ.Arn
  BlitzfilterApiPutItemsLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "blitzfilter-api-put-items-${StageName}"
      Runtime: provided.al2023
      Handler: lib.handler
      Role: !GetAtt BlitzfilterApiPutItemsRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub "item-api-put-items-${StageName}-${CommitSHA}.zip"
      MemorySize: 1024
      Timeout: 60
      EphemeralStorage:
        Size: 512
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME: !Ref TableOne
          INGEST_ITEM_EVENTS_QUEUE_URL: !Ref ItemIngestEventsDynamoDbQ
  BlitzfilterApiPutItemsLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref BlitzfilterApiPutItemsLambda
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${BlitzfilterApi}/*/*/api/v1/items"

  BlitzfilterApiSimpleSearchRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref BlitzfilterApi
      RouteKey: "GET /api/v1/items"
      Target: !Sub "integrations/${BlitzfilterApiSimpleSearchLambdaIntegration}"
  BlitzfilterApiSimpleSearchLambdaIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref BlitzfilterApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${BlitzfilterApiSimpleSearchLambda}"
      PayloadFormatVersion: "2.0"
  BlitzfilterApiSimpleSearchRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "blitzfilter-api-simple-search-role-${StageName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: OpenSearchReadOnly
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - es:Describe*
                  - es:List*
                  - es:ESHttpGet
                  - es:ESHttpHead
                  - es:ESHttpPost
                Resource: !Sub "${BlitzfilterOpenSearchDomain.Arn}/*"
  BlitzfilterApiSimpleSearchLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "blitzfilter-api-simple-search-${StageName}"
      Runtime: provided.al2023
      Handler: lib.handler
      Role: !GetAtt BlitzfilterApiSimpleSearchRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub "item-api-simple-search-${StageName}-${CommitSHA}.zip"
      MemorySize: 512
      Timeout: 10
      EphemeralStorage:
        Size: 512
      Environment:
        Variables:
          OPENSEARCH_DOMAIN_ENDPOINT_URL: !Sub "https://${BlitzfilterOpenSearchDomain.DomainEndpoint}"
  BlitzfilterApiSimpleSearchLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref BlitzfilterApiSimpleSearchLambda
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${BlitzfilterApi}/*/*/api/v1/items*"

  BlitzfilterApiComplexSearchRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref BlitzfilterApi
      RouteKey: "POST /api/v1/items/search"
      Target: !Sub "integrations/${BlitzfilterApiComplexSearchLambdaIntegration}"
  BlitzfilterApiComplexSearchLambdaIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref BlitzfilterApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${BlitzfilterApiComplexSearchLambda}"
      PayloadFormatVersion: "2.0"
  BlitzfilterApiComplexSearchRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "blitzfilter-api-complex-search-role-${StageName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: OpenSearchReadOnly
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - es:Describe*
                  - es:List*
                  - es:ESHttpGet
                  - es:ESHttpHead
                  - es:ESHttpPost
                Resource: !Sub "${BlitzfilterOpenSearchDomain.Arn}/*"
  BlitzfilterApiComplexSearchLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "blitzfilter-api-complex-search-${StageName}"
      Runtime: provided.al2023
      Handler: lib.handler
      Role: !GetAtt BlitzfilterApiComplexSearchRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub "item-api-complex-search-${StageName}-${CommitSHA}.zip"
      MemorySize: 512
      Timeout: 10
      EphemeralStorage:
        Size: 512
      Environment:
        Variables:
          OPENSEARCH_DOMAIN_ENDPOINT_URL: !Sub "https://${BlitzfilterOpenSearchDomain.DomainEndpoint}"
  BlitzfilterApiComplexSearchLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref BlitzfilterApiComplexSearchLambda
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${BlitzfilterApi}/*/*/api/v1/items/search*"

  BlitzfilterApiGetShopRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref BlitzfilterApi
      RouteKey: "GET /api/v1/shops/{shopId}"
      Target: !Sub "integrations/${BlitzfilterApiGetShopLambdaIntegration}"
  BlitzfilterApiGetShopLambdaIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref BlitzfilterApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${BlitzfilterApiGetShopLambda}"
      PayloadFormatVersion: "2.0"
  BlitzfilterApiGetShopRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "blitzfilter-api-get-shop-role-${StageName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:BatchGetItem
                  - dynamodb:Query
                Resource: !GetAtt TableOne.Arn
  BlitzfilterApiGetShopLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "blitzfilter-api-get-shop-${StageName}"
      Runtime: provided.al2023
      Handler: lib.handler
      Role: !GetAtt BlitzfilterApiGetsShopRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub "item-api-get-shop-${StageName}-${CommitSHA}.zip"
      MemorySize: 512
      Timeout: 10
      EphemeralStorage:
        Size: 512
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME: !Ref TableOne
  BlitzfilterApiGetShopLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref BlitzfilterApiGetShopLambda
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${BlitzfilterApi}/*/*/api/v1/shops/*"

  BlitzfilterApiShopSearchRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref BlitzfilterApi
      RouteKey: "POST /api/v1/shops/search"
      Target: !Sub "integrations/${BlitzfilterApiShopSearchLambdaIntegration}"
  BlitzfilterApiShopSearchLambdaIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref BlitzfilterApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${BlitzfilterApiShopSearchLambda}"
      PayloadFormatVersion: "2.0"
  BlitzfilterApiShopSearchRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "blitzfilter-api-shop-search-role-${StageName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: OpenSearchReadOnly
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - es:Describe*
                  - es:List*
                  - es:ESHttpGet
                  - es:ESHttpHead
                  - es:ESHttpPost
                Resource: !Sub "${BlitzfilterOpenSearchDomain.Arn}/*"
  BlitzfilterApiShopSearchLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "blitzfilter-api-shop-search-${StageName}"
      Runtime: provided.al2023
      Handler: lib.handler
      Role: !GetAtt BlitzfilterApiShopSearchRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub "item-api-shop-search-${StageName}-${CommitSHA}.zip"
      MemorySize: 512
      Timeout: 10
      EphemeralStorage:
        Size: 512
      Environment:
        Variables:
          OPENSEARCH_DOMAIN_ENDPOINT_URL: !Sub "https://${BlitzfilterOpenSearchDomain.DomainEndpoint}"
  BlitzfilterApiShopSearchLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref BlitzfilterApiShopSearchLambda
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${BlitzfilterApi}/*/*/api/v1/shop/search*"

  ApiDeleteSearchFilterRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref BlitzfilterApi
      RouteKey: "DELETE /api/v1/search-filters/{searchFilterId}"
      AuthorizationType: JWT
      AuthorizerId: !Ref BlitzfilterApiCognitoAuthorizer
      Target: !Sub "integrations/${BlitzfilterApiDeleteSearchFilterLambdaIntegration}"
  BlitzfilterApiDeleteSearchFilterLambdaIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref BlitzfilterApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${BlitzfilterApiDeleteSearchFilterLambda}"
      PayloadFormatVersion: "2.0"
  BlitzfilterApiDeleteSearchFilterRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "blitzfilter-api-delete-search-filter-role-${StageName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:DeleteItem
                  - dynamodb:BatchGetItem
                  - dynamodb:Query
                Resource: !GetAtt TableOne.Arn
  BlitzfilterApiDeleteSearchFilterLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "blitzfilter-api-delete-search-filter-${StageName}"
      Runtime: provided.al2023
      Handler: lib.handler
      Role: !GetAtt BlitzfilterApiDeleteSearchFilterRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub "search-filter-api-delete-search-filter-${StageName}-${CommitSHA}.zip"
      MemorySize: 512
      Timeout: 10
      EphemeralStorage:
        Size: 512
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME: !Ref TableOne
  BlitzfilterApiDeleteSearchFilterLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref BlitzfilterApiDeleteSearchFilterLambda
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${BlitzfilterApi}/*/*/api/v1/search-filters/*"

  ApiGetSearchFilterRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref BlitzfilterApi
      RouteKey: "GET /api/v1/search-filters/{searchFilterId}"
      AuthorizationType: JWT
      AuthorizerId: !Ref BlitzfilterApiCognitoAuthorizer
      Target: !Sub "integrations/${BlitzfilterApiGetSearchFilterLambdaIntegration}"
  BlitzfilterApiGetSearchFilterLambdaIntegration:
    Type: AWS::ApiGatewayV2::Integration
