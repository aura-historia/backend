  ItemUpdateNotifyUserRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "item-lambda-update-notify-user-role-${StageName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                Resource:
                  - !GetAtt TableOne.Arn
                  - !Sub "${TableOne.Arn}/index/*"
        - PolicyName: SQSPollerAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                  - sqs:GetQueueUrl
                Resource: !GetAtt ItemUpdateNotifyUserQ.Arn
        - PolicyName: SQSSendMessage
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: !GetAtt SendMailQ.Arn
  ItemUpdateNotifyUserLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "item-lambda-update-notify-user-${StageName}"
      Runtime: provided.al2023
      Handler: lib.handler
      Role: !GetAtt ItemUpdateNotifyUserRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub "item-lambda-update-notify-user-${StageName}-${CommitSHA}.zip"
      MemorySize: 512
      Timeout: 60
      EphemeralStorage:
        Size: 512
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME: !Ref TableOne
          MAIL_QUEUE_URL: !Ref SendMailQ
          SENDER_MAIL: "no-reply@aura-historia.com"
  ItemUpdateNotifyUserMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      FunctionName: !Ref ItemUpdateNotifyUserLambda
      EventSourceArn: !GetAtt ItemUpdateNotifyUserQ.Arn
      Enabled: true
      BatchSize: 10
      MaximumBatchingWindowInSeconds:
        !FindInMap [
          IItemUpdateNotifyUserQueueMap,
          MaximumBatchingWindowInSeconds,
          !Ref Stage,
        ]
      FunctionResponseTypes:
        - ReportBatchItemFailures
  ItemUpdateNotifyUserLambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${StageName}-item-update-notify-user-lambda-errors"
      AlarmDescription: "Alarm when item-update-notify-user Lambda has errors"
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref ItemUpdateNotifyUserLambda
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmNotificationTopic
  ItemUpdateNotifyUserDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${StageName}-item-update-notify-user-dlq-messages"
      AlarmDescription: "Alarm when messages appear in item-update-notify-user DLQ"
      MetricName: ApproximateNumberOfMessagesVisible
      Namespace: AWS/SQS
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: QueueName
          Value: !GetAtt ItemUpdateNotifyUserDlq.QueueName
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmNotificationTopic

