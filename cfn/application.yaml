AWSTemplateFormatVersion: "2010-09-09"
Description: Full application stack for the Blitzfilter Backend

Parameters:
  Stage:
    Type: String
    Description: "Type of the stage"
    AllowedValues:
      - dev
      - staging
      - prod
  StageName:
    Type: String
    Description: "Unique name of the stage"
  ArtifactBucket:
    Type: String
    Description: "S3 bucket containing Lambda deployment zips"
  CommitSHA:
    Type: String

Mappings:
  ItemWriteQueuesMap:
    MaximumBatchingWindowInSeconds:
      dev: 1
      prod: 10
  ItemMaterializeDynamoDbQueuesMap:
    MaximumBatchingWindowInSeconds:
      dev: 1
      prod: 10
  ItemMaterializeOpenSearchQueuesMap:
    MaximumBatchingWindowInSeconds:
      dev: 1
      prod: 300

Resources:
  TableOne:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "table_1-${StageName}"
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: gsi_1_pk
          AttributeType: S
        - AttributeName: gsi_1_sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: gsi_1
          KeySchema:
            - AttributeName: gsi_1_pk
              KeyType: HASH
            - AttributeName: gsi_1_sk
              KeyType: RANGE
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes:
              - item_id
              - shop_id
              - shops_item_id
              - hash
      BillingMode: PAY_PER_REQUEST
      TableClass: STANDARD
      StreamSpecification:
        StreamViewType: NEW_IMAGE

  ItemsOpenSearchDomain:
    Type: AWS::OpenSearchService::Domain
    Properties:
      DomainName: !Sub "application-${StageName}"
      EngineVersion: "OpenSearch_2.19"
      ClusterConfig:
        InstanceType: t3.small.search
        InstanceCount: 1
        ZoneAwarenessEnabled: false
      EBSOptions:
        EBSEnabled: true
        VolumeSize: 10
        VolumeType: gp3
      AccessPolicies:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: "es:*"
            Resource: !Sub "arn:aws:es:${AWS::Region}:${AWS::AccountId}:domain/application-${StageName}/*"

  DynamoDbEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub "dynamodb-event-bus-${StageName}"
  PipeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "dynamodb-to-eventbridge-pipe-role-${StageName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: pipes.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PipePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:DescribeStream
                  - dynamodb:GetRecords
                  - dynamodb:GetShardIterator
                  - dynamodb:ListStreams
                Resource: "*"
              - Effect: Allow
                Action:
                  - events:PutEvents
                Resource: !GetAtt DynamoDbEventBus.Arn
  TableOneStreamToEventBusPipe:
    Type: AWS::Pipes::Pipe
    Properties:
      Name: !Sub "tableone-stream-to-eventbus-${StageName}"
      RoleArn: !GetAtt PipeRole.Arn
      Source: !GetAtt TableOne.StreamArn
      SourceParameters:
        DynamoDBStreamParameters:
          StartingPosition: LATEST
          BatchSize: 10
          MaximumBatchingWindowInSeconds: 1
        FilterCriteria:
          Filters:
            - Pattern: |
                {
                  "eventName": ["INSERT"],
                  "dynamodb": {
                    "NewImage": {
                      "sk": {
                        "S": [{ "prefix": "item#event#" }]
                      }
                    }
                  }
                }
      Target: !GetAtt DynamoDbEventBus.Arn
      TargetParameters:
        EventBridgeEventBusParameters:
          DetailType: "DynamoDBStreamRecord"
          Source: !Ref TableOne

  DynamoDbEventBusQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref ItemMaterializeDynamoDbNewQ
        - !Ref ItemMaterializeDynamoDbUpdateQ
        - !Ref ItemMaterializeOpenSearchNewQ
        - !Ref ItemMaterializeOpenSearchUpdateQ
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource:
              - !GetAtt ItemMaterializeDynamoDbNewQ.Arn
              - !GetAtt ItemMaterializeDynamoDbUpdateQ.Arn
              - !GetAtt ItemMaterializeOpenSearchNewQ.Arn
              - !GetAtt ItemMaterializeOpenSearchUpdateQ.Arn

  BlitzfilterApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "blitzfilter-api-${StageName}"
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        AllowHeaders:
          - "*"
  BlitzfilterApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      StageName: !Sub "${StageName}"
      ApiId: !Ref BlitzfilterApi
      AutoDeploy: true

  BlitzfilterApiGetItemRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref BlitzfilterApi
      RouteKey: "GET /api/v1/items/{shopId}/{shopsItemId}"
      Target: !Sub "integrations/${BlitzfilterApiGetItemLambdaIntegration}"
  BlitzfilterApiGetItemLambdaIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref BlitzfilterApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${BlitzfilterApiGetItemLambda}"
      PayloadFormatVersion: "2.0"
  BlitzfilterApiGetItemRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "blitzfilter-api-get-item-role-${StageName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:BatchGetItem
                  - dynamodb:Query
                Resource: !GetAtt TableOne.Arn
  BlitzfilterApiGetItemLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "blitzfilter-api-get-item-${StageName}"
      Runtime: provided.al2023
      Handler: lib.handler
      Role: !GetAtt BlitzfilterApiGetItemRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub "item-api-get-item-${StageName}-${CommitSHA}.zip"
      MemorySize: 512
      Timeout: 10
      EphemeralStorage:
        Size: 512
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME: !Ref TableOne
  BlitzfilterApiGetItemLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref BlitzfilterApiGetItemLambda
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${BlitzfilterApi}/*/*/api/v1/items/*/*"

  BlitzfilterApiSimpleSearchRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref BlitzfilterApi
      RouteKey: "GET /api/v1/items"
      Target: !Sub "integrations/${BlitzfilterApiSimpleSearchLambdaIntegration}"
  BlitzfilterApiSimpleSearchLambdaIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref BlitzfilterApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${BlitzfilterApiSimpleSearchLambda}"
      PayloadFormatVersion: "2.0"
  BlitzfilterApiSimpleSearchRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "blitzfilter-api-simple-search-role-${StageName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: OpenSearchReadOnly
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - es:Describe*
                  - es:List*
                  - es:ESHttpGet
                  - es:ESHttpHead
                  - es:ESHttpPost
                Resource: !Sub "${ItemsOpenSearchDomain.Arn}/*"
  BlitzfilterApiSimpleSearchLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "blitzfilter-api-simple-search-${StageName}"
      Runtime: provided.al2023
      Handler: lib.handler
      Role: !GetAtt BlitzfilterApiSimpleSearchRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub "item-api-simple-search-${StageName}-${CommitSHA}.zip"
      MemorySize: 512
      Timeout: 10
      EphemeralStorage:
        Size: 512
      Environment:
        Variables:
          OPENSEARCH_ITEMS_DOMAIN_ENDPOINT_URL: !Sub "https://${ItemsOpenSearchDomain.DomainEndpoint}"
  BlitzfilterApiSimpleSearchLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref BlitzfilterApiSimpleSearchLambda
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${BlitzfilterApi}/*/*/api/v1/items*"

  ApiDeleteSearchFilterRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref BlitzfilterApi
      RouteKey: "DELETE /api/v1/search-filters/{searchFilterId}"
      Target: !Sub "integrations/${BlitzfilterApiDeleteSearchFilterLambdaIntegration}"
  BlitzfilterApiDeleteSearchFilterLambdaIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref BlitzfilterApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${BlitzfilterApiDeleteSearchFilterLambda}"
      PayloadFormatVersion: "2.0"
  BlitzfilterApiDeleteSearchFilterRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "blitzfilter-api-delete-search-filter-role-${StageName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:DeleteItem
                  - dynamodb:BatchGetItem
                  - dynamodb:Query
                Resource: !GetAtt TableOne.Arn
  BlitzfilterApiDeleteSearchFilterLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "blitzfilter-api-delete-search-filter-${StageName}"
      Runtime: provided.al2023
      Handler: lib.handler
      Role: !GetAtt BlitzfilterApiDeleteSearchFilterRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub "search-filter-api-delete-search-filter-${StageName}-${CommitSHA}.zip"
      MemorySize: 512
      Timeout: 10
      EphemeralStorage:
        Size: 512
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME: !Ref TableOne
  BlitzfilterApiDeleteSearchFilterLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref BlitzfilterApiDeleteSearchFilterLambda
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${BlitzfilterApi}/*/*/api/v1/search-filters"

  ApiGetSearchFilterRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref BlitzfilterApi
      RouteKey: "GET /api/v1/search-filters/{searchFilterId}"
      Target: !Sub "integrations/${BlitzfilterApiGetSearchFilterLambdaIntegration}"
  BlitzfilterApiGetSearchFilterLambdaIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref BlitzfilterApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${BlitzfilterApiGetSearchFilterLambda}"
      PayloadFormatVersion: "2.0"
  BlitzfilterApiGetSearchFilterRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "blitzfilter-api-get-search-filter-role-${StageName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:BatchGetItem
                  - dynamodb:Query
                Resource: !GetAtt TableOne.Arn
  BlitzfilterApiGetSearchFilterLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "blitzfilter-api-get-search-filter-${StageName}"
      Runtime: provided.al2023
      Handler: lib.handler
      Role: !GetAtt BlitzfilterApiGetSearchFilterRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub "search-filter-api-get-search-filter-${StageName}-${CommitSHA}.zip"
      MemorySize: 512
      Timeout: 10
      EphemeralStorage:
        Size: 512
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME: !Ref TableOne
  BlitzfilterApiGetSearchFilterLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref BlitzfilterApiGetSearchFilterLambda
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${BlitzfilterApi}/*/*/api/v1/search-filters/*"

  ApiGetSearchFiltersRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref BlitzfilterApi
      RouteKey: "GET /api/v1/search-filters"
      Target: !Sub "integrations/${BlitzfilterApiGetSearchFiltersLambdaIntegration}"
  BlitzfilterApiGetSearchFiltersLambdaIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref BlitzfilterApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${BlitzfilterApiGetSearchFiltersLambda}"
      PayloadFormatVersion: "2.0"
  BlitzfilterApiGetSearchFiltersRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "blitzfilter-api-get-search-filters-role-${StageName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:BatchGetItem
                  - dynamodb:Query
                Resource: !GetAtt TableOne.Arn
  BlitzfilterApiGetSearchFiltersLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "blitzfilter-api-get-search-filters-${StageName}"
      Runtime: provided.al2023
      Handler: lib.handler
      Role: !GetAtt BlitzfilterApiGetSearchFiltersRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub "search-filter-api-get-search-filters-${StageName}-${CommitSHA}.zip"
      MemorySize: 512
      Timeout: 10
      EphemeralStorage:
        Size: 512
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME: !Ref TableOne
  BlitzfilterApiGetSearchFiltersLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref BlitzfilterApiGetSearchFiltersLambda
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${BlitzfilterApi}/*/*/api/v1/search-filters"

  ApiPostSearchFilterRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref BlitzfilterApi
      RouteKey: "POST /api/v1/search-filters"
      Target: !Sub "integrations/${BlitzfilterApiPostSearchFilterLambdaIntegration}"
  BlitzfilterApiPostSearchFilterLambdaIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref BlitzfilterApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${BlitzfilterApiPostSearchFilterLambda}"
      PayloadFormatVersion: "2.0"
  BlitzfilterApiPostSearchFilterRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "blitzfilter-api-post-search-filter-role-${StageName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                Resource: !GetAtt TableOne.Arn
  BlitzfilterApiPostSearchFilterLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "blitzfilter-api-post-search-filter-${StageName}"
      Runtime: provided.al2023
      Handler: lib.handler
      Role: !GetAtt BlitzfilterApiPostSearchFilterRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub "search-filter-api-post-search-filter-${StageName}-${CommitSHA}.zip"
      MemorySize: 512
      Timeout: 10
      EphemeralStorage:
        Size: 512
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME: !Ref TableOne
  BlitzfilterApiPostSearchFilterLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref BlitzfilterApiPostSearchFilterLambda
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${BlitzfilterApi}/*/*/api/v1/search-filters"

  ItemWriteNewDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "item-lambda-write-new-dlq-${StageName}"
      MessageRetentionPeriod: 1209600
  ItemWriteNewQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "item-lambda-write-new-queue-${StageName}"
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ItemWriteNewDlq.Arn
        maxReceiveCount: 3
      VisibilityTimeout: 360
  ItemWriteNewRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "item-lambda-write-new-role-${StageName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:*
                Resource: !GetAtt TableOne.Arn
        - PolicyName: SQSPollerAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                  - sqs:GetQueueUrl
                Resource: !GetAtt ItemWriteNewQ.Arn
  ItemWriteNewLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "item-lambda-write-new-${StageName}"
      Runtime: provided.al2023
      Handler: lib.handler
      Role: !GetAtt ItemWriteNewRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub "item-lambda-write-new-${StageName}-${CommitSHA}.zip"
      MemorySize: 512
      Timeout: 60
      EphemeralStorage:
        Size: 512
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME: !Ref TableOne
  ItemWriteNewMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      FunctionName: !Ref ItemWriteNewLambda
      EventSourceArn: !GetAtt ItemWriteNewQ.Arn
      Enabled: true
      BatchSize: 200
      MaximumBatchingWindowInSeconds:
        !FindInMap [
          ItemWriteQueuesMap,
          MaximumBatchingWindowInSeconds,
          !Ref Stage,
        ]
      FunctionResponseTypes:
        - ReportBatchItemFailures

  ItemWriteUpdateDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "item-lambda-write-update-dlq-${StageName}"
      MessageRetentionPeriod: 1209600
  ItemWriteUpdateQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "item-lambda-write-update-queue-${StageName}"
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ItemWriteUpdateDlq.Arn
        maxReceiveCount: 3
      VisibilityTimeout: 360
  ItemWriteUpdateRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "item-lambda-write-update-role-${StageName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:*
                Resource: !GetAtt TableOne.Arn
        - PolicyName: SQSPollerAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                  - sqs:GetQueueUrl
                Resource: !GetAtt ItemWriteUpdateQ.Arn
  ItemWriteUpdateLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "item-lambda-write-update-${StageName}"
      Runtime: provided.al2023
      Handler: lib.handler
      Role: !GetAtt ItemWriteUpdateRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub "item-lambda-write-update-${StageName}-${CommitSHA}.zip"
      MemorySize: 512
      Timeout: 60
      EphemeralStorage:
        Size: 512
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME: !Ref TableOne
  ItemWriteUpdateMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      FunctionName: !Ref ItemWriteUpdateLambda
      EventSourceArn: !GetAtt ItemWriteUpdateQ.Arn
      Enabled: true
      BatchSize: 200
      MaximumBatchingWindowInSeconds:
        !FindInMap [
          ItemWriteQueuesMap,
          MaximumBatchingWindowInSeconds,
          !Ref Stage,
        ]
      FunctionResponseTypes:
        - ReportBatchItemFailures

  ItemMaterializeDynamoDbNewDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "item-lambda-materialize-dynamodb-new-dlq-${StageName}"
      MessageRetentionPeriod: 1209600
  ItemMaterializeDynamoDbNewQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "item-lambda-materialize-dynamodb-new-queue-${StageName}"
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ItemMaterializeDynamoDbNewDlq.Arn
        maxReceiveCount: 5
      VisibilityTimeout: 360
  ItemMaterializeDynamoDbNewRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "item-lambda-materialize-dynamodb-new-role-${StageName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:*
                Resource: !GetAtt TableOne.Arn
        - PolicyName: SQSPollerAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                  - sqs:GetQueueUrl
