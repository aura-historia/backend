      Runtime: provided.al2023
      Handler: lib.handler
      Role: !GetAtt ProductEnrichmentScaleDownRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub "product-enrichment-asg-scale-down-${StageName}-${CommitSHA}.zip"
      MemorySize: 128
