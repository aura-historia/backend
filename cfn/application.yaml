AWSTemplateFormatVersion: "2010-09-09"
Description: Full application stack for the Blitzfilter Backend

Parameters:
  Stage:
    Type: String
    Description: "Type of the stage"
    AllowedValues:
      - dev
      - staging
      - prod
  StageName:
    Type: String
    Description: "Unique name of the stage"
  ArtifactBucket:
    Type: String
    Description: "S3 bucket containing Lambda deployment zips (must have versioning enabled)"

Mappings:
  ItemIngestEventsDynamoDbQueueMap:
    MaximumBatchingWindowInSeconds:
      dev: 1
      staging: 1
      prod: 10
  ItemMaterializeDynamoDbQueuesMap:
    MaximumBatchingWindowInSeconds:
      dev: 1
      staging: 1
      prod: 10
  ItemMaterializeOpenSearchQueuesMap:
    MaximumBatchingWindowInSeconds:
      dev: 1
      staging: 1
      prod: 300

Resources:
  BlitzfilterUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "blitzfilter-userpool-${StageName}"
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 7
      UserPoolAddOns:
        AdvancedSecurityMode: ENFORCED
      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE
      EmailVerificationSubject: "Verify your email"
      EmailVerificationMessage: "Your verification code is {####}"
      Schema:
        - Name: email
          AttributeDataType: String
          Mutable: true
          Required: true
        - Name: given_name
          AttributeDataType: String
          Mutable: true
          Required: true
        - Name: family_name
          AttributeDataType: String
          Mutable: true
          Required: true
        - Name: birthdate
          AttributeDataType: String
          Mutable: true
          Required: true
        - Name: gender
          AttributeDataType: String
          Mutable: true
          Required: true
        - Name: phone_number
          AttributeDataType: String
          Mutable: true
          Required: false
        - Name: locale
          AttributeDataType: String
          Mutable: true
          Required: false
        - Name: zoneinfo
          AttributeDataType: String
          Mutable: true
          Required: false
  BlitzfilterUserPoolClientPublic:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref BlitzfilterUserPool
      ClientName: !Sub "blitzfilter-client-${StageName}"
      GenerateSecret: false # PKCE replaces client secret
      PreventUserExistenceErrors: ENABLED
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      SupportedIdentityProviders:
        - COGNITO
      CallbackURLs:
        - http://localhost:3000/
        - https://blitzfilter.blitzfilter.workers.dev/
      LogoutURLs:
        - http://localhost:3000/
        - https://blitzfilter.blitzfilter.workers.dev/
      EnableTokenRevocation: true
      AccessTokenValidity: 1 # hours
      IdTokenValidity: 1 # hours
      RefreshTokenValidity: 30 # days
      ReadAttributes:
        - email
        - given_name
        - family_name
        - birthdate
        - gender
        - phone_number
        - locale
        - zoneinfo
      WriteAttributes:
        - email
        - given_name
        - family_name
        - birthdate
        - gender
        - phone_number
        - locale
        - zoneinfo
  BlitzfilterUserPoolClientAdmin:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref BlitzfilterUserPool
      ClientName: !Sub "blitzfilter-admin-${StageName}"
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      AllowedOAuthFlowsUserPoolClient: false
      ExplicitAuthFlows:
        - ALLOW_ADMIN_USER_PASSWORD_AUTH
      EnableTokenRevocation: true
      AccessTokenValidity: 1 # hours
      IdTokenValidity: 1 # hours
      RefreshTokenValidity: 30 # days
      ReadAttributes:
        - email
        - given_name
        - family_name
        - birthdate
        - gender
        - phone_number
        - locale
        - zoneinfo
      WriteAttributes:
        - email
        - given_name
        - family_name
        - birthdate
        - gender
        - phone_number
        - locale
        - zoneinfo
  BlitzfilterUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub "blitzfilter-${StageName}" # hosted UI domain
      UserPoolId: !Ref BlitzfilterUserPool

  TableOne:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "table_1-${StageName}"
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST
      TableClass: STANDARD
      StreamSpecification:
        StreamViewType: NEW_IMAGE

  BlitzfilterOpenSearchDomain:
    Type: AWS::OpenSearchService::Domain
    Properties:
      DomainName: !Sub "application-${StageName}"
      EngineVersion: "OpenSearch_2.19"
      ClusterConfig:
        InstanceType: t3.small.search
        InstanceCount: 1
        ZoneAwarenessEnabled: false
      EBSOptions:
        EBSEnabled: true
        VolumeSize: 10
        VolumeType: gp3
      AccessPolicies:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: "es:*"
            Resource: !Sub "arn:aws:es:${AWS::Region}:${AWS::AccountId}:domain/application-${StageName}/*"

  DynamoDbEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub "dynamodb-event-bus-${StageName}"
  PipeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "dynamodb-to-eventbridge-pipe-role-${StageName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: pipes.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PipePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:DescribeStream
                  - dynamodb:GetRecords
                  - dynamodb:GetShardIterator
                  - dynamodb:ListStreams
                Resource: "*"
              - Effect: Allow
                Action:
                  - events:PutEvents
                Resource: !GetAtt DynamoDbEventBus.Arn
  TableOneStreamToEventBusPipe:
    Type: AWS::Pipes::Pipe
    Properties:
      Name: !Sub "tableone-stream-to-eventbus-${StageName}"
      RoleArn: !GetAtt PipeRole.Arn
      Source: !GetAtt TableOne.StreamArn
      SourceParameters:
        DynamoDBStreamParameters:
          StartingPosition: LATEST
          BatchSize: 10
          MaximumBatchingWindowInSeconds: 1
        FilterCriteria:
          Filters:
            - Pattern: |
                {
                  "eventName": ["INSERT"],
                  "dynamodb": {
                    "NewImage": {
                      "sk": {
                        "S": [{ "prefix": "item#event#" }]
                      }
                    }
                  }
                }
      Target: !GetAtt DynamoDbEventBus.Arn
      TargetParameters:
        EventBridgeEventBusParameters:
          DetailType: "DynamoDBStreamRecord"
          Source: !Ref TableOne

  DynamoDbEventBusQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref ItemMaterializeDynamoDbNewQ
        - !Ref ItemMaterializeDynamoDbUpdateQ
        - !Ref ItemMaterializeOpenSearchNewQ
        - !Ref ItemMaterializeOpenSearchUpdateQ
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource:
              - !GetAtt ItemMaterializeDynamoDbNewQ.Arn
              - !GetAtt ItemMaterializeDynamoDbUpdateQ.Arn
              - !GetAtt ItemMaterializeOpenSearchNewQ.Arn
              - !GetAtt ItemMaterializeOpenSearchUpdateQ.Arn

  BlitzfilterApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "blitzfilter-api-${StageName}"
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        AllowHeaders:
          - "*"
  BlitzfilterApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      StageName: !Sub "${StageName}"
      ApiId: !Ref BlitzfilterApi
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 20
  BlitzfilterApiCognitoAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref BlitzfilterApi
      Name: CognitoJwtAuthorizer
      AuthorizerType: JWT
      IdentitySource:
        - "$request.header.Authorization"
      JwtConfiguration:
        Issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${BlitzfilterUserPool}"
        Audience:
          - !Ref BlitzfilterUserPoolClientPublic
          - !Ref BlitzfilterUserPoolClientAdmin

  BlitzfilterApiGetItemRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref BlitzfilterApi
      RouteKey: "GET /api/v1/items/{shopId}/{shopsItemId}"
      Target: !Sub "integrations/${BlitzfilterApiGetItemLambdaIntegration}"
  BlitzfilterApiGetItemLambdaIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref BlitzfilterApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${BlitzfilterApiGetItemLambda}"
      PayloadFormatVersion: "2.0"
  BlitzfilterApiGetItemRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "blitzfilter-api-get-item-role-${StageName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:BatchGetItem
                  - dynamodb:Query
                Resource: !GetAtt TableOne.Arn
  BlitzfilterApiGetItemLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "blitzfilter-api-get-item-${StageName}"
      Runtime: provided.al2023
      Handler: lib.handler
      Role: !GetAtt BlitzfilterApiGetItemRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub "item-api-get-item-${StageName}.zip"
      MemorySize: 512
      Timeout: 10
      EphemeralStorage:
        Size: 512
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME: !Ref TableOne
  BlitzfilterApiGetItemLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref BlitzfilterApiGetItemLambda
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${BlitzfilterApi}/*/*/api/v1/items/*/*"

  BlitzfilterApiPutItemsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref BlitzfilterApi
      RouteKey: "PUT /api/v1/items"
      Target: !Sub "integrations/${BlitzfilterApiPutItemsLambdaIntegration}"
  BlitzfilterApiPutItemsLambdaIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref BlitzfilterApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${BlitzfilterApiPutItemsLambda}"
      PayloadFormatVersion: "2.0"
  BlitzfilterApiPutItemsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "blitzfilter-api-put-items-role-${StageName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:BatchGetItem
                  - dynamodb:Query
                Resource: !GetAtt TableOne.Arn
        - PolicyName: SQSSendMessage
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: !GetAtt ItemIngestEventsDynamoDbQ.Arn
  BlitzfilterApiPutItemsLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "blitzfilter-api-put-items-${StageName}"
      Runtime: provided.al2023
      Handler: lib.handler
      Role: !GetAtt BlitzfilterApiPutItemsRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub "item-api-put-items-${StageName}.zip"
      MemorySize: 1024
      Timeout: 60
      EphemeralStorage:
        Size: 512
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME: !Ref TableOne
          INGEST_ITEM_EVENTS_QUEUE_URL: !Ref ItemIngestEventsDynamoDbQ
  BlitzfilterApiPutItemsLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref BlitzfilterApiPutItemsLambda
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${BlitzfilterApi}/*/*/api/v1/items"

  BlitzfilterApiSimpleSearchRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref BlitzfilterApi
      RouteKey: "GET /api/v1/items"
      Target: !Sub "integrations/${BlitzfilterApiSimpleSearchLambdaIntegration}"
  BlitzfilterApiSimpleSearchLambdaIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref BlitzfilterApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${BlitzfilterApiSimpleSearchLambda}"
      PayloadFormatVersion: "2.0"
  BlitzfilterApiSimpleSearchRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "blitzfilter-api-simple-search-role-${StageName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: OpenSearchReadOnly
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - es:Describe*
                  - es:List*
                  - es:ESHttpGet
                  - es:ESHttpHead
                  - es:ESHttpPost
                Resource: !Sub "${BlitzfilterOpenSearchDomain.Arn}/*"
  BlitzfilterApiSimpleSearchLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "blitzfilter-api-simple-search-${StageName}"
      Runtime: provided.al2023
      Handler: lib.handler
      Role: !GetAtt BlitzfilterApiSimpleSearchRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub "item-api-simple-search-${StageName}.zip"
      MemorySize: 512
      Timeout: 10
      EphemeralStorage:
        Size: 512
      Environment:
        Variables:
          OPENSEARCH_DOMAIN_ENDPOINT_URL: !Sub "https://${BlitzfilterOpenSearchDomain.DomainEndpoint}"
  BlitzfilterApiSimpleSearchLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref BlitzfilterApiSimpleSearchLambda
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${BlitzfilterApi}/*/*/api/v1/items*"

  BlitzfilterApiComplexSearchRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref BlitzfilterApi
      RouteKey: "POST /api/v1/items/search"
      Target: !Sub "integrations/${BlitzfilterApiComplexSearchLambdaIntegration}"
  BlitzfilterApiComplexSearchLambdaIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref BlitzfilterApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${BlitzfilterApiComplexSearchLambda}"
      PayloadFormatVersion: "2.0"
  BlitzfilterApiComplexSearchRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "blitzfilter-api-complex-search-role-${StageName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: OpenSearchReadOnly
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - es:Describe*
                  - es:List*
                  - es:ESHttpGet
                  - es:ESHttpHead
                  - es:ESHttpPost
                Resource: !Sub "${BlitzfilterOpenSearchDomain.Arn}/*"
  BlitzfilterApiComplexSearchLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "blitzfilter-api-complex-search-${StageName}"
      Runtime: provided.al2023
      Handler: lib.handler
      Role: !GetAtt BlitzfilterApiComplexSearchRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub "item-api-complex-search-${StageName}.zip"
      MemorySize: 512
      Timeout: 10
      EphemeralStorage:
        Size: 512
      Environment:
        Variables:
          OPENSEARCH_DOMAIN_ENDPOINT_URL: !Sub "https://${BlitzfilterOpenSearchDomain.DomainEndpoint}"
  BlitzfilterApiComplexSearchLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref BlitzfilterApiComplexSearchLambda
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${BlitzfilterApi}/*/*/api/v1/items/search*"

  BlitzfilterApiGetWatchlistItemsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref BlitzfilterApi
      RouteKey: "GET /api/v1/watchlist"
      AuthorizationType: JWT
      AuthorizerId: !Ref BlitzfilterApiCognitoAuthorizer
      Target: !Sub "integrations/${BlitzfilterApiGetWatchlistItemsLambdaIntegration}"
  BlitzfilterApiGetWatchlistItemsLambdaIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref BlitzfilterApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${BlitzfilterApiGetWatchlistItemsLambda}"
      PayloadFormatVersion: "2.0"
  BlitzfilterApiGetWatchlistItemsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "blitzfilter-api-get-watchlist-items-role-${StageName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:BatchGetItem
                  - dynamodb:Query
                Resource: !GetAtt TableOne.Arn
  BlitzfilterApiGetWatchlistItemsLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "blitzfilter-api-get-watchlist-items-${StageName}"
      Runtime: provided.al2023
      Handler: lib.handler
      Role: !GetAtt BlitzfilterApiGetWatchlistItemsRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub "item-api-watchlist-get-${StageName}.zip"
      MemorySize: 512
      Timeout: 10
      EphemeralStorage:
        Size: 512
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME: !Ref TableOne
  BlitzfilterApiGetWatchlistItemsLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref BlitzfilterApiGetWatchlistItemsLambda
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${BlitzfilterApi}/*/*/api/v1/watchlist*"

  BlitzfilterApiDeleteWatchlistItemRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref BlitzfilterApi
      RouteKey: "DELETE /api/v1/watchlist/{shopId}/{shopsItemId}"
      AuthorizationType: JWT
      AuthorizerId: !Ref BlitzfilterApiCognitoAuthorizer
      Target: !Sub "integrations/${BlitzfilterApiDeleteWatchlistItemLambdaIntegration}"
  BlitzfilterApiDeleteWatchlistItemLambdaIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref BlitzfilterApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${BlitzfilterApiDeleteWatchlistItemLambda}"
      PayloadFormatVersion: "2.0"
  BlitzfilterApiDeleteWatchlistItemRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "blitzfilter-api-delete-watchlist-item-role-${StageName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:BatchGetItem
                  - dynamodb:Query
                  - dynamodb:DeleteItem
                Resource: !GetAtt TableOne.Arn
  BlitzfilterApiDeleteWatchlistItemLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "blitzfilter-api-delete-watchlist-item-${StageName}"
      Runtime: provided.al2023
      Handler: lib.handler
      Role: !GetAtt BlitzfilterApiDeleteWatchlistItemRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub "item-api-watchlist-delete-${StageName}.zip"
      MemorySize: 512
      Timeout: 10
      EphemeralStorage:
        Size: 512
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME: !Ref TableOne
  BlitzfilterApiDeleteWatchlistItemLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref BlitzfilterApiDeleteWatchlistItemLambda
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${BlitzfilterApi}/*/*/api/v1/watchlist/*/*"

  BlitzfilterApiPostWatchlistItemRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref BlitzfilterApi
      RouteKey: "POST /api/v1/watchlist"
      AuthorizationType: JWT
      AuthorizerId: !Ref BlitzfilterApiCognitoAuthorizer
      Target: !Sub "integrations/${BlitzfilterApiPostWatchlistItemLambdaIntegration}"
  BlitzfilterApiPostWatchlistItemLambdaIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref BlitzfilterApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${BlitzfilterApiPostWatchlistItemLambda}"
      PayloadFormatVersion: "2.0"
  BlitzfilterApiPostWatchlistItemRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "blitzfilter-api-post-watchlist-item-role-${StageName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:BatchGetItem
                  - dynamodb:Query
                  - dynamodb:PutItem
                Resource: !GetAtt TableOne.Arn
  BlitzfilterApiPostWatchlistItemLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "blitzfilter-api-post-watchlist-item-${StageName}"
      Runtime: provided.al2023
      Handler: lib.handler
      Role: !GetAtt BlitzfilterApiPostWatchlistItemRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub "item-api-watchlist-post-${StageName}.zip"
      MemorySize: 512
      Timeout: 10
