    Properties:
      RoleName: !Sub "product-enrichment-asg-scale-up-role-${StageName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ScaleUpASG
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - autoscaling:UpdateAutoScalingGroup
                  - autoscaling:DescribeAutoScalingGroups
                Resource: !Sub "arn:aws:autoscaling:${AWS::Region}:${AWS::AccountId}:autoScalingGroup:*:autoScalingGroupName/${ProductEnrichmentASG}"
        - PolicyName: OpenSearchAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - es:*
                Resource: !Sub "arn:aws:es:${AWS::Region}:${AWS::AccountId}:domain/application-${StageName}/*"
  ProductEnrichmentScaleUpLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "product-enrichment-asg-scale-up-${StageName}"
      Runtime: provided.al2023
      Handler: lib.handler
      Role: !GetAtt ProductEnrichmentScaleUpRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub "product-enrichment-asg-scale-up-${StageName}-${CommitSHA}.zip"
      MemorySize: 128
      Timeout: 60
      EphemeralStorage:
        Size: 512
      Environment:
        Variables:
          PRODUCT_ENRICHMENT_ASG_NAME: !Ref ProductEnrichmentASG
          OPENSEARCH_DOMAIN_ENDPOINT_URL: !Sub "https://${BlitzfilterOpenSearchDomain.DomainEndpoint}"
  ProductEnrichmentScaleUpStartSchedule:
    Type: AWS::Events::Rule
    Properties:
      ScheduleExpression: "cron(0 1 * * ? *)" # every day at 01:00 UTC
      Targets:
        - Arn: !GetAtt ProductEnrichmentScaleUpLambda.Arn
          Id: "ProductEnrichmentScaleUpStartSchedule"
          RetryPolicy:
            MaximumRetryAttempts: 5
            MaximumEventAgeInSeconds: 3600
          DeadLetterConfig:
            Arn: !GetAtt ProductEnrichmentDlq.Arn
  ProductEnrichmentScaleUpStartSchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ProductEnrichmentScaleUpLambda
      Action: "lambda:InvokeFunction"
      Principal: "events.amazonaws.com"
      SourceArn: !GetAtt ProductEnrichmentScaleUpStartSchedule.Arn
  ProductEnrichmentScaleUpLambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${StageName}-product-enrichment-asg-scale-up-lambda-errors"
      AlarmDescription: "Alarm when product-enrichment-asg-scale-up Lambda has errors"
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref ProductEnrichmentScaleUpLambda
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmNotificationTopic

