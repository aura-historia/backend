  ProductEnrichmentScaleDownStartSchedule:
    Type: AWS::Events::Rule
    Properties:
      ScheduleExpression: "cron(0 3 * * ? *)" # every day at 03:00 UTC
      Targets:
        - Arn: !GetAtt ProductEnrichmentScaleDownLambda.Arn
          Id: "ProductEnrichmentScaleDownStartSchedule"
          RetryPolicy:
            MaximumRetryAttempts: 5
            MaximumEventAgeInSeconds: 3600
          DeadLetterConfig:
            Arn: !GetAtt ProductEnrichmentDlq.Arn
  ProductEnrichmentScaleDownStartSchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ProductEnrichmentScaleDownLambda
      Action: "lambda:InvokeFunction"
      Principal: "events.amazonaws.com"
      SourceArn: !GetAtt ProductEnrichmentScaleDownStartSchedule.Arn
  ProductEnrichmentScaleDownLambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${StageName}-product-enrichment-asg-scale-down-lambda-errors"
      AlarmDescription: "Alarm when product-enrichment-asg-scale-down Lambda has errors"
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref ProductEnrichmentScaleDownLambda
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmNotificationTopic

