  ApiGatewayEndpointUrl:
    Value: !Sub "https://${BlitzfilterApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}"
  OpensearchDomainEndpointUrl:
    Value: !Sub "https://${BlitzfilterOpenSearchDomain.DomainEndpoint}"
  OpensearchDomainName:
    Value: !Ref BlitzfilterOpenSearchDomain
  DynamodbTable1Name:
