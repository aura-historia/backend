AWSTemplateFormatVersion: "2010-09-09"
Description: Full application stack for the Blitzfilter Backend

Parameters:
  Stage:
    Type: String
    Description: "Type of the stage"
    AllowedValues:
      - dev
      - staging
      - prod
  StageName:
    Type: String
    Description: "Unique name of the stage"
  ArtifactBucket:
    Type: String
    Description: "S3 bucket containing Lambda deployment zips"
  ResourceBucket:
    Type: String
    Description: "S3 bucket containing resources"
  MailTemplateBucket:
    Type: String
    Description: "S3 bucket containing mail-templates"
  CommitSHA:
    Type: String
  Ec2KeyPairName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: For EC2 SSH-Access

Mappings:
  SendMailQueueMap:
    MaximumBatchingWindowInSeconds:
      dev: 1
      staging: 1
      prod: 5
  ItemIngestEventsDynamoDbQueueMap:
    MaximumBatchingWindowInSeconds:
      dev: 1
      staging: 1
      prod: 10
  ItemMaterializeDynamoDbQueuesMap:
    MaximumBatchingWindowInSeconds:
      dev: 1
      staging: 1
      prod: 10
  ItemMaterializeOpenSearchQueuesMap:
    MaximumBatchingWindowInSeconds:
      dev: 1
      staging: 1
      prod: 300
  IItemUpdateNotifyUserQueueMap:
    MaximumBatchingWindowInSeconds:
      dev: 1
      staging: 1
      prod: 5

Resources:
  # SNS Topic for CloudWatch Alarms
  AlarmNotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "cloudwatch-alarms-${StageName}"
      DisplayName: "CloudWatch Alarms for Blitzfilter Backend"

  BlitzfilterUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "blitzfilter-userpool-${StageName}"
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 7
      UserPoolAddOns:
        AdvancedSecurityMode: ENFORCED
      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE
      EmailVerificationSubject: "Verify your email"
      EmailVerificationMessage: "Your verification code is {####}"
      Schema:
        - Name: email
          AttributeDataType: String
          Mutable: false
          Required: true
      LambdaConfig:
        PostConfirmation: !GetAtt PostConfirmationLambda.Arn

  PostConfirmationLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "blitzfilter-cognito-post-confirmation-role-${StageName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                Resource: !GetAtt TableOne.Arn
  PostConfirmationLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "blitzfilter-cognito-post-confirmation-${StageName}"
      Runtime: provided.al2023
      Handler: lib.handler
      Role: !GetAtt PostConfirmationLambdaRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub "cognito-post-confirmation-${StageName}-${CommitSHA}.zip"
      MemorySize: 256
      Timeout: 5
      EphemeralStorage:
        Size: 512
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME: !Ref TableOne
  AllowCognitoInvokePostConfirmationLambda:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt PostConfirmationLambda.Arn
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt BlitzfilterUserPool.Arn

  BlitzfilterUserPoolClientPublic:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref BlitzfilterUserPool
      ClientName: !Sub "blitzfilter-client-${StageName}"
      GenerateSecret: false # PKCE replaces client secret
      PreventUserExistenceErrors: ENABLED
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      SupportedIdentityProviders:
        - COGNITO
      CallbackURLs:
        - http://localhost:3000/
        - https://aura-historia.com/
      LogoutURLs:
        - http://localhost:3000/
        - https://aura-historia.com/
      EnableTokenRevocation: true
      AccessTokenValidity: 1 # hours
      IdTokenValidity: 1 # hours
      RefreshTokenValidity: 30 # days
      ReadAttributes:
        - email
        - email_verified
  BlitzfilterUserPoolClientAdmin:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref BlitzfilterUserPool
      ClientName: !Sub "blitzfilter-admin-${StageName}"
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      AllowedOAuthFlowsUserPoolClient: false
      ExplicitAuthFlows:
        - ALLOW_ADMIN_USER_PASSWORD_AUTH
      EnableTokenRevocation: true
      AccessTokenValidity: 1 # hours
      IdTokenValidity: 1 # hours
      RefreshTokenValidity: 30 # days
      ReadAttributes:
        - email
      WriteAttributes:
        - email
  BlitzfilterUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub "blitzfilter-${StageName}" # hosted UI domain
      UserPoolId: !Ref BlitzfilterUserPool

  TableOne:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "table_1-${StageName}"
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: lsi1_sk
          AttributeType: S
        - AttributeName: gsi1_pk
          AttributeType: S
        - AttributeName: gsi1_sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      LocalSecondaryIndexes:
        - IndexName: lsi1
          KeySchema:
            - AttributeName: pk
              KeyType: HASH
            - AttributeName: lsi1_sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      GlobalSecondaryIndexes:
        - IndexName: gsi1
          KeySchema:
            - AttributeName: gsi1_pk
              KeyType: HASH
            - AttributeName: gsi1_sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      BillingMode: PAY_PER_REQUEST
      TableClass: STANDARD
      StreamSpecification:
        StreamViewType: NEW_IMAGE
  TableOneThrottledRequestsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${StageName}-dynamodb-throttled-requests"
      AlarmDescription: "Alarm when DynamoDB table has throttled requests"
      MetricName: UserErrors
      Namespace: AWS/DynamoDB
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: TableName
          Value: !Ref TableOne
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmNotificationTopic

  BlitzfilterOpenSearchDomain:
    Type: AWS::OpenSearchService::Domain
    Properties:
      DomainName: !Sub "application-${StageName}"
      EngineVersion: "OpenSearch_3.1"
      ClusterConfig:
        InstanceType: t3.small.search
        InstanceCount: 1
        ZoneAwarenessEnabled: false
      EBSOptions:
        EBSEnabled: true
        VolumeSize: 10
        VolumeType: gp3
      AccessPolicies:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: "es:*"
            Resource: !Sub "arn:aws:es:${AWS::Region}:${AWS::AccountId}:domain/application-${StageName}/*"
  OpenSearchClusterStatusRedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${StageName}-opensearch-cluster-red"
      AlarmDescription: "Alarm when OpenSearch cluster status is RED"
      MetricName: ClusterStatus.red
      Namespace: AWS/ES
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: DomainName
          Value: !Ref BlitzfilterOpenSearchDomain
        - Name: ClientId
          Value: !Ref AWS::AccountId
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmNotificationTopic
  OpenSearchClusterStatusYellowAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${StageName}-opensearch-cluster-yellow"
      AlarmDescription: "Alarm when OpenSearch cluster status is YELLOW"
      MetricName: ClusterStatus.yellow
      Namespace: AWS/ES
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: DomainName
          Value: !Ref BlitzfilterOpenSearchDomain
        - Name: ClientId
          Value: !Ref AWS::AccountId
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmNotificationTopic
  OpenSearchFreeStorageSpaceAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${StageName}-opensearch-low-storage"
      AlarmDescription: "Alarm when OpenSearch has low free storage space"
      MetricName: FreeStorageSpace
      Namespace: AWS/ES
      Statistic: Minimum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 2000
      ComparisonOperator: LessThanOrEqualToThreshold
      Dimensions:
        - Name: DomainName
          Value: !Ref BlitzfilterOpenSearchDomain
        - Name: ClientId
          Value: !Ref AWS::AccountId
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmNotificationTopic
  OpenSearchCPUUtilizationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${StageName}-opensearch-high-cpu"
      AlarmDescription: "Alarm when OpenSearch CPU utilization is high"
      MetricName: CPUUtilization
      Namespace: AWS/ES
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 80
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: DomainName
          Value: !Ref BlitzfilterOpenSearchDomain
        - Name: ClientId
          Value: !Ref AWS::AccountId
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmNotificationTopic
  OpenSearchJVMMemoryPressureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${StageName}-opensearch-high-jvm-memory"
      AlarmDescription: "Alarm when OpenSearch JVM memory pressure is high"
      MetricName: JVMMemoryPressure
      Namespace: AWS/ES
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 85
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: DomainName
          Value: !Ref BlitzfilterOpenSearchDomain
        - Name: ClientId
          Value: !Ref AWS::AccountId
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmNotificationTopic

  DynamoDbEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub "dynamodb-event-bus-${StageName}"
  PipeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "dynamodb-to-eventbridge-pipe-role-${StageName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: pipes.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PipePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:DescribeStream
                  - dynamodb:GetRecords
                  - dynamodb:GetShardIterator
                  - dynamodb:ListStreams
                Resource: "*"
              - Effect: Allow
                Action:
                  - events:PutEvents
                Resource: !GetAtt DynamoDbEventBus.Arn
  TableOneStreamToEventBusPipe:
    Type: AWS::Pipes::Pipe
    Properties:
      Name: !Sub "tableone-stream-to-eventbus-${StageName}"
      RoleArn: !GetAtt PipeRole.Arn
      Source: !GetAtt TableOne.StreamArn
      SourceParameters:
        DynamoDBStreamParameters:
          StartingPosition: LATEST
          BatchSize: 10
          MaximumBatchingWindowInSeconds: 1
        FilterCriteria:
          Filters:
            - Pattern: |
                {
                  "eventName": ["INSERT"],
                  "dynamodb": {
                    "NewImage": {
                      "sk": {
                        "S": [{ "prefix": "item#event#" }]
                      }
                    }
                  }
                }
      Target: !GetAtt DynamoDbEventBus.Arn
      TargetParameters:
        EventBridgeEventBusParameters:
          DetailType: "DynamoDBStreamRecord"
          Source: !Ref TableOne

  DynamoDbEventBusQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref ItemMaterializeDynamoDbNewQ
        - !Ref ItemMaterializeDynamoDbUpdateQ
        - !Ref ItemMaterializeOpenSearchNewQ
        - !Ref ItemMaterializeOpenSearchUpdateQ
        - !Ref ItemUpdateNotifyUserQ
        - !Ref NightlyEnrichmentQ
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource:
              - !GetAtt ItemMaterializeDynamoDbNewQ.Arn
              - !GetAtt ItemMaterializeDynamoDbUpdateQ.Arn
              - !GetAtt ItemMaterializeOpenSearchNewQ.Arn
              - !GetAtt ItemMaterializeOpenSearchUpdateQ.Arn
              - !GetAtt ItemUpdateNotifyUserQ.Arn
              - !GetAtt NightlyEnrichmentQ.Arn

  BlitzfilterApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "blitzfilter-api-${StageName}"
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - "http://localhost:3000"
          - "https://aura-historia.com"
          - "https://dev.aura-historia.com"
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        AllowHeaders:
          - "*"
  BlitzfilterApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      StageName: !Sub "${StageName}"
      ApiId: !Ref BlitzfilterApi
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 20
  BlitzfilterApiCognitoAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref BlitzfilterApi
      Name: CognitoJwtAuthorizer
      AuthorizerType: JWT
      IdentitySource:
        - "$request.header.Authorization"
      JwtConfiguration:
        Issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${BlitzfilterUserPool}"
        Audience:
          - !Ref BlitzfilterUserPoolClientPublic
          - !Ref BlitzfilterUserPoolClientAdmin
  BlitzfilterApi5XXErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${StageName}-api-5xx-errors"
      AlarmDescription: "Alarm when API Gateway returns 5XX errors"
      MetricName: 5XXError
      Namespace: AWS/ApiGateway
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: ApiId
          Value: !Ref BlitzfilterApi
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmNotificationTopic
  BlitzfilterApi4XXErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${StageName}-api-4xx-errors"
      AlarmDescription: "Alarm when API Gateway returns high 4XX errors"
      MetricName: 4XXError
      Namespace: AWS/ApiGateway
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 50
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: ApiId
          Value: !Ref BlitzfilterApi
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmNotificationTopic

  BlitzfilterApiGetItemRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref BlitzfilterApi
      RouteKey: "GET /api/v1/items/{shopId}/{shopsItemId}"
      Target: !Sub "integrations/${BlitzfilterApiGetItemLambdaIntegration}"
  BlitzfilterApiGetItemLambdaIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref BlitzfilterApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${BlitzfilterApiGetItemLambda}"
      PayloadFormatVersion: "2.0"
  BlitzfilterApiGetItemRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "blitzfilter-api-get-item-role-${StageName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:BatchGetItem
                  - dynamodb:Query
                Resource: !GetAtt TableOne.Arn
  BlitzfilterApiGetItemLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "blitzfilter-api-get-item-${StageName}"
      Runtime: provided.al2023
      Handler: lib.handler
      Role: !GetAtt BlitzfilterApiGetItemRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub "item-api-get-item-${StageName}-${CommitSHA}.zip"
      MemorySize: 512
      Timeout: 10
      EphemeralStorage:
        Size: 512
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME: !Ref TableOne
  BlitzfilterApiGetItemLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref BlitzfilterApiGetItemLambda
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${BlitzfilterApi}/*/*/api/v1/items/*/*"
  BlitzfilterApiGetItemLambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${StageName}-get-item-lambda-errors"
      AlarmDescription: "Alarm when get-item Lambda has errors"
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref BlitzfilterApiGetItemLambda
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmNotificationTopic
  BlitzfilterApiGetItemLambdaThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${StageName}-get-item-lambda-throttles"
      AlarmDescription: "Alarm when get-item Lambda is throttled"
      MetricName: Throttles
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref BlitzfilterApiGetItemLambda
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmNotificationTopic

  BlitzfilterApiPutItemsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref BlitzfilterApi
      RouteKey: "PUT /api/v1/items"
      Target: !Sub "integrations/${BlitzfilterApiPutItemsLambdaIntegration}"
  BlitzfilterApiPutItemsLambdaIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref BlitzfilterApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${BlitzfilterApiPutItemsLambda}"
      PayloadFormatVersion: "2.0"
  BlitzfilterApiPutItemsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "blitzfilter-api-put-items-role-${StageName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:BatchGetItem
                  - dynamodb:Query
                Resource: !GetAtt TableOne.Arn
        - PolicyName: SQSSendMessage
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: !GetAtt ItemIngestEventsDynamoDbQ.Arn
  BlitzfilterApiPutItemsLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "blitzfilter-api-put-items-${StageName}"
      Runtime: provided.al2023
      Handler: lib.handler
      Role: !GetAtt BlitzfilterApiPutItemsRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub "item-api-put-items-${StageName}-${CommitSHA}.zip"
      MemorySize: 1024
      Timeout: 60
      EphemeralStorage:
        Size: 512
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME: !Ref TableOne
          INGEST_ITEM_EVENTS_QUEUE_URL: !Ref ItemIngestEventsDynamoDbQ
  BlitzfilterApiPutItemsLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref BlitzfilterApiPutItemsLambda
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${BlitzfilterApi}/*/*/api/v1/items"
  BlitzfilterApiPutItemsLambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${StageName}-put-items-lambda-errors"
      AlarmDescription: "Alarm when put-items Lambda has errors"
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref BlitzfilterApiPutItemsLambda
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmNotificationTopic
  BlitzfilterApiPutItemsLambdaThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${StageName}-put-items-lambda-throttles"
      AlarmDescription: "Alarm when put-items Lambda is throttled"
      MetricName: Throttles
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref BlitzfilterApiPutItemsLambda
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmNotificationTopic

  BlitzfilterApiComplexSearchRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref BlitzfilterApi
      RouteKey: "POST /api/v1/items/search"
      Target: !Sub "integrations/${BlitzfilterApiComplexSearchLambdaIntegration}"
  BlitzfilterApiComplexSearchLambdaIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref BlitzfilterApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${BlitzfilterApiComplexSearchLambda}"
      PayloadFormatVersion: "2.0"
  BlitzfilterApiComplexSearchRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "blitzfilter-api-complex-search-role-${StageName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: OpenSearchReadOnly
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - es:Describe*
                  - es:List*
                  - es:ESHttpGet
                  - es:ESHttpHead
                  - es:ESHttpPost
                Resource: !Sub "${BlitzfilterOpenSearchDomain.Arn}/*"
  BlitzfilterApiComplexSearchLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "blitzfilter-api-complex-search-${StageName}"
      Runtime: provided.al2023
      Handler: lib.handler
      Role: !GetAtt BlitzfilterApiComplexSearchRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub "item-api-complex-search-${StageName}-${CommitSHA}.zip"
      MemorySize: 512
      Timeout: 10
      EphemeralStorage:
        Size: 512
      Environment:
        Variables:
          OPENSEARCH_DOMAIN_ENDPOINT_URL: !Sub "https://${BlitzfilterOpenSearchDomain.DomainEndpoint}"
  BlitzfilterApiComplexSearchLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref BlitzfilterApiComplexSearchLambda
      Principal: apigateway.amazonaws.com
