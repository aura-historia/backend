    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "ddb-item-mat-ddb-update-${StageName}"
      EventBusName: !Ref DynamoDbEventBus
      EventPattern:
        source:
          - !Ref TableOne
        detail-type:
