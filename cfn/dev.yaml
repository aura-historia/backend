  ProductMaterializeDynamodbUpdateQueueUrl:
    Value: !Ref ProductMaterializeDynamoDbUpdateQ
  ProductMaterializeDynamodbUpdateDeadLetterQueueUrl:
    Value: !Ref ProductMaterializeDynamoDbUpdateDlq

  ProductMaterializeOpensearchNewQueueUrl:
    Value: !Ref ProductMaterializeOpenSearchNewQ
  ProductMaterializeOpensearchNewDeadLetterQueueUrl:
