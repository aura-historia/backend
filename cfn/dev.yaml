    Properties:
      FunctionName: !Ref ProductPipelineEmbedTextLambda
      EventSourceArn: !GetAtt ProductPipelineEmbedTextQ.Arn
      Enabled: true
      BatchSize: 50
      MaximumBatchingWindowInSeconds: 60
      FunctionResponseTypes:
        - ReportBatchItemFailures

  FxRateSyncRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: "fxrate-lambda-role-dev"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                Resource:
                  - !GetAtt TableOne.Arn
  FxRateSyncLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: "fxrate-lambda-dev"
      Runtime: provided.al2023
      Handler: lib.handler
      Role: !GetAtt FxRateSyncRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub "fxrate-lambda-dev-${CommitSHA}.zip"
      MemorySize: 128
      Timeout: 10
      # ReservedConcurrentExecutions: 1
      EphemeralStorage:
        Size: 512
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME: !Ref TableOne
          FXRATES_API_TOKEN: "{{resolve:ssm:/fxratesapi/prod/api-token}}"
  FxRateSyncStartSchedule:
    Type: AWS::Events::Rule
    Properties:
      ScheduleExpression: "cron(0 6,18 * * ? *)" # 6 AM/PM
      Targets:
        - Arn: !GetAtt FxRateSyncLambda.Arn
          Id: "FxRateSyncStartSchedule"
          RetryPolicy:
            MaximumRetryAttempts: 3
            MaximumEventAgeInSeconds: 3600
  FxRateSyncStartSchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref FxRateSyncLambda
      Action: "lambda:InvokeFunction"
      Principal: "events.amazonaws.com"
      SourceArn: !GetAtt FxRateSyncStartSchedule.Arn

  # ---------------------------------------------------------------------------
  # Stripe integration
  # Stripe events are delivered through an AWS EventBridge Partner-Event-Bus
  # (created manually in the AWS Console, see
  # https://docs.stripe.com/event-destinations/eventbridge). The rule below
  # forwards the supported `customer.subscription.*` events to the Lambda.
  # ---------------------------------------------------------------------------
  StripeLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: "stripe-lambda-role-dev"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                Resource:
                  - !GetAtt TableOne.Arn
                  - !Sub "${TableOne.Arn}/index/*"
  StripeLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: "stripe-lambda-dev"
      Runtime: provided.al2023
      Handler: lib.handler
      Role: !GetAtt StripeLambdaRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub "stripe-lambda-dev-${CommitSHA}.zip"
      MemorySize: 128
      Timeout: 7
      # ReservedConcurrentExecutions: 1
      EphemeralStorage:
        Size: 512
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME: !Ref TableOne
          STRIPE_PRO_PRODUCT_ID: !Ref StripeProProductId
          STRIPE_ULTIMATE_PRODUCT_ID: !Ref StripeUltimateProductId
  StripeEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: "stripe-subscription-events-dev"
      EventBusName: !Ref StripeEventBusName
      EventPattern:
        source:
          - prefix: "aws.partner/stripe.com"
        detail:
          type:
            - "customer.subscription.created"
            - "customer.subscription.updated"
            - "customer.subscription.deleted"
          livemode:
            - false
      Targets:
        - Id: StripeLambda
          Arn: !GetAtt StripeLambda.Arn
  AllowEventBridgeInvokeStripeLambda:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref StripeLambda
      Principal: events.amazonaws.com
      SourceArn: !GetAtt StripeEventRule.Arn

  # ---------------------------------------------------------------------------
  # Shopify integration
  # Shopify product webhooks are delivered through EventBridge and forwarded to
  # the Lambda for partner-shop product synchronization.
  # ---------------------------------------------------------------------------
  ShopifyLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: "shopify-lambda-role-dev"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:BatchGetItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:GetItem
                  - dynamodb:Query
                Resource:
                  - !GetAtt TableOne.Arn
                  - !Sub "${TableOne.Arn}/index/*"
        - PolicyName: SQSPollerAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                  - sqs:GetQueueUrl
                Resource: !GetAtt ShopifyLambdaQ.Arn
  ShopifyLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: "shopify-lambda-dev"
      Runtime: provided.al2023
      Handler: lib.handler
      Role: !GetAtt ShopifyLambdaRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub "shopify-lambda-dev-${CommitSHA}.zip"
      MemorySize: 128
      Timeout: 15
      EphemeralStorage:
        Size: 512
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME: !Ref TableOne
          OPENSEARCH_ENDPOINT_URL: !Ref OpenSearchEndpointUrl
          OPENSEARCH_USERNAME: "{{resolve:ssm:/opensearch/dev/username}}"
          OPENSEARCH_PASSWORD: "{{resolve:ssm:/opensearch/dev/password}}"
          GEMINI_API_KEY: !Sub "{{resolve:ssm:/secrets/dev/gemini-api-key}}"
          GOOGLE_GEOCODING_API_KEY: !Sub "{{resolve:ssm:/secrets/dev/google-geocoding-api-key}}"
  ShopifyLambdaMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      FunctionName: !Ref ShopifyLambda
      EventSourceArn: !GetAtt ShopifyLambdaQ.Arn
      Enabled: true
      BatchSize: 100
      MaximumBatchingWindowInSeconds: 10
      FunctionResponseTypes:
        - ReportBatchItemFailures
  ShopifyEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: "shopify-product-events-dev"
      EventBusName: !Ref ShopifyEventBusName
      EventPattern:
        source:
          - prefix: "aws.partner/shopify.com"
        detail:
          metadata:
            X-Shopify-Topic:
              - "products/create"
              - "products/update"
              - "products/delete"
      Targets:
        - Id: ShopifyLambdaQ
          Arn: !GetAtt ShopifyLambdaQ.Arn

