  ProductPipelineInitInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: "product-pipeline-init-profile-dev"
      Roles:
        - !Ref ProductPipelineInitRole
  ProductPipelineInitLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: "product-pipeline-init-template-dev"
      LaunchTemplateData:
        KeyName: !Ref Ec2KeyPairName
        IamInstanceProfile:
          Name: !Ref ProductPipelineInitInstanceProfile
        InstanceType: c7i.large
        ImageId: ami-004e960cde33f9146
        SecurityGroupIds: [!Ref ProductPipelineSecurityGroup]
        BlockDeviceMappings:
          - DeviceName: /dev/sda1
            Ebs:
              VolumeSize: 50
              VolumeType: gp3
              DeleteOnTermination: true
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: "product-pipeline-init-dev"
              - Key: Fleet
                Value: product-pipeline-init
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -euxo pipefail
            sudo -i
            export STAGE="dev"
            export STAGE_NAME=dev
            export CommitSHA="${CommitSHA}"
            export ARTIFACT_BUCKET="${ArtifactBucket}"
            export SOURCE_QUEUE_URL="${ProductPipelineInitQ}"
            export TARGET_QUEUE_URL="${ProductPipelineTranslateQ}"
            # Install awscli
            apt -y install unzip
            curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
            unzip awscliv2.zip
            sudo ./aws/install
            # Install cloudwatch-agent
            sudo wget https://s3.amazonaws.com/amazoncloudwatch-agent/debian/amd64/latest/amazon-cloudwatch-agent.deb
            sudo dpkg -i -E ./amazon-cloudwatch-agent.deb
            # Download and install binary
            sudo aws s3 cp "s3://${ArtifactBucket}/dev/${CommitSHA}/product-pipeline-init" /opt/product-pipeline-init --region eu-central-1
            sudo chmod +x /opt/product-pipeline-init
            # Configure CloudWatchAgent
            cat << EOF | sudo tee /opt/aws/amazon-cloudwatch-agent.json > /dev/null
            {
              "metrics": {
                "namespace": "CWAgent",
                "metrics_collected": {
                  "cpu": {
                    "measurement": [
                      {
                        "name": "cpu_usage_idle",
                        "rename": "CPU_IDLE",
                        "unit": "Percent"
                      },
                      {
                        "name": "cpu_usage_iowait",
                        "rename": "CPU_IOWAIT",
                        "unit": "Percent"
                      },
                      "cpu_time_guest"
                    ],
                    "metrics_collection_interval": 60,
                    "resources": ["*"],
                    "totalcpu": false
                  },
                  "disk": {
                    "measurement": [
                      {
                        "name": "used_percent",
                        "rename": "DISK_USED_PERCENT",
                        "unit": "Percent"
                      },
                      "used",
                      "free"
                    ],
                    "metrics_collection_interval": 60,
                    "resources": ["*"]
                  },
                  "diskio": {
                    "measurement": [
                      "io_time",
                      "read_bytes",
                      "write_bytes",
                      "reads",
                      "writes"
                    ],
                    "metrics_collection_interval": 60,
                    "resources": ["*"]
                  },
                  "mem": {
                    "measurement": [
                      {
                        "name": "mem_used_percent",
                        "rename": "MEM_USED_PERCENT",
                        "unit": "Percent"
                      },
                      "mem_used",
                      "mem_available"
                    ],
                    "metrics_collection_interval": 60
                  },
                  "netstat": {
                    "measurement": [
                      "tcp_established",
                      "tcp_time_wait"
                    ],
                    "metrics_collection_interval": 60
                  },
                  "net": {
                    "measurement": [
                      "bytes_sent",
                      "bytes_recv",
                      "packets_sent",
                      "packets_recv"
                    ],
                    "metrics_collection_interval": 60,
                    "resources": ["*"]
                  }
                }
              },
              "logs": {
                "logs_collected": {
                  "files": {
                    "collect_list": [
                      {
                        "file_path": "/var/log/product-pipeline-init.log",
                        "log_group_name": "/aws/ec2/$STAGE-product-pipeline-init",
                        "log_stream_name": "{instance_id}",
                        "timestamp_format": "%Y-%m-%dT%H:%M:%S.%f%z",
                        "timezone": "UTC",
                        "multi_line_start_pattern": "^{"
                      }
                    ]
                  }
                }
              }
            }
            EOF
            amazon-cloudwatch-agent-ctl -a fetch-config -m ec2 -c file:/opt/aws/amazon-cloudwatch-agent.json -s
            LOG_PATH="/var/log/product-pipeline-init.log"
            sudo touch "$LOG_PATH"
            sudo chmod 666 "$LOG_PATH"
            # Run binary
            echo "[$(date)] Running product-pipeline-init..." | tee -a "$LOG_PATH"
            /opt/product-pipeline-init >> "$LOG_PATH" 2>&1
            EXIT_CODE=$?
            echo "[$(date)] Job finished with code $EXIT_CODE" | tee -a "$LOG_PATH"
            sleep 5
            aws autoscaling terminate-instance-in-auto-scaling-group \
              --instance-id $(ec2metadata --instance-id) \
              --should-decrement-desired-capacity
            exit $EXIT_CODE
