  CognitoUserPoolClientPublicId:
    Value: !Ref PrimaryUserPoolClientPublic
  CognitoUserPoolClientAdminId:
    Value: !Ref PrimaryUserPoolClientAdmin
  ApiGatewayEndpointUrl:
    Value: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com/dev"
  OpensearchEndpointUrl:
    Value: !Ref OpenSearchEndpointUrl
  OpensearchDomainName:
    Value: "aura-historia-dev"
  DynamodbTable1Name:
    Value: !Ref TableOne

  SendMailQueueUrl:
    Value: !Ref SendMailQ
  SendMailDeadLetterQueueUrl:
    Value: !Ref SendMailDlq

  ProductIngestEventsDynamodbQueueUrl:
