      Targets:
        - Id: ProductMaterializeOpenSearchUpdateQ
          Arn: !GetAtt ProductMaterializeOpenSearchUpdateQ.Arn
  DynamoDbProductEventRecordUpdatedNotifyUserEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "ddb-product-update-notify-user-dev"
      EventBusName: !Ref DynamoDbEventBus
      EventPattern:
        source:
          - !Ref TableOne
        detail-type:
          - "DynamoDBStreamRecord"
        detail:
          eventName:
            - "INSERT"
          dynamodb:
            NewImage:
              event_type:
                S:
                  - prefix: "PRICE_"
                  - prefix: "STATE_"
      Targets:
        - Id: ProductUpdateNotifyUserQ
          Arn: !GetAtt ProductUpdateNotifyUserQ.Arn
  DynamoDbProductEventRecordCreatedProductEnrichmentEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "ddb-product-enrichment-dev"
      EventBusName: !Ref DynamoDbEventBus
      EventPattern:
        source:
          - !Ref TableOne
        detail-type:
          - "DynamoDBStreamRecord"
        detail:
          eventName:
            - "INSERT"
          dynamodb:
            NewImage:
              event_type:
                S:
                  - "CREATED"
      Targets:
        - Id: ProductEnrichmentQ
          Arn: !GetAtt ProductEnrichmentQ.Arn
  DynamoDbUserUpdatedFanoutWatchlistUpdateEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "ddb-user-update-fanout-watchlist-dev"
      EventBusName: !Ref DynamoDbEventBus
      EventPattern:
        source:
          - !Ref TableOne
        detail-type:
          - "DynamoDBStreamRecord"
        detail:
          eventName:
            - "MODIFY"
          dynamodb:
            NewImage:
              sk:
                S:
                  - "user#details"
      Targets:
        - Id: UserLambdaFanoutUpdateWatchlistQ
          Arn: !GetAtt UserLambdaFanoutUpdateWatchlistQ.Arn

  ProductEnrichmentVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub "product-enrichment-vpc-dev"
  ProductEnrichmentInternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "product-enrichment-igw-dev"
  ProductEnrichmentVpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref ProductEnrichmentInternetGateway
      VpcId: !Ref ProductEnrichmentVpc
  ProductEnrichmentPublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref ProductEnrichmentVpc
      Tags:
        - Key: Name
          Value: !Sub "product-enrichment-public-rt-dev"
  ProductEnrichmentPublicRoute:
    Type: AWS::EC2::Route
    DependsOn: ProductEnrichmentVpcGatewayAttachment
    Properties:
      RouteTableId: !Ref ProductEnrichmentPublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref ProductEnrichmentInternetGateway
  ProductEnrichmentSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref ProductEnrichmentVpc
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub "product-enrichment-subnet-a-dev"
  ProductEnrichmentSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref ProductEnrichmentVpc
      CidrBlock: 10.0.2.0/24
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub "product-enrichment-subnet-b-dev"
  ProductEnrichmentSubnetRouteAssocA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref ProductEnrichmentSubnetA
      RouteTableId: !Ref ProductEnrichmentPublicRouteTable
  ProductEnrichmentSubnetRouteAssocB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref ProductEnrichmentSubnetB
      RouteTableId: !Ref ProductEnrichmentPublicRouteTable
  ProductEnrichmentSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow SSH and internal comms
      VpcId: !Ref ProductEnrichmentVpc
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub "product-enrichment-sg-dev"

  ProductEnrichmentDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "product-enrichment-dlq-dev"
      MessageRetentionPeriod: 1209600
  ProductEnrichmentQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "product-enrichment-queue-dev"
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ProductEnrichmentDlq.Arn
        maxReceiveCount: 3
      VisibilityTimeout: 360
  ProductEnrichmentRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "product-enrichment-role-dev"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
          - Effect: Allow
            Principal:
              Service: spot.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
        - arn:aws:iam::aws:policy/AmazonS3ReadOnlyAccess
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: AllowTerminateInASG
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: autoscaling:TerminateInstanceInAutoScalingGroup
                Resource: "*"
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                  - dynamodb:UpdateItem
                  - dynamodb:BatchGetItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:TransactGetItems
                  - dynamodb:TransactWriteItems
                Resource:
                  - !GetAtt TableOne.Arn
                  - !Sub "${TableOne.Arn}/index/*"
        - PolicyName: OpenSearchAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - es:*
                Resource: !Sub "arn:aws:es:${AWS::Region}:${AWS::AccountId}:domain/application-dev/*"
        - PolicyName: SQSPollerAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:DeleteMessageBatch
                  - sqs:GetQueueAttributes
                  - sqs:GetQueueUrl
                Resource: !GetAtt ProductEnrichmentQ.Arn
        - PolicyName: CloudWatchLogsCreate
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"
  ProductEnrichmentInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub "product-enrichment-profile-dev"
      Roles:
        - !Ref ProductEnrichmentRole
  ProductEnrichmentLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub "product-enrichment-template-dev"
      LaunchTemplateData:
        KeyName: !Ref Ec2KeyPairName
        IamInstanceProfile:
          Name: !Ref ProductEnrichmentInstanceProfile
        InstanceType: g6.xlarge # Placeholder - ASG overrides this
        ImageId: ami-028f346ccb9f0f3c9 # custom eu-central-1 AMI with preinstalled deps and models based on ami-032fa3abdbb7e3a12 (Deep Learning OSS Nvidia Driver AMI GPU PyTorch 2.8 (Ubuntu 24.04))
        SecurityGroupIds: [!Ref ProductEnrichmentSecurityGroup]
        BlockDeviceMappings:
          - DeviceName: /dev/sda1
            Ebs:
              VolumeSize: 100
              VolumeType: gp3
              DeleteOnTermination: true
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: !Sub "product-enrichment-dev"
              - Key: Fleet
                Value: product-enrichment
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -euxo pipefail
            sudo -i
            export STAGE="dev"
            export STAGE_NAME="dev"
            export COMMIT_SHA="${CommitSHA}"
            export RESOURCE_BUCKET="${ResourceBucket}"
            export ARTIFACT_BUCKET="${ArtifactBucket}"
            export ENRICHMENT_QUEUE_URL="${ProductEnrichmentQ}"
            export DYNAMODB_TABLE_NAME="${TableOne}"
            export OPENSEARCH_ENDPOINT_URL="${OpensearchEndpointUrl}"
            export OPENSEARCH_USERNAME="${OpenSearchUsername}"
            export OPENSEARCH_PASSWORD="${OpenSearchPassword}"
            export BAAI_BGE_M3_MODEL_DEVICE="cuda"
            aws s3 cp "s3://${ResourceBucket}/dev/${CommitSHA}/src/product-enrichment/user-data.sh" /tmp/user_data.sh --region eu-central-1
            source /tmp/user_data.sh
  ProductEnrichmentASG:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      VPCZoneIdentifier:
        - !Ref ProductEnrichmentSubnetA
        - !Ref ProductEnrichmentSubnetB
      MinSize: 0
      MaxSize: 3
      DesiredCapacity: 0 # Default zero, scale via EventBridge
      MixedInstancesPolicy:
        LaunchTemplate:
          LaunchTemplateSpecification:
            LaunchTemplateId: !Ref ProductEnrichmentLaunchTemplate
            Version: !GetAtt ProductEnrichmentLaunchTemplate.LatestVersionNumber
          Overrides:
            - InstanceType: g6.xlarge
            - InstanceType: g6.2xlarge
            - InstanceType: g5.xlarge
            - InstanceType: g5.2xlarge
        InstancesDistribution:
          OnDemandPercentageAboveBaseCapacity: 0
          SpotAllocationStrategy: price-capacity-optimized
      Tags:
        - Key: Name
          Value: !Sub "product-enrichment-dev"
          PropagateAtLaunch: true
      HealthCheckType: EC2
      HealthCheckGracePeriod: 120

  ProductEnrichmentScaleDownRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "product-enrichment-asg-scale-down-role-dev"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ScaleDownASG
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - autoscaling:UpdateAutoScalingGroup
                  - autoscaling:DescribeAutoScalingGroups
                Resource: !Sub "arn:aws:autoscaling:${AWS::Region}:${AWS::AccountId}:autoScalingGroup:*:autoScalingGroupName/${ProductEnrichmentASG}"
        - PolicyName: OpenSearchAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - es:*
                Resource: !Sub "arn:aws:es:${AWS::Region}:${AWS::AccountId}:domain/application-dev/*"
  ProductEnrichmentScaleDownLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "product-enrichment-asg-scale-down-dev"
      Runtime: provided.al2023
      Handler: lib.handler
      Role: !GetAtt ProductEnrichmentScaleDownRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub "product-enrichment-asg-scale-down-dev-${CommitSHA}.zip"
      MemorySize: 128
      Timeout: 60
      EphemeralStorage:
        Size: 512
      Environment:
        Variables:
          STAGE: "dev"
          PRODUCT_ENRICHMENT_ASG_NAME: !Ref ProductEnrichmentASG
          OPENSEARCH_ENDPOINT_URL: !Ref OpenSearchEndpointUrl
          OPENSEARCH_USERNAME: !Ref OpenSearchUsername
          OPENSEARCH_PASSWORD: !Ref OpenSearchPassword
  ProductEnrichmentScaleDownStartSchedule:
    Type: AWS::Events::Rule
    Properties:
      ScheduleExpression: "cron(0 3 * * ? *)" # every day at 03:00 UTC
      Targets:
        - Arn: !GetAtt ProductEnrichmentScaleDownLambda.Arn
          Id: "ProductEnrichmentScaleDownStartSchedule"
          RetryPolicy:
            MaximumRetryAttempts: 5
            MaximumEventAgeInSeconds: 3600
          DeadLetterConfig:
            Arn: !GetAtt ProductEnrichmentDlq.Arn
  ProductEnrichmentScaleDownStartSchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ProductEnrichmentScaleDownLambda
      Action: "lambda:InvokeFunction"
      Principal: "events.amazonaws.com"
      SourceArn: !GetAtt ProductEnrichmentScaleDownStartSchedule.Arn

  ProductEnrichmentScaleUpRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "product-enrichment-asg-scale-up-role-dev"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ScaleUpASG
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - autoscaling:UpdateAutoScalingGroup
                  - autoscaling:DescribeAutoScalingGroups
                Resource: !Sub "arn:aws:autoscaling:${AWS::Region}:${AWS::AccountId}:autoScalingGroup:*:autoScalingGroupName/${ProductEnrichmentASG}"
        - PolicyName: OpenSearchAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - es:*
                Resource: !Sub "arn:aws:es:${AWS::Region}:${AWS::AccountId}:domain/application-dev/*"
  ProductEnrichmentScaleUpLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "product-enrichment-asg-scale-up-dev"
      Runtime: provided.al2023
      Handler: lib.handler
      Role: !GetAtt ProductEnrichmentScaleUpRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub "product-enrichment-asg-scale-up-dev-${CommitSHA}.zip"
      MemorySize: 128
      Timeout: 60
      EphemeralStorage:
        Size: 512
      Environment:
        Variables:
          STAGE: "dev"
          PRODUCT_ENRICHMENT_ASG_NAME: !Ref ProductEnrichmentASG
          OPENSEARCH_ENDPOINT_URL: !Ref OpenSearchEndpointUrl
          OPENSEARCH_USERNAME: !Ref OpenSearchUsername
          OPENSEARCH_PASSWORD: !Ref OpenSearchPassword
  ProductEnrichmentScaleUpStartSchedule:
    Type: AWS::Events::Rule
    Properties:
      ScheduleExpression: "cron(0 1 * * ? *)" # every day at 01:00 UTC
      Targets:
        - Arn: !GetAtt ProductEnrichmentScaleUpLambda.Arn
          Id: "ProductEnrichmentScaleUpStartSchedule"
          RetryPolicy:
            MaximumRetryAttempts: 5
            MaximumEventAgeInSeconds: 3600
          DeadLetterConfig:
            Arn: !GetAtt ProductEnrichmentDlq.Arn
  ProductEnrichmentScaleUpStartSchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ProductEnrichmentScaleUpLambda
      Action: "lambda:InvokeFunction"
      Principal: "events.amazonaws.com"
      SourceArn: !GetAtt ProductEnrichmentScaleUpStartSchedule.Arn

