          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                  - dynamodb:UpdateItem
                  - dynamodb:BatchGetItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:TransactGetItems
                  - dynamodb:TransactWriteItems
                Resource:
                  - !GetAtt TableOne.Arn
                  - !Sub "${TableOne.Arn}/index/*"
  ProductPipelineTranslateInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: "product-pipeline-translate-profile-dev"
      Roles:
        - !Ref ProductPipelineTranslateRole
  ProductPipelineTranslateLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: "product-pipeline-translate-template-dev"
      LaunchTemplateData:
        IamInstanceProfile:
          Name: !Ref ProductPipelineTranslateInstanceProfile
        InstanceType: g6.xlarge # Placeholder - ASG overrides this
        ImageId: "{{resolve:ssm:/amis/dev/product-pipeline-translate/latest}}"
        SecurityGroupIds: [!Ref ProductPipelineSecurityGroup]
        BlockDeviceMappings:
          - DeviceName: /dev/sda1
            Ebs:
              VolumeSize: 80
              VolumeType: gp3
              DeleteOnTermination: true
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: "product-pipeline-translate-dev"
              - Key: Fleet
                Value: product-pipeline-translate
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -euxo pipefail
            sudo -i
            export DYNAMODB_TABLE_NAME="${TableOne}"
            export STAGE="dev"
            export STAGE_NAME=dev
            export CommitSHA="${CommitSHA}"
            export ARTIFACT_BUCKET="${ArtifactBucket}"
            export SOURCE_QUEUE_URL="${ProductPipelineTranslateQ}"
            # Download and install binary
            sudo aws s3 cp "s3://${ArtifactBucket}/dev/${CommitSHA}/product-pipeline-translate" /opt/product-pipeline-translate/product-pipeline-translate --region eu-central-1
            sudo chmod +x /opt/product-pipeline-translate/product-pipeline-translate
            # Prepare (preconfigured via custom ami) python venv
            cd /opt/product-pipeline-translate
            source .venv/bin/activate
            # ----------------------------
            # INSTANCE STORE (CORRECT ZERO-COPY HF CACHE)
            # ----------------------------
            set -euxo pipefail

            ROOT_DEV=$(lsblk -ndo PKNAME "$(findmnt -n -o SOURCE /)")
            DEVICE=""

            echo "Waiting for instance store NVMe..."

            for i in {1..30}; do
              DEVICE=$(lsblk -ndo NAME,TYPE | awk '$2=="disk"{print "/dev/"$1}' | grep -v "$ROOT_DEV" | head -n1 || true)
              [ -n "$DEVICE" ] && break
              sleep 1
            done

            if [ -z "$DEVICE" ]; then
              echo "❌ No instance store detected — using EBS"
              export HF_HOME=/opt/huggingface
              export TRANSFORMERS_CACHE=/opt/huggingface
              export SENTENCE_TRANSFORMERS_HOME=/opt/huggingface
            else
              echo "✅ Found instance store: $DEVICE"

              if ! blkid "$DEVICE" >/dev/null 2>&1; then
                mkfs.xfs -f "$DEVICE"
              fi

              mkdir -p /mnt/instance-store
              mount -o noatime,nodiratime "$DEVICE" /mnt/instance-store

              mkdir -p /mnt/instance-store/huggingface

              # If /opt/huggingface is NOT already a symlink, replace it
              if [ ! -L /opt/huggingface ]; then
                echo "🔁 Moving HF cache pointer to NVMe (no copy)"
                rm -rf /opt/huggingface
                ln -s /mnt/instance-store/huggingface /opt/huggingface
              fi

              export HF_HOME=/opt/huggingface
              export TRANSFORMERS_CACHE=/opt/huggingface
              export SENTENCE_TRANSFORMERS_HOME=/opt/huggingface

              echo "🔥 HuggingFace cache now lives on NVMe"
            fi

            # Run binary
            LOG_PATH="/var/log/product-pipeline-translate.log"
            echo "[$(date)] Running product-pipeline-translate..." | tee -a "$LOG_PATH"
            ./product-pipeline-translate >> "$LOG_PATH" 2>&1
            EXIT_CODE=$?
            echo "[$(date)] Job finished with code $EXIT_CODE" | tee -a "$LOG_PATH"
            sleep 5
            aws autoscaling terminate-instance-in-auto-scaling-group \
              --instance-id $(ec2metadata --instance-id) \
              --should-decrement-desired-capacity
            exit $EXIT_CODE
  ProductPipelineTranslateASG:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      VPCZoneIdentifier:
        - !Ref ProductPipelineSubnetA
      MinSize: 0
      MaxSize: 1
      DesiredCapacity: 0
      MixedInstancesPolicy:
        LaunchTemplate:
          LaunchTemplateSpecification:
            LaunchTemplateId: !Ref ProductPipelineTranslateLaunchTemplate
            Version: !GetAtt ProductPipelineTranslateLaunchTemplate.LatestVersionNumber
          Overrides:
            - InstanceType: g6.xlarge
            - InstanceType: g6.2xlarge
            - InstanceType: g5.xlarge
            - InstanceType: g5.2xlarge
        InstancesDistribution:
          OnDemandPercentageAboveBaseCapacity: 0
          SpotAllocationStrategy: price-capacity-optimized
      Tags:
        - Key: Name
          Value: "product-pipeline-translate-dev"
          PropagateAtLaunch: true
      HealthCheckType: EC2
      HealthCheckGracePeriod: 120

