  ProductPipelineCompleteDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: "product-pipeline-complete-dlq-dev"
      MessageRetentionPeriod: 1209600
  ProductPipelineCompleteQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: "product-pipeline-complete-queue-dev"
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ProductPipelineCompleteDlq.Arn
        maxReceiveCount: 5
      VisibilityTimeout: 60
  ProductPipelineCompleteRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: "product-pipeline-complete-role-dev"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
          - Effect: Allow
            Principal:
              Service: spot.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
        - arn:aws:iam::aws:policy/AmazonS3ReadOnlyAccess
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: AllowTerminateInASG
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: autoscaling:TerminateInstanceInAutoScalingGroup
                Resource: "*"
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                  - dynamodb:UpdateItem
                  - dynamodb:BatchGetItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:TransactGetItems
                  - dynamodb:TransactWriteItems
                Resource:
                  - !GetAtt TableOne.Arn
                  - !Sub "${TableOne.Arn}/index/*"
        - PolicyName: SQSPollerAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                  - sqs:SendMessageBatch
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:DeleteMessageBatch
                  - sqs:GetQueueAttributes
                  - sqs:GetQueueUrl
                  - sqs:ChangeMessageVisibility
                Resource: !GetAtt ProductPipelineCompleteQ.Arn
        - PolicyName: CloudWatchLogsCreate
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"
  ProductPipelineCompleteInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: "product-pipeline-complete-profile-dev"
      Roles:
        - !Ref ProductPipelineCompleteRole
  ProductPipelineCompleteLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: "product-pipeline-complete-template-dev"
      LaunchTemplateData:
        KeyName: !Ref Ec2KeyPairName
        IamInstanceProfile:
          Name: !Ref ProductPipelineCompleteInstanceProfile
        InstanceType: c7i.large
        ImageId: ami-004e960cde33f9146
        SecurityGroupIds: [!Ref ProductPipelineSecurityGroup]
        BlockDeviceMappings:
          - DeviceName: /dev/sda1
            Ebs:
              VolumeSize: 50
              VolumeType: gp3
              DeleteOnTermination: true
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: "product-pipeline-complete-dev"
              - Key: Fleet
                Value: product-pipeline-complete
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -euxo pipefail
            sudo -i
            export STAGE="dev"
            export STAGE_NAME=dev
            export CommitSHA="${CommitSHA}"
            export ARTIFACT_BUCKET="${ArtifactBucket}"
            export SOURCE_QUEUE_URL="${ProductPipelineCompleteQ}"
            export DYNAMODB_TABLE_NAME="${TableOne}"
            export OPENSEARCH_ENDPOINT_URL="${OpenSearchEndpointUrl}"
            export OPENSEARCH_USERNAME="${OpenSearchUsername}"
            export OPENSEARCH_PASSWORD="${OpenSearchPassword}"
            # Install awscli
            apt -y install unzip
            curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
            unzip awscliv2.zip
            sudo ./aws/install
            # Install cloudwatch-agent
            sudo wget https://s3.amazonaws.com/amazoncloudwatch-agent/debian/amd64/latest/amazon-cloudwatch-agent.deb
            sudo dpkg -i -E ./amazon-cloudwatch-agent.deb
            # Download and install binary
            sudo aws s3 cp "s3://${ArtifactBucket}/dev/${CommitSHA}/product-pipeline-complete" /opt/product-pipeline-complete --region eu-central-1
            sudo chmod +x /opt/product-pipeline-complete
            # Configure CloudWatchAgent
            cat << EOF | sudo tee /opt/aws/amazon-cloudwatch-agent.json > /dev/null
            {
              "metrics": {
                "namespace": "CWAgent",
                "metrics_collected": {
                  "cpu": {
                    "measurement": [
                      {
                        "name": "cpu_usage_idle",
                        "rename": "CPU_IDLE",
                        "unit": "Percent"
                      },
                      {
                        "name": "cpu_usage_iowait",
                        "rename": "CPU_IOWAIT",
                        "unit": "Percent"
                      },
                      "cpu_time_guest"
                    ],
                    "metrics_collection_interval": 60,
                    "resources": ["*"],
                    "totalcpu": false
                  },
                  "disk": {
                    "measurement": [
                      {
                        "name": "used_percent",
                        "rename": "DISK_USED_PERCENT",
                        "unit": "Percent"
                      },
                      "used",
                      "free"
                    ],
                    "metrics_collection_interval": 60,
                    "resources": ["*"]
                  },
                  "diskio": {
                    "measurement": [
                      "io_time",
                      "read_bytes",
                      "write_bytes",
                      "reads",
                      "writes"
                    ],
                    "metrics_collection_interval": 60,
                    "resources": ["*"]
                  },
                  "mem": {
                    "measurement": [
                      {
                        "name": "mem_used_percent",
                        "rename": "MEM_USED_PERCENT",
                        "unit": "Percent"
                      },
                      "mem_used",
                      "mem_available"
                    ],
                    "metrics_collection_interval": 60
                  },
                  "netstat": {
                    "measurement": [
                      "tcp_established",
                      "tcp_time_wait"
                    ],
                    "metrics_collection_interval": 60
                  },
                  "net": {
                    "measurement": [
                      "bytes_sent",
                      "bytes_recv",
                      "packets_sent",
                      "packets_recv"
                    ],
                    "metrics_collection_interval": 60,
                    "resources": ["*"]
                  }
                }
              },
              "logs": {
                "logs_collected": {
                  "files": {
                    "collect_list": [
                      {
                        "file_path": "/var/log/product-pipeline-complete.log",
                        "log_group_name": "/aws/ec2/$STAGE-product-pipeline-complete",
                        "log_stream_name": "{instance_id}",
                        "timestamp_format": "%Y-%m-%dT%H:%M:%S.%f%z",
                        "timezone": "UTC",
                        "multi_line_start_pattern": "^{"
                      }
                    ]
                  }
                }
              }
            }
            EOF
            amazon-cloudwatch-agent-ctl -a fetch-config -m ec2 -c file:/opt/aws/amazon-cloudwatch-agent.json -s
            LOG_PATH="/var/log/product-pipeline-complete.log"
            sudo touch "$LOG_PATH"
            sudo chmod 666 "$LOG_PATH"
            # Run binary
            echo "[$(date)] Running product-pipeline-complete..." | tee -a "$LOG_PATH"
            /opt/product-pipeline-complete >> "$LOG_PATH" 2>&1
            EXIT_CODE=$?
            echo "[$(date)] Job finished with code $EXIT_CODE" | tee -a "$LOG_PATH"
            sleep 5
            aws autoscaling terminate-instance-in-auto-scaling-group \
              --instance-id $(ec2metadata --instance-id) \
              --should-decrement-desired-capacity
            exit $EXIT_CODE
