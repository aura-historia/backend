AWSTemplateFormatVersion: "2010-09-09"
Description: Development Stack for the Aura-Historia Application-Backend

Parameters:
  ArtifactBucket:
    Type: String
    Description: "S3 bucket containing Lambda deployment zips"
  ResourceBucket:
    Type: String
    Description: "S3 bucket containing resources"
  MailTemplateBucket:
    Type: String
    Description: "S3 bucket containing mail-templates"
  CommitSHA:
    Type: String
  OpenSearchEndpointUrl:
    Type: String
    Description: "URL for the self-hosted OpenSearch-Cluster"
  StripeEventBusName:
    Type: String
    Description: "Name of the AWS EventBridge Partner-Event-Bus connected to Stripe (created manually in the AWS Console — see https://docs.stripe.com/event-destinations/eventbridge)."
  ShopifyEventBusName:
    Type: String
    Description: "Name of the AWS EventBridge Partner-Event-Bus connected to Shopify."
  StripeProProductId:
    Type: String
    Description: "Stripe product-id (prod_…) corresponding to the 'Pro' user-tier."
  StripeUltimateProductId:
    Type: String
    Description: "Stripe product-id (prod_…) corresponding to the 'Ultimate' user-tier."
  StripeProMonthlyPriceId:
    Type: String
    Description: "Stripe price-id (price_…) for the monthly 'Pro' subscription."
  StripeProYearlyPriceId:
    Type: String
    Description: "Stripe price-id (price_…) for the yearly 'Pro' subscription."
  StripeUltimateMonthlyPriceId:
    Type: String
    Description: "Stripe price-id (price_…) for the monthly 'Ultimate' subscription."
  StripeUltimateYearlyPriceId:
    Type: String
    Description: "Stripe price-id (price_…) for the yearly 'Ultimate' subscription."

Resources:
  PrimaryUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: "primary-userpool-dev"
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 7
      UserPoolAddOns:
        AdvancedSecurityMode: ENFORCED
      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE
      EmailVerificationSubject: "Verify your email"
      EmailVerificationMessage: "Your verification code is {####}"
      Schema:
        - Name: email
          AttributeDataType: String
          Mutable: false
          Required: true
      LambdaConfig:
        PostConfirmation: !GetAtt PrimaryUserPoolPostConfirmationLambda.Arn

  PrimaryUserPoolPostConfirmationLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: "cognito-primary-userpool-post-confirmation-role-dev"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                Resource: !GetAtt TableOne.Arn
  PrimaryUserPoolPostConfirmationLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: "cognito-primary-userpool-post-confirmation-dev"
      Runtime: provided.al2023
      Handler: lib.handler
      Role: !GetAtt PrimaryUserPoolPostConfirmationLambdaRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub "cognito-post-confirmation-dev-${CommitSHA}.zip"
      MemorySize: 256
      Timeout: 10
      # ReservedConcurrentExecutions: 1
      EphemeralStorage:
        Size: 512
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME: !Ref TableOne
  AllowCognitoInvokePrimaryUserPoolPostConfirmationLambda:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref PrimaryUserPoolPostConfirmationLambda
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt PrimaryUserPool.Arn

  PrimaryUserPoolClientPublic:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref PrimaryUserPool
      ClientName: "primary-userpool-client-public-dev"
      GenerateSecret: false # PKCE replaces client secret
      PreventUserExistenceErrors: ENABLED
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      SupportedIdentityProviders:
        - COGNITO
      CallbackURLs:
        - http://localhost:3000/
        - https://aura-historia.com/
      LogoutURLs:
        - http://localhost:3000/
        - https://aura-historia.com/
      EnableTokenRevocation: true
      AccessTokenValidity: 1 # hours
      IdTokenValidity: 1 # hours
      RefreshTokenValidity: 30 # days
      ReadAttributes:
        - email
        - email_verified
  PrimaryUserPoolClientAdmin:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref PrimaryUserPool
      ClientName: "primary-userpool-client-admin-dev"
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      AllowedOAuthFlowsUserPoolClient: false
      ExplicitAuthFlows:
        - ALLOW_ADMIN_USER_PASSWORD_AUTH
      EnableTokenRevocation: true
      AccessTokenValidity: 1 # hours
      IdTokenValidity: 1 # hours
      RefreshTokenValidity: 30 # days
      ReadAttributes:
        - email
      WriteAttributes:
        - email
  PrimaryUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: "primary-userpool-dev" # hosted UI domain
      UserPoolId: !Ref PrimaryUserPool

  TableOne:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: "table_1-dev-v2"
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: lsi1_sk
          AttributeType: S
        - AttributeName: lsi2_sk
          AttributeType: S
        - AttributeName: lsi3_sk
          AttributeType: S
        - AttributeName: lsi4_sk
          AttributeType: S
        - AttributeName: lsi5_sk
          AttributeType: S
        - AttributeName: gsi1_pk
          AttributeType: S
        - AttributeName: gsi1_sk
          AttributeType: S
        - AttributeName: gsi2_pk
          AttributeType: S
        - AttributeName: gsi2_sk
          AttributeType: S
        - AttributeName: gsi3_pk
          AttributeType: S
        - AttributeName: gsi3_sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      LocalSecondaryIndexes:
        - IndexName: lsi1
          KeySchema:
            - AttributeName: pk
              KeyType: HASH
            - AttributeName: lsi1_sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: lsi2
          KeySchema:
            - AttributeName: pk
              KeyType: HASH
            - AttributeName: lsi2_sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: lsi3
          KeySchema:
            - AttributeName: pk
              KeyType: HASH
            - AttributeName: lsi3_sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: lsi4
          KeySchema:
            - AttributeName: pk
              KeyType: HASH
            - AttributeName: lsi4_sk
              KeyType: RANGE
          Projection:
            ProjectionType: KEYS_ONLY
        - IndexName: lsi5
          KeySchema:
            - AttributeName: pk
              KeyType: HASH
            - AttributeName: lsi5_sk
              KeyType: RANGE
          Projection:
            ProjectionType: KEYS_ONLY
      GlobalSecondaryIndexes:
        - IndexName: gsi1
          KeySchema:
            - AttributeName: gsi1_pk
              KeyType: HASH
            - AttributeName: gsi1_sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: gsi2
          KeySchema:
            - AttributeName: gsi2_pk
              KeyType: HASH
            - AttributeName: gsi2_sk
              KeyType: RANGE
          Projection:
            ProjectionType: KEYS_ONLY
        - IndexName: gsi3
          KeySchema:
            - AttributeName: gsi3_pk
              KeyType: HASH
            - AttributeName: gsi3_sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: "ttl"
        Enabled: true
      BillingMode: PAY_PER_REQUEST
      TableClass: STANDARD
      StreamSpecification:
        StreamViewType: NEW_IMAGE

  DynamoDbEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: "dynamodb-event-bus-dev"
  PipeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: "dynamodb-to-eventbridge-pipe-role-dev"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: pipes.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PipePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:DescribeStream
                  - dynamodb:GetRecords
                  - dynamodb:GetShardIterator
                  - dynamodb:ListStreams
                Resource: "*"
              - Effect: Allow
                Action:
                  - events:PutEvents
                Resource: !GetAtt DynamoDbEventBus.Arn
  TableOneStreamToEventBusPipe:
    Type: AWS::Pipes::Pipe
    Properties:
      Name: "tableone-v2-stream-to-eventbus-dev"
      RoleArn: !GetAtt PipeRole.Arn
      Source: !GetAtt TableOne.StreamArn
      SourceParameters:
        DynamoDBStreamParameters:
          StartingPosition: LATEST
          BatchSize: 10
          MaximumBatchingWindowInSeconds: 1
        FilterCriteria:
          Filters:
            - Pattern: |
                {
                  "eventName": ["INSERT"],
                  "dynamodb": {
                    "NewImage": {
                      "pk": {
                        "S": [{ "prefix": "product#shop_id#" }]
                      },
                      "sk": {
                        "S": [{ "prefix": "product#event#" }]
                      }
                    }
                  }
                }
            - Pattern: |
                {
                  "eventName": ["MODIFY"],
                  "dynamodb": {
                    "NewImage": {
                      "pk": {
                        "S": [{ "prefix": "user#" }]
                      },
                      "sk": {
                        "S": [ "user#details" ]
                      }
                    }
                  }
                }
            - Pattern: |
                {
                  "eventName": ["INSERT", "MODIFY"],
                  "dynamodb": {
                    "NewImage": {
                      "pk": {
                        "S": [{ "prefix": "shop#shop_id#" }]
                      },
                      "sk": {
                        "S": [ "shop#details" ]
                      }
                    }
                  }
                }
            - Pattern: |
                {
                  "eventName": ["INSERT"],
                  "dynamodb": {
                    "NewImage": {
                      "pk": {
                        "S": [{ "prefix": "user#" }]
                      },
                      "sk": {
                        "S": [{ "prefix": "user#notification#origin_event_id#" }]
                      }
                    }
                  }
                }
            # FILTER 5: Search filter INSERT/MODIFY/REMOVE events
            - Pattern: |
                {
                  "eventName": ["INSERT", "MODIFY", "REMOVE"],
                  "dynamodb": {
                    "$or": [
                      {
                        "NewImage": {
                          "pk": {
                            "S": [{ "prefix": "user#" }]
                          },
                          "sk": {
                            "S": [{ "prefix": "search_filter#" }]
                          }
                        }
                      },
                      {
                        "Keys": {
                          "pk": {
                            "S": [{ "prefix": "user#" }]
                          },
                          "sk": {
                            "S": [{ "prefix": "search_filter#" }]
                          }
                        }
                      }
                    ]
                  }
                }
      Target: !GetAtt DynamoDbEventBus.Arn
      TargetParameters:
        EventBridgeEventBusParameters:
          DetailType: "DynamoDBStreamRecord"
          Source: !Ref TableOne

  DynamoDbEventBusQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref ProductMaterializeDynamoDbQ
        - !Ref ProductMaterializeOpenSearchQ
        - !Ref ShopOpenSearchIndexQ
        - !Ref UserOpenSearchIndexQ
        - !Ref UserTierUpdateQ
        - !Ref SearchFilterOpenSearchSyncQ
        - !Ref ProductUpdateNotifyUserQ
        - !Ref SearchFilterPercolateProductQ
        - !Ref ProductPipelineTranslateQ
        - !Ref ProductPipelineEmbedTextQ
        - !Ref NotificationSendQ
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource:
              - !GetAtt ProductMaterializeDynamoDbQ.Arn
              - !GetAtt ProductMaterializeOpenSearchQ.Arn
              - !GetAtt ShopOpenSearchIndexQ.Arn
              - !GetAtt UserOpenSearchIndexQ.Arn
              - !GetAtt UserTierUpdateQ.Arn
              - !GetAtt SearchFilterOpenSearchSyncQ.Arn
              - !GetAtt ProductUpdateNotifyUserQ.Arn
              - !GetAtt SearchFilterPercolateProductQ.Arn
              - !GetAtt ProductPipelineTranslateQ.Arn
              - !GetAtt ProductPipelineEmbedTextQ.Arn
              - !GetAtt NotificationSendQ.Arn

  ShopifyEventBusQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref ShopifyLambdaQ
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt ShopifyLambdaQ.Arn

  Api:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: "api-dev"
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - "*"
        AllowHeaders:
          - Authorization
          - Content-Type
          - Accept
          - X-WC-Webhook-Source
          - X-WC-Webhook-Topic
          - X-WC-Webhook-Signature
          - X-WC-Webhook-Resource
          - X-WC-Webhook-Event
          - X-WC-Webhook-ID
          - X-WC-Webhook-Delivery-ID
          - X-Api-Key
  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      StageName: "dev"
      ApiId: !Ref Api
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 20
  ApiCognitoAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref Api
      Name: CognitoJwtAuthorizer
      AuthorizerType: JWT
      IdentitySource:
        - "$request.header.Authorization"
      JwtConfiguration:
        Issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${PrimaryUserPool}"
        Audience:
          - !Ref PrimaryUserPoolClientPublic
          - !Ref PrimaryUserPoolClientAdmin

  ProductApiGetProductRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: "GET /api/v1/shops/{shopId}/products/{shopsProductId}"
      Target: !Sub "integrations/${ProductApiLambdaIntegration}"
  ProductApiGetProductBySlugIdRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: "GET /api/v1/by-slug/shops/{shopSlugId}/products/{productSlugId}"
      Target: !Sub "integrations/${ProductApiLambdaIntegration}"
  ProductApiGetProductSimilarRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: "GET /api/v1/shops/{shopId}/products/{shopsProductId}/similar"
      Target: !Sub "integrations/${ProductApiLambdaIntegration}"
  ProductApiSearchProductRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: "POST /api/v1/products/search"
      Target: !Sub "integrations/${ProductApiLambdaIntegration}"
  ProductApiSimpleSearchProductRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: "GET /api/v1/products"
      Target: !Sub "integrations/${ProductApiLambdaIntegration}"
  ProductApiGetProductHistoryRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: "GET /api/v1/shops/{shopId}/products/{shopsProductId}/history"
      Target: !Sub "integrations/${ProductApiLambdaIntegration}"
  ProductApiLambdaIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref Api
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${ProductApiLambda}"
      PayloadFormatVersion: "2.0"
  ProductApiRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: "product-api-role-dev"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:Query
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:BatchGetItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:TransactGetItems
                  - dynamodb:TransactWriteItems
                Resource:
                  - !GetAtt TableOne.Arn
                  - !Sub "${TableOne.Arn}/index/*"
  ProductApiLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: "product-api-dev"
      Runtime: provided.al2023
      Handler: lib.handler
      Role: !GetAtt ProductApiRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub "product-api-dev-${CommitSHA}.zip"
      MemorySize: 128
      Timeout: 10
      # ReservedConcurrentExecutions: 1
      EphemeralStorage:
        Size: 512
      Environment:
        Variables:
          OPENSEARCH_ENDPOINT_URL: !Ref OpenSearchEndpointUrl
          STAGE: "dev"
          OPENSEARCH_USERNAME: "{{resolve:ssm:/opensearch/dev/username}}"
          OPENSEARCH_PASSWORD: "{{resolve:ssm:/opensearch/dev/password}}"
          DYNAMODB_TABLE_NAME: !Ref TableOne
          USER_POOL_ID: !Ref PrimaryUserPool
          USER_POOL_PUBLIC_CLIENT_ID: !Ref PrimaryUserPoolClientPublic
          USER_POOL_ADMIN_CLIENT_ID: !Ref PrimaryUserPoolClientAdmin
          GEMINI_API_KEY: !Sub "{{resolve:ssm:/secrets/dev/gemini-api-key}}"
  ProductApiLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ProductApiLambda
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*/*/api/v1*"

  # --- Product API Partner ---
  ProductApiPartnerPostProductsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: "POST /api/v1/shops/{shopId}/products"
      AuthorizationType: NONE
      Target: !Sub "integrations/${ProductApiPartnerLambdaIntegration}"
  ProductApiPartnerPatchProductsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: "PATCH /api/v1/shops/{shopId}/products"
      AuthorizationType: NONE
      Target: !Sub "integrations/${ProductApiPartnerLambdaIntegration}"
  ProductApiPartnerPutProductsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: "PUT /api/v1/shops/{shopId}/products"
      AuthorizationType: NONE
      Target: !Sub "integrations/${ProductApiPartnerLambdaIntegration}"
  ProductApiPartnerLambdaIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref Api
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${ProductApiPartnerLambda}"
      PayloadFormatVersion: "2.0"
  WebhookApiWoocommerceRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: "POST /api/v1/webhooks/woocommerce/{shopId}"
      AuthorizationType: NONE
      Target: !Sub "integrations/${WebhookApiLambdaIntegration}"
  WebhookApiLambdaIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref Api
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${WebhookApiLambda}"
      PayloadFormatVersion: "2.0"
  ProductApiPartnerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: "product-api-partner-role-dev"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:Query
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:BatchGetItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:TransactGetItems
                  - dynamodb:TransactWriteItems
                Resource:
                  - !GetAtt TableOne.Arn
                  - !Sub "${TableOne.Arn}/index/*"
  ProductApiPartnerLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: "product-api-partner-dev"
      Runtime: provided.al2023
      Handler: lib.handler
      Role: !GetAtt ProductApiPartnerRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub "product-api-partner-dev-${CommitSHA}.zip"
      MemorySize: 128
      Timeout: 10
      # ReservedConcurrentExecutions: 1
      EphemeralStorage:
        Size: 512
      Environment:
        Variables:
          OPENSEARCH_ENDPOINT_URL: !Ref OpenSearchEndpointUrl
          STAGE: "dev"
          OPENSEARCH_USERNAME: "{{resolve:ssm:/opensearch/dev/username}}"
          OPENSEARCH_PASSWORD: "{{resolve:ssm:/opensearch/dev/password}}"
          DYNAMODB_TABLE_NAME: !Ref TableOne
          GEMINI_API_KEY: !Sub "{{resolve:ssm:/secrets/dev/gemini-api-key}}"
          GOOGLE_GEOCODING_API_KEY: !Sub "{{resolve:ssm:/secrets/dev/google-geocoding-api-key}}"
  ProductApiPartnerLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ProductApiPartnerLambda
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*/*/api/v1*"

  WebhookApiRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: "webhook-api-role-dev"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:Query
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:BatchGetItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:TransactGetItems
                  - dynamodb:TransactWriteItems
                Resource:
                  - !GetAtt TableOne.Arn
                  - !Sub "${TableOne.Arn}/index/*"
  WebhookApiLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: "webhook-api-dev"
      Runtime: provided.al2023
      Handler: lib.handler
      Role: !GetAtt WebhookApiRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub "webhook-api-dev-${CommitSHA}.zip"
      MemorySize: 128
      Timeout: 10
      EphemeralStorage:
        Size: 512
      Environment:
        Variables:
          OPENSEARCH_ENDPOINT_URL: !Ref OpenSearchEndpointUrl
          STAGE: "dev"
          OPENSEARCH_USERNAME: "{{resolve:ssm:/opensearch/dev/username}}"
          OPENSEARCH_PASSWORD: "{{resolve:ssm:/opensearch/dev/password}}"
          DYNAMODB_TABLE_NAME: !Ref TableOne
          GEMINI_API_KEY: !Sub "{{resolve:ssm:/secrets/dev/gemini-api-key}}"
          GOOGLE_GEOCODING_API_KEY: !Sub "{{resolve:ssm:/secrets/dev/google-geocoding-api-key}}"
  WebhookApiLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref WebhookApiLambda
      Principal: apigateway.amazonaws.com
