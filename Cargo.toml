    "src/cognito-post-confirmation",
    "src/common",
    "src/search-filter",
    "src/search-filter-api",
    "src/search-filter-lambda",
    "src/product",
    "src/product-api",
    "src/product-personalization",
    "src/product-classification",
    "src/product-classification-api",
    "src/product-watchlist",
    "src/product-watchlist-api",
    "src/product-lambda",
    "src/test-api",
    "src/shop",
    "src/shop-api",
    "src/shop-lambda",
    "src/user",
    "src/user-api",
    "src/notification-send",
    "src/notification",
    "src/notification-api",
    "src/product-pipeline",
    "src/fxrate",
    "src/fxrate-lambda",
    "src/aura-scraper",
]

