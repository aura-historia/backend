search-filter-lambda = { workspace = true }
shop = { workspace = true }
shop-api = { workspace = true }
shop-lambda = { workspace = true }
product = { workspace = true }
product-api = { workspace = true }
product-personalization = { workspace = true }
product-classification = { workspace = true }
product-classification-api = { workspace = true }
product-watchlist = { workspace = true }
product-watchlist-api = { workspace = true }
