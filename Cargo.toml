[package]
name = "blitzfilter-parent"
version = "0.1.0"
edition = "2024"

[dependencies]
aws-tests = { workspace = true }
cognito = { workspace = true }
cognito-post-confirmation = { workspace = true }
common = { workspace = true }
search-filter = { workspace = true }
search-filter-api = { workspace = true }
shop = { workspace = true }
shop-api = { workspace = true }
product = { workspace = true }
product-api = { workspace = true }
product-lambda = { workspace = true }
test-api = { workspace = true }
user = { workspace = true }
mail = { workspace = true }
mail-lambda-send = { workspace = true }
product-enrichment = { workspace = true }

[workspace]
members = [
    "src/aws-tests",
    "src/cognito",
    "src/cognito-post-confirmation",
    "src/common",
    "src/search-filter",
    "src/search-filter-api",
    "src/shop",
    "src/product",
    "src/product-api",
    "src/product-lambda",
    "src/test-api",
    "src/shop",
    "src/shop-api",
    "src/user",
    "src/mail",
    "src/mail-lambda-send",
    "src/product-enrichment",
]

[workspace.dependencies]
accept-language = "3.1.0"
async-stream = "0.3.6"
async-trait = "0.1.89"
aws-config = "1.8.8"
aws-sdk-account = "1.89.0"
aws-sdk-autoscaling = "1.98.0"
aws-sdk-dynamodb = "1.95.0"
aws-sdk-lambda = "1.100.0"
aws-sdk-opensearch = "1.100.0"
aws-sdk-sqs = "1.86.0"
aws-sdk-sesv2 = "1.100.0"
aws-sdk-s3 = "1.108.0"
aws_lambda_events = { version = "0.17.0", default-features = false }
common = { path = "src/common" }
derive_builder = "0.20.2"
fake = { version = "4.4.0", features = ["derive", "time", "uuid", "url"] }
field = "0.1.0"
search-filter = { path = "src/search-filter" }
search-filter-api = { path = "src/search-filter-api" }
search-filter-api-delete-search-filter = { path = "src/search-filter-api/src/search-filter-api-delete-search-filter" }
search-filter-api-get-search-filter = { path = "src/search-filter-api/src/search-filter-api-get-search-filter" }
search-filter-api-get-search-filters = { path = "src/search-filter-api/src/search-filter-api-get-search-filters" }
search-filter-api-patch-search-filter = { path = "src/search-filter-api/src/search-filter-api-patch-search-filter" }
search-filter-api-post-search-filter = { path = "src/search-filter-api/src/search-filter-api-post-search-filter" }
shop = { path = "src/shop" }
shop-api = { path = "src/shop-api" }
shop-api-get-shop = { path = "src/shop-api/src/shop-api-get-shop" }
shop-api-search = { path = "src/shop-api/src/shop-api-search" }
mail = { path = "src/mail" }
mail-core = { path = "src/mail/src/mail-core" }
mail-lambda-send = { path = "src/mail-lambda-send" }
futures = { version = "0.3.31", default-features = false }
hex = "0.4.3"
http = "1.3.1"
httpdate = "1.0.3"
product = { path = "src/product" }
product-api = { path = "src/product-api" }
