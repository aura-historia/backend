name: Integrate (CI)

on:
  push:
    branches: [develop]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".cargo/**"
      - ".config/**"
      - "ci/**"
      - "tooling/**"
      - "tests/**"
      - "rust-toolchain.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "depgraph-rules.toml"
      - "sonar-project.properties"
      - "src/**"
      - "migrations/**"
      - "opensearch/**"
      - "mjml/**"
      - "docs/swagger.yaml"
      - "docs/fixtures/**"
      - "infra/sql/**"
      - "infra/assets/rds-ca-layer/**"
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".cargo/**"
      - ".config/**"
      - "ci/**"
      - "tooling/**"
      - "tests/**"
      - "rust-toolchain.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "depgraph-rules.toml"
      - "sonar-project.properties"
      - "src/**"
      - "migrations/**"
      - "opensearch/**"
      - "mjml/**"
      - "docs/swagger.yaml"
      - "docs/fixtures/**"
      - "infra/sql/**"
      - "infra/assets/rds-ca-layer/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_BUILD_JOBS: 4

jobs:
  lint:
    name: Lint Workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/lint-workspace

  api:
    name: Test API
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/test-lane
        with:
          id: api
          lanes: API
          slots: 4
          profile: api
          compilation_cache: dependencies

  crawler:
    name: Test Crawler
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/test-lane
        with:
          id: crawler
          lanes: CRAWLER
          slots: 4
          profile: postgres
          compilation_cache: dependencies

  integration:
    name: Test Integration
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/test-lane
        with:
          id: integration
          lanes: INFRASTRUCTURE
          slots: 4
          profile: api
          compilation_cache: dependencies

  remaining:
    name: Test Remaining
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/test-lane
        with:
          id: remaining
          lanes: REMAINING
          slots: 4
          profile: none
          compilation_cache: dependencies

  quality:
    name: Require all lint and test lanes
    needs: [lint, api, crawler, integration, remaining]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every independent quality job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          jobs = json.loads(os.environ['RESULTS'])
          expected = {'lint', 'api', 'crawler', 'integration', 'remaining'}
          if set(jobs) != expected or any(job['result'] != 'success' for job in jobs.values()):
              raise SystemExit('Every lint and test lane must succeed: ' + os.environ['RESULTS'])
          PY
