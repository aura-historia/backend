name: Integrate (CI)

on:
  push:
    branches: [prod, develop]
    paths:
      - ".github/workflows/integrate.yml"
      - ".github/workflows/deploy.yml"
      - ".github/scripts/**"
      - ".cargo/**"
      - "rust-toolchain.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "depgraph-rules.toml"
      - "sonar-project.properties"
      - "src/**"
      - "migrations/**"
      - "deploy/**"
      - "opensearch/**"
      - "infra/**"
      - "mjml/**"
  pull_request:
    paths:
      - ".github/workflows/integrate.yml"
      - ".github/workflows/deploy.yml"
      - ".github/scripts/**"
      - ".cargo/**"
      - "rust-toolchain.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "depgraph-rules.toml"
      - "sonar-project.properties"
      - "src/**"
      - "migrations/**"
      - "deploy/**"
      - "infra/**"
      - "opensearch/**"
      - "mjml/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/prod' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  infra-test:
    name: Test CDK infrastructure
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install CDK dependencies
        run: npm --prefix infra ci

      - name: Type-check CDK app
        run: npm --prefix infra run build

      - name: Test CDK app
        run: npm --prefix infra test

      - name: Synthesize all stacks
        run: npm --prefix infra run synth:all

  mjml-compile:
    name: Compile MJML templates
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install MJML
        run: npm install --global mjml

      - name: Compile every MJML template
        shell: bash
        run: |
          set -euo pipefail
          template_count=0
          while IFS= read -r -d '' template; do
            mjml "$template" --output /dev/null
            template_count=$((template_count + 1))
          done < <(find mjml -type f -name '*.mjml' -print0)
          test "$template_count" -gt 0

  lint:
    name: Lint Workspace
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Bind build identity to checkout
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse --verify HEAD)"
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not determine canonical checkout SHA"
            exit 1
          fi
          printf 'COMMIT_SHA=%s\n' "$sha" >> "$GITHUB_ENV"
          printf 'Testing checkout %s\n' "$sha"

      - name: Compute common baseline comparison ref
        id: common-baseline-base
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ github.event.before }}" \
               && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            echo "sha=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=HEAD^" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Install dependency graph checker
        run: cargo install cargo-depgraph-check --version 0.1.0 --locked

      - name: Check dependency graph rules
        run: cargo depgraph-check check

      - name: Clippy lint
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings -D clippy::result-large-err

  determine-affected-crates:
    name: Determine Affected Crates
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      integration_test_crates: ${{ steps.determine.outputs.integration_test_crates }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Bind build identity to checkout
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse --verify HEAD)"
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not determine canonical checkout SHA"
            exit 1
          fi
          printf 'COMMIT_SHA=%s\n' "$sha" >> "$GITHUB_ENV"
          printf 'Testing checkout %s\n' "$sha"

      - name: Install Toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Build ci-determinator
        run: cargo build --locked --release --package ci-determinator

      - name: Compute base ref
        id: base-ref
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=HEAD~1" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine affected crates
        id: determine
        run: |
          result=$(./target/release/ci-determinator "${{ steps.base-ref.outputs.sha }}")
          integration_test_crates=$(jq -c '.integration_test' <<< "$result")

          printf 'integration_test_crates=%s\n' "$integration_test_crates" >> "$GITHUB_OUTPUT"

  test:
    name: Test ${{ matrix.crate }}
    needs: [determine-affected-crates]
    if: needs.determine-affected-crates.outputs.integration_test_crates != '[]'
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    strategy:
      matrix:
        crate: ${{ fromJson(needs.determine-affected-crates.outputs.integration_test_crates) }}
    steps:
      - uses: actions/checkout@v7

      - name: Bind build identity to checkout
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse --verify HEAD)"
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not determine canonical checkout SHA"
            exit 1
          fi
          printf 'COMMIT_SHA=%s\n' "$sha" >> "$GITHUB_ENV"
          printf 'Testing checkout %s\n' "$sha"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare PostgreSQL fixture image
        shell: bash
        run: bash .github/scripts/prepare-postgres-test-image.sh

      - name: Install Toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Create coverage output directory
        run: |
          mkdir -p "${{ github.workspace }}/coverage-profraw"
          test -d "${{ github.workspace }}/coverage-profraw"
          test -w "${{ github.workspace }}/coverage-profraw"

      - name: Test ${{ matrix.crate }}
        working-directory: ${{ matrix.crate }}
        env:
          CARGO_PROFILE_TEST_DEBUG: 1
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_API_KEY }}
          RUSTFLAGS: "-C instrument-coverage"
          LLVM_PROFILE_FILE: "${{ github.workspace }}/coverage-profraw/${{ strategy.job-index }}-%p-%m.profraw"
        run: cargo test --locked --all-features -- --nocapture

      - name: Add Cargo bin to PATH
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install grcov
        run: cargo install grcov

      - name: Generate coverage for ${{ matrix.crate }}
        run: |
          set -euo pipefail
          if profile_path="$(find coverage-profraw -type f -name "*.profraw" -print -quit)"; then
            if [ -z "$profile_path" ]; then
              echo "No LLVM coverage profiles were written." >&2
              exit 1
            fi
          else
            status=$?
            echo "Failed to search for LLVM coverage profiles (find exited with $status)." >&2
            exit "$status"
          fi
          mkdir -p coverage-lcov
          grcov coverage-profraw --binary-path ./target/debug/deps/ -s . -t lcov --branch --ignore-not-existing --ignore "/*" --ignore "*/target/*" --ignore "*/.cargo/*" -o "coverage-lcov/${{ strategy.job-index }}.lcov"
          test -s "coverage-lcov/${{ strategy.job-index }}.lcov"

      - name: Upload coverage for ${{ matrix.crate }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ strategy.job-index }}
          path: coverage-lcov/${{ strategy.job-index }}.lcov
          if-no-files-found: error
          retention-days: 1

      - name: Prune Docker volumes
        run: docker volume prune -f

  deployment-checks:
    name: Test deployment tooling
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Check local test tools
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          openssl version
          compose_version="$(docker compose version --short)"
          COMPOSE_VERSION="$compose_version" python3 - <<'PY_COMPOSE'
          import os
          import re

          raw = os.environ["COMPOSE_VERSION"].strip()
          match = re.fullmatch(r"v?(\d+)\.(\d+)(?:\.(\d+))?", raw)
          if match is None:
              raise SystemExit(f"Unsupported Docker Compose version output: {raw!r}")
          version = tuple(int(part or 0) for part in match.groups())
          if version < (2, 30, 0):
              raise SystemExit(f"Docker Compose >=2.30 is required; found {raw}")
          print(f"Docker Compose {raw}")
          PY_COMPOSE

      - name: Run lightweight deployment checks
        shell: bash
        run: |
          set -euo pipefail
          env -i PATH="$PATH" PYTHONDONTWRITEBYTECODE=1 \
            AURA_TEST_COMPOSE_CONFIG=1 \
            python3 deploy/tests/run_ci.py

  sonar:
    name: SonarQube-Cloud Analysis
    needs: [test]
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download coverage artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: coverage-artifacts
          merge-multiple: true

      - name: Merge coverage reports
        run: |
          find coverage-artifacts -name "*.lcov" -type f | sort > coverage-files.txt
          if ! [ -s coverage-files.txt ]; then
            echo "No coverage reports were downloaded."
            exit 1
          fi
          xargs cat < coverage-files.txt > coverage.lcov
          test -s coverage.lcov

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Clean coverage artifacts
        if: always()
        run: |
          rm -rf coverage-artifacts coverage-files.txt coverage.lcov
