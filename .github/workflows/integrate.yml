name: Integrate (CI)

on:
  push:
    branches: [develop]
    paths: &rust_paths
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".cargo/**"
      - ".config/**"
      - "ci/**"
      - "tooling/**"
      - "tests/**"
      - "rust-toolchain.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "depgraph-rules.toml"
      - "sonar-project.properties"
      - "src/**"
      - "migrations/**"
      - "opensearch/**"
      - "mjml/**"
  pull_request:
    paths: *rust_paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_BUILD_JOBS: 4

jobs:
  lint:
    name: Lint Workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: lint
      - name: Check CI tooling
        run: python3 -m unittest discover -s ci/tests
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Check geographic reference reproducibility
        run: python3 src/geo/scripts/generate_reference.py --check
      - name: Install dependency graph checker
        run: cargo install cargo-depgraph-check --version 0.1.0 --locked
      - name: Check dependency graph rules
        run: cargo depgraph-check check
      - name: Clippy lint
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings -D clippy::result-large-err

  api:
    name: Test API
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/test-lane
        with:
          id: api
          lanes: API
          harness: nextest
          slots: 4
          profile: api

  crawler:
    name: Test Crawler
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/test-lane
        with:
          id: crawler
          lanes: CRAWLER
          harness: nextest
          slots: 4
          profile: postgres

  integration:
    name: Test Integration
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/test-lane
        with:
          id: integration
          lanes: INFRASTRUCTURE
          harness: nextest
          slots: 4
          profile: api

  remaining:
    name: Test Remaining
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/test-lane
        with:
          id: remaining
          lanes: REMAINING
          harness: nextest
          slots: 4
          profile: none

  sonar:
    name: SonarQube-Cloud Analysis
    needs: [lint, api, crawler, integration, remaining]
    if: always()
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require every independent quality job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          jobs = json.loads(os.environ['RESULTS'])
          expected = {'lint', 'api', 'crawler', 'integration', 'remaining'}
          if set(jobs) != expected or any(job['result'] != 'success' for job in jobs.values()):
              raise SystemExit('Every lint and test lane must succeed: ' + os.environ['RESULTS'])
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Download coverage artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          path: coverage-artifacts
          merge-multiple: false
      - name: Require complete valid lane coverage
        run: python3 ci/merge-coverage.py --input coverage-artifacts --output coverage.lcov api crawler integration remaining
      - name: SonarCloud scan and quality gate
        uses: SonarSource/sonarqube-scan-action@b632445a46f521460d97cad21057b904b24c326f
        with:
          args: -Dsonar.qualitygate.wait=true -Dsonar.qualitygate.timeout=600
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
