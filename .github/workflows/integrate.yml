name: Integrate (CI)

on:
  push:
    branches: [prod, develop]
    paths:
      - ".github/workflows/integrate.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "depgraph-rules.toml"
      - "sonar-project.properties"
      - "src/**"
      - "infra/**"
      - "mjml/**"
  pull_request:
    paths:
      - ".github/workflows/integrate.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "depgraph-rules.toml"
      - "sonar-project.properties"
      - "src/**"
      - "infra/**"
      - "opensearch/**"
      - "mjml/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/prod' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_API_KEY }}

jobs:
  infra-test:
    name: Test CDK infrastructure
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install CDK dependencies
        run: npm --prefix infra ci

      - name: Type-check CDK app
        run: npm --prefix infra run build

      - name: Test CDK app
        run: npm --prefix infra test

      - name: Synthesize all stacks
        run: npm --prefix infra run synth:all

  lint:
    name: Lint Workspace
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Install dependency graph checker
        run: cargo install cargo-depgraph-check --version 0.1.0 --locked

      - name: Check dependency graph rules
        run: cargo depgraph-check check

      - name: Clippy lint
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings -D clippy::result-large-err

  determine-affected-crates:
    name: Determine Affected Crates
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      integration_test_crates: ${{ steps.determine.outputs.integration_test_crates }}
      acceptance_test_crates: ${{ steps.determine.outputs.acceptance_test_crates }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build ci-determinator
        run: cargo build --locked --release --package ci-determinator

      - name: Compute base ref
        id: base-ref
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=HEAD~1" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine affected crates
        id: determine
        run: |
          result=$(./target/release/ci-determinator "${{ steps.base-ref.outputs.sha }}")
          echo "integration_test_crates=$(echo "$result" | jq -c '.integration_test')" >> "$GITHUB_OUTPUT"
          echo "acceptance_test_crates=$(echo "$result" | jq -c '.acceptance_test')" >> "$GITHUB_OUTPUT"

  test:
    name: Test ${{ matrix.crate }}
    needs: [determine-affected-crates]
    if: needs.determine-affected-crates.outputs.integration_test_crates != '[]'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      matrix:
        crate: ${{ fromJson(needs.determine-affected-crates.outputs.integration_test_crates) }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools

      - uses: Swatinem/rust-cache@v2

      - name: Test ${{ matrix.crate }}
        working-directory: ${{ matrix.crate }}
        env:
          CARGO_PROFILE_TEST_DEBUG: 1
          RUSTFLAGS: "-C instrument-coverage"
          LLVM_PROFILE_FILE: "${{ github.workspace }}/coverage-profraw/${{ strategy.job-index }}-%p-%m.profraw"
        run: |
          mkdir -p "${{ github.workspace }}/coverage-profraw"
          cargo test --locked --all-features -- --nocapture

      - name: Add Cargo bin to PATH
        if: always()
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install grcov
        if: always()
        run: cargo install grcov

      - name: Generate coverage for ${{ matrix.crate }}
        if: always()
        run: |
          mkdir -p coverage-lcov
          if find coverage-profraw -name "*.profraw" -type f | grep -q .; then
            grcov . --binary-path ./target/debug/deps/ -s . -t lcov --branch --ignore-not-existing --ignore "/*" --ignore "*/target/*" --ignore "*/.cargo/*" -o "coverage-lcov/${{ strategy.job-index }}.lcov"
          else
            touch "coverage-lcov/${{ strategy.job-index }}.lcov"
          fi

      - name: Upload coverage for ${{ matrix.crate }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ strategy.job-index }}
          path: coverage-lcov/${{ strategy.job-index }}.lcov
          if-no-files-found: warn
          retention-days: 1

      - name: Prune Docker volumes
        run: docker volume prune -f

  acceptance-test:
    name: Acceptance-Test
    needs: [determine-affected-crates]
    if: needs.determine-affected-crates.outputs.acceptance_test_crates != '[]' && !always() # temporary disabled while migrating to Hetzner/Postgres
    permissions:
      contents: read
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Cache cargo-lambda and Zig
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/cargo-lambda
            ~/.cache/zig
          key: ${{ runner.os }}-cargo-lambda-zig-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Zig
        run: |
          if ! command -v zig >/dev/null 2>&1; then
            npm install -g @ziglang/cli
          fi

      - name: Install cargo-lambda
        run: |
          if ! command -v cargo-lambda >/dev/null 2>&1; then
            cargo install cargo-lambda
          fi

      - name: Install CDK dependencies
        run: npm --prefix infra ci

      - name: Type-check CDK app
        run: npm --prefix infra run build

      - name: Test acceptance-tests
        run: cargo test --locked --package acceptance-tests -- --nocapture

      - name: Prune Docker volumes
        run: docker volume prune -f

  sonar:
    name: SonarQube-Cloud Analysis
    needs: [test]
    permissions:
      contents: read
      pull-requests: read
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download coverage artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: coverage-*
          path: coverage-artifacts
          merge-multiple: true

      - name: Merge coverage reports
        run: |
          mkdir -p coverage-artifacts
          find coverage-artifacts -name "*.lcov" -type f | sort > coverage-files.txt
          if [ -s coverage-files.txt ]; then
            xargs cat < coverage-files.txt > coverage.lcov
          else
            touch coverage.lcov
          fi

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Clean coverage artifacts
        if: always()
        run: |
          rm -rf coverage-artifacts coverage-files.txt coverage.lcov
