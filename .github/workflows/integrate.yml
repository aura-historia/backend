# Experiment for #2425 only: never merge this workflow.
name: Integrate (CI)

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".cargo/**"
      - ".config/**"
      - "ci/**"
      - "tooling/**"
      - "tests/**"
      - "rust-toolchain.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "depgraph-rules.toml"
      - "sonar-project.properties"
      - "src/**"
      - "migrations/**"
      - "opensearch/**"
      - "mjml/**"
      - "docs/swagger.yaml"
      - "docs/fixtures/**"
      - "infra/sql/**"
      - "infra/assets/rds-ca-layer/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_BUILD_JOBS: 4

jobs:
  baseline:
    name: Screen baseline (develop dependency cache)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/kache-screen
        with:
          mode: baseline

  kache-populate:
    name: Screen kache population
    # Completed in run 39950816384; this rerun repairs only the baseline measurement.
    if: false
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/kache-screen
        with:
          mode: populate

  kache-reuse:
    name: Screen kache fresh-runner reuse
    # Completed in run 39950816384; this rerun repairs only the baseline measurement.
    if: false
    needs: kache-populate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/kache-screen
        with:
          mode: reuse
