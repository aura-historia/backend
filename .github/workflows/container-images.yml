name: Container image checks

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact commit to build, selected by the deploy workflow
        required: false
        type: string
      publish:
        description: Push the tested application image to GHCR, tagged with the commit
        required: false
        type: boolean
        default: false
    outputs:
      image:
        description: The published image, pinned by digest (ghcr.io/<owner>/<repository>@sha256:…)
        value: ${{ jobs.image.outputs.published }}
  pull_request:
    paths:
      - ".dockerignore"
      - "Dockerfile"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "src/**"
      - "mjml/**"
      - "migrations/**"
      - "infra/sql/**"
      - "infra/assets/rds-ca-layer/**"
      - "ci/container-images.json"
      - "ci/container-images.cjs"
      - "ci/container-images*.test.cjs"
      - "ci/container-images/**"
      - ".github/workflows/container-images.yml"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/mjml-templates.yml"
      - "host/**"
      - "opensearch/prod/**"
      - "ci/host-prod/**"
  push:
    branches: [develop]
    paths:
      - ".dockerignore"
      - "Dockerfile"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "src/**"
      - "mjml/**"
      - "migrations/**"
      - "infra/sql/**"
      - "infra/assets/rds-ca-layer/**"
      - "ci/container-images.json"
      - "ci/container-images.cjs"
      - "ci/container-images*.test.cjs"
      - "ci/container-images/**"
      - ".github/workflows/container-images.yml"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/mjml-templates.yml"
      - "host/**"
      - "opensearch/prod/**"
      - "ci/host-prod/**"

permissions:
  contents: read

jobs:
  catalog:
    name: Validate image catalog
    runs-on: ubuntu-latest
    outputs:
      container_matrix: ${{ steps.catalog.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - name: Validate catalog and fixture logic
        run: |
          node ci/container-images.cjs validate
          node --test ci/container-images*.test.cjs
      - name: Read container image catalog
        id: catalog
        run: node ci/container-images.cjs matrix >> "$GITHUB_OUTPUT"

  host-scripts:
    name: Lint and test host scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - name: Shellcheck
        run: |
          shellcheck --version
          git ls-files -z -- 'host/*.sh' 'host/**/*.sh' 'ci/host-prod/*.sh' | xargs -0 shellcheck --severity=warning
      - name: Migration plan tests
        run: python3 -m unittest discover -s ci/host-prod

  image:
    name: Build and test ${{ matrix.id }}
    needs: [catalog]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Used only by the publish step, which runs only when the deploy workflow asks for it.
      packages: write
    outputs:
      published: ${{ steps.publish.outputs.image }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.catalog.outputs.container_matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - name: Configure Docker Hub mirror
        shell: bash
        run: |
          sudo python3 - <<'PYTHON'
          import json
          from pathlib import Path
          path = Path("/etc/docker/daemon.json")
          config = json.loads(path.read_text()) if path.exists() else {}
          mirrors = config.get("registry-mirrors", [])
          config["registry-mirrors"] = ["https://mirror.gcr.io"] + [mirror for mirror in mirrors if mirror != "https://mirror.gcr.io"]
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(config))
          PYTHON
          sudo systemctl restart docker
      - name: Build local image
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.source_sha || github.sha }}
          IMAGE_ID: ${{ matrix.id }}
          IMAGE_BINARY: ${{ matrix.binary }}
          IMAGE_PLATFORM: ${{ matrix.platform }}
          IMAGE_DOCKERFILE: ${{ matrix.dockerfile }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          build_identity="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}"
          IMAGE="local/${IMAGE_ID}:${CANDIDATE_SHA}"
          docker build --platform "$IMAGE_PLATFORM" -f "$IMAGE_DOCKERFILE" \
            --build-arg "SOURCE_REVISION=${CANDIDATE_SHA}" \
            --build-arg "BUILD_WORKFLOW_IDENTITY=${build_identity}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${CANDIDATE_SHA}" \
            --label "org.opencontainers.image.title=${IMAGE_BINARY}" \
            --label "com.aura-historia.build-workflow=${build_identity}" \
            -t "$IMAGE" .
          test -x "ci/container-images/${IMAGE_ID}/smoke.sh"
          bash ci/container-images/${IMAGE_ID}/smoke.sh "$IMAGE"
      - name: Smoke-test the prod Compose project with this image
        if: matrix.id == 'aura-historia'
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.source_sha || github.sha }}
          IMAGE_ID: ${{ matrix.id }}
        run: bash ci/host-prod/smoke.sh "local/${IMAGE_ID}:${CANDIDATE_SHA}"
      - name: Publish to GHCR
        id: publish
        if: inputs.publish && matrix.id == 'aura-historia'
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.source_sha || github.sha }}
          IMAGE_ID: ${{ matrix.id }}
          REPOSITORY: ghcr.io/${{ github.repository_owner }}/${{ matrix.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker tag "local/${IMAGE_ID}:${CANDIDATE_SHA}" "${REPOSITORY}:${CANDIDATE_SHA}"
          docker push --quiet "${REPOSITORY}:${CANDIDATE_SHA}"
          image="$(docker image inspect --format '{{index .RepoDigests 0}}' "${REPOSITORY}:${CANDIDATE_SHA}")"
          [[ ${image} =~ ^${REPOSITORY}@sha256:[0-9a-f]{64}$ ]]
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "Published \`${image}\`" >> "$GITHUB_STEP_SUMMARY"
