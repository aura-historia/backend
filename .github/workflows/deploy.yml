name: Deploy (CD)

on:
  push:
    branches: [prod, develop]
    paths:
      - ".github/workflows/deploy.yml"
      - ".github/workflows/initialize.yml"
      - ".dockerignore"
      - "src/aura-historia-cron/Dockerfile"
      - "rust-toolchain.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "migrations/**"
      - "infra/**"
      - "mjml/**"
  workflow_dispatch:
    inputs:
      stage:
        description: "Stage to deploy"
        required: true
        type: choice
        options:
          - dev
          - prod
      commit_sha:
        description: "Full 40-character lowercase SHA of artifacts already uploaded for this stage"
        required: true
        type: string

concurrency:
  group: aws-deploy-${{ github.event_name == 'workflow_dispatch' && inputs.stage || github.ref == 'refs/heads/prod' && 'prod' || 'dev' }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  STAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.stage
    || github.ref == 'refs/heads/prod' && 'prod'
    || github.ref == 'refs/heads/develop' && 'dev' }}
  STACK_NAME_PREFIX: application-${{ github.event_name == 'workflow_dispatch' && inputs.stage || github.ref == 'refs/heads/prod' && 'prod' || 'dev' }}
  DEPLOY_COMMIT_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.commit_sha || github.event_name == 'push' && github.sha || '' }}

jobs:
  infra-test:
    name: Test CDK infrastructure
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install CDK dependencies
        run: npm --prefix infra ci

      - name: Type-check CDK app
        run: npm --prefix infra run build

      - name: Test CDK app
        run: npm --prefix infra test

      - name: Synthesize all stacks
        run: npm --prefix infra run synth:all

  aws-push-periodic-matcher:
    name: Publish verified periodic matcher image
    if: github.event_name == 'push'
    needs: [infra-test]
    concurrency:
      group: aws-periodic-matcher-artifact-apply
      cancel-in-progress: false
    environment:
      name: ${{ github.ref == 'refs/heads/prod' && 'aws-prod' || 'aws-dev' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image_digest: ${{ steps.image.outputs.image_digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_COMMIT_SHA }}
      - name: Verify release source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$DEPLOY_COMMIT_SHA"
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Install locked CDK dependencies
        run: npm --prefix infra ci
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.CI_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Bootstrap retained artifact repository
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix infra run cdk -- deploy aura-historia-periodic-matcher-artifacts \
            --app 'npx ts-node --prefer-ts-exts bin/artifacts.ts' \
            --require-approval never --method change-set --exclusively \
            --no-path-metadata --no-asset-metadata --no-version-reporting --no-notices
      - name: Publish or verify image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          repository=aura-historia-periodic-matcher
          tag="git-${DEPLOY_COMMIT_SHA}"
          account="$(aws sts get-caller-identity --query Account --output text)"
          uri="${account}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/${repository}"
          dockerfile="$(git show "${DEPLOY_COMMIT_SHA}:src/aura-historia-cron/Dockerfile")"
          builder_base="$(sed -nE 's/^FROM rust:[^[:space:]@]+@(sha256:[0-9a-f]{64}) AS build$/\1/p' <<< "$dockerfile")"
          runtime_base="$(sed -nE 's/^FROM debian:[^[:space:]@]+@(sha256:[0-9a-f]{64})$/\1/p' <<< "$dockerfile")"
          [[ "$builder_base" =~ ^sha256:[0-9a-f]{64}$ && "$runtime_base" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          if aws ecr describe-images --repository-name "$repository" --image-ids imageTag="$tag" \
            --output json > image.json 2>image-error.txt; then
            existing=true
          elif grep -q 'ImageNotFoundException' image-error.txt; then
            existing=false
          else
            cat image-error.txt >&2
            exit 1
          fi
          aws ecr get-login-password | docker login --username AWS --password-stdin "${uri%/*}"
          if [ "$existing" = false ]; then
            build_workflow_identity="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}"
            docker build --platform linux/amd64 \
              -f src/aura-historia-cron/Dockerfile \
              --build-arg "SOURCE_REVISION=${DEPLOY_COMMIT_SHA}" \
              --build-arg "BUILD_WORKFLOW_IDENTITY=${build_workflow_identity}" \
              --label "com.aura-historia.builder-base.digest=${builder_base}" \
              --label "org.opencontainers.image.base.digest=${runtime_base}" \
              -t "${uri}:${tag}" .
            docker image inspect "${uri}:${tag}" > built.json
            jq -e --arg sha "$DEPLOY_COMMIT_SHA" --arg workflow "$build_workflow_identity" --arg builder "$builder_base" --arg runtime "$runtime_base" \
              'length == 1 and .[0].Os == "linux" and .[0].Architecture == "amd64" and
               .[0].Config.Labels["org.opencontainers.image.revision"] == $sha and
               .[0].Config.Labels["org.opencontainers.image.source"] == "https://github.com/aura-historia/backend" and
               .[0].Config.Labels["com.aura-historia.build-workflow"] == $workflow and
               .[0].Config.Labels["com.aura-historia.builder-base.digest"] == $builder and
               .[0].Config.Labels["org.opencontainers.image.base.digest"] == $runtime and
               .[0].Config.User == "10001:10001" and
               (.[0].Config.ExposedPorts // {} | length == 0) and
               (.[0].Config.Volumes // {} | keys == ["/tmp"]) and
               .[0].Config.Entrypoint == ["/usr/local/bin/aura-historia-cron"] and
               (.[0].Config.Cmd // []) == []' built.json >/dev/null || {
              echo 'Built image source, platform or runtime provenance mismatch' >&2; exit 1;
            }
            if ! docker push "${uri}:${tag}" >push.log 2>&1; then
              cat push.log >&2
              # A competing publisher or a lost push response is safe only if the immutable
              # tag can now be read and the digest passes full provenance checks below.
              aws ecr describe-images --repository-name "$repository" --image-ids imageTag="$tag" \
                --output json > image.json 2>image-error.txt || { cat image-error.txt >&2; exit 1; }
              echo 'Push failed but the SHA tag exists; independently verifying its registry image.'
            else
              aws ecr describe-images --repository-name "$repository" --image-ids imageTag="$tag" \
                --output json > image.json
            fi
          fi
          digest="$(jq -r '.imageDetails | if length == 1 then .[0].imageDigest else empty end' image.json)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo 'Invalid ECR image digest' >&2; exit 1; }
          docker pull --platform linux/amd64 "${uri}@${digest}"
          docker image inspect "${uri}@${digest}" > inspected.json
          jq -e --arg sha "$DEPLOY_COMMIT_SHA" --arg builder "$builder_base" --arg runtime "$runtime_base" \
            'length == 1 and .[0].Os == "linux" and .[0].Architecture == "amd64" and
             .[0].Config.Labels["org.opencontainers.image.revision"] == $sha and
             .[0].Config.Labels["org.opencontainers.image.source"] == "https://github.com/aura-historia/backend" and
             (.[0].Config.Labels["com.aura-historia.build-workflow"] | type == "string" and test("^https://github\\.com/aura-historia/backend/actions/runs/[0-9]+/attempts/[0-9]+$")) and
             .[0].Config.Labels["com.aura-historia.builder-base.digest"] == $builder and
             .[0].Config.Labels["org.opencontainers.image.base.digest"] == $runtime and
             .[0].Config.User == "10001:10001" and
             (.[0].Config.ExposedPorts // {} | length == 0) and
             (.[0].Config.Volumes // {} | keys == ["/tmp"]) and
             .[0].Config.Entrypoint == ["/usr/local/bin/aura-historia-cron"] and
             (.[0].Config.Cmd // []) == []' inspected.json >/dev/null || {
            echo 'Image source, platform or runtime provenance mismatch' >&2; exit 1;
          }
          image_build_workflow="$(jq -r '.[0].Config.Labels["com.aura-historia.build-workflow"]' inspected.json)"
          image_ref="${uri}@${digest}"
          volume="matcher-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RANDOM}-${RANDOM}"
          container="${volume}-task"
          docker volume create "$volume" >/dev/null
          trap 'docker rm -f "$container" >/dev/null 2>&1 || :; docker volume rm -f "$volume" >/dev/null' EXIT
          status=0
          timeout 20s docker run --rm --name "$container" --network none --read-only "$image_ref" --run-once >smoke-args.log 2>&1 || status=$?
          test "$status" -eq 1 && grep -q 'accepts no arguments' smoke-args.log || {
            echo 'Argument rejection smoke test failed or timed out' >&2; exit 1;
          }
          status=0
          timeout 20s docker run --rm --name "$container" --network none --read-only \
            --mount "type=volume,src=${volume},dst=/tmp" \
            -e 'AURA_HISTORIA_GOOGLE_ADC_CREDENTIALS_JSON={"type":"authorized_user"}' \
            "$image_ref" >smoke-startup.log 2>&1 || status=$?
          test "$status" -eq 1 && grep -q 'startup_failed' smoke-startup.log || {
            echo 'Expected config failure not reached or timed out' >&2; exit 1;
          }
          adc_dir=/tmp/aura-historia-google-adc
          adc_file="${adc_dir}/application_default_credentials.json"
          dir_mode="$(docker run --rm --network none --read-only --user 10001:10001 \
            --mount "type=volume,src=${volume},dst=/tmp" --entrypoint /usr/bin/stat \
            "$image_ref" -c '%a:%u:%g' "$adc_dir")"
          file_mode="$(docker run --rm --network none --read-only --user 10001:10001 \
            --mount "type=volume,src=${volume},dst=/tmp" --entrypoint /usr/bin/stat \
            "$image_ref" -c '%a:%u:%g' "$adc_file")"
          test "$dir_mode" = '700:10001:10001'
          test "$file_mode" = '600:10001:10001'
          test "$(docker run --rm --network none --read-only --user 10001:10001 \
            --mount "type=volume,src=${volume},dst=/tmp" --entrypoint /usr/bin/cat \
            "$image_ref" "$adc_file")" = '{"type":"authorized_user"}'
          docker rm -f "$container" >/dev/null 2>&1 || :
          docker volume rm -f "$volume" >/dev/null
          trap - EXIT
          binary_sha="$(docker run --rm --network none --read-only --entrypoint /usr/bin/sha256sum \
            "$image_ref" /usr/local/bin/aura-historia-cron | cut -d ' ' -f 1)"
          rds_ca_sha="$(docker run --rm --network none --read-only --entrypoint /usr/bin/sha256sum \
            "$image_ref" /opt/aura-historia/rds-ca/global-bundle.pem | cut -d ' ' -f 1)"
          [[ "$binary_sha" =~ ^[0-9a-f]{64}$ && "$rds_ca_sha" =~ ^[0-9a-f]{64}$ ]] || exit 1
          expected_ca="$(sha256sum infra/assets/rds-ca-layer/aura-historia/rds-ca/global-bundle.pem | cut -d ' ' -f 1)"
          test "$rds_ca_sha" = "$expected_ca" || { echo 'Public RDS CA differs from selected source' >&2; exit 1; }
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ### Periodic matcher release evidence
          - Source SHA: ${DEPLOY_COMMIT_SHA}
          - Registry: ${uri}
          - Registry digest: ${digest}
          - Platform: linux/amd64
          - OCI source: https://github.com/aura-historia/backend
          - OCI revision: ${DEPLOY_COMMIT_SHA}
          - Builder base digest: ${builder_base}
          - Runtime base digest: ${runtime_base}
          - Build workflow: ${image_build_workflow}
          - Verification workflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} (attempt ${GITHUB_RUN_ATTEMPT})
          - Executable SHA256: ${binary_sha}
          - Public RDS CA SHA256: ${rds_ca_sha}
          EOF
          echo "image_digest=$digest" >> "$GITHUB_OUTPUT"

  aws-push-lambda:
    name: Publish Lambda ${{ matrix.binary }}
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      # Lambda-only artifact catalog; native CDC ingress is an external handoff.
      matrix:
        include:
          - crate: src/aura-historia-api
            binary: aura-historia-api
          - crate: src/shopify-lambda
            binary: shopify-lambda
          - crate: src/cognito-post-confirmation
            binary: cognito-post-confirmation
          - crate: src/cloudwatch-log-retention-lambda
            binary: cloudwatch-log-retention-lambda
          - crate: src/database-migration-lambda
            binary: database-migration-lambda
          - crate: src/fxrate-lambda
            binary: fxrate-lambda
          - crate: src/backend-cleanup-lambda
            binary: backend-cleanup-lambda
          - crate: src/stripe-lambda
            binary: stripe-lambda
          - crate: src/product-listing-opensearch-lambda
            binary: product-listing-opensearch-lambda
          - crate: src/product-listing-normalization-lambda
            binary: product-listing-normalization-lambda
          - crate: src/product-content-assessment-lambda
            binary: product-content-assessment-lambda
          - crate: src/product-embedding-lambda
            binary: product-embedding-lambda
          - crate: src/product-translation-lambda
            binary: product-translation-lambda
          - crate: src/search-filter-projection-lambda
            binary: search-filter-projection-lambda
          - crate: src/search-filter-percolator-lambda
            binary: search-filter-percolator-lambda
          - crate: src/search-filter-match-notification-lambda
            binary: search-filter-match-notification-lambda
          - crate: src/watchlist-notification-lambda
            binary: watchlist-notification-lambda
          - crate: src/notification-delivery-lambda
            binary: notification-delivery-lambda
          - crate: src/cdc-router-lambda
            binary: cdc-router-lambda
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_COMMIT_SHA }}

      - name: Install Toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Cache cargo-lambda
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/cargo-lambda
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-lambda-1.9.0

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - name: Install cargo-lambda
        run: |
          if ! cargo lambda --version | grep -Eq '^cargo-lambda 1\.9\.0($| )'; then
            cargo install cargo-lambda --version 1.9.0 --locked --force
          fi

      - name: Build Lambda binary
        working-directory: ${{ matrix.crate }}
        env:
          CARGO_PROFILE_RELEASE_LTO: true
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 1
        run: cargo lambda build --locked --release --target x86_64-unknown-linux-musl --output-format zip --bin "${{ matrix.binary }}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.CI_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload Lambda ZIP
        shell: bash
        env:
          BUCKET: ${{ vars.S3_BINARY_ARTIFACTS_BUCKET_NAME }}
          BINARY: ${{ matrix.binary }}
        run: |
          set -euo pipefail
          file="target/lambda/${BINARY}/bootstrap.zip"
          key="${BINARY}-${STAGE}-${DEPLOY_COMMIT_SHA}.zip"
          test -s "$file"
          aws s3api put-object --bucket "$BUCKET" --key "$key" --body "$file" \
            --tagging "stage=${STAGE}" >/dev/null

  aws-push-mail-templates:
    name: Compile and upload mail templates
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_COMMIT_SHA }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.CI_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install pinned MJML
        run: npm --prefix mjml ci

      - name: Compile and upload templates
        shell: bash
        env:
          BUCKET: ${{ vars.S3_MAIL_TEMPLATE_BUCKET_NAME }}
        run: |
          set -euo pipefail
          template_count=0
          while IFS= read -r -d '' template; do
            test -s "$template"
            name="${template%.mjml}.html"
            output="dist/emails/${name}"
            mkdir -p "$(dirname "$output")"
            mjml/node_modules/.bin/mjml "$template" -o "$output"
            test -s "$output"
            key="${STAGE}/${DEPLOY_COMMIT_SHA}/${name}"
            aws s3api put-object --bucket "$BUCKET" --key "$key" --body "$output" \
              --tagging "stage=${STAGE}" >/dev/null
            template_count=$((template_count + 1))
          done < <(git ls-files -z -- 'mjml/**/*.mjml')
          test "$template_count" -gt 0

  aws-cdk-deploy:
    name: Deploy CDK stacks after environment approval
    if: >-
      ${{ always() && needs.infra-test.result == 'success'
          && ((github.event_name == 'push' && needs.aws-push-lambda.result == 'success'
               && needs.aws-push-mail-templates.result == 'success'
               && needs.aws-push-periodic-matcher.result == 'success')
              || (github.event_name == 'workflow_dispatch' && needs.aws-push-lambda.result == 'skipped'
                  && needs.aws-push-mail-templates.result == 'skipped'
                  && needs.aws-push-periodic-matcher.result == 'skipped')) }}
    needs:
      [
        infra-test,
        aws-push-lambda,
        aws-push-mail-templates,
        aws-push-periodic-matcher,
      ]
    concurrency:
      group: aws-periodic-matcher-artifact-apply
      cancel-in-progress: false
    environment:
      name: ${{ (github.event_name == 'workflow_dispatch' && inputs.stage || github.ref == 'refs/heads/prod' && 'prod' || 'dev') == 'prod' && 'aws-prod' || 'aws-dev' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate commit SHA
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "${DEPLOY_COMMIT_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "commit_sha must be a full 40-character lowercase Git commit SHA" >&2
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        if: github.event_name == 'push'
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install CDK dependencies
        if: github.event_name == 'push'
        run: npm --prefix infra ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.CI_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy foundation or migrate and update initialized application
        if: github.event_name == 'push'
        shell: bash
        env:
          PERIODIC_MATCHER_IMAGE_DIGEST: ${{ needs.aws-push-periodic-matcher.outputs.image_digest }}
        run: |
          set -euo pipefail
          [[ "$PERIODIC_MATCHER_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          deploy() {
            npm --prefix infra run cdk -- deploy "$@" \
              --context stage="${STAGE}" \
              --context stackNamePrefix="${STACK_NAME_PREFIX}" \
              --require-approval never \
              --method change-set \
              --exclusively \
              --no-path-metadata \
              --no-asset-metadata \
              --no-version-reporting \
              --no-notices
          }
          stack_status() {
            local stack="$1"
            local status
            if status="$(aws cloudformation describe-stacks \
              --stack-name "${STACK_NAME_PREFIX}-${stack}" \
              --query 'Stacks[0].StackStatus' --output text 2>error.txt)"; then
              printf '%s\n' "$status"
            elif grep -Eq '\(ValidationError\).*does not exist' error.txt; then
              printf 'missing\n'
            else
              cat error.txt >&2
              return 1
            fi
          }

          # Missing application stacks (including partial initialization) are repaired by
          # Initialize after the foundation advances; failed/in-progress stacks require operator repair.
          for stack in compute api; do
            status="$(stack_status "$stack")"
            case "$status" in
              missing|CREATE_COMPLETE|UPDATE_COMPLETE|UPDATE_ROLLBACK_COMPLETE) ;;
              *) echo "Application stack ${stack} is ${status}; repair it before Deploy." >&2; exit 1 ;;
            esac
            if [ "$stack" = compute ]; then compute_status="$status"; else api_status="$status"; fi
          done
          observability_status=missing
          if [ "$STAGE" = prod ]; then
            observability_status="$(stack_status observability)"
            case "$observability_status" in
              missing|CREATE_COMPLETE|UPDATE_COMPLETE|UPDATE_ROLLBACK_COMPLETE) ;;
              *) echo "Observability stack is ${observability_status}; repair it before Deploy." >&2; exit 1 ;;
            esac
          fi
          needs_initialize=false
          if [ "$compute_status" = missing ] || [ "$api_status" = missing ] \
            || { [ "$STAGE" = prod ] && [ "$observability_status" = missing ]; }; then
            needs_initialize=true
          fi

          # A missing/partially created foundation is safe to resume; do not update a failed stack.
          for stack in network data initialize; do
            status="$(stack_status "$stack")"
            case "$status" in
              missing|CREATE_COMPLETE|UPDATE_COMPLETE|UPDATE_ROLLBACK_COMPLETE) ;;
              *) echo "Foundation stack ${stack} is ${status}; repair it before Deploy." >&2; exit 1 ;;
            esac
          done
          deploy "${STACK_NAME_PREFIX}-network"
          deploy "${STACK_NAME_PREFIX}-data"
          deploy "${STACK_NAME_PREFIX}-initialize" \
            --parameters "${STACK_NAME_PREFIX}-initialize:CommitSHA=${DEPLOY_COMMIT_SHA}"

          if [ "$needs_initialize" = true ]; then
            echo 'Foundation deployed. Run Initialize (CD) with this stage and commit SHA to repair initialization, migrate, and admit compute/API.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Only the initialization stack owns the private migration Lambda.
          # Update it to this verified SHA before invoking the embedded migrations.
          aws lambda wait function-updated --function-name "database-migration-lambda-${STAGE}"
          printf '{}' > migration-invocation.json
          response="$(aws lambda invoke \
            --function-name "database-migration-lambda-${STAGE}" \
            --invocation-type RequestResponse \
            --payload fileb://migration-invocation.json \
            --cli-binary-format raw-in-base64-out \
            --cli-connect-timeout 10 --cli-read-timeout 900 \
            migration-result.json --query '{StatusCode: StatusCode, FunctionError: FunctionError}' \
            --output json)" || { echo 'Private migration invocation failed.' >&2; exit 1; }
          if [ "$(jq -r '.StatusCode // empty' <<< "$response")" != 200 ] \
            || [ -n "$(jq -r '.FunctionError // empty' <<< "$response")" ] \
            || ! jq -se 'length == 1 and .[0] == {"status":"ready"}' migration-result.json >/dev/null; then
            echo 'Private migration failed; application admission is blocked.' >&2
            exit 1
          fi

          stacks=("${STACK_NAME_PREFIX}-compute" "${STACK_NAME_PREFIX}-api")
          if [ "$STAGE" = prod ]; then
            stacks+=("${STACK_NAME_PREFIX}-observability")
          fi
          # CDK retains existing activation parameters, including the approved CDC router value.
          deploy "${stacks[@]}" \
            --previous-parameters \
            --parameters "${STACK_NAME_PREFIX}-compute:CommitSHA=${DEPLOY_COMMIT_SHA}" \
                         "${STACK_NAME_PREFIX}-compute:PeriodicMatcherImageDigest=${PERIODIC_MATCHER_IMAGE_DIGEST}"
          task_definition_arn="$(aws cloudformation describe-stacks --stack-name "${STACK_NAME_PREFIX}-compute" --output json | jq -er '.Stacks[0].Outputs[] | select(.OutputKey == "TaskDefinitionArn") | .OutputValue')"
          {
            echo '## Periodic matcher deployment'
            echo "- Source SHA: ${DEPLOY_COMMIT_SHA}"
            echo "- Registry digest: ${PERIODIC_MATCHER_IMAGE_DIGEST}"
            echo "- Task-definition revision: ${task_definition_arn}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preflight stage artifacts and deployed stack state
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          MAIL_BUCKET: ${{ vars.S3_MAIL_TEMPLATE_BUCKET_NAME }}
        run: |
          set -euo pipefail
          repository=aura-historia-periodic-matcher
          tag="git-${DEPLOY_COMMIT_SHA}"
          git fetch --no-tags --depth=1 origin "$DEPLOY_COMMIT_SHA"
          dockerfile="$(git show "${DEPLOY_COMMIT_SHA}:src/aura-historia-cron/Dockerfile")"
          builder_base="$(sed -nE 's/^FROM rust:[^[:space:]@]+@(sha256:[0-9a-f]{64}) AS build$/\1/p' <<< "$dockerfile")"
          runtime_base="$(sed -nE 's/^FROM debian:[^[:space:]@]+@(sha256:[0-9a-f]{64})$/\1/p' <<< "$dockerfile")"
          [[ "$builder_base" =~ ^sha256:[0-9a-f]{64}$ && "$runtime_base" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          image="$(aws ecr describe-images --repository-name "$repository" --image-ids imageTag="$tag" --output json)"
          PERIODIC_MATCHER_IMAGE_DIGEST="$(jq -r '.imageDetails | if length == 1 then .[0].imageDigest else empty end' <<< "$image")"
          [[ "$PERIODIC_MATCHER_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          account="$(aws sts get-caller-identity --query Account --output text)"
          uri="${account}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/${repository}"
          aws ecr get-login-password | docker login --username AWS --password-stdin "${uri%/*}"
          docker pull --platform linux/amd64 "${uri}@${PERIODIC_MATCHER_IMAGE_DIGEST}"
          docker image inspect "${uri}@${PERIODIC_MATCHER_IMAGE_DIGEST}" > inspected.json
          jq -e --arg sha "$DEPLOY_COMMIT_SHA" --arg builder "$builder_base" --arg runtime "$runtime_base" \
            'length == 1 and .[0].Os == "linux" and .[0].Architecture == "amd64" and
             .[0].Config.Labels["org.opencontainers.image.revision"] == $sha and
             .[0].Config.Labels["org.opencontainers.image.source"] == "https://github.com/aura-historia/backend" and
             (.[0].Config.Labels["com.aura-historia.build-workflow"] | type == "string" and test("^https://github\\.com/aura-historia/backend/actions/runs/[0-9]+/attempts/[0-9]+$")) and
             .[0].Config.Labels["com.aura-historia.builder-base.digest"] == $builder and
             .[0].Config.Labels["org.opencontainers.image.base.digest"] == $runtime and
             .[0].Config.User == "10001:10001" and
             (.[0].Config.ExposedPorts // {} | length == 0) and
             (.[0].Config.Volumes // {} | keys == ["/tmp"]) and
             .[0].Config.Entrypoint == ["/usr/local/bin/aura-historia-cron"] and
             (.[0].Config.Cmd // []) == []' inspected.json >/dev/null || {
            echo 'Image source, platform or runtime provenance mismatch' >&2; exit 1;
          }
          image_ref="${uri}@${PERIODIC_MATCHER_IMAGE_DIGEST}"
          volume="matcher-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RANDOM}-${RANDOM}"
          container="${volume}-task"
          docker volume create "$volume" >/dev/null
          trap 'docker rm -f "$container" >/dev/null 2>&1 || :; docker volume rm -f "$volume" >/dev/null' EXIT
          status=0
          timeout 20s docker run --rm --name "$container" --network none --read-only "$image_ref" --run-once >smoke-args.log 2>&1 || status=$?
          test "$status" -eq 1 && grep -q 'accepts no arguments' smoke-args.log || {
            echo 'Argument rejection smoke test failed or timed out' >&2; exit 1;
          }
          status=0
          timeout 20s docker run --rm --name "$container" --network none --read-only \
            --mount "type=volume,src=${volume},dst=/tmp" \
            -e 'AURA_HISTORIA_GOOGLE_ADC_CREDENTIALS_JSON={"type":"authorized_user"}' \
            "$image_ref" >smoke-startup.log 2>&1 || status=$?
          test "$status" -eq 1 && grep -q 'startup_failed' smoke-startup.log || {
            echo 'Expected config failure not reached or timed out' >&2; exit 1;
          }
          adc_dir=/tmp/aura-historia-google-adc
          adc_file="${adc_dir}/application_default_credentials.json"
          dir_mode="$(docker run --rm --network none --read-only --user 10001:10001 \
            --mount "type=volume,src=${volume},dst=/tmp" --entrypoint /usr/bin/stat \
            "$image_ref" -c '%a:%u:%g' "$adc_dir")"
          file_mode="$(docker run --rm --network none --read-only --user 10001:10001 \
            --mount "type=volume,src=${volume},dst=/tmp" --entrypoint /usr/bin/stat \
            "$image_ref" -c '%a:%u:%g' "$adc_file")"
          test "$dir_mode" = '700:10001:10001'
          test "$file_mode" = '600:10001:10001'
          test "$(docker run --rm --network none --read-only --user 10001:10001 \
            --mount "type=volume,src=${volume},dst=/tmp" --entrypoint /usr/bin/cat \
            "$image_ref" "$adc_file")" = '{"type":"authorized_user"}'
          docker rm -f "$container" >/dev/null 2>&1 || :
          docker volume rm -f "$volume" >/dev/null
          trap - EXIT
          rds_ca_sha="$(docker run --rm --network none --read-only --entrypoint /usr/bin/sha256sum \
            "$image_ref" /opt/aura-historia/rds-ca/global-bundle.pem | cut -d ' ' -f 1)"
          expected_ca="$(git show "${DEPLOY_COMMIT_SHA}:infra/assets/rds-ca-layer/aura-historia/rds-ca/global-bundle.pem" | sha256sum | cut -d ' ' -f 1)"
          test "$rds_ca_sha" = "$expected_ca" || { echo 'Public RDS CA differs from selected source' >&2; exit 1; }
          echo "PERIODIC_MATCHER_IMAGE_DIGEST=$PERIODIC_MATCHER_IMAGE_DIGEST" >> "$GITHUB_ENV"
          # Check tracked templates from the workflow source, not an older release tree.
          template_count=0
          while IFS= read -r -d '' template; do
            key="${STAGE}/${DEPLOY_COMMIT_SHA}/${template%.mjml}.html"
            aws s3api head-object --bucket "$MAIL_BUCKET" --key "$key" >/dev/null || {
              echo "Missing stage mail artifact: $key" >&2; exit 1;
            }
            template_count=$((template_count + 1))
          done < <(git ls-files -z -- 'mjml/**/*.mjml')
          test "$template_count" -gt 0

          stacks=(network data initialize compute api)
          if [ "$STAGE" = prod ]; then
            stacks+=(observability)
          fi
          for stack in "${stacks[@]}"; do
            name="${STACK_NAME_PREFIX}-${stack}"
            if ! aws cloudformation describe-stacks --stack-name "$name" --output json > "${stack}-stack.json"; then
              echo "Stack $name is missing or inaccessible; finish Initialize (CD) first." >&2
              exit 1
            fi
            status="$(jq -r '.Stacks[0].StackStatus // empty' "${stack}-stack.json")"
            case "$status" in
              CREATE_COMPLETE|UPDATE_COMPLETE|UPDATE_ROLLBACK_COMPLETE) ;;
              *) echo "Stack $name is not safe to update: ${status:-missing}" >&2; exit 1 ;;
            esac
          done
          for stack in initialize compute; do
            file="${stack}-stack.json"
            if ! jq -e '[.Stacks[0].Parameters[]? | select(.ParameterKey == "CommitSHA") | .ParameterValue] | length == 1 and (.[0] | type == "string" and test("^[0-9a-f]{40}$"))' "$file" >/dev/null; then
              echo "Stack $stack must have one valid CommitSHA parameter." >&2; exit 1
            fi
          done
          if ! jq -e '[.Stacks[0].Parameters[]? | select(.ParameterKey == "CdcRouterEnabled") | .ParameterValue] | length == 1 and (.[0] == "true" or .[0] == "false")' compute-stack.json >/dev/null; then
            echo 'Compute stack must have a valid CdcRouterEnabled parameter.' >&2; exit 1
          fi
          for parameter in PeriodicMatcherEnabled PeriodicMatcherImageDigest; do
            if ! jq -e --arg key "$parameter" '[.Stacks[0].Parameters[]? | select(.ParameterKey == $key)] | length == 1' compute-stack.json >/dev/null; then
              echo "Unsupported historical compute template: missing $parameter" >&2; exit 1
            fi
          done
          jq -e '[.Stacks[0].Parameters[] | select(.ParameterKey == "PeriodicMatcherEnabled") | .ParameterValue] | . == ["true"] or . == ["false"]' compute-stack.json >/dev/null || exit 1
          jq -e '[.Stacks[0].Parameters[] | select(.ParameterKey == "PeriodicMatcherImageDigest") | .ParameterValue] | length == 1 and (.[0] | test("^sha256:[0-9a-f]{64}$"))' compute-stack.json >/dev/null || exit 1

      - name: Update artifact SHA and image digest with previous CloudFormation templates
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          for stack in initialize compute; do
            name="${STACK_NAME_PREFIX}-${stack}"
            current_sha="$(jq -r '.Stacks[0].Parameters[] | select(.ParameterKey == "CommitSHA") | .ParameterValue' "${stack}-stack.json")"
            current_digest="$(jq -r '.Stacks[0].Parameters[] | select(.ParameterKey == "PeriodicMatcherImageDigest") | .ParameterValue' "${stack}-stack.json")"
            if [ "$current_sha" = "$DEPLOY_COMMIT_SHA" ] && { [ "$stack" = initialize ] || [ "$current_digest" = "$PERIODIC_MATCHER_IMAGE_DIGEST" ]; }; then
              echo "$name already selects the requested release."
              continue
            fi
            # Supply every existing parameter with UsePreviousValue, including CdcRouterEnabled.
            jq --arg sha "$DEPLOY_COMMIT_SHA" --arg digest "$PERIODIC_MATCHER_IMAGE_DIGEST" \
              '[.Stacks[0].Parameters[] | if .ParameterKey == "CommitSHA" then
                {ParameterKey, ParameterValue: $sha}
              elif .ParameterKey == "PeriodicMatcherImageDigest" then
                {ParameterKey, ParameterValue: $digest}
              else {ParameterKey, UsePreviousValue: true} end]' \
              "${stack}-stack.json" > "${stack}-parameters.json"
            aws cloudformation update-stack --stack-name "$name" \
              --use-previous-template --capabilities CAPABILITY_NAMED_IAM \
              --parameters "file://${stack}-parameters.json" >/dev/null
            aws cloudformation wait stack-update-complete --stack-name "$name"
          done
          task_definition_arn="$(aws cloudformation describe-stacks --stack-name "${STACK_NAME_PREFIX}-compute" --output json | jq -er '.Stacks[0].Outputs[] | select(.OutputKey == "TaskDefinitionArn") | .OutputValue')"
          {
            echo '## Periodic matcher rollback selection'
            echo "- Source SHA: ${DEPLOY_COMMIT_SHA}"
            echo "- Registry digest: ${PERIODIC_MATCHER_IMAGE_DIGEST}"
            echo "- Task-definition revision: ${task_definition_arn}"
            echo '- Only initialization/compute artifact parameters were changed; no migration was invoked.'
          } >> "$GITHUB_STEP_SUMMARY"
