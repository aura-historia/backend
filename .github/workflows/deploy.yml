name: Deploy (CD)

on:
  push:
    branches: [prod, develop]
    paths:
      - ".github/workflows/deploy.yml"
      - ".github/workflows/initialize.yml"
      - ".github/workflows/container-images.yml"
      - ".github/actions/resolve-container-images/**"
      - "ci/container-images.json"
      - "ci/container-images.cjs"
      - "ci/container-images*.test.cjs"
      - "ci/container-images/**"
      - ".dockerignore"

      - "rust-toolchain.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "migrations/**"
      - "infra/**"
      - "mjml/**"
  workflow_dispatch:
    inputs:
      stage:
        description: "Stage to deploy"
        required: true
        type: choice
        options:
          - dev
          - prod
      commit_sha:
        description: "Full 40-character lowercase SHA of artifacts already uploaded for this stage"
        required: true
        type: string

concurrency:
  group: aws-deploy-${{ github.event_name == 'workflow_dispatch' && inputs.stage || github.ref == 'refs/heads/prod' && 'prod' || 'dev' }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  STAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.stage
    || github.ref == 'refs/heads/prod' && 'prod'
    || github.ref == 'refs/heads/develop' && 'dev' }}
  STACK_NAME_PREFIX: application-${{ github.event_name == 'workflow_dispatch' && inputs.stage || github.ref == 'refs/heads/prod' && 'prod' || 'dev' }}
  DEPLOY_COMMIT_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.commit_sha || github.event_name == 'push' && github.sha || '' }}

jobs:
  infra-test:
    name: Test CDK infrastructure
    outputs:
      container_matrix: ${{ steps.container-catalog.outputs.matrix }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install CDK dependencies
        run: npm --prefix infra ci

      - name: Type-check CDK app
        run: npm --prefix infra run build

      - name: Test CDK app
        run: npm --prefix infra test

      - name: Synthesize all stacks
        run: npm --prefix infra run synth:all

      - name: Test container catalog helpers
        run: node --test ci/container-images*.test.cjs

      - name: Read container image catalog
        id: container-catalog
        run: node ci/container-images.cjs matrix >> "$GITHUB_OUTPUT"

  aws-container-artifacts:
    name: Reconcile shared container artifact repositories
    needs: [infra-test]
    concurrency:
      group: aws-container-artifact-stack
      cancel-in-progress: false
    environment:
      name: ${{ (github.event_name == 'workflow_dispatch' && inputs.stage || github.ref == 'refs/heads/prod' && 'prod' || 'dev') == 'prod' && 'aws-prod' || 'aws-dev' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Install CDK dependencies
        run: npm --prefix infra ci
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.CI_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Reconcile retained image repositories
        run: |
          set -euo pipefail
          npm --prefix infra run cdk -- deploy aura-historia-container-artifacts \
            --app 'npx ts-node --prefer-ts-exts bin/artifacts.ts' \
            --require-approval never --method change-set --exclusively \
            --no-path-metadata --no-asset-metadata --no-version-reporting --no-notices

  aws-push-container-images:
    name: Publish image ${{ matrix.id }}
    if: github.event_name == 'push'
    needs: [infra-test, aws-container-artifacts]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.infra-test.outputs.container_matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_COMMIT_SHA }}
      - name: Verify release source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$DEPLOY_COMMIT_SHA"
          node ci/container-images.cjs validate
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.CI_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Publish tested image or reuse immutable SHA tag
        shell: bash
        env:
          IMAGE_ID: ${{ matrix.id }}
          IMAGE_BINARY: ${{ matrix.binary }}
          IMAGE_REPOSITORY: ${{ matrix.repository }}
          IMAGE_DOCKERFILE: ${{ matrix.dockerfile }}
          IMAGE_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          tag="git-${DEPLOY_COMMIT_SHA}"
          account="$(aws sts get-caller-identity --query Account --output text)"
          uri="${account}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/${IMAGE_REPOSITORY}"
          aws ecr get-login-password | docker login --username AWS --password-stdin "${uri%/*}"
          resolve_tag() {
            node ci/container-images.cjs resolve-one --id "$IMAGE_ID" --commit-sha "$DEPLOY_COMMIT_SHA" "$@"
          }
          verify_image() {
            local image_ref="$1"
            local inspect_file="$2"
            docker image inspect "$image_ref" > "$inspect_file"
            jq -e --arg sha "$DEPLOY_COMMIT_SHA" \
              --arg source "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
              --arg binary "$IMAGE_BINARY" \
              --arg workflow_prefix "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/" \
              --arg architecture "${IMAGE_PLATFORM##*/}" \
              'length == 1 and .[0].Os == "linux" and .[0].Architecture == $architecture and
               .[0].Config.Labels["org.opencontainers.image.revision"] == $sha and
               .[0].Config.Labels["org.opencontainers.image.source"] == $source and
               .[0].Config.Labels["org.opencontainers.image.title"] == $binary and
               (.[0].Config.Labels["com.aura-historia.build-workflow"] | type == "string" and startswith($workflow_prefix) and test("/actions/runs/[0-9]+/attempts/[0-9]+$"))' \
              "$inspect_file" >/dev/null || {
                echo "Image metadata does not match source ${DEPLOY_COMMIT_SHA} and platform ${IMAGE_PLATFORM}." >&2
                exit 1
              }
          }
          initial="$(resolve_tag --allow-missing)"
          if [ "$(jq -r '.status' <<< "$initial")" = existing ]; then
            digest="$(jq -er '.digest' <<< "$initial")"
            docker pull --platform "$IMAGE_PLATFORM" "${uri}@${digest}"
            verify_image "${uri}@${digest}" reused-image.json
            metadata_file=reused-image.json
          else
            build_identity="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}"
            local_ref="local/${IMAGE_ID}:${DEPLOY_COMMIT_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            docker build --platform "$IMAGE_PLATFORM" \
              -f "$IMAGE_DOCKERFILE" \
              --build-arg "SOURCE_REVISION=${DEPLOY_COMMIT_SHA}" \
              --build-arg "BUILD_WORKFLOW_IDENTITY=${build_identity}" \
              --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
              --label "org.opencontainers.image.revision=${DEPLOY_COMMIT_SHA}" \
              --label "org.opencontainers.image.title=${IMAGE_BINARY}" \
              --label "com.aura-historia.build-workflow=${build_identity}" \
              -t "$local_ref" .
            verify_image "$local_ref" built-image.json
            bash "ci/container-images/${IMAGE_ID}/smoke.sh" "$local_ref"
            docker tag "$local_ref" "${uri}:${tag}"
            push_succeeded=true
            if ! docker push "${uri}:${tag}" > push.log 2>&1; then
              push_succeeded=false
              cat push.log >&2
              echo "Push failed; checking once for a trusted immutable publication by a competing writer." >&2
            fi
            published="$(resolve_tag --allow-missing)"
            if [ "$(jq -r '.status' <<< "$published")" != existing ]; then
              echo "No trusted registry image is available at ${IMAGE_REPOSITORY}:${tag}; retry publication after inspecting the push failure." >&2
              exit 1
            fi
            digest="$(jq -er '.digest' <<< "$published")"
            docker pull --platform "$IMAGE_PLATFORM" "${uri}@${digest}"
            verify_image "${uri}@${digest}" published-image.json
            if [ "$push_succeeded" = false ]; then
              echo 'Verifying the competing immutable publication with the image-owned smoke test.' >&2
              bash "ci/container-images/${IMAGE_ID}/smoke.sh" "${uri}@${digest}"
            fi
            metadata_file=published-image.json
          fi
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo 'Invalid ECR registry digest.' >&2; exit 1; }
          build_workflow="$(jq -er '.[0].Config.Labels["com.aura-historia.build-workflow"]' "$metadata_file")"
          {
            echo "### Container image: ${IMAGE_ID}"
            echo "- Source SHA: ${DEPLOY_COMMIT_SHA}"
            echo "- Repository: ${IMAGE_REPOSITORY}"
            echo "- Platform: ${IMAGE_PLATFORM}"
            echo "- Registry digest: ${digest}"
            echo "- Build workflow identity: ${build_workflow}"
            echo "- Publisher verification: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} (attempt ${GITHUB_RUN_ATTEMPT})"
          } >> "$GITHUB_STEP_SUMMARY"
  aws-push-lambda:
    name: Publish Lambda ${{ matrix.binary }}
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      # Lambda-only artifact catalog; native CDC ingress is an external handoff.
      matrix:
        include:
          - crate: src/aura-historia-api
            binary: aura-historia-api
          - crate: src/shopify-lambda
            binary: shopify-lambda
          - crate: src/cognito-post-confirmation
            binary: cognito-post-confirmation
          - crate: src/cloudwatch-log-retention-lambda
            binary: cloudwatch-log-retention-lambda
          - crate: src/database-migration-lambda
            binary: database-migration-lambda
          - crate: src/fxrate-lambda
            binary: fxrate-lambda
          - crate: src/backend-cleanup-lambda
            binary: backend-cleanup-lambda
          - crate: src/stripe-lambda
            binary: stripe-lambda
          - crate: src/product-listing-opensearch-lambda
            binary: product-listing-opensearch-lambda
          - crate: src/product-listing-normalization-lambda
            binary: product-listing-normalization-lambda
          - crate: src/product-content-assessment-lambda
            binary: product-content-assessment-lambda
          - crate: src/product-embedding-lambda
            binary: product-embedding-lambda
          - crate: src/product-translation-lambda
            binary: product-translation-lambda
          - crate: src/search-filter-projection-lambda
            binary: search-filter-projection-lambda
          - crate: src/search-filter-percolator-lambda
            binary: search-filter-percolator-lambda
          - crate: src/search-filter-match-notification-lambda
            binary: search-filter-match-notification-lambda
          - crate: src/watchlist-notification-lambda
            binary: watchlist-notification-lambda
          - crate: src/notification-delivery-lambda
            binary: notification-delivery-lambda
          - crate: src/cdc-router-lambda
            binary: cdc-router-lambda
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_COMMIT_SHA }}

      - name: Install Toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Cache cargo-lambda
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/cargo-lambda
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-lambda-1.9.0

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - name: Install cargo-lambda
        run: |
          if ! cargo lambda --version | grep -Eq '^cargo-lambda 1\.9\.0($| )'; then
            cargo install cargo-lambda --version 1.9.0 --locked --force
          fi

      - name: Build Lambda binary
        working-directory: ${{ matrix.crate }}
        env:
          CARGO_PROFILE_RELEASE_LTO: true
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 1
        run: cargo lambda build --locked --release --target x86_64-unknown-linux-musl --output-format zip --bin "${{ matrix.binary }}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.CI_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload Lambda ZIP
        shell: bash
        env:
          BUCKET: ${{ vars.S3_BINARY_ARTIFACTS_BUCKET_NAME }}
          BINARY: ${{ matrix.binary }}
        run: |
          set -euo pipefail
          file="target/lambda/${BINARY}/bootstrap.zip"
          key="${BINARY}-${STAGE}-${DEPLOY_COMMIT_SHA}.zip"
          test -s "$file"
          aws s3api put-object --bucket "$BUCKET" --key "$key" --body "$file" \
            --tagging "stage=${STAGE}" >/dev/null

  aws-push-mail-templates:
    name: Compile and upload mail templates
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_COMMIT_SHA }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.CI_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install pinned MJML
        run: npm --prefix mjml ci

      - name: Compile and upload templates
        shell: bash
        env:
          BUCKET: ${{ vars.S3_MAIL_TEMPLATE_BUCKET_NAME }}
        run: |
          set -euo pipefail
          template_count=0
          while IFS= read -r -d '' template; do
            test -s "$template"
            name="${template%.mjml}.html"
            output="dist/emails/${name}"
            mkdir -p "$(dirname "$output")"
            mjml/node_modules/.bin/mjml "$template" -o "$output"
            test -s "$output"
            key="${STAGE}/${DEPLOY_COMMIT_SHA}/${name}"
            aws s3api put-object --bucket "$BUCKET" --key "$key" --body "$output" \
              --tagging "stage=${STAGE}" >/dev/null
            template_count=$((template_count + 1))
          done < <(git ls-files -z -- 'mjml/**/*.mjml')
          test "$template_count" -gt 0

  aws-cdk-deploy:
    name: Deploy CDK stacks after environment approval
    if: >-
      ${{ always() && needs.infra-test.result == 'success' && needs.aws-container-artifacts.result == 'success'
          && ((github.event_name == 'push' && needs.aws-push-lambda.result == 'success'
               && needs.aws-push-mail-templates.result == 'success'
               && needs.aws-push-container-images.result == 'success')
              || (github.event_name == 'workflow_dispatch' && needs.aws-push-lambda.result == 'skipped'
                  && needs.aws-push-mail-templates.result == 'skipped'
                  && needs.aws-push-container-images.result == 'skipped')) }}
    needs:
      [
        infra-test,
        aws-push-lambda,
        aws-push-mail-templates,
        aws-container-artifacts,
        aws-push-container-images,
      ]
    environment:
      name: ${{ (github.event_name == 'workflow_dispatch' && inputs.stage || github.ref == 'refs/heads/prod' && 'prod' || 'dev') == 'prod' && 'aws-prod' || 'aws-dev' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate commit SHA
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "${DEPLOY_COMMIT_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "commit_sha must be a full 40-character lowercase Git commit SHA" >&2
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        if: github.event_name == 'push'
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install CDK dependencies
        if: github.event_name == 'push'
        run: npm --prefix infra ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.CI_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Resolve immutable release images
        id: container-images
        uses: ./.github/actions/resolve-container-images
        with:
          commit-sha: ${{ env.DEPLOY_COMMIT_SHA }}

      - name: Ensure account-level DMS VPC role
        if: github.event_name == 'push'
        run: bash infra/scripts/ensure-dms-vpc-role.sh

      - name: Deploy foundation or migrate and update initialized application
        if: github.event_name == 'push'
        shell: bash
        env:
          CONTAINER_IMAGE_DIGESTS: ${{ steps.container-images.outputs.digests }}
          CDC_ROUTER_FAILURE_ARCHIVE_BUCKET: ${{ vars[format('S3_CDC_ROUTER_FAILURE_ARCHIVE_BUCKET_NAME_{0}', github.ref == 'refs/heads/prod' && 'PROD' || 'DEV')] }}
        run: |
          set -euo pipefail
          printf '%s\n' "$CONTAINER_IMAGE_DIGESTS" > container-image-digests.json
          jq -e 'type == "object" and length > 0 and all(.[]; test("^sha256:[0-9a-f]{64}$"))' container-image-digests.json >/dev/null || {
            echo 'Resolved image digest map is missing or invalid.' >&2; exit 1;
          }
          deploy() {
            npm --prefix infra run cdk -- deploy "$@" \
              --context stage="${STAGE}" \
              --context stackNamePrefix="${STACK_NAME_PREFIX}" \
              --require-approval never \
              --method change-set \
              --exclusively \
              --no-path-metadata \
              --no-asset-metadata \
              --no-version-reporting \
              --no-notices
          }
          stack_status() {
            local stack="$1"
            local status
            if status="$(aws cloudformation describe-stacks \
              --stack-name "${STACK_NAME_PREFIX}-${stack}" \
              --query 'Stacks[0].StackStatus' --output text 2>error.txt)"; then
              printf '%s\n' "$status"
            elif grep -Eq '\(ValidationError\).*does not exist' error.txt; then
              printf 'missing\n'
            else
              cat error.txt >&2
              return 1
            fi
          }

          # Missing application stacks (including partial initialization) are repaired by
          # Initialize after the foundation advances; failed/in-progress stacks require operator repair.
          for stack in compute api; do
            status="$(stack_status "$stack")"
            if [ "$stack" = compute ] && [ "$status" = REVIEW_IN_PROGRESS ] \
              && [ "$CDC_ROUTER_FAILURE_ARCHIVE_BUCKET" = "aura-historia-cdc-router-failures-${STAGE}" ] \
              && [ "$(aws cloudformation list-stack-resources --stack-name "${STACK_NAME_PREFIX}-compute" --query 'length(StackResourceSummaries)' --output text)" = 0 ]; then
              # Failed CREATE change set: no resources were admitted. Initialize owns archive import.
              status=missing
            fi
            case "$status" in
              missing|CREATE_COMPLETE|UPDATE_COMPLETE|UPDATE_ROLLBACK_COMPLETE) ;;
              *) echo "Application stack ${stack} is ${status}; repair it before Deploy." >&2; exit 1 ;;
            esac
            if [ "$stack" = compute ]; then compute_status="$status"; else api_status="$status"; fi
          done
          observability_status=missing
          if [ "$STAGE" = prod ]; then
            observability_status="$(stack_status observability)"
            case "$observability_status" in
              missing|CREATE_COMPLETE|UPDATE_COMPLETE|UPDATE_ROLLBACK_COMPLETE) ;;
              *) echo "Observability stack is ${observability_status}; repair it before Deploy." >&2; exit 1 ;;
            esac
          fi
          needs_initialize=false
          if [ "$compute_status" = missing ] || [ "$api_status" = missing ] \
            || { [ "$STAGE" = prod ] && [ "$observability_status" = missing ]; }; then
            needs_initialize=true
          fi

          # A missing/partially created foundation is safe to resume; do not update a failed stack.
          for stack in network data initialize; do
            status="$(stack_status "$stack")"
            case "$status" in
              missing|CREATE_COMPLETE|UPDATE_COMPLETE|UPDATE_ROLLBACK_COMPLETE) ;;
              *) echo "Foundation stack ${stack} is ${status}; repair it before Deploy." >&2; exit 1 ;;
            esac
          done
          deploy "${STACK_NAME_PREFIX}-network"
          deploy "${STACK_NAME_PREFIX}-data"
          deploy "${STACK_NAME_PREFIX}-initialize" \
            --parameters "${STACK_NAME_PREFIX}-initialize:CommitSHA=${DEPLOY_COMMIT_SHA}"

          if [ "$needs_initialize" = true ]; then
            echo 'Foundation deployed. Run Initialize (CD) with this stage and commit SHA to repair initialization, migrate, and admit compute/API.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Only the initialization stack owns the private migration Lambda.
          # Update it to this verified SHA before invoking the embedded migrations.
          aws lambda wait function-updated --function-name "database-migration-lambda-${STAGE}"
          printf '{}' > migration-invocation.json
          response="$(aws lambda invoke \
            --function-name "database-migration-lambda-${STAGE}" \
            --invocation-type RequestResponse \
            --payload fileb://migration-invocation.json \
            --cli-binary-format raw-in-base64-out \
            --cli-connect-timeout 10 --cli-read-timeout 900 \
            migration-result.json --query '{StatusCode: StatusCode, FunctionError: FunctionError}' \
            --output json)" || { echo 'Private migration invocation failed.' >&2; exit 1; }
          if [ "$(jq -r '.StatusCode // empty' <<< "$response")" != 200 ] \
            || [ -n "$(jq -r '.FunctionError // empty' <<< "$response")" ] \
            || ! jq -se 'length == 1 and .[0] == {"status":"ready"}' migration-result.json >/dev/null; then
            echo 'Private migration failed; application admission is blocked.' >&2
            exit 1
          fi

          stacks=("${STACK_NAME_PREFIX}-compute" "${STACK_NAME_PREFIX}-api")
          if [ "$STAGE" = prod ]; then
            stacks+=("${STACK_NAME_PREFIX}-observability")
          fi
          # Previous values preserve every activation parameter; the selected catalog digest set is explicit.
          compute_parameters=(--parameters "${STACK_NAME_PREFIX}-compute:CommitSHA=${DEPLOY_COMMIT_SHA}")
          while IFS= read -r assignment; do
            compute_parameters+=(--parameters "${STACK_NAME_PREFIX}-compute:${assignment}")
          done < <(jq -r 'to_entries[] | "\(.key)=\(.value)"' container-image-digests.json)
          deploy "${stacks[@]}" --previous-parameters "${compute_parameters[@]}"
          if ! aws cloudformation describe-stacks --stack-name "${STACK_NAME_PREFIX}-compute" --output json > compute-stack.json; then
            echo 'Post-deployment output lookup failed. The deployment may already have completed; inspect the existing compute stack before rerunning, and do not rerun migrations or launch another task.' >&2
            exit 1
          fi
          task_definition_outputs="$(node ci/container-images.cjs task-outputs --stack-file compute-stack.json --stack-name "${STACK_NAME_PREFIX}-compute")" || exit 1
          {
            echo '## Container image deployment'
            echo "- Source SHA: ${DEPLOY_COMMIT_SHA}"
            echo "- Image digests: \`$(jq -cS . container-image-digests.json)\`"
            echo "$task_definition_outputs"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preflight stage artifacts and deployed stack state
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          MAIL_BUCKET: ${{ vars.S3_MAIL_TEMPLATE_BUCKET_NAME }}
          CONTAINER_IMAGE_DIGESTS: ${{ steps.container-images.outputs.digests }}
        run: |
          set -euo pipefail
          printf '%s\n' "$CONTAINER_IMAGE_DIGESTS" > container-image-digests.json
          jq -e 'type == "object" and length > 0 and all(.[]; test("^sha256:[0-9a-f]{64}$"))' container-image-digests.json >/dev/null || {
            echo 'Resolved image digest map is missing or invalid.' >&2; exit 1;
          }
          # Check tracked templates from the workflow source, not an older release tree.
          template_count=0
          while IFS= read -r -d '' template; do
            key="${STAGE}/${DEPLOY_COMMIT_SHA}/${template%.mjml}.html"
            aws s3api head-object --bucket "$MAIL_BUCKET" --key "$key" >/dev/null || {
              echo "Missing stage mail artifact: $key" >&2; exit 1;
            }
            template_count=$((template_count + 1))
          done < <(git ls-files -z -- 'mjml/**/*.mjml')
          test "$template_count" -gt 0

          stacks=(network data initialize compute api)
          if [ "$STAGE" = prod ]; then
            stacks+=(observability)
          fi
          for stack in "${stacks[@]}"; do
            name="${STACK_NAME_PREFIX}-${stack}"
            if ! aws cloudformation describe-stacks --stack-name "$name" --output json > "${stack}-stack.json"; then
              echo "Stack $name is missing or inaccessible; finish Initialize (CD) first." >&2
              exit 1
            fi
            status="$(jq -r '.Stacks[0].StackStatus // empty' "${stack}-stack.json")"
            case "$status" in
              CREATE_COMPLETE|UPDATE_COMPLETE|UPDATE_ROLLBACK_COMPLETE) ;;
              *) echo "Stack $name is not safe to update: ${status:-missing}" >&2; exit 1 ;;
            esac
          done
          for stack in initialize compute; do
            file="${stack}-stack.json"
            if ! jq -e '[.Stacks[0].Parameters[]? | select(.ParameterKey == "CommitSHA") | .ParameterValue] | length == 1 and (.[0] | type == "string" and test("^[0-9a-f]{40}$"))' "$file" >/dev/null; then
              echo "Stack $stack must have one valid CommitSHA parameter." >&2; exit 1
            fi
          done
          node ci/container-images.cjs previous-update \
            --stack-file compute-stack.json --commit-sha "$DEPLOY_COMMIT_SHA" \
            --digests container-image-digests.json > compute-previous-update.json

      - name: Update artifact SHA and image digests with previous CloudFormation templates
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          init_name="${STACK_NAME_PREFIX}-initialize"
          init_sha="$(jq -r '.Stacks[0].Parameters[] | select(.ParameterKey == "CommitSHA") | .ParameterValue' initialize-stack.json)"
          if [ "$init_sha" != "$DEPLOY_COMMIT_SHA" ]; then
            jq --arg sha "$DEPLOY_COMMIT_SHA" \
              '[.Stacks[0].Parameters[] | if .ParameterKey == "CommitSHA" then
                {ParameterKey, ParameterValue: $sha}
              else {ParameterKey, UsePreviousValue: true} end]' \
              initialize-stack.json > initialize-parameters.json
            aws cloudformation update-stack --stack-name "$init_name" \
              --use-previous-template --capabilities CAPABILITY_NAMED_IAM \
              --parameters file://initialize-parameters.json >/dev/null
            aws cloudformation wait stack-update-complete --stack-name "$init_name"
          else
            echo "$init_name already selects the requested release."
          fi

          compute_name="${STACK_NAME_PREFIX}-compute"
          if [ "$(jq -r '.unchanged' compute-previous-update.json)" = true ]; then
            echo "$compute_name already selects the requested source SHA and complete image digest set."
          else
            jq '.parameters' compute-previous-update.json > compute-parameters.json
            aws cloudformation update-stack --stack-name "$compute_name" \
              --use-previous-template --capabilities CAPABILITY_NAMED_IAM \
              --parameters file://compute-parameters.json >/dev/null
            aws cloudformation wait stack-update-complete --stack-name "$compute_name"
          fi
          if ! aws cloudformation describe-stacks --stack-name "$compute_name" --output json > compute-stack.json; then
            echo 'Post-deployment output lookup failed. The artifact update may already have completed; inspect the existing compute stack before rerunning, and do not rerun migrations or launch another task.' >&2
            exit 1
          fi
          task_definition_outputs="$(node ci/container-images.cjs task-outputs --stack-file compute-stack.json --stack-name "$compute_name")" || exit 1
          {
            echo '## Artifact rollback selection'
            echo "- Source SHA: ${DEPLOY_COMMIT_SHA}"
            echo "- Image digests: \`$(jq -cS . container-image-digests.json)\`"
            echo "$task_definition_outputs"
            echo '- Only initialization/compute artifact parameters were changed; no migration was invoked.'
          } >> "$GITHUB_STEP_SUMMARY"
