name: Deploy (CD)

on:
  push:
    branches: [prod, develop]
    paths:
      - ".github/workflows/deploy.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "infra/**"
      - "mjml/**"
  workflow_dispatch:
    inputs:
      stage:
        description: "Stage to deploy"
        required: true
        type: choice
        options:
          - dev
          - prod
      commit_sha:
        description: "Previously uploaded artifact commit SHA to deploy (useful for rollbacks)"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.stage || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/prod' && (github.event_name != 'workflow_dispatch' || inputs.stage != 'prod') }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  STAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.stage
    || github.ref == 'refs/heads/prod' && 'prod'
    || github.ref == 'refs/heads/develop' && 'dev' }}
  STAGE_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.stage
    || github.ref == 'refs/heads/prod' && 'prod'
    || github.ref == 'refs/heads/develop' && 'dev' }}
  STACK_NAME_PREFIX: application-${{ github.event_name == 'workflow_dispatch' && inputs.stage || github.ref == 'refs/heads/prod' && 'prod' || 'dev' }}
  DEPLOY_COMMIT_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.commit_sha || github.sha }}

jobs:
  infra-test:
    name: Test CDK infrastructure
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install CDK dependencies
        run: npm --prefix infra ci

      - name: Type-check CDK app
        run: npm --prefix infra run build

      - name: Test CDK app
        run: npm --prefix infra test

      - name: Synthesize all stacks
        run: npm --prefix infra run synth:all

  aws-push-lambda:
    name: Push Lambda to S3 ${{ matrix.crate }}
    if: github.event_name == 'push' && (github.ref == 'refs/heads/prod' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        crate:
          - src/search-filter-api
          - src/search-filter-lambda/src/search-filter-lambda-opensearch-sync
          - src/search-filter-lambda/src/search-filter-lambda-percolate-product
          - src/product-api
          - src/product-api-partner
          - src/product-watchlist-api
          - src/product-pipeline/src/product-pipeline-embed-text
          - src/product-pipeline/src/product-pipeline-translate
          - src/product-lambda/src/product-lambda-materialize-opensearch
          - src/product-lambda/src/product-lambda-ingest-partner-products
          - src/product-lambda/src/product-lambda-delete-product
          - src/shop-api
          - src/webhook-api
          - src/shop-lambda/src/shop-lambda-opensearch-index
          - src/shopify-lambda
          - src/user-api
          - src/oauth-api
          - src/user-lambda/src/user-lambda-index-opensearch
          - src/user-lambda/src/user-lambda-tier-update
          - src/partner-shop-application-api
          - src/partner-shop-application-lambda
          - src/cognito-post-confirmation
          - src/cloudwatch-log-retention-lambda
          - src/newsletter-api
          - src/fxrate-lambda
          - src/stripe-lambda
          - src/stripe-api
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Cache cargo-lambda
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/cargo-lambda
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-lambda-1.9.0

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - name: Install cargo-lambda
        run: |
          if ! command -v cargo-lambda &> /dev/null; then
            cargo install cargo-lambda --version 1.9.0
          fi

      - name: Build Lambda binary
        working-directory: ${{ matrix.crate }}
        env:
          CARGO_PROFILE_RELEASE_LTO: true
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 1
        run: cargo lambda build --locked --release --target x86_64-unknown-linux-musl --output-format zip

      - name: Copy Lambda zip artifact
        run: |
          BIN_NAME=$(basename ${{ matrix.crate }})
          OUT_DIR=$GITHUB_WORKSPACE/artifacts
          mkdir -p $OUT_DIR
          cp target/lambda/$BIN_NAME/bootstrap.zip $OUT_DIR/$BIN_NAME-${{ env.STAGE_NAME }}-${{ env.DEPLOY_COMMIT_SHA }}.zip

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ secrets.CI_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload Lambda to S3
        run: |
          BIN_NAME=$(basename ${{ matrix.crate }})
          aws s3api put-object \
            --bucket "${{ vars.S3_BINARY_ARTIFACTS_BUCKET_NAME }}" \
            --key "$BIN_NAME-${{ env.STAGE_NAME }}-${{ env.DEPLOY_COMMIT_SHA }}.zip" \
            --body "$GITHUB_WORKSPACE/artifacts/$BIN_NAME-${{ env.STAGE_NAME }}-${{ env.DEPLOY_COMMIT_SHA }}.zip" \
            --tagging "stage=${{ env.STAGE }}"

  aws-push-periodic-match-image:
    name: Push periodic matcher image to ECR
    if: github.event_name == 'push' && (github.ref == 'refs/heads/prod' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ secrets.CI_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories \
            --repository-names aura-historia-search-filter-periodic-match \
            >/dev/null 2>&1 \
          || aws ecr create-repository \
            --repository-name aura-historia-search-filter-periodic-match \
            --image-scanning-configuration scanOnPush=true \
            --tags Key=application,Value=aura-historia Key=stage,Value=${{ env.STAGE }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push periodic matcher image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: aura-historia-search-filter-periodic-match
          IMAGE_TAG: ${{ env.STAGE_NAME }}-${{ env.DEPLOY_COMMIT_SHA }}
        run: |
          docker build \
            -f src/search-filter-periodic-match/Dockerfile \
            -t $REGISTRY/$REPOSITORY:$IMAGE_TAG \
            .
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG

  aws-push-mail-templates:
    name: Compile & push Mail-Templates to S3 ${{ matrix.resource }}
    if: github.event_name == 'push' && (github.ref == 'refs/heads/prod' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    strategy:
      matrix:
        resource:
          - mjml/watchlist/product-update/price/de.mjml
          - mjml/watchlist/product-update/price/en.mjml
          - mjml/watchlist/product-update/price/es.mjml
          - mjml/watchlist/product-update/price/fr.mjml
          - mjml/watchlist/product-update/price/it.mjml
          - mjml/watchlist/product-update/state/de.mjml
          - mjml/watchlist/product-update/state/en.mjml
          - mjml/watchlist/product-update/state/es.mjml
          - mjml/watchlist/product-update/state/fr.mjml
          - mjml/watchlist/product-update/state/it.mjml
          - mjml/search-filter/match/de.mjml
          - mjml/search-filter/match/en.mjml
          - mjml/search-filter/match/es.mjml
          - mjml/search-filter/match/fr.mjml
          - mjml/search-filter/match/it.mjml
          - mjml/partner-application/approval/de.mjml
          - mjml/partner-application/approval/en.mjml
          - mjml/partner-application/approval/es.mjml
          - mjml/partner-application/approval/fr.mjml
          - mjml/partner-application/approval/it.mjml
          - mjml/partner-application/rejection/de.mjml
          - mjml/partner-application/rejection/en.mjml
          - mjml/partner-application/rejection/es.mjml
          - mjml/partner-application/rejection/fr.mjml
          - mjml/partner-application/rejection/it.mjml

    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ secrets.CI_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install MJML
        run: npm install -g mjml

      - name: Compile MJML
        run: |
          output="dist/emails/${{ matrix.resource }}"
          output="${output%.mjml}.html"
          mkdir -p "$(dirname "$output")"
          mjml "${{ matrix.resource }}" -o "$output"

      - name: Upload compiled template to S3
        run: |
          output="dist/emails/${{ matrix.resource }}"
          output="${output%.mjml}.html"
          aws s3api put-object \
            --bucket "${{ vars.S3_MAIL_TEMPLATE_BUCKET_NAME }}" \
            --key "${{ env.STAGE_NAME }}/${{ env.DEPLOY_COMMIT_SHA }}/${output#dist/emails/}" \
            --body "$output" \
            --tagging "stage=${{ env.STAGE }}"

  aws-cdk-deploy:
    name: Deploy CDK stacks
    if: >-
      ${{
        always()
        && needs.infra-test.result == 'success'
        && (needs.aws-push-lambda.result == 'success' || needs.aws-push-lambda.result == 'skipped')
        && (needs.aws-push-periodic-match-image.result == 'success' || needs.aws-push-periodic-match-image.result == 'skipped')
        && (needs.aws-push-mail-templates.result == 'success' || needs.aws-push-mail-templates.result == 'skipped')
        && (github.event_name == 'workflow_dispatch'
          || (github.event_name == 'push' && (github.ref == 'refs/heads/prod' || github.ref == 'refs/heads/develop')))
      }}
    needs:
      [
        infra-test,
        aws-push-lambda,
        aws-push-periodic-match-image,
        aws-push-mail-templates,
      ]
    environment:
      name: ${{ (github.event_name == 'workflow_dispatch' && inputs.stage || github.ref == 'refs/heads/prod' && 'prod' || 'dev') == 'prod' && 'aws-prod' || 'aws-dev' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install CDK dependencies
        run: npm --prefix infra ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ secrets.CI_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy CDK stacks via CloudFormation change sets
        shell: bash
        run: |
          set -euo pipefail
          stacks=(
            "${STACK_NAME_PREFIX}-data"
            "${STACK_NAME_PREFIX}-compute"
            "${STACK_NAME_PREFIX}-api"
          )
          if [ "${STAGE}" = "prod" ]; then
            stacks+=("${STACK_NAME_PREFIX}-observability")
          fi

          npm --prefix infra run cdk -- deploy "${stacks[@]}" \
            --context stage="${STAGE}" \
            --context stackNamePrefix="${STACK_NAME_PREFIX}" \
            --require-approval never \
            --method change-set \
            --no-path-metadata \
            --no-asset-metadata \
            --no-version-reporting \
            --no-notices \
            --parameters "${STACK_NAME_PREFIX}-compute:CommitSHA=${DEPLOY_COMMIT_SHA}"

  aws-smoking-test:
    name: AWS Smoking-Test
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/prod') || (github.event_name == 'workflow_dispatch' && inputs.stage == 'prod') }}
    needs: aws-cdk-deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ secrets.CI_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Export stack outputs
        id: export-cfn-output
        shell: bash
        run: |
          set -euo pipefail
          JSON=$(
            {
              aws cloudformation describe-stacks \
                --stack-name "${STACK_NAME_PREFIX}-data" \
                --query 'Stacks[0].Outputs' \
                --output json \
              && aws cloudformation describe-stacks \
                --stack-name "${STACK_NAME_PREFIX}-compute" \
                --query 'Stacks[0].Outputs' \
                --output json \
              && aws cloudformation describe-stacks \
                --stack-name "${STACK_NAME_PREFIX}-api" \
                --query 'Stacks[0].Outputs' \
                --output json
            } | jq -cs 'add | map({(.OutputKey): .OutputValue}) | add'
          )
          echo "outputs_json=$JSON" >> "$GITHUB_OUTPUT"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run Smoking-Tests
        working-directory: src/aws-tests/src/smoking-tests
        env:
          CFN_OUTPUT: ${{ steps.export-cfn-output.outputs.outputs_json }}
        run: cargo test --locked --test '*' --all-features -- --ignored --nocapture
