name: Deploy
run-name: Deploy ${{ inputs.ref }} to prod
# Builds the image for one commit, publishes it to GHCR and deploys it to the prod host over SSH
# (host/prod/README.md#deploys); deploying an earlier commit is the rollback. It also publishes
# the commit's Cognito trigger zips, which an operator's `cdk deploy` of the identity stack
# selects by commit (docs/infra.md#deploying-the-reduced-app). The `prod` environment's
# reviewers approve every deploy; its branch policy limits which branches may run this
# workflow, and DEPLOY_BRANCHES which commits it deploys.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to deploy, on a deploy branch (an earlier commit rolls back)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: prod-deploy
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/aura-historia
  # The host enforces the same list (host/prod/deploy.sh); this only fails earlier.
  DEPLOY_BRANCHES: develop
  TRIGGER_BUCKET: aura-historia-binary-artifacts-eu-central-1

jobs:
  resolve:
    name: Resolve ${{ inputs.ref }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the commit on a deploy branch
        id: commit
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          for branch in $DEPLOY_BRANCHES; do
            if git merge-base --is-ancestor "$sha" "origin/${branch}"; then
              echo "sha=${sha}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::error::${sha} is not on ${DEPLOY_BRANCHES}"
          exit 1
      # Only this workflow's publish job pushes to the package, once per commit.
      - name: Reuse the image already published for this commit
        id: image
        env:
          SHA: ${{ steps.commit.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          if digest="$(docker buildx imagetools inspect "${IMAGE_REPOSITORY}:${SHA}" --format '{{json .Manifest.Digest}}' 2>/dev/null)"; then
            digest="${digest//\"/}"
            [[ ${digest} =~ ^sha256:[0-9a-f]{64}$ ]]
            echo "image=${IMAGE_REPOSITORY}@${digest}" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build
    needs: resolve
    if: needs.resolve.outputs.image == ''
    uses: ./.github/workflows/container-images.yml
    with:
      source_sha: ${{ needs.resolve.outputs.sha }}
      export_image: true

  # The only job that can write the package, and it runs none of the commit's code.
  publish:
    name: Publish to GHCR
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      packages: write
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: image-${{ github.run_id }}
      - name: Push the tested image
        id: push
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gunzip -c image.tar.gz | docker load --quiet
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker tag "local/aura-historia:${SHA}" "${IMAGE_REPOSITORY}:${SHA}"
          docker push --quiet "${IMAGE_REPOSITORY}:${SHA}"
          image="$(docker image inspect --format '{{index .RepoDigests 0}}' "${IMAGE_REPOSITORY}:${SHA}")"
          [[ ${image} =~ ^${IMAGE_REPOSITORY}@sha256:[0-9a-f]{64}$ ]]
          echo "image=${image}" >> "$GITHUB_OUTPUT"

  triggers:
    name: Build the Cognito triggers
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - name: Install toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: cognito-triggers
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.14.1
      - name: Build the trigger zips
        env:
          CARGO_PROFILE_RELEASE_LTO: true
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 1
        run: |
          set -euo pipefail
          if ! cargo lambda --version 2>/dev/null | grep -Eq '^cargo-lambda 1\.9\.0($| )'; then
            cargo install cargo-lambda --version 1.9.0 --locked
          fi
          mapfile -t binaries < <(jq -r '.[]' ci/lambda-binaries.json)
          arguments=()
          for binary in "${binaries[@]}"; do arguments+=(--package "$binary" --bin "$binary"); done
          cargo lambda build --locked --release --target x86_64-unknown-linux-musl --output-format zip "${arguments[@]}"
          mkdir -p triggers
          for binary in "${binaries[@]}"; do cp "target/lambda/${binary}/bootstrap.zip" "triggers/${binary}.zip"; done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cognito-triggers-${{ github.run_id }}
          path: triggers/
          if-no-files-found: error
          # A re-run of the producing job replaces it; artifacts outlive the run attempt.
          overwrite: true
          retention-days: 7

  deploy:
    name: Deploy ${{ needs.resolve.outputs.sha }}
    needs: [resolve, publish, triggers]
    # Either the image this run published, or the one already published for the commit.
    if: ${{ !cancelled() && needs.resolve.result == 'success' && needs.triggers.result == 'success' && (needs.publish.result == 'success' || (needs.publish.result == 'skipped' && needs.resolve.outputs.image != '')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      # Only for the trigger publisher role, which trusts this environment alone.
      id-token: write
    environment:
      name: prod
      url: https://api.aura-historia.com/v1/health
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: cognito-triggers-${{ github.run_id }}
          path: triggers
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.PROD_TRIGGER_PUBLISHER_ROLE_ARN }}
          aws-region: eu-central-1
      - name: Publish the Cognito triggers
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          for zip in triggers/*.zip; do
            key="$(basename "$zip" .zip)-prod-${SHA}.zip"
            # A commit's zip is published once; a rebuilt one never replaces it.
            if output="$(aws s3api put-object --bucket "$TRIGGER_BUCKET" --key "$key" --body "$zip" --if-none-match '*' 2>&1)"; then
              echo "published s3://${TRIGGER_BUCKET}/${key}"
            elif grep -q PreconditionFailed <<<"$output"; then
              echo "kept the published s3://${TRIGGER_BUCKET}/${key}"
            else
              echo "$output" >&2
              exit 1
            fi
          done
      - name: Deploy over SSH
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
          IMAGE: ${{ needs.publish.outputs.image || needs.resolve.outputs.image }}
          DEPLOY_HOST: ${{ secrets.PROD_DEPLOY_HOST }}
          DEPLOY_KEY: ${{ secrets.PROD_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.PROD_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ ${IMAGE} =~ ^${IMAGE_REPOSITORY}@sha256:[0-9a-f]{64}$ ]]
          [[ -n ${DEPLOY_HOST} && -n ${DEPLOY_KEY} && -n ${KNOWN_HOSTS} ]]
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy
          chmod 0600 ~/.ssh/deploy
          # The host's key is pinned under an alias, so the host's address appears in no variable.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          echo "Deploying \`${SHA}\` as \`${IMAGE}\`" >> "$GITHUB_STEP_SUMMARY"
          # The deploy runs as a unit on the host and finishes even if this connection drops;
          # `status` over the same key shows its outcome.
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o HostKeyAlias=aura-prod -o ServerAliveInterval=30 \
            "deploy@${DEPLOY_HOST}" "deploy ${SHA} ${IMAGE}"
      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/deploy
