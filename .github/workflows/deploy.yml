name: Deploy
run-name: Deploy ${{ inputs.ref }} to prod
# Builds the image for one commit, publishes it to GHCR and deploys it to the prod host over SSH
# (host/prod/README.md#deploys). Deploying an earlier commit is the rollback. The `prod`
# environment's reviewers approve every deploy; its branch policy limits which branches may run
# this workflow, not which commit it deploys.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to deploy (an earlier commit rolls back)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: prod-deploy
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/aura-historia

jobs:
  resolve:
    name: Resolve ${{ inputs.ref }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Resolve the commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Reuse an image already published for this commit
        id: image
        env:
          SHA: ${{ steps.commit.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          if digest="$(docker buildx imagetools inspect "${IMAGE_REPOSITORY}:${SHA}" --format '{{json .Manifest.Digest}}' 2>/dev/null)"; then
            digest="${digest//\"/}"
            [[ ${digest} =~ ^sha256:[0-9a-f]{64}$ ]]
            echo "image=${IMAGE_REPOSITORY}@${digest}" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build
    needs: resolve
    if: needs.resolve.outputs.image == ''
    uses: ./.github/workflows/container-images.yml
    with:
      source_sha: ${{ needs.resolve.outputs.sha }}
      publish: true
    permissions:
      contents: read
      packages: write

  deploy:
    name: Deploy ${{ needs.resolve.outputs.sha }}
    needs: [resolve, build]
    if: ${{ !cancelled() && needs.resolve.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: prod
      url: https://api.aura-historia.com/v1/health
    steps:
      - name: Deploy over SSH
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
          IMAGE: ${{ needs.build.outputs.image || needs.resolve.outputs.image }}
          DEPLOY_HOST: ${{ secrets.PROD_DEPLOY_HOST }}
          DEPLOY_KEY: ${{ secrets.PROD_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.PROD_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ ${IMAGE} =~ ^${IMAGE_REPOSITORY}@sha256:[0-9a-f]{64}$ ]]
          [[ -n ${DEPLOY_HOST} && -n ${DEPLOY_KEY} && -n ${KNOWN_HOSTS} ]]
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy
          chmod 0600 ~/.ssh/deploy
          # The host's key is pinned under an alias, so the host's address appears in no variable.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          echo "Deploying \`${SHA}\` as \`${IMAGE}\`" >> "$GITHUB_STEP_SUMMARY"
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o HostKeyAlias=aura-prod -o ServerAliveInterval=30 \
            "deploy@${DEPLOY_HOST}" "deploy ${SHA} ${IMAGE}"
      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/deploy
