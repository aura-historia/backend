name: Deploy (CD)

on:
  push:
    branches: [prod, develop]
    paths:
      - ".github/workflows/deploy.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "cfn/dev.yaml"
      - "cfn/prod.yaml"
      - "mjml/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/prod' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  STAGE: ${{ github.event_name == 'pull_request' && 'ephemeral'
    || github.ref == 'refs/heads/prod' && 'prod'
    || github.ref == 'refs/heads/develop' && 'dev' }}
  STAGE_NAME:
    ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number)
    || github.ref == 'refs/heads/prod' && 'prod'
    || github.ref == 'refs/heads/develop' && 'dev' }}
  STACK: application
  STACK_NAME:
    application-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number)
    || github.ref == 'refs/heads/prod' && 'prod'
    || github.ref == 'refs/heads/develop' && 'dev' }}
  CLOUDFORMATION_TEMPLATE_PATH:
    ${{ github.event_name == 'pull_request' && 'cfn/ephemeral.yaml'
    || github.ref == 'refs/heads/prod' && 'cfn/prod.yaml'
    || github.ref == 'refs/heads/develop' && 'cfn/dev.yaml' }}

jobs:
  cfn-lint:
    name: Lint CloudFormation
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install cfn-lint
        run: pip install -r cfn/lint/requirements.txt

      - name: Run cfn-lint for '${{ env.CLOUDFORMATION_TEMPLATE_PATH }}'
        run: cfn-lint --non-zero-exit-code error ${{ env.CLOUDFORMATION_TEMPLATE_PATH }}

  aws-push-lambda:
    name: Push Lambda to S3 ${{ matrix.crate }}
    if: github.event_name == 'push' && (github.ref == 'refs/heads/prod' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        crate:
          - src/search-filter-api
          - src/search-filter-lambda/src/search-filter-lambda-opensearch-sync
          - src/search-filter-lambda/src/search-filter-lambda-percolate-product
          - src/product-api
          - src/product-api-partner
          - src/product-classification-api
          - src/product-watchlist-api
          - src/product-pipeline/src/product-pipeline-asg-scale-control
          - src/product-pipeline/src/product-pipeline-embed-text
          - src/product-pipeline/src/product-pipeline-classify
          - src/product-pipeline/src/product-pipeline-extract-attribute
          - src/product-pipeline/src/product-pipeline-translate
          - src/product-lambda/src/product-lambda-materialize-dynamodb
          - src/product-lambda/src/product-lambda-materialize-opensearch
          - src/product-lambda/src/product-lambda-update-notify-user
          - src/shop-api
          - src/shop-lambda/src/shop-lambda-opensearch-index
          - src/user-api
          - src/user-lambda/src/user-lambda-index-opensearch
          - src/user-lambda/src/user-lambda-tier-update
          - src/partner-shop-application-api
          - src/partner-shop-application-lambda
          - src/partner-api
          - src/cognito-post-confirmation
          - src/notification-send
          - src/notification-api
          - src/newsletter-api
          - src/fxrate-lambda
          - src/stripe-lambda
          - src/stripe-api
    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Cache cargo-lambda
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/cargo-lambda
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-lambda-1.9.0

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - name: Install cargo-lambda
        run: |
          if ! command -v cargo-lambda &> /dev/null; then
            cargo install cargo-lambda --version 1.9.0
          fi

      - name: Build Lambda binary
        working-directory: ${{ matrix.crate }}
        env:
          CARGO_PROFILE_RELEASE_LTO: true
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 1
        run: cargo lambda build --locked --release --target x86_64-unknown-linux-musl --output-format zip

      - name: Copy Lambda zip artifact
        run: |
          BIN_NAME=$(basename ${{ matrix.crate }})
          OUT_DIR=$GITHUB_WORKSPACE/artifacts
          mkdir -p $OUT_DIR
          cp target/lambda/$BIN_NAME/bootstrap.zip $OUT_DIR/$BIN_NAME-${{ env.STAGE_NAME }}-${GITHUB_SHA}.zip

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ secrets.CI_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload Lambda to S3
        run: |
          BIN_NAME=$(basename ${{ matrix.crate }})
          aws s3api put-object \
            --bucket "${{ vars.S3_BINARY_ARTIFACTS_BUCKET_NAME }}" \
            --key "$BIN_NAME-${{ env.STAGE_NAME }}-${GITHUB_SHA}.zip" \
            --body "$GITHUB_WORKSPACE/artifacts/$BIN_NAME-${{ env.STAGE_NAME }}-${GITHUB_SHA}.zip" \
            --tagging "stage=${{ env.STAGE }}"

  aws-push-mail-templates:
    name: Compile & push Mail-Templates to S3 ${{ matrix.resource }}
    if: github.event_name == 'push' && (github.ref == 'refs/heads/prod' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    strategy:
      matrix:
        resource:
          - mjml/watchlist/product-update/price/de.mjml
          - mjml/watchlist/product-update/price/en.mjml
          - mjml/watchlist/product-update/price/es.mjml
          - mjml/watchlist/product-update/price/fr.mjml
          - mjml/watchlist/product-update/price/it.mjml
          - mjml/watchlist/product-update/state/de.mjml
          - mjml/watchlist/product-update/state/en.mjml
          - mjml/watchlist/product-update/state/es.mjml
          - mjml/watchlist/product-update/state/fr.mjml
          - mjml/watchlist/product-update/state/it.mjml
          - mjml/search-filter/match/de.mjml
          - mjml/search-filter/match/en.mjml
          - mjml/search-filter/match/es.mjml
          - mjml/search-filter/match/fr.mjml
          - mjml/search-filter/match/it.mjml
          - mjml/partner-application/approval/de.mjml
          - mjml/partner-application/approval/en.mjml
          - mjml/partner-application/approval/es.mjml
          - mjml/partner-application/approval/fr.mjml
          - mjml/partner-application/approval/it.mjml
          - mjml/partner-application/rejection/de.mjml
          - mjml/partner-application/rejection/en.mjml
          - mjml/partner-application/rejection/es.mjml
          - mjml/partner-application/rejection/fr.mjml
          - mjml/partner-application/rejection/it.mjml

    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ secrets.CI_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install MJML
        run: npm install -g mjml

      - name: Compile MJML
        run: |
          output="dist/emails/${{ matrix.resource }}"
          output="${output%.mjml}.html"
          mkdir -p "$(dirname "$output")"
          mjml "${{ matrix.resource }}" -o "$output"

      - name: Upload compiled template to S3
        run: |
          output="dist/emails/${{ matrix.resource }}"
          output="${output%.mjml}.html"
          aws s3api put-object \
            --bucket "${{ vars.S3_MAIL_TEMPLATE_BUCKET_NAME }}" \
            --key "${{ env.STAGE_NAME }}/${GITHUB_SHA}/${output#dist/emails/}" \
            --body "$output" \
            --tagging "stage=${{ env.STAGE }}"

  aws-cfn-deploy:
    name: Deploy & initialize CFN-Stack
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/prod' || github.ref == 'refs/heads/develop') }}
    needs:
      [cfn-lint, aws-push-lambda, aws-push-mail-templates]
    environment:
      name: ${{ github.ref == 'refs/heads/prod' && 'aws-prod' || github.ref == 'refs/heads/develop' && 'aws-dev' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ secrets.CI_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy CloudFormation
        run: |
          aws cloudformation deploy \
            --stack-name ${{ env.STACK_NAME }} \
            --template-file ${{ env.CLOUDFORMATION_TEMPLATE_PATH }} \
            --s3-bucket ${{ vars.S3_CFN_ARTIFACTS_BUCKET_NAME }} \
            --s3-prefix ${{ env.STAGE_NAME }} \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
                Stage=${{ env.STAGE }} \
                StageName=${{ env.STAGE_NAME }} \
                ArtifactBucket=${{ vars.S3_BINARY_ARTIFACTS_BUCKET_NAME }} \
                ResourceBucket=${{ vars.S3_RESOURCE_ARTIFACTS_BUCKET_NAME }} \
                MailTemplateBucket=${{ vars.S3_MAIL_TEMPLATE_BUCKET_NAME }} \
                CommitSHA=${GITHUB_SHA} \
                OpenSearchEndpointUrl=${{ vars.OPENSEARCH_ENDPOINT_URL }} \
                StripeEventBusName=${{ vars.STRIPE_EVENT_BUS_NAME }} \
                StripeProProductId=${{ vars.STRIPE_PRO_PRODUCT_ID }} \
                StripeUltimateProductId=${{ vars.STRIPE_ULTIMATE_PRODUCT_ID }} \
                StripeProMonthlyPriceId=${{ vars.STRIPE_PRO_MONTHLY_PRICE_ID }} \
                StripeProYearlyPriceId=${{ vars.STRIPE_PRO_YEARLY_PRICE_ID }} \
                StripeUltimateMonthlyPriceId=${{ vars.STRIPE_ULTIMATE_MONTHLY_PRICE_ID }} \
                StripeUltimateYearlyPriceId=${{ vars.STRIPE_ULTIMATE_YEARLY_PRICE_ID }}

  aws-smoking-test:
    name: AWS Smoking-Test
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/prod' }}
    needs: aws-cfn-deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ secrets.CI_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Export CFN Output
        id: export-cfn-output
        shell: bash
        run: |
          set -euo pipefail
          JSON=$(
            aws cloudformation describe-stacks \
              --stack-name ${{ env.STACK_NAME }} \
              --query 'Stacks[0].Outputs' \
              --output json \
            | jq -c 'map({(.OutputKey): .OutputValue}) | add'
          )
          echo "outputs_json=$JSON" >> "$GITHUB_OUTPUT"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run Smoking-Tests
        working-directory: src/aws-tests/src/smoking-tests
        env:
          CFN_OUTPUT: ${{ steps.export-cfn-output.outputs.outputs_json }}
        run: cargo test --locked --test '*' --all-features -- --ignored --nocapture

  aws-put-staging-test-data:
    name: AWS Populate Test-Data
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
    needs: aws-cfn-deploy
    permissions:
      contents: read
      id-token: write
    environment:
      name: aws-dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ secrets.CI_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Export CFN Output
        id: export-cfn-output
        shell: bash
        run: |
          set -euo pipefail
          JSON=$(
            aws cloudformation describe-stacks \
              --stack-name ${{ env.STACK_NAME }} \
              --query 'Stacks[0].Outputs' \
              --output json \
            | jq -c 'map({(.OutputKey): .OutputValue}) | add'
          )
          echo "outputs_json=$JSON" >> "$GITHUB_OUTPUT"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run src/aws-tests/src/staging-data
        working-directory: src/aws-tests/src/staging-data
        env:
          CFN_OUTPUT: ${{ steps.export-cfn-output.outputs.outputs_json }}
          STAGE: ${{ env.STAGE }}
          OPENSEARCH_ENDPOINT_URL: ${{ vars.OPENSEARCH_ENDPOINT_URL }}
          OPENSEARCH_USERNAME: ${{ secrets.OPENSEARCH_USERNAME }}
          OPENSEARCH_PASSWORD: ${{ secrets.OPENSEARCH_PASSWORD }}
        run: cargo run --locked --all-features -- --nocapture
