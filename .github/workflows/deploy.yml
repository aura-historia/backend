name: Legacy deployment disabled

on:
  workflow_dispatch:

permissions: {}

jobs:
  disabled:
    name: Legacy CD is intentionally disabled
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Refuse legacy deployment
        shell: bash
        run: |
          echo "::error::Legacy CD is disabled. The replacement hybrid release workflow is not enabled yet."
          exit 1
