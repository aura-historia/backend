name: Deploy (CD)
run-name: Deploy ${{ github.event_name == 'workflow_dispatch' && inputs.stage || startsWith(github.ref, 'refs/tags/') && 'prod' || 'dev' }} — ${{ inputs.ref || github.ref_name }} (${{ inputs.scope || 'auto' }})

on:
  push:
    branches: [develop]
    tags: ["[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]-[0-9][0-9][0-9][0-9]"]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - "ci/**"
      - ".dockerignore"
      - "rust-toolchain.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "migrations/**"
      - "infra/**"
      - "mjml/**"
  workflow_dispatch:
    inputs:
      stage:
        description: Stage to deploy
        required: true
        type: choice
        default: dev
        options: [dev, prod]
      ref:
        description: "Dev: develop or full commit SHA (blank = develop). Prod: existing YYYYMMDD-HHMM tag."
        type: string
      scope:
        description: "auto: stop at foundation for new stages or migration changes; foundation: prepare only; all: acknowledge readiness and deploy application"
        required: true
        type: choice
        default: auto
        options: [auto, foundation, all]

permissions:
  contents: read

concurrency:
  group: aws-deploy-${{ github.event_name == 'workflow_dispatch' && inputs.stage || startsWith(github.ref, 'refs/tags/') && 'prod' || 'dev' }}
  cancel-in-progress: false

env:
  STAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.stage || startsWith(github.ref, 'refs/tags/') && 'prod' || 'dev' }}
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  infra-test:
    name: Resolve release and test infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      stage: ${{ env.STAGE }}
      commit_sha: ${{ steps.source.outputs.commit_sha }}
      lambda_matrix: ${{ steps.lambda-catalog.outputs.matrix }}
      container_matrix: ${{ steps.container-catalog.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Resolve and validate release source
        id: source
        env:
          REQUESTED_REF: ${{ inputs.ref }}
        run: node ci/release-source.cjs
      - name: Check out the exact release
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.source.outputs.commit_sha }}
      - name: Install CDK dependencies
        run: npm --prefix infra ci
      - name: Type-check CDK app
        run: npm --prefix infra run build
      - name: Test CDK app and deployment helpers
        run: |
          npm --prefix infra test
          node --test ci/*.test.cjs
      - name: Synthesize all stacks
        run: npm --prefix infra run synth:all
      - name: Read container image catalog
        id: container-catalog
        run: node ci/container-images.cjs matrix >> "$GITHUB_OUTPUT"
      - name: Read release Lambda catalog
        id: lambda-catalog
        run: |
          node -e 'console.log("matrix=" + JSON.stringify({binary: require("./ci/lambda-binaries.json")}))' >> "$GITHUB_OUTPUT"

  aws-push-container-images:
    name: Publish or reuse image ${{ matrix.id }}
    needs: [infra-test]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOY_COMMIT_SHA: ${{ needs.infra-test.outputs.commit_sha }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.infra-test.outputs.container_matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_COMMIT_SHA }}
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.CI_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Publish tested image or reuse immutable SHA tag
        env:
          IMAGE_ID: ${{ matrix.id }}
          IMAGE_BINARY: ${{ matrix.binary }}
          IMAGE_REPOSITORY: ${{ matrix.repository }}
          IMAGE_DOCKERFILE: ${{ matrix.dockerfile }}
          IMAGE_PLATFORM: ${{ matrix.platform }}
        run: bash ci/publish-container.sh

  aws-push-lambda:
    name: Publish or reuse Lambda ${{ matrix.binary }}
    needs: [infra-test]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOY_COMMIT_SHA: ${{ needs.infra-test.outputs.commit_sha }}
      BUCKET: ${{ vars.S3_BINARY_ARTIFACTS_BUCKET_NAME }}
      BINARY: ${{ matrix.binary }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.infra-test.outputs.lambda_matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_COMMIT_SHA }}
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.CI_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Check for published ZIP
        id: artifact
        run: |
          exists="$(bash ci/s3-artifact-exists.sh "$BUCKET" "${BINARY}-${STAGE}-${DEPLOY_COMMIT_SHA}.zip")"
          echo "exists=$exists" >> "$GITHUB_OUTPUT"
      - name: Install toolchain
        if: steps.artifact.outputs.exists == 'false'
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        if: steps.artifact.outputs.exists == 'false'
      - name: Cache cargo-lambda
        if: steps.artifact.outputs.exists == 'false'
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-lambda
          key: ${{ runner.os }}-cargo-lambda-1.9.0
      - uses: mlugg/setup-zig@v2
        if: steps.artifact.outputs.exists == 'false'
        with:
          version: 0.14.1
      - name: Build Lambda ZIP
        if: steps.artifact.outputs.exists == 'false'
        working-directory: src/${{ matrix.binary }}
        env:
          CARGO_PROFILE_RELEASE_LTO: true
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 1
        run: |
          if ! cargo lambda --version | grep -Eq '^cargo-lambda 1\.9\.0($| )'; then
            cargo install cargo-lambda --version 1.9.0 --locked --force
          fi
          cargo lambda build --locked --release --target x86_64-unknown-linux-musl --output-format zip --bin "$BINARY"
      - name: Upload Lambda ZIP without replacing a published artifact
        if: steps.artifact.outputs.exists == 'false'
        run: |
          file="target/lambda/${BINARY}/bootstrap.zip"
          test -s "$file"
          aws s3api put-object --bucket "$BUCKET" \
            --key "${BINARY}-${STAGE}-${DEPLOY_COMMIT_SHA}.zip" --body "$file" \
            --if-none-match '*' --tagging "stage=${STAGE}" >/dev/null

  aws-push-mail-templates:
    name: Publish or reuse mail templates
    needs: [infra-test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOY_COMMIT_SHA: ${{ needs.infra-test.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_COMMIT_SHA }}
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm --prefix mjml ci
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.CI_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Compile and upload missing templates
        shell: bash
        env:
          BUCKET: ${{ vars.S3_MAIL_TEMPLATE_BUCKET_NAME }}
        run: |
          set -euo pipefail
          template_count=0
          while IFS= read -r -d '' template; do
            key="${STAGE}/${DEPLOY_COMMIT_SHA}/${template%.mjml}.html"
            exists="$(bash ci/s3-artifact-exists.sh "$BUCKET" "$key")"
            if [ "$exists" = false ]; then
              output="dist/emails/${template%.mjml}.html"
              mkdir -p "$(dirname "$output")"
              mjml/node_modules/.bin/mjml "$template" -o "$output"
              test -s "$output"
              aws s3api put-object --bucket "$BUCKET" --key "$key" --body "$output" \
                --if-none-match '*' --tagging "stage=${STAGE}" >/dev/null
            fi
            template_count=$((template_count + 1))
          done < <(git ls-files -z -- 'mjml/**/*.mjml')
          test "$template_count" -gt 0

  aws-cdk-deploy:
    name: Deploy CDK stacks
    needs:
      [
        infra-test,
        aws-push-container-images,
        aws-push-lambda,
        aws-push-mail-templates,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: aws-${{ needs.infra-test.outputs.stage }}
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOY_COMMIT_SHA: ${{ needs.infra-test.outputs.commit_sha }}
      DEPLOY_SCOPE: ${{ inputs.scope || 'auto' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_COMMIT_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm --prefix infra ci
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.CI_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Resolve immutable release images
        id: container-images
        uses: ./.github/actions/resolve-container-images
        with:
          commit-sha: ${{ env.DEPLOY_COMMIT_SHA }}
      - name: Deploy foundation and application
        env:
          CONTAINER_IMAGE_DIGESTS: ${{ steps.container-images.outputs.digests }}
        run: bash ci/deploy-stacks.sh
