name: Release
run-name: Release ${{ inputs.mode }} / ${{ inputs.target }} / ${{ inputs.source_sha || inputs.bundle_digest }}
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Build shared artifacts or promote a completed bundle
        required: true
        type: choice
        options: [build, promote]
      target:
        description: Deployment target (dev must be explicitly enabled)
        required: true
        type: choice
        options: [prod, dev]
      source_sha:
        description: Build only — full lowercase SHA merged into protected develop
        type: string
      bundle_digest:
        description: Promote only — full immutable completed bundle SHA-256
        type: string
      manual_evidence:
        description: Optional sanitized OpenSearch observations JSON; see docs/infra.md
        type: string
permissions:
  contents: read
  actions: read
  deployments: read
env:
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  AWS_REGION: ${{ vars.AWS_REGION }}
  DELIVERY_BUCKET: ${{ vars.DELIVERY_BUCKET }}
  DELIVERY_CONTROL_VERSION: ${{ vars.DELIVERY_CONTROL_VERSION }}
  DELIVERY_BUILD_PIPELINE: ${{ vars.DELIVERY_BUILD_PIPELINE }}
  DELIVERY_DEV_ENABLED: ${{ vars.DELIVERY_DEV_ENABLED }}
  DELIVERY_PROTECTIONS_VERIFIED: ${{ vars.DELIVERY_PROTECTIONS_VERIFIED }}
  WORKFLOW_REVISION: ${{ github.workflow_sha }}
  GH_TOKEN: ${{ github.token }}
jobs:
  resolve:
    name: Pin request and check protections
    if: github.ref == 'refs/heads/develop' && github.repository == 'aura-historia/backend'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      deployments: read
      id-token: write
    outputs:
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      request_id: ${{ steps.resolve.outputs.request_id }}
      bundle_digest: ${{ steps.resolve.outputs.bundle_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        if: inputs.mode == 'promote'
        with:
          role-to-assume: ${{ vars.DELIVERY_READER_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Resolve immutable selection
        id: resolve
        env:
          DELIVERY_MODE: ${{ inputs.mode }}
          DELIVERY_TARGET: ${{ inputs.target }}
          DELIVERY_SOURCE_SHA: ${{ inputs.source_sha }}
          DELIVERY_BUNDLE_DIGEST: ${{ inputs.bundle_digest }}
        run: node ci/delivery/workflow.cjs resolve
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: delivery-selection-${{ github.run_id }}-${{ github.run_attempt }}
          path: .delivery/selection.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
  tests:
    needs: resolve
    uses: ./.github/workflows/release-tests.yml
    with:
      source_sha: ${{ needs.resolve.outputs.source_sha }}
    permissions:
      contents: read
      packages: read
  build:
    name: Approve shared build / ${{ needs.resolve.outputs.source_sha }}
    if: inputs.mode == 'build'
    needs: [resolve, tests]
    environment: aws-release-build
    runs-on: ubuntu-24.04
    timeout-minutes: 130
    permissions:
      contents: read
      actions: read
      deployments: read
      id-token: write
    outputs:
      bundle_digest: ${{ steps.wait.outputs.bundle_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - uses: actions/download-artifact@v8
        with:
          name: delivery-selection-${{ github.run_id }}-${{ github.run_attempt }}
          path: .delivery
      - uses: actions/download-artifact@v8
        with:
          name: delivery-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: .delivery
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.DELIVERY_BUILD_REQUESTER_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Submit exact authorized shared build
        run: node ci/delivery/workflow.cjs build
      - name: Bounded native build monitor
        id: wait
        run: node ci/delivery/workflow.cjs wait-build
  prepare:
    name: Review cumulative target compatibility
    if: always() && needs.tests.result == 'success' && (needs.build.result == 'success' || (inputs.mode == 'promote' && needs.build.result == 'skipped'))
    needs: [resolve, tests, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
      deployments: read
      id-token: write
    outputs:
      report_digest: ${{ steps.summary.outputs.report_digest }}
      verdict: ${{ steps.summary.outputs.verdict }}
      prerequisite_digest: ${{ steps.summary.outputs.prerequisite_digest }}
    env:
      DELIVERY_REQUEST_ID: ${{ needs.resolve.outputs.request_id }}
      DELIVERY_TARGET: ${{ inputs.target }}
      DELIVERY_BUNDLE_DIGEST: ${{ needs.build.outputs.bundle_digest || needs.resolve.outputs.bundle_digest }}
      DELIVERY_REVIEW_MODEL_ID: ${{ vars.DELIVERY_REVIEW_MODEL_ID }}
      DELIVERY_MANUAL_COMPLETION: ${{ inputs.manual_evidence }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - uses: actions/download-artifact@v8
        with:
          name: delivery-selection-${{ github.run_id }}-${{ github.run_attempt }}
          path: .delivery
      - uses: actions/download-artifact@v8
        with:
          name: delivery-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: .delivery
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ inputs.target == 'prod' && vars.DELIVERY_PROD_PLANNER_ROLE_ARN || vars.DELIVERY_DEV_PLANNER_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Prepare target report and blocking manual checklist
        env:
          DELIVERY_REPO_DIR: ${{ github.workspace }}
          DELIVERY_TESTS_FILE: .delivery/tests.json
        run: node ci/delivery/pipeline.cjs prepare
      - name: Display exact approval identity
        id: summary
        run: |
          jq -r '"report_digest=" + .reportDigest, "verdict=" + .verdict, "prerequisite_digest=" + .prerequisiteDigest' .delivery/approval.json >> "$GITHUB_OUTPUT"
          cat .delivery/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: delivery-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: .delivery/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
  deploy:
    name: Approve ${{ inputs.target }} / report ${{ needs.prepare.outputs.report_digest }} / prerequisites ${{ needs.prepare.outputs.prerequisite_digest }}
    if: needs.prepare.outputs.verdict == 'ROUTINE'
    needs: [resolve, prepare]
    environment:
      name: aws-${{ inputs.target }}
      url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      deployments: read
      id-token: write
    env:
      DELIVERY_DEPLOY_PIPELINE: ${{ inputs.target == 'prod' && vars.DELIVERY_PROD_PIPELINE || vars.DELIVERY_DEV_PIPELINE }}
      DELIVERY_MANUAL_COMPLETION: ${{ inputs.manual_evidence }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - uses: actions/download-artifact@v8
        with:
          name: delivery-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: .delivery
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ inputs.target == 'prod' && vars.DELIVERY_PROD_REQUESTER_ROLE_ARN || vars.DELIVERY_DEV_REQUESTER_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Submit exact approved deployment and manual attestation
        run: node ci/delivery/workflow.cjs deploy
