name: Deploy (CD)

on:
  push:
    branches: [prod, develop]
    paths:
      - ".github/workflows/deploy.yml"
      - "rust-toolchain.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "migrations/**"
      - "infra/**"
      - "mjml/**"
  workflow_dispatch:
    inputs:
      stage:
        description: "Stage to deploy"
        required: true
        type: choice
        options:
          - dev
          - prod
      commit_sha:
        description: "Previously uploaded artifact commit SHA to deploy (useful for rollbacks)"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.stage || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/prod' && (github.event_name != 'workflow_dispatch' || inputs.stage != 'prod') }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  STAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.stage
    || github.ref == 'refs/heads/prod' && 'prod'
    || github.ref == 'refs/heads/develop' && 'dev' }}
  STAGE_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.stage
    || github.ref == 'refs/heads/prod' && 'prod'
    || github.ref == 'refs/heads/develop' && 'dev' }}
  STACK_NAME_PREFIX: application-${{ github.event_name == 'workflow_dispatch' && inputs.stage || github.ref == 'refs/heads/prod' && 'prod' || 'dev' }}
  DEPLOY_COMMIT_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.commit_sha || github.sha }}

jobs:
  infra-test:
    name: Test CDK infrastructure
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install CDK dependencies
        run: npm --prefix infra ci

      - name: Type-check CDK app
        run: npm --prefix infra run build

      - name: Test CDK app
        run: npm --prefix infra test

      - name: Synthesize all stacks
        run: npm --prefix infra run synth:all

  aws-push-lambda:
    name: Push Lambda to S3 ${{ matrix.crate }}
    if: github.event_name == 'push' && (github.ref == 'refs/heads/prod' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        crate:
          - src/product-pipeline/src/product-pipeline-embed-text
          - src/product-pipeline/src/product-pipeline-translate
          - src/shopify-lambda
          - src/cognito-post-confirmation
          - src/cloudwatch-log-retention-lambda
          - src/fxrate-lambda
          - src/stripe-lambda
    steps:
      - uses: actions/checkout@v7

      - name: Install Toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Cache cargo-lambda
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/cargo-lambda
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-lambda-1.9.0

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - name: Install cargo-lambda
        run: |
          if ! command -v cargo-lambda &> /dev/null; then
            cargo install cargo-lambda --version 1.9.0
          fi

      - name: Build Lambda binary
        working-directory: ${{ matrix.crate }}
        env:
          CARGO_PROFILE_RELEASE_LTO: true
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 1
        run: cargo lambda build --locked --release --target x86_64-unknown-linux-musl --output-format zip

      - name: Copy Lambda zip artifact
        run: |
          BIN_NAME=$(basename ${{ matrix.crate }})
          OUT_DIR=$GITHUB_WORKSPACE/artifacts
          mkdir -p $OUT_DIR
          cp target/lambda/$BIN_NAME/bootstrap.zip $OUT_DIR/$BIN_NAME-${{ env.STAGE_NAME }}-${{ env.DEPLOY_COMMIT_SHA }}.zip

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ secrets.CI_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload Lambda to S3
        run: |
          BIN_NAME=$(basename ${{ matrix.crate }})
          aws s3api put-object \
            --bucket "${{ vars.S3_BINARY_ARTIFACTS_BUCKET_NAME }}" \
            --key "$BIN_NAME-${{ env.STAGE_NAME }}-${{ env.DEPLOY_COMMIT_SHA }}.zip" \
            --body "$GITHUB_WORKSPACE/artifacts/$BIN_NAME-${{ env.STAGE_NAME }}-${{ env.DEPLOY_COMMIT_SHA }}.zip" \
            --tagging "stage=${{ env.STAGE }}"

  aws-push-mail-templates:
    name: Compile & push Mail-Templates to S3 ${{ matrix.resource }}
    if: github.event_name == 'push' && (github.ref == 'refs/heads/prod' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    strategy:
      matrix:
        resource:
          - mjml/partnership-application/approval/de.mjml
          - mjml/partnership-application/approval/en.mjml
          - mjml/partnership-application/approval/es.mjml
          - mjml/partnership-application/approval/fr.mjml
          - mjml/partnership-application/approval/it.mjml
          - mjml/partnership-application/rejection/de.mjml
          - mjml/partnership-application/rejection/en.mjml
          - mjml/partnership-application/rejection/es.mjml
          - mjml/partnership-application/rejection/fr.mjml
          - mjml/partnership-application/rejection/it.mjml

    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ secrets.CI_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install MJML
        run: npm install -g mjml

      - name: Compile MJML
        run: |
          output="dist/emails/${{ matrix.resource }}"
          output="${output%.mjml}.html"
          mkdir -p "$(dirname "$output")"
          mjml "${{ matrix.resource }}" -o "$output"

      - name: Upload compiled template to S3
        run: |
          output="dist/emails/${{ matrix.resource }}"
          output="${output%.mjml}.html"
          aws s3api put-object \
            --bucket "${{ vars.S3_MAIL_TEMPLATE_BUCKET_NAME }}" \
            --key "${{ env.STAGE_NAME }}/${{ env.DEPLOY_COMMIT_SHA }}/${output#dist/emails/}" \
            --body "$output" \
            --tagging "stage=${{ env.STAGE }}"

  aws-cdk-deploy:
    name: Deploy CDK stacks
    if: >-
      ${{
        always()
        && needs.infra-test.result == 'success'
        && (needs.aws-push-lambda.result == 'success' || needs.aws-push-lambda.result == 'skipped')
        && (needs.aws-push-mail-templates.result == 'success' || needs.aws-push-mail-templates.result == 'skipped')
        && (github.event_name == 'workflow_dispatch'
          || (github.event_name == 'push' && (github.ref == 'refs/heads/prod' || github.ref == 'refs/heads/develop')))
      }}
    needs: [infra-test, aws-push-lambda, aws-push-mail-templates]
    environment:
      name: ${{ (github.event_name == 'workflow_dispatch' && inputs.stage || github.ref == 'refs/heads/prod' && 'prod' || 'dev') == 'prod' && 'aws-prod' || 'aws-dev' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install CDK dependencies
        run: npm --prefix infra ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ secrets.CI_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy CDK stacks via CloudFormation change sets
        shell: bash
        run: |
          set -euo pipefail
          stacks=(
            "${STACK_NAME_PREFIX}-data"
            "${STACK_NAME_PREFIX}-compute"
            "${STACK_NAME_PREFIX}-api"
          )
          if [ "${STAGE}" = "prod" ]; then
            stacks+=("${STACK_NAME_PREFIX}-observability")
          fi

          npm --prefix infra run cdk -- deploy "${stacks[@]}" \
            --context stage="${STAGE}" \
            --context stackNamePrefix="${STACK_NAME_PREFIX}" \
            --require-approval never \
            --method change-set \
            --no-path-metadata \
            --no-asset-metadata \
            --no-version-reporting \
            --no-notices \
            --parameters "${STACK_NAME_PREFIX}-compute:CommitSHA=${DEPLOY_COMMIT_SHA}"
