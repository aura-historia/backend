name: Build Golden AMI

on:
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    CARGO_TERM_COLOR: always
    STAGE: ${{ github.event_name == 'pull_request' && 'ephemeral'
        || github.ref == 'refs/heads/prod' && 'prod'
        || github.ref == 'refs/heads/develop' && 'dev' }}
    STAGE_NAME:
        ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number)
        || github.ref == 'refs/heads/prod' && 'prod'
        || github.ref == 'refs/heads/develop' && 'dev' }}
    STACK: application
    STACK_NAME:
        application-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number)
        || github.ref == 'refs/heads/prod' && 'prod'
        || github.ref == 'refs/heads/develop' && 'dev' }}
    CLOUDFORMATION_TEMPLATE_PATH:
        ${{ github.event_name == 'pull_request' && 'cfn/ephemeral.yaml'
        || github.ref == 'refs/heads/prod' && 'cfn/prod.yaml'
        || github.ref == 'refs/heads/develop' && 'cfn/dev.yaml' }}

jobs:
    build-ami:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v5.1.1
              with:
                  role-to-assume: ${{ secrets.CI_DEPLOY_ROLE_ARN }}
                  aws-region: ${{ vars.AWS_REGION }}

            # 1️⃣ Deploy / update Image Builder stack
            - name: Deploy Image Builder CloudFormation
              run: |
                  aws cloudformation deploy \
                    --stack-name ${{ env.STAGE_NAME }}-imagebuilder \
                    --template-file cfn/product-pipeline-embed-text.yaml \
                    --s3-bucket ${{ vars.S3_CFN_ARTIFACTS_BUCKET_NAME }} \
                    --s3-prefix ${{ env.STAGE_NAME }} \
                    --capabilities CAPABILITY_NAMED_IAM \
                    --parameter-overrides StageName=${{ env.STAGE_NAME }}

            # 2️⃣ Get pipeline ARN
            - name: Get Image Pipeline ARN
              id: get_pipeline_arn
              run: |
                  PIPELINE_ARN=$(aws cloudformation describe-stacks \
                    --stack-name ${{ env.STAGE_NAME }}-imagebuilder \
                    --query "Stacks[0].Outputs[?OutputKey=='ImagePipelineArn'].OutputValue" \
                    --output text)

                  echo "pipeline_arn=$PIPELINE_ARN" >> $GITHUB_OUTPUT

            # 3️⃣ Start Image Builder execution (IMPORTANT)
            - name: Start Image Builder Pipeline
              id: start_pipeline
              run: |
                  EXECUTION_ARN=$(aws imagebuilder start-image-pipeline-execution \
                    --image-pipeline-arn ${{ steps.get_pipeline_arn.outputs.pipeline_arn }} \
                    --query 'imageBuildVersionArn' \
                    --output text)

                  echo "execution_arn=$EXECUTION_ARN" >> $GITHUB_OUTPUT
                  echo "Started Image Builder execution:"
                  echo "$EXECUTION_ARN"

            # 4️⃣ Wait for *this exact build*
            - name: Wait for Image Builder AMI
              run: |
                  EXECUTION_ARN="${{ steps.start_pipeline.outputs.execution_arn }}"
                  echo "Waiting for Image Builder execution: $EXECUTION_ARN"

                  while true; do
                    STATUS=$(aws imagebuilder get-image \
                      --image-build-version-arn "$EXECUTION_ARN" \
                      --query 'image.state.status' \
                      --output text)

                    echo "Current status: $STATUS"

                    if [[ "$STATUS" == "AVAILABLE" ]]; then
                      echo "AMI build completed successfully"
                      break
                    elif [[ "$STATUS" == "FAILED" ]]; then
                      echo "AMI build failed"
                      aws imagebuilder get-image \
                        --image-build-version-arn "$EXECUTION_ARN"
                      exit 1
                    else
                      sleep 30
                    fi
                  done

            # 5️⃣ Fetch AMI ID from the same execution
            - name: Get AMI ID
              id: get_ami
              run: |
                  EXECUTION_ARN="${{ steps.start_pipeline.outputs.execution_arn }}"

                  AMI_ID=$(aws imagebuilder get-image \
                    --image-build-version-arn "$EXECUTION_ARN" \
                    --query 'image.outputResources.amis[0].image' \
                    --output text)

                  echo "ami_id=$AMI_ID" >> $GITHUB_OUTPUT
                  echo "Built AMI ID: $AMI_ID"

            # 6️⃣ Store AMI ID in SSM
            - name: Store AMI ID in SSM Parameter Store
              run: |
                  aws ssm put-parameter \
                    --name /amis/product-pipeline-embed-text/${{ env.STAGE_NAME }}/latest \
                    --value ${{ steps.get_ami.outputs.ami_id }} \
                    --type String \
                    --overwrite

