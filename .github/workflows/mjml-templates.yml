name: MJML template checks

on:
  push:
    branches: [develop]
    paths:
      - "mjml/**"
      - "infra/src/resources/cognito-verification-email.html"
      - ".github/workflows/mjml-templates.yml"
  pull_request:
    paths:
      - "mjml/**"
      - "infra/src/resources/cognito-verification-email.html"
      - ".github/workflows/mjml-templates.yml"

jobs:
  mjml-compile:
    name: Compile MJML templates
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install pinned MJML
        run: npm --prefix mjml ci

      - name: Generate and verify Cognito verification HTML
        run: |
          git ls-files --error-unmatch -- infra/src/resources/cognito-verification-email.html >/dev/null
          npm --prefix mjml run generate:cognito-verification
          git diff --exit-code -- infra/src/resources/cognito-verification-email.html

      - name: Compile every MJML template
        shell: bash
        run: |
          set -euo pipefail
          template_count=0
          while IFS= read -r -d '' template; do
            mjml/node_modules/.bin/mjml "$template" --output /dev/null
            template_count=$((template_count + 1))
          done < <(git ls-files -z -- 'mjml/**/*.mjml')
          test "$template_count" -gt 0
