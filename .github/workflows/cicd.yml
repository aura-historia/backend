name: CI/CD

on:
  push:
    branches: [prod, develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/prod' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  STAGE: ${{ github.event_name == 'pull_request' && 'ephemeral'
    || github.ref == 'refs/heads/prod' && 'prod'
    || github.ref == 'refs/heads/develop' && 'dev' }}
  STAGE_NAME:
    ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number)
    || github.ref == 'refs/heads/prod' && 'prod'
    || github.ref == 'refs/heads/develop' && 'dev' }}
  STACK: application
  STACK_NAME:
    application-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number)
    || github.ref == 'refs/heads/prod' && 'prod'
    || github.ref == 'refs/heads/develop' && 'dev' }}
  CLOUDFORMATION_TEMPLATE_PATH:
    ${{ github.event_name == 'pull_request' && 'cfn/ephemeral.yaml'
    || github.ref == 'refs/heads/prod' && 'cfn/prod.yaml'
    || github.ref == 'refs/heads/develop' && 'cfn/dev.yaml' }}
  LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_API_KEY }}

jobs:
  cfn-lint:
    name: Lint CloudFormation
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install cfn-lint
        run: pip install -r cfn/lint/requirements.txt

      - name: Run cfn-lint for '${{ env.CLOUDFORMATION_TEMPLATE_PATH }}'
        run: cfn-lint --non-zero-exit-code error ${{ env.CLOUDFORMATION_TEMPLATE_PATH }}

  lint:
    name: Lint Workspace
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy lint
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings -D clippy::result-large-err

  unit-test:
    name: Unit-Test Workspace
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test Workspace
        run: cargo test --locked --workspace --lib --all-features -- --nocapture

  determine-affected-crates:
    name: Determine Affected Crates
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      integration_test_crates: ${{ steps.determine.outputs.integration_test_crates }}
      test_pipeline_crates: ${{ steps.determine.outputs.test_pipeline_crates }}
      acceptance_test_crates: ${{ steps.determine.outputs.acceptance_test_crates }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build ci-determinator
        run: cargo build --locked --release --package ci-determinator

      - name: Compute base ref
        id: base-ref
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=HEAD~1" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine affected crates
        id: determine
        run: |
          result=$(./target/release/ci-determinator "${{ steps.base-ref.outputs.sha }}")
          echo "integration_test_crates=$(echo "$result" | jq -c '.integration_test')" >> "$GITHUB_OUTPUT"
          echo "test_pipeline_crates=$(echo "$result" | jq -c '.test_pipeline')" >> "$GITHUB_OUTPUT"
          echo "acceptance_test_crates=$(echo "$result" | jq -c '.acceptance_test')" >> "$GITHUB_OUTPUT"

  integration-test:
    name: Integration-Test ${{ matrix.crate }}
    needs: [determine-affected-crates]
    if: needs.determine-affected-crates.outputs.integration_test_crates != '[]'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      matrix:
        crate: ${{ fromJson(needs.determine-affected-crates.outputs.integration_test_crates) }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test ${{ matrix.crate }}
        working-directory: ${{ matrix.crate }}
        run: cargo test --locked --test '*' --all-features -- --nocapture

      - name: Prune Docker volumes
        run: docker volume prune -f

  acceptance-test:
    name: Acceptance-Test
    needs: [determine-affected-crates]
    if: needs.determine-affected-crates.outputs.acceptance_test_crates != '[]'
    permissions:
      contents: read
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Cache cargo-lambda and Zig
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/cargo-lambda
            ~/.cache/zig
          key: ${{ runner.os }}-cargo-lambda-zig-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Zig
        run: |
          if ! command -v zig >/dev/null 2>&1; then
            npm install -g @ziglang/cli
          fi

      - name: Install cargo-lambda
        run: |
          if ! command -v cargo-lambda >/dev/null 2>&1; then
            cargo install cargo-lambda
          fi
      - name: Test acceptance-tests
        run: cargo test --locked --package acceptance-tests -- --nocapture

      - name: Prune Docker volumes
        run: docker volume prune -f

  test-product-pipeline:
    name: Test product-pipeline
    needs: [determine-affected-crates]
    if: needs.determine-affected-crates.outputs.test_pipeline_crates != '[]'
    permissions:
      contents: read
    runs-on: self-hosted
    strategy:
      matrix:
        crate: ${{ fromJson(needs.determine-affected-crates.outputs.test_pipeline_crates) }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python deps
        working-directory: ${{ matrix.crate }}
        run: |
          python -m pip install --upgrade pip
          pip install -r python/requirements.txt

      - name: Test ${{ matrix.crate }}
        working-directory: ${{ matrix.crate }}
        run: cargo test --locked --all-features -- --nocapture --include-ignored

      - name: Prune Docker volumes
        run: docker volume prune -f

  sonar:
    name: SonarQube-Cloud Analysis
    needs: [unit-test, integration-test, test-product-pipeline]
    if: >-
      !cancelled() &&
      github.ref == 'refs/heads/develop' &&
      needs.unit-test.result == 'success' &&
      (needs.integration-test.result == 'success' || needs.integration-test.result == 'skipped') &&
      (needs.test-product-pipeline.result == 'success' || needs.test-product-pipeline.result == 'skipped')
    permissions:
      contents: read
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt, llvm-tools

      - name: Add Cargo bin to PATH
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install grcov
        run: cargo install grcov

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r src/product-pipeline/src/product-pipeline-embed-text/python/requirements.txt

      - name: Generate coverage
        env:
          CARGO_PROFILE_TEST_DEBUG: 1
          RUSTFLAGS: "-C instrument-coverage"
          LLVM_PROFILE_FILE: "coverage-%p-%m.profraw"
        run: |
          cargo test --locked --workspace --all-features --exclude smoking-tests --exclude acceptance-tests --exclude product-pipeline-translate -- --nocapture --include-ignored
          grcov . --binary-path ./target/debug/deps/ -s . -t lcov --branch --ignore-not-existing --ignore "/*" --ignore "*/target/*" --ignore "*/.cargo/*" -o coverage.lcov

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Clean LLVM coverage artifacts
        run: |
          find . -name "*.profraw" -delete
          rm -f coverage.lcov

      - name: Prune Docker volumes
        run: docker volume prune -f

  aws-push-lambda:
    name: Push Lambda to S3 ${{ matrix.crate }}
    if: github.event_name == 'push' && (github.ref == 'refs/heads/prod' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        crate:
          - src/search-filter-api
          - src/search-filter-lambda/src/search-filter-lambda-opensearch-sync
          - src/search-filter-lambda/src/search-filter-lambda-percolate-product
          - src/product-api
          - src/product-api-partner
          - src/product-classification-api
          - src/product-watchlist-api
          - src/product-pipeline/src/product-pipeline-asg-scale-control
          - src/product-lambda/src/product-lambda-materialize-dynamodb
          - src/product-lambda/src/product-lambda-materialize-opensearch
          - src/product-lambda/src/product-lambda-update-notify-user
          - src/shop-api
          - src/shop-lambda/src/shop-lambda-opensearch-index
          - src/user-api
          - src/cognito-post-confirmation
          - src/notification-send
          - src/notification-api
          - src/fxrate-lambda
    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Cache cargo-lambda
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/cargo-lambda
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-lambda-1.9.0

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - name: Install cargo-lambda
        run: |
          if ! command -v cargo-lambda &> /dev/null; then
            cargo install cargo-lambda --version 1.9.0
          fi

      - name: Build Lambda binary
        working-directory: ${{ matrix.crate }}
        env:
          CARGO_PROFILE_RELEASE_LTO: true
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 1
        run: cargo lambda build --locked --release --target x86_64-unknown-linux-musl --output-format zip

      - name: Copy Lambda zip artifact
        run: |
          BIN_NAME=$(basename ${{ matrix.crate }})
          OUT_DIR=$GITHUB_WORKSPACE/artifacts
          mkdir -p $OUT_DIR
          cp target/lambda/$BIN_NAME/bootstrap.zip $OUT_DIR/$BIN_NAME-${{ env.STAGE_NAME }}-${GITHUB_SHA}.zip

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.0.0
        with:
          role-to-assume: ${{ secrets.CI_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload Lambda to S3
        run: |
          BIN_NAME=$(basename ${{ matrix.crate }})
          aws s3api put-object \
            --bucket "${{ vars.S3_BINARY_ARTIFACTS_BUCKET_NAME }}" \
            --key "$BIN_NAME-${{ env.STAGE_NAME }}-${GITHUB_SHA}.zip" \
            --body "$GITHUB_WORKSPACE/artifacts/$BIN_NAME-${{ env.STAGE_NAME }}-${GITHUB_SHA}.zip" \
            --tagging "stage=${{ env.STAGE }}"

  aws-push-ec2-x86:
    name: Push EC2 to S3 ${{ matrix.crate }}
    if: github.event_name == 'push' && (github.ref == 'refs/heads/prod' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        crate:
          - src/product-pipeline/src/product-pipeline-classify
          - src/product-pipeline/src/product-pipeline-embed-text
          - src/product-pipeline/src/product-pipeline-extract-attribute
          - src/product-pipeline/src/product-pipeline-translate
    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build EC2 binary
        working-directory: ${{ matrix.crate }}
        env:
          CARGO_PROFILE_RELEASE_LTO: true
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 1
        run: cargo build --locked --release

      - name: Copy EC2 binary to artifacts
        run: |
          BIN_NAME=$(basename ${{ matrix.crate }})
          mkdir -p $GITHUB_WORKSPACE/artifacts
          cp target/release/$BIN_NAME $GITHUB_WORKSPACE/artifacts/$BIN_NAME-${{ env.STAGE_NAME }}-${GITHUB_SHA}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.0.0
        with:
          role-to-assume: ${{ secrets.CI_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload EC2 binary to S3
        run: |
          BIN_NAME=$(basename ${{ matrix.crate }})
          aws s3api put-object \
            --bucket "${{ vars.S3_BINARY_ARTIFACTS_BUCKET_NAME }}" \
            --key "${{ env.STAGE_NAME }}/${GITHUB_SHA}/$BIN_NAME" \
            --body "$GITHUB_WORKSPACE/artifacts/$BIN_NAME-${{ env.STAGE_NAME }}-${GITHUB_SHA}" \
            --tagging "stage=${{ env.STAGE }}"

  aws-push-mail-templates:
    name: Compile & push Mail-Templates to S3 ${{ matrix.resource }}
    if: github.event_name == 'push' && (github.ref == 'refs/heads/prod' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    strategy:
      matrix:
        resource:
          - mjml/watchlist/product-update/price/de.mjml
          - mjml/watchlist/product-update/price/en.mjml
          - mjml/watchlist/product-update/price/es.mjml
          - mjml/watchlist/product-update/price/fr.mjml
          - mjml/watchlist/product-update/price/it.mjml
          - mjml/watchlist/product-update/state/de.mjml
          - mjml/watchlist/product-update/state/en.mjml
          - mjml/watchlist/product-update/state/es.mjml
          - mjml/watchlist/product-update/state/fr.mjml
          - mjml/watchlist/product-update/state/it.mjml
          - mjml/search-filter/match/de.mjml
          - mjml/search-filter/match/en.mjml
          - mjml/search-filter/match/es.mjml
          - mjml/search-filter/match/fr.mjml
          - mjml/search-filter/match/it.mjml

    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.0.0
        with:
          role-to-assume: ${{ secrets.CI_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install MJML
        run: npm install -g mjml

      - name: Compile MJML
        run: |
          output="dist/emails/${{ matrix.resource }}"
          output="${output%.mjml}.html"
          mkdir -p "$(dirname "$output")"
          mjml "${{ matrix.resource }}" -o "$output"

      - name: Upload compiled template to S3
        run: |
          output="dist/emails/${{ matrix.resource }}"
          output="${output%.mjml}.html"
          aws s3api put-object \
            --bucket "${{ vars.S3_MAIL_TEMPLATE_BUCKET_NAME }}" \
            --key "${{ env.STAGE_NAME }}/${GITHUB_SHA}/${output#dist/emails/}" \
            --body "$output" \
            --tagging "stage=${{ env.STAGE }}"

  aws-cfn-deploy:
    name: Deploy & initialize CFN-Stack
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/prod' || github.ref == 'refs/heads/develop') }}
    needs:
      [cfn-lint, aws-push-lambda, aws-push-ec2-x86, aws-push-mail-templates]
    environment:
      name: ${{ github.ref == 'refs/heads/prod' && 'aws-prod' || github.ref == 'refs/heads/develop' && 'aws-dev' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.0.0
        with:
          role-to-assume: ${{ secrets.CI_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy CloudFormation
        run: |
          aws cloudformation deploy \
            --stack-name ${{ env.STACK_NAME }} \
            --template-file ${{ env.CLOUDFORMATION_TEMPLATE_PATH }} \
            --s3-bucket ${{ vars.S3_CFN_ARTIFACTS_BUCKET_NAME }} \
            --s3-prefix ${{ env.STAGE_NAME }} \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
                Stage=${{ env.STAGE }} \
                StageName=${{ env.STAGE_NAME }} \
                ArtifactBucket=${{ vars.S3_BINARY_ARTIFACTS_BUCKET_NAME }} \
                ResourceBucket=${{ vars.S3_RESOURCE_ARTIFACTS_BUCKET_NAME }} \
                MailTemplateBucket=${{ vars.S3_MAIL_TEMPLATE_BUCKET_NAME }} \
                CommitSHA=${GITHUB_SHA} \
                OpenSearchEndpointUrl=${{ vars.OPENSEARCH_ENDPOINT_URL }} \

  aws-smoking-test:
    name: AWS Smoking-Test
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/prod' }}
    needs: aws-cfn-deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.0.0
        with:
          role-to-assume: ${{ secrets.CI_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Export CFN Output
        id: export-cfn-output
        shell: bash
        run: |
          set -euo pipefail
          JSON=$(
            aws cloudformation describe-stacks \
              --stack-name ${{ env.STACK_NAME }} \
              --query 'Stacks[0].Outputs' \
              --output json \
            | jq -c 'map({(.OutputKey): .OutputValue}) | add'
          )
          echo "outputs_json=$JSON" >> "$GITHUB_OUTPUT"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run Smoking-Tests
        working-directory: src/aws-tests/src/smoking-tests
        env:
          CFN_OUTPUT: ${{ steps.export-cfn-output.outputs.outputs_json }}
        run: cargo test --locked --test '*' --all-features -- --ignored --nocapture

  aws-put-staging-test-data:
    name: AWS Populate Test-Data
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
    needs: aws-cfn-deploy
    permissions:
      contents: read
      id-token: write
    environment:
      name: aws-dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.0.0
        with:
          role-to-assume: ${{ secrets.CI_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Export CFN Output
        id: export-cfn-output
        shell: bash
        run: |
          set -euo pipefail
          JSON=$(
            aws cloudformation describe-stacks \
              --stack-name ${{ env.STACK_NAME }} \
              --query 'Stacks[0].Outputs' \
              --output json \
            | jq -c 'map({(.OutputKey): .OutputValue}) | add'
          )
          echo "outputs_json=$JSON" >> "$GITHUB_OUTPUT"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run src/aws-tests/src/staging-data
        working-directory: src/aws-tests/src/staging-data
        env:
          CFN_OUTPUT: ${{ steps.export-cfn-output.outputs.outputs_json }}
          STAGE: ${{ env.STAGE }}
          OPENSEARCH_ENDPOINT_URL: ${{ vars.OPENSEARCH_ENDPOINT_URL }}
          OPENSEARCH_USERNAME: ${{ secrets.OPENSEARCH_USERNAME }}
          OPENSEARCH_PASSWORD: ${{ secrets.OPENSEARCH_PASSWORD }}
        run: cargo run --locked --all-features -- --nocapture
