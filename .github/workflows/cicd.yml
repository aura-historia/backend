name: CI/CD

on:
  push:
    branches: [prod, develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  STAGE: ${{ github.event_name == 'pull_request' && 'ephemeral'
    || github.ref == 'refs/heads/prod' && 'prod'
    || github.ref == 'refs/heads/develop' && 'dev' }}
  STAGE_NAME:
    ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number)
    || github.ref == 'refs/heads/prod' && 'prod'
    || github.ref == 'refs/heads/develop' && 'dev' }}
  STACK: application
  STACK_NAME:
    application-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number)
    || github.ref == 'refs/heads/prod' && 'prod'
    || github.ref == 'refs/heads/develop' && 'dev' }}
  CLOUDFORMATION_TEMPLATE_PATH:
    ${{ github.event_name == 'pull_request' && 'cfn/ephemeral.yaml'
    || github.ref == 'refs/heads/prod' && 'cfn/prod.yaml'
    || github.ref == 'refs/heads/develop' && 'cfn/dev.yaml' }}

jobs:
  cfn-lint:
    name: Lint CloudFormation
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install cfn-lint
        run: pip install -r cfn/lint/requirements.txt

      - name: Run cfn-lint for '${{ env.CLOUDFORMATION_TEMPLATE_PATH }}'
        run: cfn-lint --non-zero-exit-code error ${{ env.CLOUDFORMATION_TEMPLATE_PATH }}

  lint:
    name: Lint Workspace
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  build:
    name: Build ${{ matrix.crate }}
    needs: lint
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      matrix:
        crate:
          - src/cognito
          - src/cognito-post-confirmation
          - src/common
          - src/search-filter
          - src/search-filter-api
          - src/aws-tests
          - src/product
          - src/product-api
          - src/product-pipeline
          - src/product-lambda
          - src/shop
          - src/shop-api
          - src/test-api
          - src/user
          - src/user-api
          - src/user-lambda
          - src/mail
          - src/mail-lambda-send
    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build ${{ matrix.crate }}
        working-directory: ${{ matrix.crate }}
        run: cargo build --all-features --all-targets

  unit-test:
    name: Unit-Test Workspace
    needs: build
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Test Workspace
        run: cargo test --workspace --lib --all-features -- --nocapture

  integration-test:
    name: Integration-Test ${{ matrix.crate }}
    needs: build
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      matrix:
        crate:
          - src/search-filter
          - src/search-filter-api/src/search-filter-api-delete-search-filter
          - src/search-filter-api/src/search-filter-api-get-search-filter
          - src/search-filter-api/src/search-filter-api-get-search-filters
          - src/search-filter-api/src/search-filter-api-patch-search-filter
          - src/search-filter-api/src/search-filter-api-post-search-filter
          - src/product
          - src/product-pipeline/src/product-pipeline-common
          - src/product-api/src/product-api-get-product
          - src/product-api/src/product-api-get-product-similar
          - src/product-api/src/product-api-put-products
          - src/product-api/src/product-api-search
          - src/product-api/src/product-api-watchlist-get
          - src/product-api/src/product-api-watchlist-post
          - src/shop
          - src/shop-api/src/shop-api-search
          - src/shop-api/src/shop-api-patch-shop
          - src/shop-api/src/shop-api-post-shop
          - src/test-api
          - src/user
          - src/user-api/src/user-api-get-account
          - src/user-api/src/user-api-patch-account
          - src/mail/src/mail-core
    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Test ${{ matrix.crate }}
        working-directory: ${{ matrix.crate }}
        run: cargo test --test '*' --all-features -- --nocapture

      - name: Prune Docker volumes
        run: docker volume prune -f

  test-product-pipeline:
    name: Test product-pipeline
    needs: build
    permissions:
      contents: read
    runs-on: self-hosted
    strategy:
      matrix:
        crate:
          - src/product-pipeline/src/product-pipeline-translate
          - src/product-pipeline/src/product-pipeline-embed-text
          - src/product-pipeline/src/product-pipeline-extract-attribute
          - src/product-pipeline/src/product-pipeline-test
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python deps
        working-directory: ${{ matrix.crate }}
        run: |
          python -m pip install --upgrade pip
          pip install -r python/requirements.txt

      - name: Test ${{ matrix.crate }}
        working-directory: ${{ matrix.crate }}
        run: cargo test --all-features -- --nocapture --include-ignored

      - name: Prune Docker volumes
        run: docker volume prune -f

  sonar:
    name: SonarQube-Cloud Analysis
    needs: [unit-test, integration-test, test-product-pipeline]
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt, llvm-tools

      - name: Install grcov
        run: cargo install grcov

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r src/product-pipeline/src/product-pipeline-test/python/requirements.txt

      - name: Generate coverage
        env:
          RUSTFLAGS: "-C instrument-coverage"
          LLVM_PROFILE_FILE: "coverage-%p-%m.profraw"
        run: |
          cargo test --workspace --all-features --exclude smoking-tests --exclude staging-tests -- --nocapture --include-ignored
          grcov . --binary-path ./target/debug/deps/ -s . -t lcov --branch --ignore-not-existing --ignore "/*" --ignore "*/target/*" --ignore "*/.cargo/*" -o coverage.lcov

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Clean LLVM coverage artifacts
        run: |
          find . -name "*.profraw" -delete
          rm -f coverage.lcov

      - name: Prune Docker volumes
        run: docker volume prune -f

  aws-push-lambda:
    name: Push Lambda to S3 ${{ matrix.crate }}
    needs: [unit-test, integration-test, test-product-pipeline]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        crate:
          - src/search-filter-api/src/search-filter-api-delete-search-filter
          - src/search-filter-api/src/search-filter-api-get-search-filter
          - src/search-filter-api/src/search-filter-api-get-search-filters
          - src/search-filter-api/src/search-filter-api-patch-search-filter
          - src/search-filter-api/src/search-filter-api-post-search-filter
          - src/product-api/src/product-api-get-product
          - src/product-api/src/product-api-get-product-similar
          - src/product-api/src/product-api-put-products
          - src/product-api/src/product-api-search
          - src/product-api/src/product-api-watchlist-delete
          - src/product-api/src/product-api-watchlist-get
          - src/product-api/src/product-api-watchlist-post
          - src/product-api/src/product-api-watchlist-patch
          - src/product-pipeline/src/product-pipeline-asg-scale-persist-up
          - src/product-pipeline/src/product-pipeline-asg-scale-control
          - src/product-lambda/src/product-lambda-materialize-dynamodb-new
          - src/product-lambda/src/product-lambda-materialize-dynamodb-update
          - src/product-lambda/src/product-lambda-materialize-opensearch-new
          - src/product-lambda/src/product-lambda-materialize-opensearch-update
          - src/product-lambda/src/product-lambda-update-notify-user
          - src/shop-api/src/shop-api-search
          - src/shop-api/src/shop-api-get-shop
          - src/shop-api/src/shop-api-patch-shop
          - src/shop-api/src/shop-api-post-shop
          - src/user-api/src/user-api-get-account
          - src/user-api/src/user-api-patch-account
          - src/user-lambda/src/user-lambda-fanout-update-watchlist
          - src/cognito-post-confirmation
          - src/mail-lambda-send
    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo-lambda
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/cargo-lambda
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-lambda-1.8.6

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - name: Install cargo-lambda
        run: |
          if ! command -v cargo-lambda &> /dev/null; then
            cargo install cargo-lambda --version 1.8.6
          fi

      - name: Build Lambda binary
        working-directory: ${{ matrix.crate }}
        run: cargo lambda build --release --target x86_64-unknown-linux-musl --output-format zip

      - name: Copy Lambda zip artifact
        run: |
          BIN_NAME=$(basename ${{ matrix.crate }})
          OUT_DIR=$GITHUB_WORKSPACE/artifacts
          mkdir -p $OUT_DIR
          cp target/lambda/$BIN_NAME/bootstrap.zip $OUT_DIR/$BIN_NAME-${{ env.STAGE_NAME }}-${GITHUB_SHA}.zip

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5.1.1
        with:
          role-to-assume: ${{ secrets.CI_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload Lambda to S3
        run: |
          BIN_NAME=$(basename ${{ matrix.crate }})
          aws s3api put-object \
            --bucket "${{ vars.S3_BINARY_ARTIFACTS_BUCKET_NAME }}" \
            --key "$BIN_NAME-${{ env.STAGE_NAME }}-${GITHUB_SHA}.zip" \
            --body "$GITHUB_WORKSPACE/artifacts/$BIN_NAME-${{ env.STAGE_NAME }}-${GITHUB_SHA}.zip" \
            --tagging "stage=${{ env.STAGE }}"

  aws-push-ec2-x86:
    name: Push EC2 to S3 ${{ matrix.crate }}
    needs: [unit-test, integration-test, test-product-pipeline]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        crate:
          - src/product-pipeline/src/product-pipeline-init
          - src/product-pipeline/src/product-pipeline-translate
          - src/product-pipeline/src/product-pipeline-embed-text
          - src/product-pipeline/src/product-pipeline-extract-attribute
          - src/product-pipeline/src/product-pipeline-complete
    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build EC2 binary
        working-directory: ${{ matrix.crate }}
        run: cargo build --release

      - name: Copy EC2 binary to artifacts
        run: |
          BIN_NAME=$(basename ${{ matrix.crate }})
          mkdir -p $GITHUB_WORKSPACE/artifacts
          cp target/release/$BIN_NAME $GITHUB_WORKSPACE/artifacts/$BIN_NAME-${{ env.STAGE_NAME }}-${GITHUB_SHA}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5.1.1
        with:
          role-to-assume: ${{ secrets.CI_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload EC2 binary to S3
        run: |
          BIN_NAME=$(basename ${{ matrix.crate }})
          aws s3api put-object \
            --bucket "${{ vars.S3_BINARY_ARTIFACTS_BUCKET_NAME }}" \
            --key "${{ env.STAGE_NAME }}/${GITHUB_SHA}/$BIN_NAME" \
            --body "$GITHUB_WORKSPACE/artifacts/$BIN_NAME-${{ env.STAGE_NAME }}-${GITHUB_SHA}" \
            --tagging "stage=${{ env.STAGE }}"

  aws-push-mail-templates:
    name: Compile & push Mail-Templates to S3 ${{ matrix.resource }}
    needs: [unit-test, integration-test, test-product-pipeline]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    strategy:
      matrix:
        resource:
          - mjml/watchlist/product-update/price/de.mjml
          - mjml/watchlist/product-update/price/en.mjml
          - mjml/watchlist/product-update/price/es.mjml
          - mjml/watchlist/product-update/price/fr.mjml
          - mjml/watchlist/product-update/state/de.mjml
          - mjml/watchlist/product-update/state/en.mjml
          - mjml/watchlist/product-update/state/es.mjml
          - mjml/watchlist/product-update/state/fr.mjml

    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5.1.1
        with:
          role-to-assume: ${{ secrets.CI_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install MJML
        run: npm install -g mjml

      - name: Compile MJML
        run: |
          output="dist/emails/${{ matrix.resource }}"
          output="${output%.mjml}.html"
          mkdir -p "$(dirname "$output")"
          mjml "${{ matrix.resource }}" -o "$output"

      - name: Upload compiled template to S3
        run: |
          output="dist/emails/${{ matrix.resource }}"
          output="${output%.mjml}.html"
          aws s3api put-object \
            --bucket "${{ vars.S3_MAIL_TEMPLATE_BUCKET_NAME }}" \
            --key "${{ env.STAGE_NAME }}/${GITHUB_SHA}/${output#dist/emails/}" \
            --body "$output" \
            --tagging "stage=${{ env.STAGE }}"

  aws-cfn-deploy:
    name: Deploy & initialize CFN-Stack
    needs:
      [cfn-lint, aws-push-lambda, aws-push-ec2-x86, aws-push-mail-templates]
    environment:
      name: ${{ github.event_name == 'pull_request' && 'aws-ephemeral' || github.ref == 'refs/heads/prod' && 'aws-prod' || github.ref == 'refs/heads/develop' && 'aws-dev' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5.1.1
        with:
          role-to-assume: ${{ secrets.CI_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy CloudFormation
        run: |
          aws cloudformation deploy \
            --stack-name ${{ env.STACK_NAME }} \
            --template-file ${{ env.CLOUDFORMATION_TEMPLATE_PATH }} \
            --s3-bucket ${{ vars.S3_CFN_ARTIFACTS_BUCKET_NAME }} \
            --s3-prefix ${{ env.STAGE_NAME }} \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
                StageName=${{ env.STAGE_NAME }} \
                ArtifactBucket=${{ vars.S3_BINARY_ARTIFACTS_BUCKET_NAME }} \
                ResourceBucket=${{ vars.S3_RESOURCE_ARTIFACTS_BUCKET_NAME }} \
                MailTemplateBucket=${{ vars.S3_MAIL_TEMPLATE_BUCKET_NAME }} \
                CommitSHA=${GITHUB_SHA} \
                Ec2KeyPairName=${{ vars.EC2_KEY_PAIR_NAME }} \
                OpenSearchEndpointUrl=${{ vars.OPENSEARCH_ENDPOINT_URL }} \
                OpenSearchUsername=${{ secrets.OPENSEARCH_USERNAME }} \
                OpenSearchPassword=${{ secrets.OPENSEARCH_PASSWORD }}

      - name: Install OpenSearch CLI
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          DOWNLOAD_URL="https://artifacts.opensearch.org/opensearch-clients/opensearch-cli/opensearch-cli-1.2.0-linux-x64.zip"
          curl -L "$DOWNLOAD_URL" -o opensearch-cli.zip
          unzip -o opensearch-cli.zip -d opensearch-cli-bin
          sudo mv opensearch-cli-bin/opensearch-cli /usr/local/bin/opensearch-cli
          sudo chmod +x /usr/local/bin/opensearch-cli

      - name: Setup OpenSearch indices
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          chmod +x ci/setup-opensearch-indices.sh
          ./ci/setup-opensearch-indices.sh

  aws-staging-test:
    name: AWS Staging-Test
    if: ${{ github.event_name == 'pull_request' }}
    needs: aws-cfn-deploy
    environment:
      name: ${{ github.event_name == 'pull_request' && 'aws-ephemeral' || github.ref == 'refs/heads/develop' && 'aws-dev' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5.1.1
        with:
          role-to-assume: ${{ secrets.CI_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Export CFN Output
        id: export-cfn-output
        shell: bash
        run: |
          set -euo pipefail
          JSON=$(
            aws cloudformation describe-stacks \
              --stack-name ${{ env.STACK_NAME }} \
              --query 'Stacks[0].Outputs' \
              --output json \
            | jq -c 'map({(.OutputKey): .OutputValue}) | add'
          )
          echo "outputs_json=$JSON" >> "$GITHUB_OUTPUT"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run Staging-tests
        working-directory: src/aws-tests/src/staging-tests
        env:
          CFN_OUTPUT: ${{ steps.export-cfn-output.outputs.outputs_json }}
          TEST_MAIL_APP_NAMESPACE: ${{ vars.TEST_MAIL_APP_NAMESPACE }}
          TEST_MAIL_APP_API_KEY: ${{ secrets.TEST_MAIL_APP_API_KEY }}
          STAGE: ${{ env.STAGE }}
          OPENSEARCH_ENDPOINT_URL: ${{ vars.OPENSEARCH_ENDPOINT_URL }}
          OPENSEARCH_USERNAME: ${{ secrets.OPENSEARCH_USERNAME }}
          OPENSEARCH_PASSWORD: ${{ secrets.OPENSEARCH_PASSWORD }}
        run: cargo test --test '*' --all-features -- --ignored --nocapture

  aws-smoking-test:
    name: AWS Smoking-Test
    if: github.event_name == 'push'
    needs: aws-cfn-deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5.1.1
        with:
          role-to-assume: ${{ secrets.CI_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Export CFN Output
        id: export-cfn-output
        shell: bash
        run: |
          set -euo pipefail
          JSON=$(
            aws cloudformation describe-stacks \
              --stack-name ${{ env.STACK_NAME }} \
              --query 'Stacks[0].Outputs' \
              --output json \
            | jq -c 'map({(.OutputKey): .OutputValue}) | add'
          )
          echo "outputs_json=$JSON" >> "$GITHUB_OUTPUT"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run Smoking-Tests
        working-directory: src/aws-tests/src/smoking-tests
        env:
          CFN_OUTPUT: ${{ steps.export-cfn-output.outputs.outputs_json }}
        run: cargo test --test '*' --all-features -- --ignored --nocapture

  aws-put-staging-test-data:
    name: AWS Populate Test-Data
    if: github.event_name == 'push'
    needs: aws-cfn-deploy
    permissions:
      contents: read
      id-token: write
    environment:
      name: ${{ github.event_name == 'pull_request' && 'aws-ephemeral' || github.ref == 'refs/heads/develop' && 'aws-dev' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5.1.1
        with:
          role-to-assume: ${{ secrets.CI_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Export CFN Output
        id: export-cfn-output
        shell: bash
        run: |
          set -euo pipefail
          JSON=$(
            aws cloudformation describe-stacks \
              --stack-name ${{ env.STACK_NAME }} \
              --query 'Stacks[0].Outputs' \
              --output json \
            | jq -c 'map({(.OutputKey): .OutputValue}) | add'
          )
          echo "outputs_json=$JSON" >> "$GITHUB_OUTPUT"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run src/aws-tests/src/staging-data
        working-directory: src/aws-tests/src/staging-data
        env:
