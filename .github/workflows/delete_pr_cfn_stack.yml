name: Delete ephemeral CFN Stack on PR-Close

on:
  pull_request:
    types: [closed]

env:
  STACK_NAME: application-${{ format('pr-{0}', github.event.pull_request.number) }}

jobs:
  aws-cfn-delete:
    name: Delete CFN Stack
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5.1.0
        with:
          role-to-assume: ${{ secrets.CI_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Delete CloudFormation Stack
        run: |
          echo "Attempting to delete stack: ${{ env.STACK_NAME }}"

          if aws cloudformation describe-stacks --stack-name "${{ env.STACK_NAME }}" >/dev/null 2>&1; then
            echo "Stack exists. Deleting..."
            aws cloudformation delete-stack --stack-name "${{ env.STACK_NAME }}"
            aws cloudformation wait stack-delete-complete --stack-name "${{ env.STACK_NAME }}"
            echo "✅ Stack deleted successfully."
          else
            echo "ℹ️ Stack '${{ env.STACK_NAME }}' does not exist. Nothing to delete."
          fi

      - name: Delete CloudWatch Log Groups
        run: |
          STAGE_NAME="pr-${{ github.event.pull_request.number }}"
          echo "Deleting CloudWatch Log Groups for stage: $STAGE_NAME"
          
          # List all log groups matching the pattern
          LOG_GROUPS=$(aws logs describe-log-groups \
            --log-group-name-prefix "/aws/lambda/" \
            --query "logGroups[?contains(logGroupName, '-${STAGE_NAME}')].logGroupName" \
            --output text)
          
          if [ -z "$LOG_GROUPS" ]; then
            echo "ℹ️ No CloudWatch Log Groups found for stage '$STAGE_NAME'."
          else
            echo "Found Log Groups:"
            echo "$LOG_GROUPS"
            
            for LOG_GROUP in $LOG_GROUPS; do
              echo "Deleting log group: $LOG_GROUP"
              aws logs delete-log-group --log-group-name "$LOG_GROUP" || echo "⚠️ Failed to delete $LOG_GROUP"
            done
            
            echo "✅ CloudWatch Log Groups deleted successfully."
          fi

      - name: Delete S3 Artifacts
        run: |
          STAGE_NAME="pr-${{ github.event.pull_request.number }}"
          echo "Deleting S3 artifacts for stage: $STAGE_NAME"
          
          # Delete from binary artifacts bucket (Lambda zips and EC2 binaries)
          if [ -n "${{ vars.S3_BINARY_ARTIFACTS_BUCKET_NAME }}" ]; then
            echo "Checking binary artifacts bucket: ${{ vars.S3_BINARY_ARTIFACTS_BUCKET_NAME }}"
            
            # List objects with STAGE_NAME in the key
            OBJECTS=$(aws s3api list-objects-v2 \
              --bucket "${{ vars.S3_BINARY_ARTIFACTS_BUCKET_NAME }}" \
              --query "Contents[?contains(Key, '-${STAGE_NAME}-')].Key" \
              --output text)
            
            if [ -n "$OBJECTS" ]; then
              echo "Found objects in binary bucket:"
              echo "$OBJECTS"
              
              for OBJECT in $OBJECTS; do
                echo "Deleting object: s3://${{ vars.S3_BINARY_ARTIFACTS_BUCKET_NAME }}/$OBJECT"
                aws s3 rm "s3://${{ vars.S3_BINARY_ARTIFACTS_BUCKET_NAME }}/$OBJECT" || echo "⚠️ Failed to delete $OBJECT"
              done
            else
              echo "ℹ️ No objects found in binary artifacts bucket."
            fi
          fi
          
          # Delete from resource artifacts bucket
          if [ -n "${{ vars.S3_RESOURCE_ARTIFACTS_BUCKET_NAME }}" ]; then
            echo "Checking resource artifacts bucket: ${{ vars.S3_RESOURCE_ARTIFACTS_BUCKET_NAME }}"
            
            # Delete all objects under the STAGE_NAME prefix
            RESOURCE_PREFIX="${STAGE_NAME}/"
            RESOURCE_COUNT=$(aws s3 ls "s3://${{ vars.S3_RESOURCE_ARTIFACTS_BUCKET_NAME }}/${RESOURCE_PREFIX}" --recursive | wc -l)
            
            if [ "$RESOURCE_COUNT" -gt 0 ]; then
              echo "Found $RESOURCE_COUNT objects under prefix: $RESOURCE_PREFIX"
              aws s3 rm "s3://${{ vars.S3_RESOURCE_ARTIFACTS_BUCKET_NAME }}/${RESOURCE_PREFIX}" --recursive || echo "⚠️ Failed to delete some objects"
            else
              echo "ℹ️ No objects found under prefix '$RESOURCE_PREFIX'."
            fi
          fi
          
          echo "✅ S3 artifacts cleanup completed."
