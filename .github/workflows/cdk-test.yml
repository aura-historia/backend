name: CDK checks

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact candidate SHA selected by the trusted release workflow
        required: false
        type: string
  push:
    branches: [develop]
    paths:
      - "infra/**"
      - "mjml/**"
      - "ci/**"
      - "opensearch/**"
      - "docs/swagger.yaml"
      - "Cargo.toml"
      - "Dockerfile"
      - "src/**/Cargo.toml"
      - "src/**/src/main.rs"
      - "src/agent-discovery/src/environment.rs"
      - "src/aura-historia-api/src/lib.rs"
      - "src/aura-historia-api/src/transport.rs"
      - "src/aura-historia-api/src/content_notices/mod.rs"
      - "src/aura-historia-api/src/search_filters/mod.rs"
      - "src/aura-historia-api/src/notifications/mod.rs"
      - "src/aura-historia-api/src/partnership_applications/mod.rs"
      - "src/aura-historia-api/src/partnerships/mod.rs"
      - "src/aura-historia-mcp/src/config.rs"
      - "src/aura-historia-mcp/src/server_card.rs"
      - ".github/actions/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "infra/**"
      - "mjml/**"
      - "ci/**"
      - "opensearch/**"
      - "docs/swagger.yaml"
      - "Cargo.toml"
      - "Dockerfile"
      - "src/**/Cargo.toml"
      - "src/**/src/main.rs"
      - "src/agent-discovery/src/environment.rs"
      - "src/aura-historia-api/src/lib.rs"
      - "src/aura-historia-api/src/transport.rs"
      - "src/aura-historia-api/src/content_notices/mod.rs"
      - "src/aura-historia-api/src/search_filters/mod.rs"
      - "src/aura-historia-api/src/notifications/mod.rs"
      - "src/aura-historia-api/src/partnership_applications/mod.rs"
      - "src/aura-historia-api/src/partnerships/mod.rs"
      - "src/aura-historia-mcp/src/config.rs"
      - "src/aura-historia-mcp/src/server_card.rs"
      - ".github/actions/**"
      - ".github/workflows/**"

jobs:
  infra-test:
    name: Test CDK infrastructure
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Install pinned MJML dependencies
        run: npm --prefix mjml ci

      - name: Generate and verify Cognito verification HTML
        run: |
          git ls-files --error-unmatch -- infra/src/resources/cognito-verification-email.html >/dev/null
          npm --prefix mjml run generate:cognito-verification
          git diff --exit-code -- infra/src/resources/cognito-verification-email.html

      - name: Install CDK dependencies
        run: npm --prefix infra ci

      - name: Type-check CDK app
        run: npm --prefix infra run build

      - name: Test CDK app and deployment helpers
        run: |
          npm --prefix infra test
          node --test ci/*.test.cjs

      - name: Synthesize all stacks
        run: npm --prefix infra run synth:all
