name: Run a complete test lane
description: Validate reviewed ownership, run supervised phases and retain coverage.
inputs:
  id:
    description: Unique artifact and cache name.
    required: true
  lanes:
    description: Space-separated inventory lane names.
    default: ''
  legacy_package:
    description: Opt-in comparison only; one package with original lazy fixtures.
    default: ''
  parity_packages:
    description: Explicit full-control root/proc-macro additions to the legacy test-api job.
    default: ''
  harness:
    description: Explicit measured harness, nextest or libtest.
    required: true
  slots:
    description: Maximum simultaneous ordinary tests and context slots.
    required: true
  profile:
    description: Supervisor service profile, or none for the remaining lane.
    required: true
runs:
  using: composite
  steps:
    - name: Configure instrumented lane
      shell: bash
      env:
        LANE_ID: ${{ inputs.id }}
      run: |
        [[ "$LANE_ID" =~ ^(api|crawler|integration|remaining|all|legacy-[a-z0-9][a-z0-9_-]*)$ ]]
        mkdir -p "$RUNNER_TEMP/coverage/$LANE_ID/profraw" "$RUNNER_TEMP/lane/$LANE_ID"
        {
          printf 'CARGO_TARGET_DIR=%s/target\n' "$GITHUB_WORKSPACE"
          printf 'CARGO_PROFILE_TEST_DEBUG=1\n'
          printf 'CARGO_PROFILE_DEV_DEBUG=1\n'
          printf 'RUSTFLAGS=-C instrument-coverage\n'
          printf 'LLVM_PROFILE_FILE=%s/coverage/%s/profraw/%s-%s-%s-%%b-%%4m.profraw\n' "$RUNNER_TEMP" "$LANE_ID" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$LANE_ID"
          printf 'AWS_ACCESS_KEY_ID=test\nAWS_SECRET_ACCESS_KEY=test\nAWS_SESSION_TOKEN=test\n'
          printf 'AWS_EC2_METADATA_DISABLED=true\nAWS_DEFAULT_REGION=eu-central-1\nAWS_REGION=eu-central-1\n'
        } >> "$GITHUB_ENV"

    - name: Prepare hosted runner disk capacity
      shell: bash
      env:
        LANE_ID: ${{ inputs.id }}
      run: bash ci/prepare-runner-disk.sh 2>&1 | tee "$RUNNER_TEMP/lane/$LANE_ID/disk-preparation.log"

    - name: Install pinned Rust toolchain
      shell: bash
      run: rustup show

    - name: Restore lane compilation cache
      id: cache
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        key: test-${{ inputs.id }}-coverage
        env-vars: CARGO_PROFILE_TEST_DEBUG CARGO_PROFILE_DEV_DEBUG CARGO_INCREMENTAL RUSTFLAGS

    - name: Install verified test tools
      shell: bash
      run: |
        bash ci/install-test-tools.sh "$RUNNER_TEMP/test-tools"
        printf '%s\n' "$RUNNER_TEMP/test-tools" >> "$GITHUB_PATH"

    - name: Record source, runner and cache provenance
      shell: bash
      env:
        LANE_ID: ${{ inputs.id }}
        CACHE_KEY: test-${{ inputs.id }}-coverage
        CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
      run: |
        python3 - <<'PY'
        import json, os, pathlib, subprocess, sys
        sys.path.insert(0, 'ci')
        from ci_benchmark.execution import environment_metadata
        root = pathlib.Path.cwd()
        record = {
            'checkout_sha': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
            'checkout_tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
            'run': {key: os.environ.get(key) for key in ('GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'GITHUB_JOB', 'GITHUB_WORKFLOW_SHA', 'GITHUB_WORKFLOW_REF', 'RUNNER_NAME')},
            'runner': environment_metadata(root, os.environ),
            'cache': {'configured_key_suffix': os.environ['CACHE_KEY'], 'exact_hit': os.environ.get('CACHE_HIT') or None,
                      'limitation': 'Resolved and fallback cache keys are retained in the cache action log.'},
        }
        path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'lane' / os.environ['LANE_ID'] / 'job.json'
        path.write_text(json.dumps(record, indent=2, sort_keys=True) + '\n')
        print(json.dumps(record, sort_keys=True))
        PY

    - name: Log in to GHCR
      if: inputs.profile != 'none' || inputs.legacy_package != ''
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Build job supervisor
      if: inputs.profile != 'none' || inputs.legacy_package == 'test-api' || inputs.legacy_package == 'database-migration-lambda'
      shell: bash
      env:
        LANE_ID: ${{ inputs.id }}
      run: |
        python3 ci/guard-disk.py --target "$CARGO_TARGET_DIR" --profiles "$RUNNER_TEMP/coverage/$LANE_ID/profraw" \
          --log "$RUNNER_TEMP/lane/$LANE_ID/disk.jsonl" -- cargo build --locked --package test-api --all-features --bin aura-test-env

    - name: Run owned targets and doctests
      shell: bash
      env:
        LANE_ID: ${{ inputs.id }}
        LANES: ${{ inputs.lanes }}
        LEGACY_PACKAGE: ${{ inputs.legacy_package }}
        PARITY_PACKAGES: ${{ inputs.parity_packages }}
        HARNESS: ${{ inputs.harness }}
        SLOTS: ${{ inputs.slots }}
        PROFILE: ${{ inputs.profile }}
      run: |
        read -ra selected <<< "$LANES"
        arguments=()
        if [ -n "$LEGACY_PACKAGE" ]; then
          test -z "$LANES"
          arguments+=(--legacy-package "$LEGACY_PACKAGE")
          read -ra parity <<< "$PARITY_PACKAGES"
          for package in "${parity[@]}"; do arguments+=(--parity-package "$package"); done
        else
          for lane in "${selected[@]}"; do arguments+=(--lane "$lane"); done
        fi
        if [ "$PROFILE" != none ]; then
          arguments+=(--features test-api/supervisor,test-api/s3,test-api/ses,test-api/aura-historia-api,test-api/api-gateway,test-api/eventbridge)
        fi
        python3 ci/guard-disk.py --target "$CARGO_TARGET_DIR" --profiles "$RUNNER_TEMP/coverage/$LANE_ID/profraw" \
          --log "$RUNNER_TEMP/lane/$LANE_ID/disk.jsonl" -- \
          python3 ci/run-test-lane.py "${arguments[@]}" --harness "$HARNESS" --slots "$SLOTS" --profile "$PROFILE" \
          --supervisor "$CARGO_TARGET_DIR/debug/aura-test-env" --state-dir "$RUNNER_TEMP/lane/$LANE_ID/state" \
          --output "$RUNNER_TEMP/lane/$LANE_ID/discovery" 2>&1 | tee "$RUNNER_TEMP/lane/$LANE_ID/tests.log"

    - name: Preserve execution diagnostics before coverage export
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: tests-${{ inputs.id }}-execution-attempt-${{ github.run_attempt }}
        path: ${{ runner.temp }}/lane/${{ inputs.id }}/
        if-no-files-found: warn
        retention-days: 7

    - name: Export existing grcov coverage
      if: always()
      shell: bash
      env:
        LANE_ID: ${{ inputs.id }}
      run: |
        python3 ci/guard-disk.py --target "$CARGO_TARGET_DIR" --profiles "$RUNNER_TEMP/coverage/$LANE_ID/profraw" \
          --log "$RUNNER_TEMP/lane/$LANE_ID/disk.jsonl" -- \
          bash ci/collect-coverage.sh "$RUNNER_TEMP/coverage/$LANE_ID/profraw" "$CARGO_TARGET_DIR/debug/deps" "$RUNNER_TEMP/coverage/$LANE_ID/$LANE_ID.lcov"

    - name: Upload coverage
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: coverage-${{ inputs.id }}
        path: ${{ runner.temp }}/coverage/${{ inputs.id }}/${{ inputs.id }}.lcov
        if-no-files-found: error
        overwrite: true
        retention-days: 3

    - name: Preserve test diagnostics
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: tests-${{ inputs.id }}-attempt-${{ github.run_attempt }}
        path: |
          ${{ runner.temp }}/lane/${{ inputs.id }}/
          ${{ runner.temp }}/coverage/${{ inputs.id }}/${{ inputs.id }}.lcov
        if-no-files-found: warn
        retention-days: 7
