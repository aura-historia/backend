name: Run a complete test lane
description: Validate reviewed ownership, run supervised phases and retain coverage.
inputs:
  id:
    description: Unique artifact and cache name.
    required: true
  lanes:
    description: Space-separated inventory lane names.
    required: true
  harness:
    description: Explicit measured harness, nextest or libtest.
    required: true
  slots:
    description: Maximum simultaneous ordinary tests and context slots.
    required: true
  profile:
    description: Supervisor service profile, or none for the remaining lane.
    required: true
runs:
  using: composite
  steps:
    - name: Configure instrumented lane
      shell: bash
      env:
        LANE_ID: ${{ inputs.id }}
      run: |
        [[ "$LANE_ID" =~ ^(api|crawler|integration|remaining|all)$ ]]
        mkdir -p "$RUNNER_TEMP/coverage/$LANE_ID/profraw" "$RUNNER_TEMP/lane/$LANE_ID"
        {
          printf 'CARGO_TARGET_DIR=%s/target\n' "$GITHUB_WORKSPACE"
          printf 'CARGO_PROFILE_TEST_DEBUG=1\n'
          printf 'RUSTFLAGS=-C instrument-coverage\n'
          printf 'LLVM_PROFILE_FILE=%s/coverage/%s/profraw/%s-%s-%s-%%p-%%m.profraw\n' "$RUNNER_TEMP" "$LANE_ID" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$LANE_ID"
          printf 'AWS_ACCESS_KEY_ID=test\nAWS_SECRET_ACCESS_KEY=test\nAWS_SESSION_TOKEN=test\n'
          printf 'AWS_EC2_METADATA_DISABLED=true\nAWS_DEFAULT_REGION=eu-central-1\nAWS_REGION=eu-central-1\n'
        } >> "$GITHUB_ENV"

    - name: Install pinned Rust toolchain
      shell: bash
      run: rustup show

    - name: Restore lane compilation cache
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        key: test-${{ inputs.id }}-coverage
        env-vars: CARGO_PROFILE_TEST_DEBUG CARGO_INCREMENTAL RUSTFLAGS

    - name: Install verified test tools
      shell: bash
      run: |
        bash ci/install-test-tools.sh "$RUNNER_TEMP/test-tools"
        printf '%s\n' "$RUNNER_TEMP/test-tools" >> "$GITHUB_PATH"

    - name: Log in to GHCR
      if: inputs.profile != 'none'
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Build job supervisor
      if: inputs.profile != 'none'
      shell: bash
      run: cargo build --locked --package test-api --all-features --bin aura-test-env

    - name: Run owned targets and doctests
      shell: bash
      env:
        LANE_ID: ${{ inputs.id }}
        LANES: ${{ inputs.lanes }}
        HARNESS: ${{ inputs.harness }}
        SLOTS: ${{ inputs.slots }}
        PROFILE: ${{ inputs.profile }}
      run: |
        read -ra selected <<< "$LANES"
        arguments=()
        for lane in "${selected[@]}"; do arguments+=(--lane "$lane"); done
        if [ "$PROFILE" != none ]; then
          arguments+=(--features test-api/supervisor,test-api/s3,test-api/ses,test-api/aura-historia-api,test-api/api-gateway,test-api/eventbridge)
        fi
        python3 ci/run-test-lane.py "${arguments[@]}" --harness "$HARNESS" --slots "$SLOTS" --profile "$PROFILE" \
          --supervisor "$CARGO_TARGET_DIR/debug/aura-test-env" --state-dir "$RUNNER_TEMP/lane/$LANE_ID/state" \
          --output "$RUNNER_TEMP/lane/$LANE_ID/discovery" 2>&1 | tee "$RUNNER_TEMP/lane/$LANE_ID/tests.log"

    - name: Export existing grcov coverage
      if: always()
      shell: bash
      env:
        LANE_ID: ${{ inputs.id }}
      run: bash ci/collect-coverage.sh "$RUNNER_TEMP/coverage/$LANE_ID/profraw" "$CARGO_TARGET_DIR/debug/deps" "$RUNNER_TEMP/coverage/$LANE_ID/$LANE_ID.lcov"

    - name: Upload coverage
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: coverage-${{ inputs.id }}
        path: ${{ runner.temp }}/coverage/${{ inputs.id }}/${{ inputs.id }}.lcov
        if-no-files-found: error
        overwrite: true
        retention-days: 3

    - name: Preserve test diagnostics
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: tests-${{ inputs.id }}-attempt-${{ github.run_attempt }}
        path: |
          ${{ runner.temp }}/lane/${{ inputs.id }}/
          ${{ runner.temp }}/coverage/${{ inputs.id }}/${{ inputs.id }}.lcov
        if-no-files-found: warn
        retention-days: 7
