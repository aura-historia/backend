name: setup-env-product-pipeline-translate
schemaVersion: 1.0
parameters:
  - Stage:
      type: string
  - ResourceBucket:
      type: string
phases:
  - name: build
    steps:
      - name: ExpandAndBindHeavyDirs
        action: ExecuteBash
        inputs:
          commands:
            - set -euxo pipefail
            - lsblk
            - df -h
            # Format new volume if needed
            - |
              if ! blkid /dev/nvme1n1; then
                mkfs.ext4 /dev/nvme1n1
              fi
            - mkdir -p /mnt/data
            - mount /dev/nvme1n1 /mnt/data
            - |
              grep -q nvme1n1 /etc/fstab || echo \
              "/dev/nvme1n1 /mnt/data ext4 defaults,nofail 0 2" >> /etc/fstab
            - |
              # Create heavy directories on new volume
              for d in opt usr/local var/tmp tmp root/.cache; do
                mkdir -p /mnt/data/$d
              done
            # Move existing content to new volume
            - |
              rsync -aXS /opt/        /mnt/data/opt/
              rsync -aXS /usr/local/  /mnt/data/usr/local/
              rsync -aXS /var/tmp/    /mnt/data/var/tmp/
              rsync -aXS /tmp/        /mnt/data/tmp/
              rsync -aXS /root/.cache /mnt/data/root/.cache/
            # Bind-mount them back
            - |
              for d in opt usr/local var/tmp tmp root/.cache; do
                mount --bind /mnt/data/$d /$d
              done
            # Persist bind mounts
            - |
              cat << 'EOF' >> /etc/fstab
              /mnt/data/opt         /opt         none bind 0 0
              /mnt/data/usr/local   /usr/local   none bind 0 0
              /mnt/data/var/tmp     /var/tmp     none bind 0 0
              /mnt/data/tmp         /tmp         none bind 0 0
              /mnt/data/root/.cache /root/.cache none bind 0 0
              EOF
            - df -h

      - name: InstallSystemDeps
        action: ExecuteBash
        inputs:
          commands:
            - set -euxo pipefail
            - apt-get update
            - apt-get install -y python3 python3-pip python3-venv build-essential

      - name: ConfigureHFCache
        action: ExecuteBash
        inputs:
          commands:
            - set -euxo pipefail
            - mkdir -p /opt/huggingface
            - chmod -R 755 /opt/huggingface
            - |
              cat << 'EOF' > /etc/profile.d/huggingface.sh
              export HF_HOME=/opt/huggingface
              export TRANSFORMERS_CACHE=/opt/huggingface
              export SENTENCE_TRANSFORMERS_HOME=/opt/huggingface
              export HF_HUB_DISABLE_TELEMETRY=1
              EOF

      - name: InstallPythonDeps
        action: ExecuteBash
        inputs:
          commands:
            - mkdir -p /opt/product-pipeline-translate
            - chmod 755 /opt/product-pipeline-translate
            - cd /opt/product-pipeline-translate
            - export RESOURCE_BUCKET="{{ ResourceBucket }}"
            - export STAGE="{{ Stage }}"
            - aws s3 cp "s3://$RESOURCE_BUCKET/$STAGE/src/product-pipeline/src/product-pipeline-translate/python/requirements.txt" requirements.txt --region eu-central-1
            - python3 -m venv .venv
            - source .venv/bin/activate
            - python3 -m pip install --upgrade pip
            - pip install --no-cache-dir -r requirements.txt

      - name: PreloadModels
        action: ExecuteBash
        inputs:
          commands:
            - set -euxo pipefail
            - |
              export HF_HOME=/opt/huggingface
              export TRANSFORMERS_CACHE=/opt/huggingface
              export SENTENCE_TRANSFORMERS_HOME=/opt/huggingface
              
              cd /opt/product-pipeline-translate
              source .venv/bin/activate
              python3 - << 'EOF'
              import torch
              from sentence_transformers import SentenceTransformer
              SentenceTransformer("Helsinki-NLP/opus-mt-de-en", device="cpu")
              SentenceTransformer("Helsinki-NLP/opus-mt-de-fr", device="cpu")
              SentenceTransformer("Helsinki-NLP/opus-mt-de-es", device="cpu")
              SentenceTransformer("Helsinki-NLP/opus-mt-en-de", device="cpu")
              SentenceTransformer("Helsinki-NLP/opus-mt-en-fr", device="cpu")
              SentenceTransformer("Helsinki-NLP/opus-mt-en-es", device="cpu")
              SentenceTransformer("Helsinki-NLP/opus-mt-fr-de", device="cpu")
              SentenceTransformer("Helsinki-NLP/opus-mt-fr-en", device="cpu")
              SentenceTransformer("Helsinki-NLP/opus-mt-fr-es", device="cpu")
              SentenceTransformer("Helsinki-NLP/opus-mt-es-de", device="cpu")
              SentenceTransformer("Helsinki-NLP/opus-mt-es-en", device="cpu")
              SentenceTransformer("Helsinki-NLP/opus-mt-es-fr", device="cpu")
              print("[build] Model preloaded")
              EOF

      - name: ConfigureSystemdHFEnv
        action: ExecuteBash
        inputs:
          commands:
            - set -euxo pipefail
            - mkdir -p /etc/systemd/system.conf.d
            - |
              cat << 'EOF' > /etc/systemd/system.conf.d/huggingface.conf
              [Manager]
              DefaultEnvironment=HF_HOME=/opt/huggingface
              DefaultEnvironment=TRANSFORMERS_CACHE=/opt/huggingface
              DefaultEnvironment=SENTENCE_TRANSFORMERS_HOME=/opt/huggingface
              EOF

      - name: SetUpCloudWatchAgentLogging
        action: ExecuteBash
        inputs:
          commands:
            - set -euxo pipefail
            - export STAGE="{{ Stage }}"
            - |
              cat << EOF | sudo tee /opt/aws/amazon-cloudwatch-agent.json > /dev/null
              {
                "logs": {
                  "logs_collected": {
                    "files": {
                      "collect_list": [
                        {
                          "file_path": "/var/log/product-pipeline-translate.log",
                          "log_group_name": "/aws/ec2/$STAGE-product-pipeline-translate",
                          "log_stream_name": "{instance_id}",
                          "timestamp_format": "%Y-%m-%dT%H:%M:%S.%f%z",
                          "timezone": "UTC", 
                          "multi_line_start_pattern": "^{"
                        }
                      ]
                    }
                  }
                }
              }
              EOF
            - amazon-cloudwatch-agent-ctl -a fetch-config -m ec2 -c file:/opt/aws/amazon-cloudwatch-agent.json -s
            - LOG_PATH="/var/log/product-pipeline-translate.log"
            - sudo touch "$LOG_PATH"
            - sudo chmod 666 "$LOG_PATH"
