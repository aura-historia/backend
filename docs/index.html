<!doctype html>
<html>
    <head>
        <link rel="shortcut icon" type="image/png" href="https://assets.aura-historia.com/branding/512x512_icon.png">
        <title>Aura Historia API Reference</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta
            name="description"
            content="Official API reference for the Aura Historia backend, partner integrations, and OAuth workflows."
        />
        <style>
            html,
            body,
            #app {
                height: 100%;
                margin: 0;
            }
        </style>
    </head>

    <body>
        <div id="app"></div>

        <!-- Load the Script -->
        <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>

        <!-- Initialize the Scalar API Reference -->
        <script>
            Scalar.createApiReference("#app", {
                // The URL of the OpenAPI/Swagger document
                url: "swagger.yaml",
            });
        </script>
    </body>
</html>
