          in: path
          required: true
          description: Unique identifier of the search filter to delete
          schema:
            type: string
            format: uuid
          example: "6ba7b810-9dad-11d1-80b4-00c04fd430c8"
      security:
        - BearerAuth: []
        - AccessTokenAuth: []
      responses:
        "204":
          description: Search filter deleted successfully
          headers:
            Access-Control-Allow-Origin:
              description: CORS header
              schema:
                type: string
              example: "*"
        "400":
          description: Bad request - invalid parameters
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                missing_search_filter_id:
                  summary: Missing search filter ID
                  value:
                    status: 400
                    title: "Bad Request"
                    error: "BAD_PATH_PARAMETER_VALUE"
                    source:
                      field: "userSearchFilterId"
                      sourceType: "path"
                invalid_uuid:
                  summary: Invalid search filter ID format
                  value:
                    status: 400
                    title: "Bad Request"
                    error: "INVALID_UUID"
                    source:
                      field: "userSearchFilterId"
                      sourceType: "path"
                    detail: "Invalid UUID format"
        "401":
          description: Unauthorized - missing or invalid Cognito JWT or Aura access token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 401
                title: "Unauthorized"
                error: "INVALID_CREDENTIALS"
        "403":
          description: Forbidden - Aura access token lacks the required `search-filters:write` scope
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 403
                title: "Forbidden"
                error: "FORBIDDEN"
        "404":
          description: Search filter not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 404
                title: "Not Found"
                error: "SEARCH_FILTER_NOT_FOUND"
        "500":
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 500
                title: "Internal Server Error"
                error: "INTERNAL_SERVER_ERROR"
    patch:
      summary: Update a search filter
      description: |
        Updates a specific search filter by its ID for the authenticated user.
        Allows partial updates - only provided fields will be modified.
        If no fields are provided in the request body, returns the existing search filter unchanged.
        Requires a Cognito JWT or an Aura access token with `search-filters:write`.

        The set of usable search filter fields depends on the user's tier:
        - `FREE`: Allowed fields are `productQuery`, `price`, `state`, `excludeProductId`, and `lifecycle`. Other fields are forbidden and return `SEARCH_FILTER_RESTRICTED_FEATURE`.
        - `PRO`: All filter fields are allowed.
        - `ULTIMATE`: All filter fields are allowed.
      operationId: updateUserSearchFilter
      tags:
        - Search Filters
      parameters:
        - name: userSearchFilterId
          in: path
          required: true
          description: Unique identifier of the search filter to update
          schema:
            type: string
            format: uuid
          example: "6ba7b810-9dad-11d1-80b4-00c04fd430c8"
      security:
        - BearerAuth: []
        - AccessTokenAuth: []
      requestBody:
        required: false
        description: |
          Partial search filter update data.
          Only provided fields will be updated. If body is empty, returns existing filter.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchUserSearchFilterData"
            examples:
              partial_update:
                summary: Update specific fields
                value:
                  name: "Updated Filter Name"
                  search:
                    shopName: ["Updated Store"]
                    price:
                      min: 2000
                      max: 8000
              update_name_only:
