  /api/v1/newsletter-subscriptions:
    put:
      summary: Upsert newsletter subscription
      description: |
        Subscribes an email address to the Aura Historia newsletter mailing list.

        The endpoint accepts anonymous requests.
        An optional Cognito JWT or Aura Historia access-token bearer credential may be supplied for authenticated calls.
        When authenticated, omitted optional profile fields (`firstName`, `lastName`, `language`, `currency`)
        fall back to the authenticated user's stored account values; explicitly provided request values take precedence.
      operationId: putNewsletterSubscription
      tags:
        - Newsletter
      security:
        - BearerAuth: []
        - {}
      requestBody:
        required: true
        description: Newsletter subscription data.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutNewsletterSubscriptionData"
            examples:
              minimal:
                summary: Subscribe with email only
                value:
                  email: "collector@example.com"
              complete:
                summary: Subscribe with explicit profile values
                value:
                  email: "collector@example.com"
                  firstName: "Ada"
                  lastName: "Lovelace"
                  language: "en"
                  currency: "EUR"
      responses:
        "204":
          description: Newsletter subscription synced successfully
          headers:
            Access-Control-Allow-Origin:
              description: CORS header
              schema:
                type: string
              example: "*"
        "400":
          description: |
            Bad request — the request body is missing, malformed, contains invalid field values,
            or the newsletter provider rejects the submitted email address as invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                missing_body:
                  summary: Missing request body
                  value:
                    status: 400
                    title: "Bad Request"
                    error: "BAD_BODY_VALUE"
                    detail: "Body cannot be empty"
                invalid_body:
                  summary: Invalid request body
                  value:
                    status: 400
                    title: "Bad Request"
                    error: "BAD_BODY_VALUE"
                invalid_email:
                  summary: Newsletter provider rejected the email address
                  value:
                    status: 400
                    title: "Bad Request"
                    error: "INVALID_EMAIL"
        "503":
          description: Newsletter provider temporarily unavailable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 503
                title: "Service Unavailable"
                error: "NEWSLETTER_TEMPORARILY_UNAVAILABLE"
        "500":
          description: Internal newsletter subscription failure
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 500
                title: "Internal Server Error"
                error: "NEWSLETTER_INTERNAL_ERROR"

  /api/v1/shops:
    post:
      summary: Create a shop
      description: |
        Creates a new shop record and returns the created shop.

        Requires a valid Cognito JWT and the `ADMIN` role.

        The request body uses `PostShopData`. The backend derives `shopSlugId` from `name`,
        initializes newly created shops with `partnerStatus` set to `SCRAPED`, and keeps them
        drafted until an approved publication transition.
      operationId: postShop
      tags:
        - Shops
      security:
        - BearerAuth: []
      requestBody:
        required: true
        description: Complete payload for creating a new shop.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostShopData"
            example:
              name: "Tech Store Premium"
              shopType: "COMMERCIAL_DEALER"
              domains:
                - "tech-store-premium.com"
                - "tech-store-premium.de"
              shopifyDomain: "tech-store-premium.myshopify.com"
              shopifyCurrency: "EUR"
              shopifyLanguage: "en"
              woocommerceWebhookSecret: "woocommerce-acceptance-secret"
              woocommerceCurrency: "EUR"
              woocommerceLanguage: "de"
              url: "https://tech-store-premium.com/"
              image: "https://tech-store-premium.com/logo.svg"
              structuredAddress:
                addressline: "Pariser Platz 1"
                addresslineExtra: "2. Etage"
                postalCode: "10117"
                locality: "Berlin"
                country: "DE"
                continent: "EUROPE"
              phone: "+49 30 123456"
              email: "contact@tech-store-premium.com"
      responses:
        "201":
          description: Shop created successfully
          headers:
            Last-Modified:
              description: When the created shop was last updated
              schema:
                type: string
                format: http-date
              example: "Wed, 01 Jan 2024 10:00:00 GMT"
            Access-Control-Allow-Origin:
              description: CORS header
              schema:
                type: string
              example: "*"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetShopData"
              example:
