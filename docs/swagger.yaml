        User callers must have the stored `ADMIN` role. Aura Historia access tokens must include
        the `partner-shop-applications:write` scope.
        An initial decision requires `businessState` `IN_REVIEW`; another decision or a different terminal decision fails with `409 Conflict`.
        Retrying the matching terminal decision returns `200` without repeating authoritative writes and retries notification delivery.
        Approval synchronously partners and publishes the linked shop and grants applicant membership. Rejection discards
        the unused linked draft for a new-shop application. The returned application is terminal `APPROVED` or `REJECTED`.
