                  value:
                    status: 400
                    title: "Bad Request"
                    error: "BAD_BODY_VALUE"
                    detail: "unknown variant `INVALID`, expected `APPROVE` or `REJECT` at line 1 column 21"
        "401":
          description: Unauthorized – invalid or missing JWT token.
          content:
