                          capturedAt: "2026-08-15T10:00:00Z"
                      state: AVAILABLE
                      lifecycle: ACTIVE
                      url: "https://example.test/accessory-1"
                      viewUrl: "https://example.test/accessory-1"
                      images: []
                      auction: {}
                      created: "2024-01-01T10:00:00Z"
                      updated: "2024-01-01T12:00:00Z"
                    userState:
                      watchlist: { watching: false, notifications: false }
                      prohibitedContent: { consent: false }
                      notification: { seen: false }
                      searchFilter: { matched: true, hidden: false }
                size: 1
                total: null
                searchAfter:
                  [
                    "2024-01-01T10:00:00Z",
