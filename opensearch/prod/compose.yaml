name: aura-opensearch-prod
# The public site, until the cutover retires it, is served by the prod project's Caddy
# (host/prod/compose.yaml), which also reaches the node on the `search` network.

x-opensearch-image: &opensearch-image opensearchproject/opensearch:3.9.0@sha256:adfa61f85025d06b4aeb562e7e74fde7e31c437039c93c3862c17e9acebd6c7c
x-logging: &logging
  driver: json-file
  options:
    max-size: 20m
    max-file: "5"

services:
  opensearch:
    image: *opensearch-image
    restart: unless-stopped
    environment:
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: ${OPENSEARCH_JAVA_OPTS:--Xms8g -Xmx8g}
    # Host memory plan and tier weights: host/README.md.
    mem_limit: ${OPENSEARCH_MEMORY_LIMIT:-20g}
    mem_reservation: ${OPENSEARCH_MEMORY_RESERVATION:-16g}
    memswap_limit: ${OPENSEARCH_MEMORY_LIMIT:-20g}
    cgroup_parent: aura_serving.slice
    oom_score_adj: -500
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [IPC_LOCK]
    ulimits:
      memlock: {soft: -1, hard: -1}
      nofile: {soft: 65536, hard: 65536}
    stop_grace_period: 120s
    logging: *logging
    volumes:
      - data:/usr/share/opensearch/data
      - node-certificates:/usr/share/opensearch/config/certificates:ro
      - ./opensearch.yml:/usr/share/opensearch/config/opensearch.yml:ro
    ports:
      - 127.0.0.1:19201:9200
    networks: [search]
    healthcheck:
      test: [CMD-SHELL, 'test "$$(curl --silent --cacert config/certificates/root-ca.pem --max-time 5 --output /dev/null --write-out "%{http_code}" https://localhost:9200/)" = 401']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  securityadmin:
    image: *opensearch-image
    profiles: [bootstrap]
    user: "0:0"
    entrypoint: [/usr/share/opensearch/plugins/opensearch-security/tools/securityadmin.sh]
    command: [-h, opensearch, -p, "9200", -cn, aura-prod, -cacert, /operator/root-ca.pem, -cert, /operator/admin.pem, -key, /operator/admin-key.pem, -cd, /security]
    mem_limit: 1g
    cpus: 1.0
    security_opt: [no-new-privileges:true]
    volumes:
      - ./.private/operator:/operator:ro
      - ./.private/security:/security:ro
    networks: [search]

volumes:
  data:
    external: true
    name: aura-historia-opensearch-prod-data
  node-certificates:
    external: true
    name: aura-historia-opensearch-prod-certificates

networks:
  search:
