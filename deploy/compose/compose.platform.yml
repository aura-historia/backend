# Explicit platform maintenance only. Application deployment never runs this project down.
x-platform: &platform
  restart: unless-stopped
  pull_policy: never
  networks: [backend]
  security_opt: [no-new-privileges:true]
  logging:
    driver: local
    options: {max-size: 10m, max-file: "3"}

services:
  postgres:
    <<: *platform
    image: ${POSTGRES_IMAGE:?Set reviewed PostgreSQL16/TTL3 immutable digest}
    stop_grace_period: 60s
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    env_file:
      - path: ${AURA_CONFIG_DIR:?}/postgres.env
        format: raw
    command: [postgres, -c, config_file=/etc/postgresql/postgresql.conf]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - type: bind
        source: ${AURA_CONFIG_DIR:?}/postgres
        target: /etc/postgresql
        read_only: true
        bind: {create_host_path: false}
    healthcheck:
      test: [CMD, pg_isready, -h, "127.0.0.1", -U, postgres]
      interval: 5s
      timeout: 3s
      retries: 12

  opensearch:
    <<: *platform
    image: ${OPENSEARCH_IMAGE:?Set reviewed OpenSearch immutable digest}
    stop_grace_period: 60s
    mem_limit: 3g
    cpus: 2
    pids_limit: 512
    ulimits:
      nofile: {soft: 65536, hard: 65536}
    environment:
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
    volumes:
      - opensearch-data:/usr/share/opensearch/data
      - type: bind
        source: ${AURA_CONFIG_DIR:?}/opensearch.yml
        target: /usr/share/opensearch/config/opensearch.yml
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${AURA_CONFIG_DIR:?}/opensearch-certs
        target: /usr/share/opensearch/config/certs
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ../../opensearch/analysis
        target: /usr/share/opensearch/config/analysis
        read_only: true
        bind: {create_host_path: false}

  redis:
    <<: *platform
    image: ${REDIS_IMAGE:?Set reviewed Redis immutable digest}
    stop_grace_period: 30s
    mem_limit: 512m
    cpus: 1
    pids_limit: 64
    command: [redis-server, /usr/local/etc/redis/redis.conf]
    volumes:
      - redis-data:/data
      - type: bind
        source: ${AURA_CONFIG_DIR:?}/redis.conf
        target: /usr/local/etc/redis/redis.conf
        read_only: true
        bind: {create_host_path: false}

  sequin:
    <<: *platform
    image: ${SEQUIN_IMAGE:?Set reviewed Sequin immutable digest}
    stop_grace_period: 60s
    mem_limit: 2g
    cpus: 2
    pids_limit: 512
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
    env_file:
      - path: ${AURA_CONFIG_DIR:?}/sequin.env
        format: raw
    environment:
      SELF_HOSTED: "1"
      SEQUIN_TELEMETRY_DISABLED: "true"
      LOG_LEVEL: warning
      CONFIG_FILE_PATH: /run/sequin/sequin.yaml
      ERL_FLAGS: "+S 2:2"
    volumes:
      - type: bind
        source: ${AURA_CONFIG_DIR:?}/sequin.yaml
        target: /run/sequin/sequin.yaml
        read_only: true
        bind: {create_host_path: false}

networks:
  backend:
    name: ${AURA_NETWORK:?Set environment-specific network}
    # Offline by default. External provider access requires explicit operator configuration.
    internal: ${AURA_NETWORK_INTERNAL:-true}

volumes:
  postgres-data:
  opensearch-data:
  redis-data:
